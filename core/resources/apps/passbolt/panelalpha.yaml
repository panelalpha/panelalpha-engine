# yaml-language-server: $schema=../../platforms/_schema.json
id: passbolt
strategy: php
label: Passbolt
priority: 944
runtime: php
port: 8000
# CakePHP serves from webroot/. Without this the repository root is the
# document root and config/, src/ and the GPG keys below sit under it.
docroot: webroot
# Passbolt is MySQL or PostgreSQL and ships no .env.example, so nothing in the
# repository tells the engine a database is wanted -- source_inspect reported
# `services: []` and the deploy reached its own boot error instead.
database: mysql
env:
  APP_ENV: production
  LOG_CHANNEL: stderr
  # Only a warning ("should only be executed as the web server user"): Passbolt
  # wants the process user named www-data/nginx/apache/http, and here it is `app`.
  PASSBOLT_SECURITY_DISPLAY_NON_WEBUSER_WARNING: 'false'
requires:
  php: runtime
# A git checkout of passbolt_api, which is not a runnable Passbolt on its own:
# config/ holds only the .default.php templates. The three markers together are
# what separate it from any other CakePHP application.
detect:
  all:
    - path: config/passbolt.default.php
    - path: config/app.default.php
    - path: webroot/index.php
commands:
  - id: gnupg-binary
    stage: [install, upgrade]
    description: 'The gnupg PHP extension is baked into the image, but it talks to the gpg binary through gpgme and Passbolt shells out to gpg itself for key generation. Installed here rather than in the base image because Passbolt is the only application that needs it, and the php platform has no per-project Dockerfile to put it in. A no-op once present.'
    run: 'command -v gpg >/dev/null 2>&1 || { apt-get update && apt-get install -y --no-install-recommends gnupg && rm -rf /var/lib/apt/lists/*; }'
  - id: passbolt-config
    stage: [install, upgrade]
    description: 'CakePHP refuses to boot without config/app.php and the repository ships only app.default.php -- the deploy served `Could not load configuration file: /app/config/app.php.` as a bare 200 until this existed. Copied rather than generated, which is what upstream''s own container entrypoint does. Never overwrites a config already there.'
    run: '[ -f /app/config/app.php ] || cp /app/config/app.default.php /app/config/app.php'
  - id: gpg-server-key
    stage: [install, upgrade]
    description: 'Passbolt encrypts with an OpenPGP server key that has to exist before it will answer, and no repository can ship one -- a published private key is not a key. Generated once per account with the same parameters upstream''s entrypoint uses (RSA 3072, sign+cert with an encrypt subkey, no passphrase because nothing can type one at boot), then imported into the account''s own keyring. The fingerprint is written beside it because the next command needs to hand it to Passbolt and cannot ask gpg twice. The key''s address is passbolt@ the project''s own host (passbolt.invalid when that is an IP): Passbolt''s install refuses a key whose address has no domain, such as passbolt@localhost, and a key generated that way is replaced. The fingerprint is read from the exported key, so a later domain change does not lose it.'
    run: 'export GNUPGHOME=/app/config/gpg/.gnupg; K=/app/config/gpg; mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"; if [ -f "$K/serverkey.asc" ] && gpg --batch --show-keys --with-colons "$K/serverkey.asc" 2>/dev/null | grep "^uid" | grep -Eq "@[^>.]*>"; then rm -rf "$GNUPGHOME" "$K/serverkey.asc" "$K/serverkey_private.asc" "$K/fingerprint"; mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"; fi; if [ ! -f "$K/serverkey_private.asc" ]; then H=$(printf "%s" "${APP_URL:-}" | sed -e "s#^[a-zA-Z][a-zA-Z0-9+.-]*://##" -e "s#[:/].*##" | tr "A-Z" "a-z"); printf "%s" "$H" | grep -Eq "^[a-z0-9.-]+\.[a-z]{2,}$" || H=passbolt.invalid; E="passbolt@$H"; printf ''%s\n'' "Key-Type: RSA" "Key-Length: 3072" "Key-Usage: sign,cert" "Subkey-Type: RSA" "Subkey-Length: 3072" "Subkey-Usage: encrypt" "Name-Real: Passbolt server key" "Name-Email: $E" "Expire-Date: 0" "%no-protection" "%commit" > /tmp/pa-gpg-params && gpg --homedir "$GNUPGHOME" --batch --no-tty --gen-key /tmp/pa-gpg-params && rm -f /tmp/pa-gpg-params && gpg --homedir "$GNUPGHOME" --armor --export-secret-keys "$E" > "$K/serverkey_private.asc" && gpg --homedir "$GNUPGHOME" --armor --export "$E" > "$K/serverkey.asc" && chmod 600 "$K/serverkey_private.asc"; fi; gpg --homedir "$GNUPGHOME" --batch --import "$K/serverkey.asc" >/dev/null 2>&1 || true; gpg --homedir "$GNUPGHOME" --batch --import "$K/serverkey_private.asc" >/dev/null 2>&1 || true; gpg --batch --show-keys --with-colons "$K/serverkey.asc" | awk -F: ''$1 == "fpr" { print $10; exit }'' > "$K/fingerprint"'
  - id: passbolt-env
    stage: [install, upgrade, start]
    description: 'Passbolt reads its database from DATASOURCES_DEFAULT_*, not from DB_*, so the account''s own credentials have to be spelled into the names CakePHP looks for. Runs in every phase because the install and migrate commands below need them just as much as the running server does, and a redeploy skips the install stage. Exported into the entrypoint''s own shell, which is the one Apache inherits.'
    run: 'DATASOURCES_DEFAULT_HOST="$DB_HOST"; DATASOURCES_DEFAULT_PORT="$DB_PORT"; DATASOURCES_DEFAULT_USERNAME="$DB_USERNAME"; DATASOURCES_DEFAULT_PASSWORD="$DB_PASSWORD"; DATASOURCES_DEFAULT_DATABASE="$DB_DATABASE"; APP_FULL_BASE_URL="$APP_URL"; GNUPGHOME=/app/config/gpg/.gnupg; PASSBOLT_GPG_SERVER_KEY_PUBLIC=/app/config/gpg/serverkey.asc; PASSBOLT_GPG_SERVER_KEY_PRIVATE=/app/config/gpg/serverkey_private.asc; PASSBOLT_GPG_SERVER_KEY_FINGERPRINT="$(cat /app/config/gpg/fingerprint 2>/dev/null)"; export DATASOURCES_DEFAULT_HOST DATASOURCES_DEFAULT_PORT DATASOURCES_DEFAULT_USERNAME DATASOURCES_DEFAULT_PASSWORD DATASOURCES_DEFAULT_DATABASE APP_FULL_BASE_URL GNUPGHOME PASSBOLT_GPG_SERVER_KEY_PUBLIC PASSBOLT_GPG_SERVER_KEY_PRIVATE PASSBOLT_GPG_SERVER_KEY_FINGERPRINT'
  - id: jwt-keys
    stage: [install, upgrade]
    description: 'Passbolt''s JWT authentication needs its own keypair under config/jwt/. Written once; the command is idempotent and refuses to overwrite. The directory is then made read-only: `passbolt install` fails its baseline check with "The /app/config/jwt/ directory should not be writable" otherwise, and the app runs as the owner of /app, so only the mode can say it.'
    run: 'cd /app && chmod u+w config/jwt && { [ -f config/jwt/jwt.key ] || bin/cake passbolt create_jwt_keys; } && chmod a-w config/jwt'
  - id: passbolt-install
    stage: install
    description: 'Creates the schema. --no-admin because an admin account needs a name, an email and a password that only the operator has; Passbolt then offers its own registration page for the first user.'
    run: 'cd /app && bin/cake passbolt install --no-admin --force'
  - id: passbolt-migrate
    stage: upgrade
    description: 'A redeploy over an existing database migrates rather than installing, which is what the install/upgrade split is for.'
    run: 'cd /app && bin/cake passbolt migrate --no-clear-cache'
