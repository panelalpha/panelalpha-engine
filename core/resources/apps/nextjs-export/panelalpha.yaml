# yaml-language-server: $schema=../../platforms/_schema.json
id: nextjs-export
strategy: nextjs
label: 'Next.js (export)'
priority: 925
runtime: nginx
port: 8080
output_directory: out
requires:
  node:
    role: build
# `output: "export"` or `next export`, in the root or the workspace app's own files.
detect:
  probe: next-export
commands:
  - id: npm-install
    stage: build
    role: dependencies
    run: '{{js.install}}'
    description: "Resolved from the project's lockfile — npm ci, pnpm install --frozen-lockfile, yarn or bun."
  - id: next-build
    stage: build
    run: '{{js.build:npx next build}}'
    description: "The project's own build script wins over this default when package.json defines one."
output_from: next-workspace
