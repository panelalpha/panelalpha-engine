# yaml-language-server: $schema=../../platforms/_schema.json
id: laravel
label: Laravel
priority: 940
runtime: php
port: 8000
docroot: public
env:
  APP_ENV: production
  LOG_CHANNEL: stderr
requires:
  php: runtime
  node:
    role: build
    optional: true
detect:
  all:
    - file: composer.json
    - file: artisan
commands:
  - id: composer-install
    stage: build
    role: dependencies
    description: 'Runs on the host, in the image the app will be served from, so Composer checks the real PHP version and extension set. --no-plugins because a plugin is arbitrary PHP out of the customer repository and this runs on the host daemon.'
    run: 'composer install --no-dev --no-interaction --no-scripts --no-plugins --optimize-autoloader'
  # No npm commands here. The frontend is compiled on the host by
  # HostCompile::runForPhp(), with the project's own package manager and its
  # own lockfile. A build-stage command runs in the PHP host build, which has
  # no Node in it, so `npm run build` there fails for every Laravel app that has
  # a build script.
  - id: package-discover
    stage: build
    description: 'composer install ran with --no-scripts, so vendor package discovery and published assets have to be done explicitly once the source is present.'
    run: 'composer run-script --no-interaction post-autoload-dump'
    optional: true
  # The real text comes from commands_from; `run` only has to be non-empty.
  - id: asset-publish
    stage: build
    description: 'The vendor:publish and filament:assets lines of the project''s own post-update-cmd and post-create-project-cmd, which composer install never runs. Nothing else from those scripts is taken.'
    run: 'true'
    optional: true
  - id: key-generate
    stage: install
    description: 'Only on first deploy — regenerating APP_KEY later would invalidate every existing session and encrypted column. Skipped when the container already has a key: the engine writes one into .env, the env_file, and key:generate would only rewrite that file under the running app, so the next restart would run on a different key (#178).'
    # key:generate exits 0 when .env has no APP_KEY line to fill (or, before
    # Laravel 10, without a word), and migrate then ran with no key; stop here instead.
    run: 'case "${APP_KEY:-}" in base64:?*) echo "APP_KEY is already set; not generating one" ;; *) php artisan key:generate --force --no-interaction && grep -qs "^APP_KEY=base64:" .env ".env.${APP_ENV:-production}" || { echo "key:generate did not write an APP_KEY into .env; stopping before migrate" >&2; exit 1; } ;; esac'
  - id: storage-link
    stage: start
    description: 'Every boot, not only on install: the public/storage symlink lives in the checkout, which each deploy re-clones, so after a rebuild every file on the public disk answered 404.'
    run: 'test -e public/storage || test -L public/storage || php artisan storage:link'
    optional: true
  - id: migrate
    stage:
      - install
      - upgrade
    description: 'Runs when the code changed, never on a plain restart or a crash-loop retry.'
    run: 'php artisan migrate --force --no-interaction'
    timeout: 600
  - id: optimize
    stage: start
    description: 'Config, route and view caches are keyed on the environment, which is only fully known at boot — cheap and idempotent, so it belongs on every start.'
    run: 'php artisan optimize'
    optional: true
commands_from:
  asset-publish: laravel.assets
