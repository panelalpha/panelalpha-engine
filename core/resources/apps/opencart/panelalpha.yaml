# yaml-language-server: $schema=../../platforms/_schema.json
id: opencart
strategy: php
label: OpenCart
priority: 972
runtime: php
port: 8000
docroot: upload
# Priority 972 puts this above the generic Dockerfile platform (970), which is
# not the usual arrangement for an application manifest. OpenCart's root
# Dockerfile does not build the checkout: it downloads the latest GitHub
# release and unzips that instead, so deploying a tag would silently ship a
# different version. In 4.1.0.4 it cannot build at all -- a stray ` && &&` in
# the extension install, and a `COPY configs` for a directory the repository
# does not contain. The repository's compose file is a workstation stack
# (adminer, mysql:5.7, published ports, admin/admin credentials) and is
# rejected before this by the compose probe.
#
# OpenCart's repository is not laid out like its release: the shop lives in
# upload/, while composer.json stays at the top with
# `vendor-dir: upload/system/storage/vendor`. That rules out app_root -- there
# is no composer.json inside upload/, and moving the image root there would
# resolve vendor/ to the wrong place. The image root stays the repository and
# only the document root moves.
env:
  APP_ENV: production
  LOG_CHANNEL: stderr
requires:
  php: runtime
# MySQL only in practice: the installer offers mysqli and pgsql, but OpenCart's
# own schema and every extension are written for MySQL. The engine also has to
# put the mysqli driver in the image, which composer.json never asks for.
database: mysql
detect:
  all:
    - file: composer.json
    # Matched against the repository root, because detection runs before any
    # of this manifest's paths are known.
    - path: upload/system/startup.php
    - path: upload/admin/index.php
    - path: upload/install/cli_install.php
commands:
  - id: release-layout
    stage: prepare
    # master pins a localhost <base href> and renders nothing, yet still matches
    # the detect rules, so it is refused here before anything is built.
    when:
      none:
        - path: upload/index.php
    description: 'Refuses a checkout without upload/index.php: the unreleased layout of OpenCart''s master branch, which this recipe cannot serve.'
    run: 'echo "OpenCart: this checkout has no upload/index.php. It is the unreleased rewrite on the master branch, whose page loads its scripts from http://localhost/ and renders nothing for a visitor. Deploy the 4.1 release line instead: branch 4.1.x.x." >&2; exit 1'
  - id: writable-config
    stage: [install, upgrade]
    description: 'OpenCart''s installer writes the storefront and admin config.php itself, and refuses to start while either is missing or read-only -- the repository ships only an empty config-dist.php. Creating both empty and writable is what lets the installer''s database step run at all.'
    run: 'touch /app/upload/config.php /app/upload/admin/config.php && chmod 664 /app/upload/config.php /app/upload/admin/config.php && mkdir -p /app/upload/system/storage/cache /app/upload/system/storage/logs /app/upload/system/storage/session /app/upload/system/storage/upload /app/upload/system/storage/download'
  - id: database-login
    stage: [install, upgrade]
    description: 'The installer writes the database login and the shop''s address into both config.php files once. A staging or clone copies them while the engine hands the copy a database of its own in DB_* and its own APP_URL, so both are put back on every boot, and nothing is written while they already match. Left alone while a file is still the empty one created above for the installer.'
    run: >-
      php -r '
      $set = fn (string $s, string $at, string $v): string => preg_replace_callback("/(" . $at . ")\x27(?:[^\x27\\\\]|\\\\.)*\x27/m", fn (array $m): string => $m[1] . var_export($v, true), $s, 1) ?? exit(1);
      $u = rtrim((string) getenv("APP_URL"), "/");
      $db = ["DB_HOSTNAME" => getenv("DB_HOST"), "DB_PORT" => getenv("DB_PORT"), "DB_DATABASE" => getenv("DB_DATABASE"), "DB_USERNAME" => getenv("DB_USERNAME"), "DB_PASSWORD" => getenv("DB_PASSWORD")];
      $urls = $u === "" ? [] : ["/app/upload/config.php" => ["HTTP_SERVER" => "$u/", "HTTPS_SERVER" => "$u/"], "/app/upload/admin/config.php" => ["HTTP_SERVER" => "$u/admin/", "HTTPS_SERVER" => "$u/admin/", "HTTP_CATALOG" => "$u/", "HTTPS_CATALOG" => "$u/"]];
      foreach (["/app/upload/config.php", "/app/upload/admin/config.php"] as $f) {
      $c = (string) @file_get_contents($f);
      if ((string) getenv("DB_DATABASE") === "" || !str_contains($c, "DB_DATABASE")) { continue; }
      $n = $c;
      foreach ($db + ($urls[$f] ?? []) as $k => $v) { $n = $set($n, "define\(\s*\x27" . $k . "\x27\s*,\s*", (string) $v); }
      if ($n === $c) { continue; }
      if (file_put_contents($f, $n) === false) { fwrite(STDERR, "database-login: cannot rewrite $f\n"); exit(1); }
      fwrite(STDERR, "database-login: $f now points at database " . getenv("DB_DATABASE") . "\n");
      }
      '
