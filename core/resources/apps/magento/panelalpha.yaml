# yaml-language-server: $schema=../../platforms/_schema.json
id: magento
strategy: php
label: Magento
priority: 943
runtime: php
port: 8000
docroot: pub
# Magento's document root is pub/, not the repository root. Served from the
# root, its own .htaccess redirects into pub/ and the request bounces until
# curl gives up at fifty hops -- a 302 loop, which is not something a status
# code alone would tell you.
env:
  APP_ENV: production
  LOG_CHANNEL: stderr
requires:
  php: runtime
# MySQL 8 / MariaDB is the only database Magento supports, and its installer
# needs credentials it has no environment variable to read.
database: mysql
detect:
  all:
    - file: composer.json
    - path: bin/magento
    - path: pub/index.php
    - path: app/etc/di.xml
commands:
  - id: writable-dirs
    stage: [install, upgrade]
    description: 'Magento generates code into generated/, caches and logs into var/, and publishes assets into pub/static and pub/media. None of the four is in the repository, and setup:install stops on the first one it cannot create.'
    run: 'mkdir -p /app/var /app/generated /app/pub/static /app/pub/media && chmod -R 775 /app/var /app/generated /app/pub/static /app/pub/media'
  - id: database-login
    stage: [install, upgrade]
    description: 'setup:install writes the database login into app/etc/env.php once. A staging or clone copies that file while the engine hands the copy a database of its own in DB_*, so the default connection is put back from DB_* on every boot, and nothing is written while it already matches. Left alone until setup:install has written the file.'
    run: >-
      php -r '
      $f = "/app/app/etc/env.php";
      $c = is_file($f) ? include $f : null;
      if ((string) getenv("DB_DATABASE") === "" || !is_array($c["db"]["connection"]["default"] ?? null)) { exit(0); }
      $n = $c;
      $n["db"]["connection"]["default"] = array_replace($c["db"]["connection"]["default"], ["host" => getenv("DB_HOST") . ":" . getenv("DB_PORT"), "dbname" => getenv("DB_DATABASE"), "username" => getenv("DB_USERNAME"), "password" => getenv("DB_PASSWORD")]);
      if ($n === $c) { exit(0); }
      if (file_put_contents($f, "<?php\nreturn " . var_export($n, true) . ";\n") === false) { fwrite(STDERR, "database-login: cannot rewrite $f\n"); exit(1); }
      fwrite(STDERR, "database-login: $f now points at database " . getenv("DB_DATABASE") . "\n");
      '
