# yaml-language-server: $schema=../../platforms/_schema.json
id: osticket
strategy: php
label: osTicket
priority: 941
runtime: php
port: 8000
docroot: .
# osTicket ships no composer.json: its dependencies are vendored under
# include/, and it needs no Composer to run. Naming the image is what says so
# -- with one, an unresolvable `requires` falls back to the engine's default
# minor instead of failing detection. osTicket's own setup refuses anything
# below PHP 8.2 (include/class.setup.php: $prereq['php']), and the default is
# above that.
image: php:8.3-apache-bookworm
env:
  APP_ENV: production
  LOG_CHANNEL: stderr
requires:
  php: runtime
# MySQL, and only MySQL: osTicket's own requirement check is
# `extension_loaded('mysqli')` and nothing else. The key both provisions the
# database and puts that extension in the image.
database: mysql
detect:
  all:
    - path: bootstrap.php
    - path: include/class.osticket.php
    - path: include/ost-sampleconfig.php
    - path: setup/install.php
commands:
  - id: writable-config
    stage: [install, upgrade]
    description: 'The installer writes include/ost-config.php and refuses to start while it is missing or read-only -- Installer::isConfigWritable() is `is_writable()` on that exact path, and the repository ships only ost-sampleconfig.php. Copied rather than generated because osTicket fills it in itself, and never over a config that already exists.'
    run: 'if [ ! -f /app/include/ost-config.php ]; then cp /app/include/ost-sampleconfig.php /app/include/ost-config.php; fi && chmod 664 /app/include/ost-config.php && mkdir -p /app/attachments'
  - id: database-login
    stage: [install, upgrade]
    description: 'The installer writes the database login into include/ost-config.php once. A staging or clone copies that file while the engine hands the copy a database of its own in DB_*, so DBHOST, DBNAME, DBUSER and DBPASS are put back from DB_* on every boot, and nothing is written while they already match. Left alone until OSTINSTALLED is TRUE: before that the file is the sample the installer fills in.'
    run: >-
      php -r '
      $f = "/app/include/ost-config.php";
      $c = (string) @file_get_contents($f);
      if ((string) getenv("DB_DATABASE") === "" || !str_contains($c, "define(\x27OSTINSTALLED\x27,TRUE)")) { exit(0); }
      $set = fn (string $s, string $at, string $v): string => preg_replace_callback("/(" . $at . ")\x27(?:[^\x27\\\\]|\\\\.)*\x27/m", fn (array $m): string => $m[1] . var_export($v, true), $s, 1) ?? exit(1);
      $n = $c;
      foreach (["DBHOST" => getenv("DB_HOST") . ":" . getenv("DB_PORT"), "DBNAME" => getenv("DB_DATABASE"), "DBUSER" => getenv("DB_USERNAME"), "DBPASS" => getenv("DB_PASSWORD")] as $k => $v) { $n = $set($n, "define\(\s*\x27" . $k . "\x27\s*,\s*", (string) $v); }
      if ($n === $c) { exit(0); }
      if (file_put_contents($f, $n) === false) { fwrite(STDERR, "database-login: cannot rewrite $f\n"); exit(1); }
      fwrite(STDERR, "database-login: $f now points at database " . getenv("DB_DATABASE") . "\n");
      '
