# yaml-language-server: $schema=../../platforms/_schema.json
id: matomo
strategy: php
label: Matomo
priority: 935
runtime: php
port: 8000
docroot: .
# Matomo is MySQL or nothing -- it has no SQLite driver -- and it has no .env
# and no compose file to say so. Without this it reached its own installer and
# stopped at the database step with nothing to type in.
database: mysql
env:
  APP_ENV: production
  LOG_CHANNEL: stderr
requires:
  php: runtime
detect:
  all:
    - file: composer.json
    - path: matomo.php
    - path: piwik.php
    - path: core/Version.php
commands:
  - id: composer-install
    stage: build
    role: dependencies
    run: 'composer install --no-dev --no-interaction --no-scripts --no-plugins --optimize-autoloader'
  - id: database-env
    stage: start
    description: 'Matomo''s installer reads its database defaults from MATOMO_DATABASE_* -- the same variables its own Docker image uses -- so the account''s credentials arrive prefilled and nobody has to be told what they are. Exported into the entrypoint''s own shell, which is the one Apache inherits.'
    run: 'MATOMO_DATABASE_HOST="$DB_HOST"; MATOMO_DATABASE_PORT="$DB_PORT"; MATOMO_DATABASE_USERNAME="$DB_USERNAME"; MATOMO_DATABASE_PASSWORD="$DB_PASSWORD"; MATOMO_DATABASE_DBNAME="$DB_DATABASE"; export MATOMO_DATABASE_HOST MATOMO_DATABASE_PORT MATOMO_DATABASE_USERNAME MATOMO_DATABASE_PASSWORD MATOMO_DATABASE_DBNAME'
  - id: restore-config
    stage: upgrade
    description: 'Matomo records the database it chose in config/config.ini.php, a file that lives in the container and not in the image, so a rebuilt container has an installed database and no idea it is installed -- it would show the wizard over a site full of data. Writing the section back points it at its own tables again. Only when the database holds a superuser, which the installer creates after the tables: a config over an empty or half-built database makes Matomo call itself installed and refuse to run its installer at all. An unreachable database fails the boot rather than guess. Upgrade only: on a first deploy there is nothing installed to point at, and the installer is what should run. Never overwrites a config Matomo already wrote.'
    run: 'if ! grep -q "^\[database\]" /app/config/config.ini.php 2>/dev/null; then n=0; while :; do rc=0; php -r ''try { $db = new PDO("mysql:host=" . getenv("DB_HOST") . ";port=" . (getenv("DB_PORT") ?: "3306") . ";dbname=" . getenv("DB_DATABASE"), getenv("DB_USERNAME"), getenv("DB_PASSWORD")); } catch (Throwable $e) { exit(2); } try { exit($db->query("SELECT COUNT(*) FROM matomo_user WHERE superuser_access = 1")->fetchColumn() > 0 ? 0 : 1); } catch (Throwable $e) { exit(1); }'' || rc=$?; if [ "$rc" != 2 ] || [ "$n" -ge 30 ]; then break; fi; n=$((n + 1)); sleep 2; done; if [ "$rc" = 1 ]; then echo "restore-config: the Matomo installer never finished (no superuser in the database); leaving it to run" >&2; elif [ "$rc" != 0 ]; then echo "restore-config: cannot read the database to tell a finished Matomo install from an unfinished one" >&2; exit 1; else printf "; <?php exit; ?> DO NOT REMOVE THIS LINE\n[database]\nhost = \"%s\"\nport = \"%s\"\nusername = \"%s\"\npassword = \"%s\"\ndbname = \"%s\"\ntables_prefix = \"matomo_\"\n\n[General]\ntrusted_hosts[] = \"%s\"\n" "$DB_HOST" "$DB_PORT" "$DB_USERNAME" "$DB_PASSWORD" "$DB_DATABASE" "${APP_URL#*://}" > /app/config/config.ini.php; fi; fi'
