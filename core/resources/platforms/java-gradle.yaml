# yaml-language-server: $schema=./_schema.json
id: java-gradle
strategy: java
label: 'Java (Gradle)'
priority: 745
runtime: command
port: 8080
# Spring Boot binds server.address, and an app that pins it to localhost
# (BinPastes' application-default.properties) is unreachable from outside the
# container. The env var outranks packaged properties; an account env var
# still overrides it. The same reason dotnet.yaml sets ASPNETCORE_URLS.
env:
  SERVER_ADDRESS: '0.0.0.0'
requires:
  java: runtime
detect:
  any:
    - file: build.gradle
    - file: build.gradle.kts
  # A repository carrying both build files is Maven's. Gradle is frequently
  # the alternative build in a Maven project -- spring-petclinic ships one --
  # and the reverse is rare.
  #
  # Said here rather than left to priority, because priority decided this
  # differently from the runtime and the two disagreed in a way nothing
  # caught: java-gradle (745) outranked java (740), so the *commands* came
  # from Gradle, while JavaRuntime::resolve() and imageFor() both check
  # pom.xml first, so the *image* and the requirement came from Maven. The
  # deploy then built `target/` with mvn and started a container looking for
  # `build/libs/*.jar`. One rule, in one place, for all three.
  none:
    - file: pom.xml
commands:
  - id: gradle-build
    stage: build
    run: 'gradle --no-daemon -x test build'
  - id: serve
    stage: start
    serve: true
    run: 'java -jar build/libs/*.jar'
commands_from:
  # ./gradlew when the project ships a wrapper, the image's gradle otherwise.
  gradle-build: java.build-gradle
  serve: java.start-gradle
