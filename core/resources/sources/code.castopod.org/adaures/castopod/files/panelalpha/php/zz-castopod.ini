; Written by PanelAlpha, and read because the compose override points
; PHP_INI_SCAN_DIR at this directory as well as the image's own conf.d. The
; shared PHP base image loads no php.ini at all -- `php --ini` answers
; "Loaded Configuration File: (none)" -- so what is in force without this file
; is PHP's compiled-in defaults (engine#185).
;
; Two of those defaults make a podcast host unusable rather than untidy.

; An episode *is* an audio file. The compiled-in defaults are
; upload_max_filesize 2M and post_max_size 8M, and a 40-minute MP3 at 128 kbps
; is about 37M -- so the episode form's POST is discarded before PHP is
; entered, $_POST and $_FILES both arrive empty, and CodeIgniter's validation
; reports "the audio file is required" on a request that carried one. These are
; upstream's own values, from the ARGs in docker/production/Dockerfile.
upload_max_filesize = 512M
post_max_size = 512M

; james-heinrich/getid3 reads the uploaded file to work out the episode's
; duration, and the cover art is resized with gd into three variants plus a
; federation-sized JPEG. 128M is the compiled-in default and is not enough for
; a large cover on a long episode.
memory_limit = 512M

; Writing half a gigabyte through PHP's upload handler and then hashing and
; transcoding the artwork takes longer than the compiled-in 30 seconds.
max_execution_time = 300
max_input_time = 300

; Two files per episode form (the audio and the cover), plus the podcast
; banner. PHP's default of 20 is fine; stated so a future edit does not have to
; wonder whether it was considered.
max_file_uploads = 20

; Castopod's own timezone handling is UTC and CodeIgniter warns when the
; default is unset.
date.timezone = UTC
