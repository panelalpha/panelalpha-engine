# yaml-language-server: $schema=../../../_schema.json
description: >-
  Akkoma is a federated (ActivityPub, Mastodon-compatible) microblogging server
  -- a Pleroma fork -- written in Elixir/Phoenix and backed by PostgreSQL. It is
  one product. This recipe is the compose-REPLACE pattern (cannery/mobilizon):
  no platform block is declared, so detection runs via fromWalk and engine#221
  does not bite; ComposePlaceholders rewrites the one PA_PUBLIC_URL value below
  to the account's public https address, and the app/init entrypoints strip the
  scheme into DOMAIN, the bare host Akkoma bakes into every actor URI.

  NO USABLE OFFICIAL IMAGE -- THE OFFICIAL PREBUILT IS AN OTP RELEASE ZIP. Unlike
  cannery/mobilizon, Akkoma publishes no maintained container image. Its
  container registry (akkoma.dev, forgejo packages) is empty; the docker.io
  `akkoma/akkoma` repo under the project's own org is abandoned (`latest`
  2023-07, `next` 2024-06, no version tags) and would not match a 2026 schema.
  What upstream DOES publish, continuously from CI (.woodpecker/publish.yml), is
  the official prebuilt OTP release -- `mix release` zipped and pushed to
  Scaleway object storage per branch and per tag. The repo's own docker-compose
  is a from-source developer template: a thin wrapper image (`build: .`) with the
  code bind-mounted (`.:/opt/akkoma`) and `mix phx.server` compiling at runtime.
  That shape is exactly the engine's local-dev-compose signature
  (ComposeFileInspector::isLocalDevCompose: a `build:` service that binds the
  project root), so ComposeUsableProbe skips it and it can never be selected as
  STRATEGY_COMPOSE -- a bare deploy of this repo does not run. Building the
  release from the clone in an authored multi-stage Dockerfile does not help
  either: Akkoma's env-driven config (config/docker.exs) is COMPILE-time in a
  release, so System.get_env would freeze at build time, not read the account's
  domain/DB at boot.

  WHAT THE RECIPE SUPPLIES. A working image-based stack around the OFFICIAL
  prebuilt release. files/akkoma-image/Dockerfile is a thin packaging wrapper
  (NOT a repair of a broken build, and it compiles nothing): debian-bookworm-slim
  + Akkoma's documented OTP runtime deps (imagemagick, ffmpeg, exiftool,
  libmagic, ncurses, postgresql-client), the official release unzipped to
  /opt/akkoma (the zip bundles its own ERTS, so no Elixir/Erlang toolchain is
  installed), and Akkoma's OWN config file shipped verbatim as
  /etc/akkoma/config.exs. Pins v3.20.0 (== the current `stable` release,
  2026-08-08); overridable with AKKOMA_RELEASE_URL. The release loads
  /etc/akkoma/config.exs at BOOT via Pleroma.Config.ReleaseRuntimeProvider, so
  every System.get_env in it (DOMAIN, DB_*, INSTANCE_NAME) is read at runtime.
  The provider REFUSES a world-readable config file, so the Dockerfile ships it
  0640 owned by the akkoma user.

  The stack: a postgres:16-alpine `db` on a NAMED volume (its superuser lets the
  first migration run CREATE EXTENSION citext/pg_trgm/uuid-ossp, which are the
  only extensions Akkoma needs -- rum is off by default, config `rum_enabled:
  false`, so plain postgres is correct and no custom Dockerfile.db is needed); a
  one-shot `init` that migrates to completion, installs the pleroma-fe and
  admin-fe frontends into the media volume, and seeds a confirmed admin BEFORE
  the app starts; the `app` running `bin/pleroma start`; and a `ready` gate
  (engine#204) so `docker compose up -d` returns only once /api/v1/instance
  answers on :4000.

  SECRETS, PERSISTED ONCE. hooks/prepare.sh generates and stores the database
  password and the seeded admin password under ~/.panelalpha/akkoma/ (0600 in
  0700), the only writable place a deploy does not delete (engine#173:
  ProjectTree::clearContents empties ~/project on every rebuild). Akkoma's OWN
  signing secrets -- secret_key_base, the endpoint signing_salt and the web-push
  VAPID keypair -- are generated by config/docker.exs on first boot into
  /var/lib/akkoma/secret.exs, which is on a NAMED volume, so they persist across
  rebuilds without ever being regenerated. Rotating any of them would log
  everyone out and break web push; a new DB password would strand the pgdata
  volume that still holds the old one.

  DATA: DATABASE + UPLOADED MEDIA + FRONTENDS, ALL PERSISTED. Postgres is on the
  pgdata named volume. Akkoma writes uploaded media to /var/lib/akkoma/uploads,
  the generated secret to /var/lib/akkoma/secret.exs, and the installed
  frontends to /var/lib/akkoma/static/frontends -- all under /var/lib/akkoma,
  which is a second NAMED volume (akkoma_var) mounted into both init and app.
  Named volumes survive project_rebuild and storage reclaim; only account
  deletion / failed-deploy rollback wipe them. VERIFIED: the database rows and an
  uploaded avatar both survive a rebuild.

  ADMIN IS SEEDED, CONFIRMED, NO EMAIL NEEDED. init runs `pleroma_ctl user new
  admin admin@<host> --password <pw> --admin -y`, which registers the user with
  is_confirmed:true (Mix.Tasks.Pleroma.User) -- an immediately usable
  administrator, no mail sent or required. The password is generated once into
  ~/.panelalpha/akkoma/ (0600) and surfaced only in that store's
  credentials.txt. Seeding is idempotent and domain-change-safe: init gates on
  `SELECT count(*) FROM users WHERE is_admin` and seeds nobody if an admin
  already exists. PLEROMA_CTL_RPC_DISABLED makes the seed run in its own eval
  instance rather than RPC-ing into a node, and init runs before the app, so
  exactly one thing touches the database at seed time.

  REGISTRATION IS CLOSED BY DEFAULT; PUBLIC SIGN-UP NEEDS OPERATOR SMTP.
  config/docker.exs sets registrations_open:false, so the account is admin-only
  and needs no mail server to be fully usable -- no first-visitor window. To OPEN
  public registration the operator sets INSTANCE_REGISTRATIONS_OPEN=true in the
  project environment AND configures SMTP, because a self-registered user must
  confirm their address and Akkoma delivers that link by SMTP; with no SMTP the
  link is only written to the app log. Client-side SENDING (SMTP out) is all that
  is involved; Akkoma receives no inbound mail, which is out of scope. Stated in
  credentials.txt.

  VERIFIED end to end on this engine over the real public HTTPS domain: a bare
  deploy of the tracker repo does not run (its compose is a local-dev template
  the engine will not select); with the recipe it deploys, the seeded admin logs
  in over the Mastodon-compatible API (/api/v1/apps + /oauth/token) and posts a
  status that reads back on the public timeline, /api/v1/instance and
  /.well-known/webfinger and /.well-known/nodeinfo all report the account's own
  domain, anonymous posting and closed registration are both refused, /.env
  /.git/config and config/prod.secret.exs do not leak and no debug traceback is
  served, and a rebuild preserves the admin login, the posted status and an
  uploaded avatar.

  ENGINE CAVEAT (NOT A RECIPE FAULT). Media upload is multipart and Akkoma's
  streaming UI opens a WebSocket; the shared panelalpha.online (WithoutDNS)
  tunnel does not reliably carry multipart/upgrade (engine#170), so upload and
  streaming are verified against the account's own address. On an account with
  its own domain pointed straight at the engine the whole UI works. Report as
  engine/tunnel limitation, not a recipe or app failure.
