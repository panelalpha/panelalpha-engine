# yaml-language-server: $schema=../../../_schema.json
description: >-
  Netron, the viewer for neural network and machine learning models (Python
  server, :8080). The plain deploy detects the python platform, pip-installs
  the checkout as an empty `netron-0.0.0` wheel (the package directory is
  only assembled by upstream's package.py) and serves the engine placeholder.

  Compose-REPLACE on python:3.12-slim that installs the current netron
  release from PyPI (9.3.0) and runs `netron --host 0.0.0.0 -p 8080`. The
  viewer opens model files in the browser, so there is no server-side state
  and no volume. No login, as upstream ships it.
