# Front proxy for Calibre-Web (see overrides/docker-compose.yml). The engine's
# vhost sends `Connection: upgrade` on every request; gevent then
# reads a POST body until EOF and every form POST hangs. Send it only for real upgrades.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8083;
    # Book uploads.
    client_max_body_size 0;
    resolver 127.0.0.11 valid=10s;
    set $cw http://app:8083;

    location / {
        proxy_pass $cw;
        proxy_http_version 1.1;
        # X-Forwarded-* pass through unchanged from the engine's proxy.
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
