# The checkout is a CakePHP source tree; this runs upstream's release image with
# MariaDB, as passbolt_docker's docker-compose-ce.yaml.
services:
  app:
    image: passbolt/passbolt:5.16.0-1-ce-non-root
    restart: unless-stopped
    env_file:
      - ../.panelalpha/passbolt/db.env
    environment:
      APP_FULL_BASE_URL: ${PA_PUBLIC_URL}
      DATASOURCES_DEFAULT_HOST: db
      DATASOURCES_DEFAULT_USERNAME: passbolt
      DATASOURCES_DEFAULT_DATABASE: passbolt
      # TLS ends at the engine's proxy; the container answers plain HTTP on 8080.
      PASSBOLT_SSL_FORCE: "false"
    volumes:
      # Server GPG key and JWT keypair, generated by the image on first boot.
      - gpg:/etc/passbolt/gpg
      - jwt:/etc/passbolt/jwt
    ports:
      - "8080:8080"
    command: ["/usr/bin/wait-for.sh", "-t", "0", "db:3306", "--", "/docker-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/healthcheck/status.json"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 768m

  db:
    image: docker.io/library/mariadb:11.4
    restart: unless-stopped
    env_file:
      - ../.panelalpha/passbolt/db.env
    environment:
      MARIADB_DATABASE: passbolt
      MARIADB_USER: passbolt
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 512m

  # No-op gate: `compose up -d` returns only once Passbolt answers.
  ready:
    image: docker.io/library/mariadb:11.4
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  gpg: {}
  jwt: {}
  db: {}
