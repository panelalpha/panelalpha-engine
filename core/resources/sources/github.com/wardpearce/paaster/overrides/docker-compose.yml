# Compose-replace: upstream's filesystem deployment (docs/docs/deployment/filesystem.md)
# on the release image; drops the Garage S3 node and pins MongoDB 7.0 (engine#146).
services:
  paaster:
    image: wardpearce/paaster:3.6.1
    restart: unless-stopped
    depends_on:
      paaster_mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ORIGIN: ${PA_PUBLIC_URL}
      STORAGE_BACKEND: filesystem
      FS_STORAGE_PATH: /data/paaster
      MONGO_URL: mongodb://paaster_mongodb:27017
      MONGO_DB: paasterv3
      # Client address for the per-IP rate limits: the hop the engine's proxy
      # appended, not the socket (the proxy) or the visitor-supplied first entry (engine#319).
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
    ports:
      - "3000:3000"
    volumes:
      - paaster_data:/data/paaster
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 512m

  paaster_mongodb:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  # No-op gate: `compose up -d` returns once the site answers.
  ready:
    image: mongo:7.0
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      paaster:
        condition: service_healthy
    mem_limit: 32m

volumes:
  paaster_data: {}
  mongo_data: {}
