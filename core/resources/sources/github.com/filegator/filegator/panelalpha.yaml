# yaml-language-server: $schema=../../../_schema.json
description: >-
  FileGator is a multi-user PHP web file manager (JSON users file, no
  database). The repository's compose builds its Dockerfile, which clones
  master again and runs npm, composer and phpunit: slow and heavy for an
  account. overrides/docker-compose.yml runs the official filegator/filegator
  image of the current release, v7.16.5, on :8080. Apache's document root is
  /var/www/filegator/dist, so configuration.php, private/ and repository/
  have no URL.

  Security: the image ships users.json.blank with admin/admin123 and copies it
  to private/users.json on the first request. The engine generates the admin
  login (`credentials:` below) into ~/.panelalpha/app-credentials.env; GET
  /projects/{name}/app-credentials (MCP app_credentials_get) returns it.
  hooks/prepare.sh hashes the password (bcrypt) into
  ~/.panelalpha/filegator/admin.hash (0600 in 0700). The users-seed service runs
  before the app, the only one given the hash, and writes users.json into the
  `private` volume while it is missing or its admin still has the default (or
  an empty) password; a password changed in the app, and users added there,
  are never touched. It exits non-zero on a missing hash or unreadable
  users.json, which keeps the app from starting. The guest user has no
  permissions, as upstream ships it.

  Files live on the `repository` named volume at /var/www/filegator/repository,
  outside the document root, so an uploaded .php is never executed and files
  are only reachable through the logged-in API. users.json, sessions and logs
  live on the `private` volume, so logins and users survive redeploys. A
  `ready` service gates on the app answering.
credentials:
  adopt_from: .panelalpha/filegator/admin.env
  fields:
    FILEGATOR_ADMIN_USER: {kind: username, value: admin}
    FILEGATOR_ADMIN_PASSWORD: {kind: password}
