; Written by PanelAlpha, and read because the compose override points
; PHP_INI_SCAN_DIR at this directory as well as the image's own conf.d. The
; shared PHP base image loads no php.ini at all -- `php --ini` answers
; "Loaded Configuration File: (none)", measured on a deployed account -- so
; what is in force without this file is PHP's compiled-in defaults
; (engine #185).

; display_errors is compiled in as On. Baikal's own front controllers are
; uneven about this: html/index.php and html/dav.php each call
; ini_set("display_errors", 0) on their second line, but html/admin/index.php
; and html/admin/install/index.php do not -- they set error_reporting(E_ALL)
; and log_errors and leave display_errors alone. So the admin interface, which
; is the half an account owner actually opens, is the half that would print
; the account's directory layout into the page. Baikal\Core\Tools::
; handleException() prints the whole exception, `<pre>` and all, and the
; Flake bootstrap reaches the filesystem and the database before it renders
; anything. log_errors sends the same text to stderr, which is the
; container's, so it lands in `docker logs` and the panel's log view where it
; belongs.
display_errors = Off
display_startup_errors = Off
log_errors = On

; expose_php is On by default in the image. Baikal already sends its own
; X-Sabre-Version header -- it is a DAV server and clients read it -- so this
; removes the PHP version, not the application's.
expose_php = Off

; Baikal reads config/baikal.yaml's `timezone` and hands it to
; date_default_timezone_set() on every request, so this value is only what PHP
; uses before that -- the CLI install stage included, where a missing
; date.timezone is a warning on every date() call. Same string as the timezone
; panelalpha-baikal-setup.php writes into the config.
date.timezone = UTC

; The admin interface is a PHP session. html/index.php, html/admin/index.php
; and the install entry point each set session.cookie_httponly themselves, on
; their own second line, so this is not the only thing saying it -- but
; samesite is not set anywhere in the application, and a cookie flag is worth
; having from the first request rather than from whichever entry point happens
; to be hit.
;
; session.cookie_secure is deliberately *not* set. TLS terminates at the
; engine's proxy and the container only ever sees plain HTTP, so PHP would have
; to be told; an account also reachable over http:// would then have a login
; form that never logs anyone in, with no error to explain it. The proxy's
; 301 to https is what keeps the cookie off the wire -- measured: port 80 on
; an account domain answers 301.
session.cookie_httponly = 1
session.cookie_samesite = Lax

; A vCard with a photo is the largest thing a CardDAV client PUTs, and sabre's
; own examples assume a few megabytes. The compiled-in post_max_size is 8M;
; this leaves room for that without inviting an upload.
post_max_size = 16M
upload_max_filesize = 16M

; sabre/dav holds a calendar object's parsed VCALENDAR in memory for a REPORT,
; and expands a recurrence rule across the queried time range to answer a
; calendar-query. 128M is PHP's own default; this is headroom for that one
; path, inside the container's 512m.
memory_limit = 256M
