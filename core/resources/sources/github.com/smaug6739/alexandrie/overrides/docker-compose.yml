# Upstream's docker-compose.yml (MySQL, RustFS, backend, frontend) from the
# v8.14.2 images, with generated secrets from ~/.panelalpha (hooks/prepare.sh)
# and one nginx front door so the API and CDN share the site's address.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ../.panelalpha/alexandrie/mysql.env
    environment:
      MYSQL_DATABASE: alexandrie
      MYSQL_USER: alexandrie
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} -e 'SELECT 1' $${MYSQL_DATABASE}"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    mem_limit: 768m

  rustfs:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    env_file:
      - ../.panelalpha/alexandrie/rustfs.env
    environment:
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_LOG_LEVEL: error
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    mem_limit: 256m

  backend:
    image: ghcr.io/smaug6739/alexandrie-backend:v8.14.2
    restart: unless-stopped
    # .env carries the customer's settings (SMTP_*, OIDC, CONFIG_*); the
    # generated secrets come second and win.
    env_file:
      - .env
      - ../.panelalpha/alexandrie/backend.env
    environment:
      BACKEND_PORT: 8201
      GIN_MODE: release
      COOKIE_DOMAIN: ${PA_PUBLIC_HOST}
      FRONTEND_URL: ${PA_PUBLIC_URL}
      ALLOW_UNSECURE: "false"
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: alexandrie
      DATABASE_USER: alexandrie
      MINIO_ENDPOINT: rustfs:9000
      MINIO_PUBLIC_URL: ${PA_PUBLIC_URL}
      MINIO_SECURE: "false"
      MINIO_BUCKET: alexandrie
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    mem_limit: 256m

  frontend:
    image: ghcr.io/smaug6739/alexandrie-frontend:v8.14.2
    restart: unless-stopped
    environment:
      PORT: 8200
      NUXT_PUBLIC_CONFIG_DISABLE_SIGNUP_PAGE: ${CONFIG_DISABLE_SIGNUP:-false}
      NUXT_PUBLIC_CONFIG_DISABLE_LANDING_PAGE: ${CONFIG_DISABLE_LANDING:-false}
      NUXT_PUBLIC_BASE_API: ${PA_PUBLIC_URL}
      NUXT_PUBLIC_BASE_CDN: ${PA_PUBLIC_URL}
      NUXT_PUBLIC_CDN_ENDPOINT: /alexandrie/
      NUXT_PUBLIC_BASE_URL: ${PA_PUBLIC_URL}
    depends_on:
      - backend
    mem_limit: 384m

  gateway:
    image: nginx:1.31.1-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./panelalpha/alexandrie-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # The API has no unauthenticated 200 route; a listening port will do.
      test: ["CMD-SHELL", "nc -z backend 8201 && wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 5s
    mem_limit: 64m

  # No-op gate: `compose up -d` returns only once the site and API answer.
  ready:
    image: nginx:1.31.1-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: 32m

volumes:
  mysql_data: {}
  rustfs_data: {}
  rustfs_logs: {}
