# One origin for the three services the browser talks to.
server {
    listen 80;
    client_max_body_size 100m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;

    location /api/ {
        proxy_pass http://backend:8201;
    }
    # Public uploads and presigned backup downloads; Host is kept because
    # the presigned signature covers it.
    location ~ ^/alexandrie(-backups)?/ {
        proxy_pass http://rustfs:9000;
    }
    location / {
        proxy_pass http://frontend:8200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
