# Compose-replace: the repo has no compose file and its Dockerfile cannot build
# without .git. Runs upstream's published release image with
# PostgreSQL, as in the upstream quickstart; library and data on named volumes.
services:
  drop:
    image: ghcr.io/drop-oss/drop:0.4.0-rc-5
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ../.panelalpha/drop/app.env
    environment:
      EXTERNAL_URL: ${PA_PUBLIC_URL}
    volumes:
      - drop-library:/library
      - drop-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    mem_limit: 1536m

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # POSTGRES_* in an env_file.
    env_file:
      - ../.panelalpha/drop/db.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - drop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drop -d drop -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 512m

  # One-shot: the first admin with the engine's login, through Drop's own setup
  # API (panelalpha/drop-login.sh), on a database with no user only. Drop
  # otherwise logs a one-time /setup link nobody deploying it sees. It always
  # exits 0: on an error Drop keeps its setup wizard and the log says so.
  login:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "/pa/drop-login.sh"]
    env_file:
      # DROP_ADMIN_USERNAME / DROP_ADMIN_EMAIL / DROP_ADMIN_PASSWORD, the login
      # the engine generates; POSTGRES_PASSWORD for psql.
      - ../.panelalpha/app-credentials.env
      - ../.panelalpha/drop/db.env
    environment:
      PGHOST: postgres
      PGUSER: drop
      PGDATABASE: drop
    volumes:
      - ./panelalpha:/pa:ro
    depends_on:
      drop:
        condition: service_healthy
    mem_limit: 64m

  # No-op: `compose up -d` returns once Drop answers and has its admin.
  ready:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      login:
        condition: service_completed_successfully
    mem_limit: 32m

volumes:
  drop-library: {}
  drop-data: {}
  drop-db: {}
