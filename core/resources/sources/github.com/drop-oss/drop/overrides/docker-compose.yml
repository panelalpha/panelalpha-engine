# Compose-replace: the repo has no compose file and its Dockerfile cannot build
# without .git (engine#413). Runs upstream's published release image with
# PostgreSQL, as in the upstream quickstart; library and data on named volumes.
services:
  drop:
    image: ghcr.io/drop-oss/drop:0.4.0-rc-5
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ../.panelalpha/drop/app.env
    environment:
      EXTERNAL_URL: ${PA_PUBLIC_URL}
    volumes:
      - drop-library:/library
      - drop-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    mem_limit: 1536m

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # POSTGRES_* in an env_file (engine#419).
    env_file:
      - ../.panelalpha/drop/db.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - drop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drop -d drop -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 512m

  # No-op: `compose up -d` returns once Drop answers.
  ready:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      drop:
        condition: service_healthy
    mem_limit: 32m

volumes:
  drop-library: {}
  drop-data: {}
  drop-db: {}
