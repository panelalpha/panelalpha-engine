# Compose-replace: the repository ships no compose file, and its Dockerfile
# needs build args (GO_VERSION, a gotify/build tag) detection cannot supply.
# This runs the official image of the current release:
#   - /app/data (gotify.db, images, plugins) on a named volume
#   - the admin is seeded from ~/.panelalpha/app-credentials.env (the engine's) on first start,
#     so the upstream admin/admin default never exists
#   - public registration stays off
services:
  app:
    image: gotify/server:3.1.1
    restart: unless-stopped
    env_file:
      - .env
      # Missing file aborts `up` rather than falling back to admin/admin.
      - ../.panelalpha/app-credentials.env
    environment:
      GOTIFY_SERVER_PORT: "80"
      GOTIFY_REGISTRATION: "false"
      # Served only over the engine's HTTPS proxy.
      GOTIFY_SERVER_SECURECOOKIE: "true"
      GOTIFY_DATABASE_DIALECT: sqlite3
      GOTIFY_DATABASE_CONNECTION: data/gotify.db
      TZ: Etc/UTC
    volumes:
      - data:/app/data
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s
    mem_limit: 256m

  # No-op gate: `compose up -d` returns only once Gotify answers /health.
  ready:
    image: gotify/server:3.1.1
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  data: {}
