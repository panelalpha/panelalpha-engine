# The stack for the repository, replacing a compose file that describes a
# laptop and not a site.
#
# The checkout's own docker-compose.yml is `name: linkace_dev`: a php service
# built from resources/docker/dockerfiles/development.Dockerfile with the
# source tree bind-mounted at /app, a Caddy dev gateway on :80, MariaDB *and*
# Postgres *and* Meilisearch all published on loopback, and buggregator (a
# debug-event collector) on :8000. ComposeUsableProbe rejects it on the first
# rule it tests -- a service with `build:` that binds the project root is
# isLocalDevCompose -- so the compose platform (priority 980) never claimed the
# project and the laravel app manifest (940) did. That strategy served the
# checkout from the shared PHP base image and kept the dev compose's six
# services as sidecars; the app and redis containers restart-looped and nothing
# ever answered on 8000.
#
# This file replaces it, and because an app config's compose is written before
# detection runs it is simply "the repository's compose file" by the time
# ComposeUsableProbe reads it: no build, no project-root bind mount, not
# sidecars-only, so the compose strategy claims the project and runs it as
# written.
#
# LinkAce is not built from the checkout. The release Dockerfiles
# (resources/docker/dockerfiles/release-*.Dockerfile) build FROM
# docker.io/linkace/base-image:2.x-php-8.5 -- an image upstream publishes and
# whose own Dockerfile is not in this repository -- so the only thing a clone
# can do with them is pull that base anyway. linkace/linkace is the same build
# upstream ships to everyone, 96 MB, and it already contains the composer
# install, the Vite build and the supervisord/Caddy/php-fpm wiring.
services:
  db:
    # MariaDB is what upstream develops and releases against (both of its own
    # compose files use mariadb:12.0) and what .env.docker.production and the
    # Helm chart's .env.k8s configure. Postgres and SQLite are supported by the
    # setup wizard but are not the path upstream tests first.
    image: mariadb:12.0
    restart: unless-stopped
    # A default MariaDB sizes its buffer pool for a machine it owns. This one
    # shares a 2.5 GB account with PHP-FPM.
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=64
      - --performance-schema=OFF
    environment:
      MARIADB_DATABASE: linkace
      MARIADB_USER: linkace
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - linkace_db:/var/lib/mysql
    # Shipped with the image since 10.11 and the check upstream's own
    # healthchecks use: --connect proves the socket, --innodb_initialized
    # proves recovery finished, which on a first boot is the part that takes
    # the time.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s
    mem_limit: 512m

  app:
    # Tag written by hooks/prepare.sh from the checkout's own package.json, so
    # a clone of the 1.x branch gets linkace/linkace:1.x rather than a 2.x
    # image with a schema its code has never seen.
    image: ${LINKACE_IMAGE:-linkace/linkace:2.x}
    restart: unless-stopped
    # 8080 inside, not the image's default 80. The image runs as www-data and
    # its Caddy binds ${PORT}; a privileged port from a non-root process works
    # only as long as the file capability survives the COPY --from=caddy:2 that
    # put the binary there, which is a build detail of somebody else's image.
    # An unprivileged port needs nothing from anybody.
    ports:
      - "8000:8080"
    environment:
      # Read by resources/docker/Caddyfile as `:{$PORT:80}`. supervisord passes
      # its own environment to both children, so php-fpm sees it too.
      PORT: "8080"
      # Not a real address and not meant to survive: ComposePlaceholders
      # rewrites a bare http://localhost under a *_URL-shaped key to the
      # account's public https URL before the stack starts, and APP_URL is
      # exactly that shape. It has to be right -- Laravel builds redirects and
      # mail links from it, and LinkAce's TrustHosts derives the host allowlist
      # from it (see TRUSTED_HOSTS below).
      APP_URL: http://localhost
      # Generated by hooks/prepare.sh. Without a real one SetupCheckMiddleware
      # sees config('app.key') still equal to its GENERIC_APP_KEY constant,
      # rewrites APP_KEY inside the image's own /app/.env and answers
      # redirect()->refresh() -- and because a process environment variable
      # beats a .env line (Laravel's repository is immutable), config('app.key')
      # is unchanged on the next request and the redirect repeats forever.
      # Upstream's Helm chart ships that exact loop in .env.k8s.
      APP_KEY: ${APP_KEY}
      # The engine's proxy sets X-Forwarded-Proto and X-Forwarded-Host (see
      # templates/dind/virtualHost-nginx-proxy.blade.php), and Laravel ignores
      # both unless the proxy is trusted. Without this every link on the page
      # is http:// and the session cookie is not marked secure. `*` is what
      # .env.docker.production ships and means "trust the one hop in front".
      TRUSTED_PROXIES: "*"
      # LinkAce registers TrustHosts globally (app/Http/Kernel.php) and, with
      # no TRUSTED_HOSTS set, allows only APP_URL's own host and its
      # subdomains. Every probe the engine makes of the application itself goes
      # to http://127.0.0.1:<port>/ with no Host header
      # (AppHealth::probeScript), so Symfony would raise SuspiciousOperation
      # and Laravel would answer 400 to the one request that decides whether
      # the deploy worked -- and to this service's own healthcheck below.
      #
      # `.*` restores stock Laravel behaviour (the framework skeleton ships
      # TrustHosts disabled). What TrustHosts defends against is a poisoned
      # Host header, and there is no way to deliver one here: the only route in
      # is the account's nginx vhost, which matches the request against
      # server_name and then sets `proxy_set_header Host $host` -- the account's
      # own domain or one of its aliases, never an attacker's string. The
      # published port is on the account's own network, not the internet.
      TRUSTED_HOSTS: ".*"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: linkace
      DB_USERNAME: linkace
      DB_PASSWORD: ${DB_PASSWORD}
      # LinkAce's own default (config/linkace.php), said out loud because the
      # image bakes .env.sqlite.production in at /app/.env and a future edit to
      # that file should not quietly enable a Meilisearch this account has not
      # got. Full-text search then runs in MariaDB.
      APP_SEARCH_DRIVER: database
      # config/logging.php's `stack` is hardcoded to the `daily` channel, which
      # writes to storage/logs and nowhere else -- so a boot failure leaves
      # `docker logs` empty and the engine's own advice ("read the container
      # output with container_service_logs") finds nothing. The cost is that
      # the admin log viewer has nothing to show; see the README.
      LOG_CHANNEL: stderr
    # Sessions, compiled views, the failed-job log, backups and every image
    # LinkAce fetches for a saved link live here. Docker seeds a fresh named
    # volume from the image's own /app/storage, which the release Dockerfile
    # copies in chmod 0777, so the tree and its permissions arrive intact.
    volumes:
      - linkace_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    # Two requests, and the second is the one that matters.
    #
    #   /_health      the route upstream's own Helm liveness and readiness
    #                 probes use (deploy/linkace/templates/deployment.yaml).
    #                 SetupCheckMiddleware lets it through before the setup
    #                 redirect, so it answers 200 on a database that has not
    #                 been migrated yet. It proves Caddy, php-fpm and the
    #                 global middleware -- including TrustHosts, which is what
    #                 would turn a loopback request into a 400.
    #
    #   /setup/start  the wizard's first page. It renders a Blade view, starts
    #                 a session and puts a CSRF token in the form, so it is the
    #                 request that fails if APP_KEY is not a valid
    #                 base64:<32 bytes> -- a case /_health cannot see, because
    #                 that route touches neither session nor encrypter.
    #
    # busybox wget, because the image is Alpine and has no curl. It exits
    # non-zero on any status >= 400, which is the whole contract here.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:8080/_health &&
          wget -q -O /dev/null http://127.0.0.1:8080/setup/start
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 60s
    mem_limit: 768m

  # Does nothing and exits 0. It exists because the engine runs
  # `docker compose up -d` without --wait and takes the deploy to be finished
  # when that returns -- which is when the container has been started, not when
  # it answers. Compose does block on a depends_on health condition, so a
  # service gated on the app's healthcheck is what makes `up -d` return only
  # once LinkAce is serving, and a clean exit 0 is explicitly not a crash loop
  # to AppHealth. Same image as the app, so it costs no extra pull.
  ready:
    image: ${LINKACE_IMAGE:-linkace/linkace:2.x}
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m

volumes:
  linkace_db: {}
  linkace_storage: {}
