# yaml-language-server: $schema=../../../_schema.json
description: >-
  Jellyswarrm is a reverse proxy that merges several Jellyfin servers into one
  library: a single Rust binary serving the bundled Jellyfin web client on /
  and its management UI on /ui, port 3000, with its SQLite database and
  jellyswarrm.toml in /app/data.

  The repository's docker-compose.yml builds the Dockerfile, which compiles
  the Rust workspace and a webpack UI in parallel stages; the build is
  OOM-killed in `npm run build:production` ("cannot allocate memory") at 2500
  MB and at 4096 MB. This recipe runs the published image of the current
  release, ghcr.io/llukas22/jellyswarrm:0.3.0 (pinned by digest), as the
  README's compose example does, with /app/data on a named volume that
  survives redeploys.

  Upstream's /ui admin login is the built-in default admin / jellyswarrm,
  which nobody deploying it is told and anyone with the address could use,
  unless JELLYSWARRM_USERNAME and JELLYSWARRM_PASSWORD are set. So the engine
  generates them (`credentials:` below, returned by GET
  /projects/{name}/app-credentials) and the compose file hands them to the
  container from ~/.panelalpha/app-credentials.env; Jellyswarrm reads them
  over jellyswarrm.toml on every start, its own documented way to set the
  admin. The admin login has no form in /ui to change it, so nothing in the
  app is overwritten; the project's own JELLYSWARRM_USERNAME /
  JELLYSWARRM_PASSWORD still win, and the engine then reports those. Keep the
  password once servers are added: Jellyswarrm encrypts the stored Jellyfin
  passwords with it. The public address Jellyfin clients are handed
  (localhost:3000 by default) is set in /ui settings: upstream reads env keys
  with "_" as the nesting separator, so JELLYSWARRM_PUBLIC_ADDRESS does not
  reach public_address.
credentials:
  login_path: /ui/login
  fields:
    JELLYSWARRM_USERNAME: {kind: username}
    JELLYSWARRM_PASSWORD: {kind: password}
