# Compose-replace: the repo only ships example compose files under deploy/.
# Runs the published image of the current release; data on a named volume.
services:
  app:
    image: ghcr.io/almarklein/timetagger:v26.1.3
    restart: unless-stopped
    ports:
      - "8080:8080"
    entrypoint: ["/bin/sh", "/timetagger-start.sh"]
    env_file:
      # TIMETAGGER_USERNAME / TIMETAGGER_PASSWORD, the login the engine generates.
      - ../.panelalpha/app-credentials.env
    environment:
      TIMETAGGER_BIND: 0.0.0.0:8080
      TIMETAGGER_DATADIR: /root/_timetagger
      TIMETAGGER_LOG_LEVEL: info
      # The customer's own user:hash pairs, used instead of the engine's login when set.
      TIMETAGGER_CREDENTIALS: ${TIMETAGGER_CREDENTIALS:-}
    volumes:
      - timetagger-data:/root/_timetagger
      - ./timetagger-start.sh:/timetagger-start.sh:ro
    mem_limit: 256m

volumes:
  timetagger-data: {}
