# yaml-language-server: $schema=../../../_schema.json
description: >-
  TimeTagger, a self-hosted time tracker (Python/uvicorn, per-user SQLite files).
  The repository has no root compose file, so the engine used to run it as a
  generic Python app and served its own placeholder. This recipe runs the
  published ghcr.io/almarklein/timetagger image of the current release
  (v26.1.3) with the data directory on a named volume. Login needs
  TIMETAGGER_CREDENTIALS (user:bcrypt-hash pairs). The engine generates a login
  (`credentials:` below, returned by GET /projects/{name}/app-credentials) and
  files/timetagger-start.sh hashes its password with the image's own bcrypt
  into TIMETAGGER_CREDENTIALS on every start. A TIMETAGGER_CREDENTIALS project
  env var (a project made before the engine's login needed one) is kept after
  it, so its users still sign in and the login the engine reports works too;
  a pair with the engine's username wins over the engine's password.
credentials:
  login_path: /timetagger/login
  fields:
    TIMETAGGER_USERNAME: {kind: username}
    TIMETAGGER_PASSWORD: {kind: password}
