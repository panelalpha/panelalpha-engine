# yaml-language-server: $schema=../../../_schema.json
description: >-
  VibraVid, a web downloader for films, series, anime and music from streaming
  sites (Django, SQLite, served by the image's own runserver on :8000). The
  repository's docker-compose.yml runs the published image but hardcodes
  ALLOWED_HOSTS "localhost,127.0.0.1,vibravid" and localhost-only
  CSRF_TRUSTED_ORIGINS as literals, so every request through the site domain
  is Django's 400 "Bad Request" page, and project env vars cannot override
  them. It also mounts /var/run/docker.sock for the in-app "Update now"
  button.

  This recipe runs the same image at the current release
  (ghcr.io/astraelabs/vibravid:v1.4.4) with ALLOWED_HOSTS and
  CSRF_TRUSTED_ORIGINS set to the site address and the proxy/secure-cookie
  flags upstream documents for a reverse proxy, without the docker socket
  (the in-app updater is unavailable; redeploy instead) and without the
  optional bypasser/telegram profiles. The database, config, downloads, logs
  and fetched binaries stay on upstream's named volumes; Django's secret key
  is generated by the app itself into the database volume. TMDB_API_KEY is
  optional and comes from the project's env vars. A `ready` gate waits for
  the app to answer.
