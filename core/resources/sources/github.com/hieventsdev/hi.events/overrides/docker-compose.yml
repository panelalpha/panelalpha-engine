# Upstream's docker/all-in-one stack on the release image instead of a source
# build, with generated secrets and named volumes.
services:
  all-in-one:
    image: daveearley/hi.events-all-in-one:v1.11.1-beta
    restart: unless-stopped
    ports:
      - "8123:80"
    env_file:
      - ../.panelalpha/hievents/app.env
    environment:
      VITE_FRONTEND_URL: ${PA_PUBLIC_URL}
      VITE_API_URL_CLIENT: ${PA_PUBLIC_URL}/api
      VITE_API_URL_SERVER: http://localhost:80/api
      VITE_STRIPE_PUBLISHABLE_KEY: ""
      VITE_APP_NAME: Hi.Events
      APP_URL: ${PA_PUBLIC_URL}
      APP_FRONTEND_URL: ${PA_PUBLIC_URL}
      APP_CDN_URL: ${PA_PUBLIC_URL}/storage
      APP_DISABLE_REGISTRATION: "false"
      APP_SAAS_MODE_ENABLED: "false"
      LOG_CHANNEL: stderr
      QUEUE_CONNECTION: redis
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: noreply@${PA_PUBLIC_HOST}
      MAIL_FROM_NAME: Hi.Events
      FILESYSTEM_PUBLIC_DISK: public
      FILESYSTEM_PRIVATE_DISK: local
      REDIS_HOST: redis
      REDIS_PASSWORD: ""
      REDIS_PORT: "6379"
      WEBHOOK_QUEUE_NAME: webhook-queue
    volumes:
      # Event images and attendee files (public and private disks).
      - storage:/app/backend/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # supervisord (nginx, php-fpm, SSR) starts only after the migrations.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    mem_limit: 1536m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data
    mem_limit: 128m

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/hievents/app.env
    environment:
      POSTGRES_DB: hi-events
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hi-events"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 384m

  # No-op gate: `compose up -d` returns once migrations ran and the site answers.
  ready:
    image: redis:7-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      all-in-one:
        condition: service_healthy
    mem_limit: 32m

volumes:
  storage: {}
  pgdata: {}
  redisdata: {}
