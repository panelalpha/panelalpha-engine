# yaml-language-server: $schema=../../../_schema.json
description: >-
  WebThings Gateway, a home-automation gateway (Node.js) that monitors and
  controls smart-home devices through the Web of Things, with its own web UI
  on port 8080.

  Upstream's compose builds the checkout (the unreleased HEAD) on
  `network_mode: host` with no published port and bind-mounts
  /opt/docker/webthings-gateway for its data. The engine strips host
  networking and then publishes nothing, so a plain deploy is green but the
  site answers 502. This recipe runs upstream's image of the
  current release, webthingsio/gateway:2.0.0, with port 8080 published and
  /home/node/.webthings (config, SQLite database, add-ons, logs) on a named
  volume.

  First visit is the gateway's own welcome page, where the first user
  account is created. The account has no USB or Bluetooth, so only
  network-reachable devices and add-ons apply.
