# Compose-replace: the app lives in server/. Runs the published image of the
# current release on its bundled nginx (page + /ws on one port). Stateless.
services:
  app:
    image: thehelpfulidiot/ghostboard-server:3.4.3
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    mem_limit: 256m

  # `compose up -d` returns only once the page answers.
  ready:
    image: thehelpfulidiot/ghostboard-server:3.4.3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m
