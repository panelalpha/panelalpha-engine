# One domain for frontend and API: VITE_API_BASE is the site itself.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s;
    set $frontend http://rote-frontend:80;
    set $backend  http://rote-backend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 300s;

    location /v2/api/      { proxy_pass $backend; }
    location /.well-known/ { proxy_pass $backend; }
    location /             { proxy_pass $frontend; }
}
