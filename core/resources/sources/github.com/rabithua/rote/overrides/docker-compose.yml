# Compose-replace of the repo's docker-compose.yml: pinned release images, a
# generated Postgres password, and frontend + API on one domain.
services:
  rote-postgres:
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    env_file:
      - ../.panelalpha/rote/app.env
    environment:
      POSTGRES_USER: rote
      POSTGRES_DB: rote
    volumes:
      - rote-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rote -d rote"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    mem_limit: 384m

  rote-backend:
    image: rabithua/rote-backend:v2.5.2
    restart: unless-stopped
    env_file:
      - ../.panelalpha/rote/app.env
    depends_on:
      rote-postgres:
        condition: service_healthy
    # Upstream's command: wait, run migrations, serve.
    command: ["sh", "-c", "sleep 15 && bun run dist/scripts/runMigrations.js && bun run dist/server.js"]
    mem_limit: 768m

  rote-frontend:
    image: rabithua/rote-frontend:v2.5.2
    restart: unless-stopped
    environment:
      # Same origin: the router below sends /v2/api to the backend.
      VITE_API_BASE: ${PA_PUBLIC_URL}
    depends_on:
      - rote-backend
    mem_limit: 64m

  # The only published port; routes by path to the frontend and the API.
  web:
    image: nginx:1-alpine
    restart: unless-stopped
    volumes:
      - ./panelalpha/router.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - rote-frontend
      - rote-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://rote-backend:3000/v2/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 64m

  # No-op gate: `up` returns only once the site and the API answer.
  ready:
    image: nginx:1-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 32m

volumes:
  rote-postgres-data: {}
