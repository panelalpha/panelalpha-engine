# Single-origin front for Receipt Wrangler. The app image already runs its own
# nginx that serves the SPA and proxies /api and /mcp to the API on :8081, so
# this front just passes everything through to it on one origin. Its only other
# job is to publish the port late: the web service waits for the init one-shot to
# finish rotating the bootstrap admin password, so the site is never public with
# admin/admin live.
server {
    listen 80;
    server_name _;

    # Match the app's own 50M upload limit for receipt images.
    client_max_body_size 50m;

    location / {
        proxy_pass http://app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long timeout + no buffering so the API's /mcp SSE streams flush.
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
