# The repo's root Dockerfile is a source build with no database. This runs
# upstream's release image with MariaDB, as deploy/compose/docker-compose.yml.
services:
  app:
    image: ghcr.io/grimmory-tools/grimmory:v3.5.0
    restart: unless-stopped
    env_file:
      - ../.panelalpha/grimmory/db.env
    environment:
      USER_ID: "1000"
      GROUP_ID: "1000"
      TZ: Etc/UTC
      DATABASE_URL: jdbc:mariadb://db:3306/grimmory
      DATABASE_USERNAME: grimmory
      SWAGGER_ENABLED: "false"
    volumes:
      - data:/app/data
      - books:/books
      - bookdrop:/bookdrop
    ports:
      - "6060:6060"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:6060/api/v1/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1536m

  db:
    image: docker.io/library/mariadb:11.4
    restart: unless-stopped
    env_file:
      - ../.panelalpha/grimmory/db.env
    environment:
      MARIADB_DATABASE: grimmory
      MARIADB_USER: grimmory
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 512m

  # No-op gate: `compose up -d` returns only once Grimmory answers.
  ready:
    image: docker.io/library/mariadb:11.4
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  data: {}
  books: {}
  bookdrop: {}
  db: {}
