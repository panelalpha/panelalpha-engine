# yaml-language-server: $schema=../../../_schema.json
description: >-
  Tdarr is a distributed media transcoding platform: Tdarr_Server serves the
  web UI on :8265 and the node API on :8266, and Tdarr_Node workers run
  FFmpeg/HandBrake jobs. The repository holds no source (a package.json with
  no code, and Dockerfiles that download closed-source binaries); the
  software is free to use under its EULA and published as the official
  image ghcr.io/haveagitgat/tdarr. This recipe runs that image with the
  internal node on CPU, data and media on named volumes.

  With auth=true and no user, Tdarr's web UI asks the first visitor to create
  an account. hooks/prepare.sh generates the JWT secret and a seeded API key
  (shared by the server and its internal node) once into ~/.panelalpha/tdarr/;
  the engine generates the admin login (`credentials:` below, written to
  ~/.panelalpha/app-credentials.env), and a one-shot `seed` service registers
  the admin as soon as the server answers and fails the deploy if a user it
  cannot log in as already exists. `ready` makes `compose up -d` return only
  after that. The login is returned by GET /projects/{name}/app-credentials;
  accounts deployed before this kept it in ~/.panelalpha/tdarr/admin.env,
  which `adopt_from` carries over.
credentials:
  adopt_from: .panelalpha/tdarr/admin.env
  fields:
    TDARR_ADMIN_USER: {kind: username, value: admin}
    TDARR_ADMIN_PASSWORD: {kind: password}
