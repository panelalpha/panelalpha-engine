# Replaces the web image's default.conf: the SPA plus the server under /api
# (the server's own pathPrefix), so one domain serves both.

# The account's web server appends the real visitor as the LAST X-Forwarded-For
# entry; the server rate-limits sign-ins by the FIRST, so pass only the last.
map $http_x_forwarded_for $pa_client_ip {
    "~(?:^|,)\s*(?<last>[^,\s]+)\s*$" $last;
    default $remote_addr;
}
map $http_upgrade $pa_connection {
    default upgrade;
    "" "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $pa_client_ip;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pa_connection;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
        client_max_body_size 600m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
