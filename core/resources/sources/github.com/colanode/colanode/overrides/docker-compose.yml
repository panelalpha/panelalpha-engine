# hosting/docker/docker-compose.yaml on the 0.4.7 release images, with one
# public port: the web client, which also serves the server under /api.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file:
      - ../.panelalpha/colanode/db.env
    environment:
      POSTGRES_USER: colanode
      POSTGRES_DB: colanode
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colanode -d colanode"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  valkey:
    image: valkey/valkey:8.1
    restart: unless-stopped
    env_file:
      - ../.panelalpha/colanode/valkey.env
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEY_PASSWORD\""]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 128m

  server:
    image: ghcr.io/colanode/server:0.4.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file:
      - ../.panelalpha/colanode/server.env
    environment:
      NODE_ENV: production
      CONFIG: /config.json
      PA_PUBLIC_URL: ${PA_PUBLIC_URL}
      PA_PUBLIC_HOST: ${PA_PUBLIC_HOST}
    volumes:
      - ./panelalpha-colanode/config.json:/config.json:ro
      - server_storage:/var/lib/colanode/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/config || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 768m

  web:
    image: ghcr.io/colanode/web:0.4.7
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./panelalpha-colanode/web.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    mem_limit: 64m

volumes:
  postgres_data: {}
  valkey_data: {}
  server_storage: {}
