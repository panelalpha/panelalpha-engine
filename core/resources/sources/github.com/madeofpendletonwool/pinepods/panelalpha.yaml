# yaml-language-server: $schema=../../../_schema.json
description: >-
  PinePods, a self-hosted podcast manager (Rust API + web UI behind nginx on
  :8040, PostgreSQL and Valkey). The repository root has no compose file and
  its only Dockerfile the engine picks is Dockerfile.validator, a database
  schema test harness, so a plain deploy builds and runs the wrong thing. This
  recipe runs upstream's documented PostgreSQL stack
  (deployment/docker/compose-files/docker-compose-postgres) from the published
  image of the current release (madeofpendletonwool/pinepods:0.9.0) with the
  database, downloads and backups on named volumes. The database password is
  generated once per account by the engine; SERVER_URL is the site's address.
  First run is as upstream ships it: the site opens PinePods' own first-admin
  setup / login page.
