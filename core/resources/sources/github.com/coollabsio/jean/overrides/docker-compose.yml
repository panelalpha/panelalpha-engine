# Compose-replace: upstream's published jean-server image instead of building
# Dockerfile.server (its frontend build runs out of memory in the account).
services:
  app:
    image: ghcr.io/coollabsio/jean-server:v1.0.6
    restart: unless-stopped
    env_file:
      # JEAN_TOKEN generated by hooks/prepare.sh; .env (project env vars) wins.
      - ../.panelalpha/jean/token.env
      - .env
    environment:
      JEAN_HEADLESS: "1"
      JEAN_HOST: 0.0.0.0
      JEAN_PORT: "3456"
    ports:
      - "3456:3456"
    volumes:
      - home:/home/jean
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3456/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    mem_limit: 2g

  # No-op gate: `compose up -d` returns only once Jean answers.
  ready:
    image: docker.io/library/alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  home: {}
