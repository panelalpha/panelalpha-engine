# Compose-replace: the repo compose binds a config.yml it does not ship and keeps
# data in ~/project. Release image, config from ~/.panelalpha, data on volumes.
services:
  app:
    image: ghcr.io/surajverma/homehub:0.2.4
    restart: unless-stopped
    env_file:
      - ../.panelalpha/homehub/app.env
    environment:
      FLASK_ENV: production
    volumes:
      - data:/app/data
      - uploads:/app/uploads
      - media:/app/media
      - pdfs:/app/pdfs
      - ../.panelalpha/homehub/config.yml:/app/config.yml:ro
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 512m

  # No-op gate: `compose up -d` returns only once HomeHub answers.
  ready:
    image: ghcr.io/surajverma/homehub:0.2.4
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  data: {}
  uploads: {}
  media: {}
  pdfs: {}
