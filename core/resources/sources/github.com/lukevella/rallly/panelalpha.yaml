# yaml-language-server: $schema=../../../_schema.json
description: >-
  Rallly, a meeting-scheduling poll tool (Doodle alternative): a Next.js app on
  :3000 with PostgreSQL. The repository's docker-compose.yml is a from-source
  build with a hard-coded database password and no SECRET_PASSWORD,
  NEXT_PUBLIC_BASE_URL or SUPPORT_EMAIL, so the plain deploy never answered.
  This recipe runs upstream's self-hosted stack on the published image of the
  current release (lukevella/rallly:4.15.2, postgres:18-alpine). The session
  secret and database password are generated per account by the engine;
  NEXT_PUBLIC_BASE_URL is the site's address; SUPPORT_EMAIL must be set by the
  customer (the deploy fails naming it otherwise). Optional settings such as
  SMTP_* are passed through from the project's environment. A health-check
  gate makes the deploy wait until Rallly has migrated and answers.
