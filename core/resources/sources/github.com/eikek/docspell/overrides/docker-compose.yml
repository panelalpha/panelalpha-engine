# The repository has no compose file. This follows github.com/docspell/docker
# (docker-compose/docker-compose.yml) with the current release images; the
# optional consumedir watcher, which bind-mounts a host folder, is left out.
services:
  restserver:
    image: ghcr.io/docspell/restserver:v0.43.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
    ports:
      - "7880:7880"
    environment:
      DOCSPELL_SERVER_BASE__URL: ${PA_PUBLIC_URL}
      DOCSPELL_SERVER_INTERNAL__URL: http://restserver:7880
      DOCSPELL_SERVER_BIND_ADDRESS: 0.0.0.0
      DOCSPELL_SERVER_ADMIN__ENDPOINT_SECRET: ${DOCSPELL_ADMIN_SECRET:?generated per account}
      # Left empty upstream it is random per start and logs everyone out.
      DOCSPELL_SERVER_AUTH_SERVER__SECRET: ${DOCSPELL_AUTH_SECRET:?generated per account}
      DOCSPELL_SERVER_BACKEND_JDBC_URL: jdbc:postgresql://db:5432/docspell
      DOCSPELL_SERVER_BACKEND_JDBC_USER: docspell
      DOCSPELL_SERVER_BACKEND_JDBC_PASSWORD: ${DOCSPELL_DB_PASSWORD:?generated per account}
      DOCSPELL_SERVER_FULL__TEXT__SEARCH_ENABLED: "true"
      DOCSPELL_SERVER_FULL__TEXT__SEARCH_SOLR_URL: http://solr:8983/solr/docspell
      DOCSPELL_SERVER_BACKEND_SIGNUP_MODE: open
      DOCSPELL_SERVER_BACKEND_ADDONS_ENABLED: "false"
    healthcheck:
      # The image has neither curl nor wget; bash's /dev/tcp does the request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7880 && printf 'GET /api/info/version HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1g

  joex:
    image: ghcr.io/docspell/joex:v0.43.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
    environment:
      DOCSPELL_JOEX_APP__ID: joex1
      DOCSPELL_JOEX_PERIODIC__SCHEDULER_NAME: joex1
      DOCSPELL_JOEX_SCHEDULER_NAME: joex1
      DOCSPELL_JOEX_BASE__URL: http://joex:7878
      DOCSPELL_JOEX_BIND_ADDRESS: 0.0.0.0
      DOCSPELL_JOEX_JDBC_URL: jdbc:postgresql://db:5432/docspell
      DOCSPELL_JOEX_JDBC_USER: docspell
      DOCSPELL_JOEX_JDBC_PASSWORD: ${DOCSPELL_DB_PASSWORD:?generated per account}
      DOCSPELL_JOEX_FULL__TEXT__SEARCH_ENABLED: "true"
      DOCSPELL_JOEX_FULL__TEXT__SEARCH_SOLR_URL: http://solr:8983/solr/docspell
      DOCSPELL_JOEX_ADDONS_EXECUTOR__CONFIG_RUNNER: trivial
      DOCSPELL_JOEX_CONVERT_HTML__CONVERTER: weasyprint
    # OCR (tesseract, ocrmypdf) and conversion run in this container.
    mem_limit: 1536m

  db:
    # Pinned major: Postgres cannot open a datadir from a newer major.
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: docspell
      POSTGRES_PASSWORD: ${DOCSPELL_DB_PASSWORD:?generated per account}
      POSTGRES_DB: docspell
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docspell -d docspell -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 256m

  solr:
    image: docker.io/library/solr:10
    restart: unless-stopped
    environment:
      SOLR_OPTS: -Dsolr.modules=analysis-extras
      SOLR_HEAP: 512m
    command:
      - bash
      - -c
      - precreate-core docspell; exec solr start -f --user-managed
    volumes:
      - solr:/var/solr
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8983/solr/docspell/admin/ping"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    mem_limit: 1g

  # No-op gate: `compose up -d` returns only once the REST server answers.
  ready:
    image: docker.io/library/alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      restserver:
        condition: service_healthy
    mem_limit: 32m

volumes:
  pgdata: {}
  solr: {}
