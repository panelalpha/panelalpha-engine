# Only what differs from Sharry's reference.conf; everything else is upstream's default.
sharry.restserver {
  base-url = ${?SHARRY_BASE_URL}
  bind {
    address = "0.0.0.0"
    port = 9090
  }
  backend.jdbc {
    url = "jdbc:postgresql://db:5432/sharry"
    user = "sharry"
    password = ${?POSTGRES_PASSWORD}
  }
}
