# bitcart-docker's one-domain mode (compose/nginx.tmpl): the store on /, the
# admin panel on /admin, the API on /api/ (prefix stripped, as upstream does).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 100M;
    resolver 127.0.0.11 valid=10s;
    set $store http://store:3000;
    set $admin http://admin:4000;
    set $backend http://backend:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 300s;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
    }
    location /admin { proxy_pass $admin; }
    location /      { proxy_pass $store; }
}
