# One address for the whole app. The web app's browser code calls the API at
# NEXT_PUBLIC_API_BASE_URL, which is the site's own address here, and every API
# route is under /api/ (NestJS's global prefix); its API documentation is
# /docs and /admin-docs. Those go to the API, everything else to Next.js. The
# web app's own /api/health is the only route the two share; it answers for
# the API here.
#
# Docker's DNS through variables, so a recreated container's new address is
# picked up instead of the one nginx resolved when it started.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_tokens off;

    # Feedback screenshots and image fields are uploaded through the API.
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 300s;

    set $api http://api:4000;
    set $web http://web:3000;

    location /api/ {
        proxy_pass $api;
    }

    location /docs {
        proxy_pass $api;
    }

    location /admin-docs {
        proxy_pass $api;
    }

    location / {
        proxy_pass $web;
    }
}
