# Compose-replace: the repository is the Maven source tree of the platform.
# This runs the image upstream publishes from xwiki/xwiki-docker, at the
# current stable release, on PostgreSQL as that repository documents it.
services:
  db:
    # Pinned major: Postgres cannot open a datadir from a newer major.
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: xwiki
      POSTGRES_USER: xwiki
      POSTGRES_PASSWORD: ${XWIKI_DB_PASSWORD:?generated per account}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --locale=C.UTF-8
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xwiki -d xwiki -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 512m

  app:
    image: docker.io/library/xwiki:18.7.0-postgres-tomcat
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_DATABASE: xwiki
      DB_USER: xwiki
      DB_PASSWORD: ${XWIKI_DB_PASSWORD:?generated per account}
      # Upstream's default heap is 1 GB; the wiki, embedded Solr and the
      # LibreOffice converter share this container.
      JAVA_OPTS: -Xmx1536m
    volumes:
      # The image's VOLUME: permanent directory, extensions, Solr, config.
      - data:/usr/local/xwiki
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/rest/"]
      interval: 10s
      timeout: 10s
      retries: 90
      start_period: 60s
    mem_limit: 3g

  # No-op gate: `compose up -d` returns only once XWiki answers.
  ready:
    image: docker.io/library/postgres:17-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  pgdata: {}
  data: {}
