# Compose-replace: the repository's compose file is a developer environment.
# Runs upstream's published image as in examples/docker-compose.example.yml.
services:
  app:
    image: rommapp/romm:5.3.1
    restart: unless-stopped
    env_file:
      - .env
      - ../.panelalpha/romm/secrets.env
    environment:
      DB_HOST: db
      DB_NAME: romm
      DB_USER: romm-user
      HASHEOUS_API_ENABLED: "true"
    volumes:
      - romm-resources:/romm/resources
      - romm-redis:/redis-data
      - romm-library:/romm/library
      - romm-assets:/romm/assets
      - romm-config:/romm/config
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1536m

  db:
    image: mariadb:13.0.2
    restart: unless-stopped
    env_file:
      - ../.panelalpha/romm/secrets.env
    environment:
      MARIADB_DATABASE: romm
      MARIADB_USER: romm-user
    volumes:
      - romm-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    mem_limit: 512m

  # No-op gate: `compose up -d` returns once RomM answers.
  ready:
    image: mariadb:13.0.2
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  romm-resources: {}
  romm-redis: {}
  romm-library: {}
  romm-assets: {}
  romm-config: {}
  romm-db: {}
