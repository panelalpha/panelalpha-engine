# Compose-replace: the repository's compose files are a dev environment and a
# Traefik example (docker.sock, whoami). This runs the official image of the
# current release on its own, with /data (SQLite sessions, OIDC keys) on a volume.
services:
  app:
    image: ghcr.io/tinyauthapp/tinyauth:v5.2.0
    restart: unless-stopped
    env_file:
      # The project's env vars: extra users, OIDC clients, OAuth/LDAP settings.
      - .env
      # TINYAUTH_ADMIN_USER / TINYAUTH_ADMIN_PASSWORD, generated by the engine.
      - ../.panelalpha/app-credentials.env
    # Tinyauth refuses to start without a login provider: the engine's login is
    # hashed at start and added to any TINYAUTH_AUTH_USERS the project sets.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        u=$$(tinyauth user create --username "$$TINYAUTH_ADMIN_USER" --password "$$TINYAUTH_ADMIN_PASSWORD" | sed -n 's/^TINYAUTH_AUTH_USERS=//p')
        [ -n "$$u" ] || { echo "tinyauth: could not hash the generated login" >&2; exit 1; }
        export TINYAUTH_AUTH_USERS="$${TINYAUTH_AUTH_USERS:+$$TINYAUTH_AUTH_USERS,}$$u"
        exec tinyauth
    environment:
      NO_COLOR: "1"
      TINYAUTH_APPURL: ${PA_PUBLIC_URL}
      # The shared parent domain is not a public suffix: a parent-domain cookie
      # would reach other accounts' sites. Set true on a domain of your own.
      TINYAUTH_AUTH_SUBDOMAINSENABLED: ${TINYAUTH_AUTH_SUBDOMAINSENABLED:-false}
    volumes:
      - data:/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "tinyauth", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s
    mem_limit: 256m

  # No-op gate: `compose up -d` returns only once Tinyauth answers.
  ready:
    image: ghcr.io/tinyauthapp/tinyauth:v5.2.0
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  data: {}
