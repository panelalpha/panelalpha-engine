# Upstream's docker/docker-compose.example.yml on the current release, with
# APP_KEY from hooks/prepare.sh and named volumes instead of bind mounts.
services:
  gameyfin:
    image: ghcr.io/gameyfin/gameyfin:2.4.0
    restart: unless-stopped
    environment:
      APP_URL: ${PA_PUBLIC_URL}
    env_file:
      # APP_KEY, generated by hooks/prepare.sh.
      - ../.panelalpha/gameyfin/app.env
    ports:
      - "8080:8080"
    volumes:
      - db:/opt/gameyfin/db
      - data:/opt/gameyfin/data
      - plugindata:/opt/gameyfin/plugindata
      - logs:/opt/gameyfin/logs
      - library:/library
    # No curl in the image; probe the actuator (management port 8081) with bash.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -c 12 <&3 | grep -q ' 200'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    # Heap is capped at 512m by the image; upstream recommends >= 1024m.
    mem_limit: 1536m

  # No-op gate: `compose up -d` returns only once Gameyfin is healthy.
  ready:
    image: ghcr.io/gameyfin/gameyfin:2.4.0
    restart: "no"
    entrypoint: ["true"]
    depends_on:
      gameyfin:
        condition: service_healthy
    mem_limit: 32m

volumes:
  db: {}
  data: {}
  plugindata: {}
  logs: {}
  library: {}
