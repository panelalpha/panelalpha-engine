# Upstream deploy/docker-compose.yml on the v3.9.0 release image, without its
# nginx-proxy/acme, haraka (inbound mail on :25) and hocuspocus (own subdomain).
x-loomio: &loomio
  image: loomio/loomio:3.9.0
  restart: unless-stopped
  # Optional customer settings first (SMTP_*, FEATURES_*, OAUTH_*, ...);
  # the generated DATABASE_URL / SECRET_COOKIE_TOKEN come last and win.
  env_file:
    - path: .env
      required: false
    - ../.panelalpha/loomio/app.env
  environment: &loomio-env
    RAILS_ENV: production
    SITE_NAME: Loomio
    CANONICAL_HOST: ${PA_PUBLIC_HOST}
    REPLY_HOSTNAME: ${PA_PUBLIC_HOST}
    PUBLIC_APP_URL: ${PA_PUBLIC_URL}
    PRIVATE_APP_URL: http://app:3000
    FORCE_SSL: "1"
    ASSUME_SSL: "1"
    REDIS_CACHE_URL: redis://redis:6379/0
    ACTIVE_STORAGE_SERVICE: local
    LOOMIO_SYSTEM_RELOAD: "1"
    WEB_CONCURRENCY: "0"
    MAX_THREADS: "5"
  volumes:
    - uploads:/loomio/public/system
    - storage:/loomio/storage
    - files:/loomio/public/files
    - client3:/loomio/public/client3
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *loomio
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1024m

  worker:
    <<: *loomio
    environment:
      <<: *loomio-env
      TASK: worker
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 640m

  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - ../.panelalpha/loomio/db.env
    environment:
      POSTGRES_DB: loomio_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 384m

  redis:
    image: redis:8.4
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 192m

  # No-op gate: `compose up -d` returns only once Loomio answers.
  ready:
    image: alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  pgdata: {}
  uploads: {}
  storage: {}
  files: {}
  client3: {}
