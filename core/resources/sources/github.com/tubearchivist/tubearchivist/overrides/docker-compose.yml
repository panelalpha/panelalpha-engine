# Upstream's docker-compose.yml with three changes: images pinned to the current
# release, no `ulimits: memlock` on Elasticsearch (an account cannot raise
# RLIMIT_MEMLOCK: "error setting rlimit type 8: operation not permitted"), and
# the initial login the engine generates instead of a literal default.
services:
  app:
    image: bbilly1/tubearchivist:v0.5.12
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      # ELASTIC_PASSWORD, generated once by hooks/prepare.sh.
      - ../.panelalpha/tubearchivist/secrets.env
      # TA_USERNAME / TA_PASSWORD, the initial login the engine generates.
      - ../.panelalpha/app-credentials.env
    environment:
      ES_URL: http://archivist-es:9200
      REDIS_CON: redis://archivist-redis:6379
      HOST_UID: "1000"
      HOST_GID: "1000"
      # Allowed host / CSRF origin.
      TA_HOST: ${PA_PUBLIC_URL}
      TZ: Etc/UTC
    volumes:
      - media:/youtube
      - cache:/cache
    depends_on:
      archivist-es:
        condition: service_healthy
      archivist-redis:
        condition: service_started
    healthcheck:
      # localhost, not 127.0.0.1: only localhost is in Django's ALLOWED_HOSTS (400 otherwise).
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    mem_limit: 1024m

  archivist-redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis:/data
    mem_limit: 256m

  archivist-es:
    image: bbilly1/tubearchivist-es:8.19.0
    restart: unless-stopped
    env_file:
      - ../.panelalpha/tubearchivist/secrets.env
    environment:
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: "true"
      discovery.type: single-node
      path.repo: /usr/share/elasticsearch/data/snapshot
    volumes:
      - es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9200/ | grep -q 401"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    # 1 GB heap plus direct memory and the ML controller: 1.5 GB was OOM-killed.
    mem_limit: 2560m

  # No-op gate: `compose up -d` returns only once Tube Archivist answers.
  ready:
    image: redis:8-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  media: {}
  cache: {}
  redis: {}
  es: {}
