# Compose-replace: the repo's compose with the release image pinned, generated
# secrets, and the README's one-time setup commands as an init service.
x-piga-env: &piga-env
  # No pidfile, so a restart is not blocked by a stale RUNNING_PID.
  JAVA_OPTS: "-Dpidfile.path=/dev/null"

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    env_file:
      - ../.panelalpha/piga/db.env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  init:
    image: nymanjens/piga:v3.109
    restart: "no"
    entrypoint: ["/bin/bash", "/panelalpha/piga-init.sh"]
    env_file:
      - ../.panelalpha/piga/app.env
    environment: *piga-env
    volumes:
      - ./panelalpha:/panelalpha:ro
      - piga_state:/state
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m

  web:
    image: nymanjens/piga:v3.109
    command: bin/server
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - .env
      - ../.panelalpha/piga/app.env
    environment: *piga-env
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: 1024m

  # No-op gate: `up -d` returns once the app answers.
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 32m

volumes:
  db_data: {}
  piga_state: {}
