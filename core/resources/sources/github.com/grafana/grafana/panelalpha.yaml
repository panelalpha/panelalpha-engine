# yaml-language-server: $schema=../../../_schema.json
description: >-
  Grafana is an observability and dashboard server: one Go binary serving the
  web UI and HTTP API on :3000, SQLite plus plugins under /var/lib/grafana.

  The repository has no compose file, and the plain deploy builds its root
  Dockerfile from source (yarn install of ~3000 packages, a 6.7 GB go mod
  download, a Go compile and an rspack frontend build, the Go and JS stages in
  parallel), which fails inside an account. This recipe runs the official
  image of the current release, grafana/grafana:13.2.2, with /var/lib/grafana
  on a named volume that survives redeploys, and GF_SERVER_ROOT_URL set to the
  account's public URL so links, redirects and the login origin check use the
  real domain rather than http://localhost:3000.

  A new database gets Grafana's built-in admin with the password admin, which
  anyone with the URL could use and nobody deploying it is told. So the engine
  generates a login (`credentials:` below, returned by GET
  /projects/{name}/app-credentials) and Grafana reads it from
  app-credentials.env as GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD,
  its own variables for the admin it creates on a new database; admin/admin
  no longer signs in and a password changed in Grafana is never overwritten. A
  database made before the recipe had the engine's login still has
  admin/admin: while that signs in, the `ready` gate
  (files/panelalpha/grafana-login.sh) sets the engine's login on it through
  Grafana's own API. Everything else is upstream's default.
credentials:
  login_path: /login
  fields:
    GF_SECURITY_ADMIN_USER: {kind: username}
    GF_SECURITY_ADMIN_PASSWORD: {kind: password}
