# The repository has no compose file and its Dockerfile is a full source build
# (Go + JS, several GB). This runs the official image of the current release.
services:
  app:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    environment:
      # Links, redirects and the login Origin check use the public domain.
      GF_SERVER_ROOT_URL: ${PA_PUBLIC_URL}
    env_file:
      # GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD, the login the engine
      # generates. Grafana creates its admin from them on a new database only, so
      # a password changed in Grafana is never overwritten.
      - ../.panelalpha/app-credentials.env
    volumes:
      # grafana.db, plugins and sessions; survives redeploys.
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    mem_limit: 1g

  # Gate: `compose up -d` returns only once Grafana answers /api/health. A
  # database made before the recipe had the engine's login still has
  # admin/admin; while that signs in, this sets the engine's login on it.
  ready:
    image: grafana/grafana:13.2.2
    restart: "no"
    entrypoint: ["/bin/sh", "/panelalpha/grafana-login.sh"]
    env_file:
      - ../.panelalpha/app-credentials.env
    volumes:
      - ./panelalpha/grafana-login.sh:/panelalpha/grafana-login.sh:ro
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  grafana-data: {}
