# Chamilo ships no compiled assets in git and its Encore build is OOM-killed in
# the host build container, so this runs upstream's release zip (vendor/ and
# public/build/ included) on webdevops/php-apache:8.3, which has every ext-*
# composer.json requires (intl, ldap, soap, gd, zip, bcmath, exif, sodium).
x-chamilo: &release
  CHAMILO_VERSION: "3.0.1"
  CHAMILO_SHA256: ccb2304d8154da93e470a02ce17c8a4f6deb6b8890b6900a09787765aaf57c31

services:
  # Unpacks the release into the app volume, once per version. Unpacking over
  # an older tree keeps .env, config/jwt and var/ (uploads) written by Chamilo.
  fetch:
    image: webdevops/php-apache:8.3
    restart: "no"
    environment: *release
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ "$$(cat /app/.pa-chamilo-version 2>/dev/null)" != "$$CHAMILO_VERSION" ]; then
          curl -fsSL -o /tmp/chamilo.zip "https://github.com/chamilo/chamilo-lms/releases/download/v$$CHAMILO_VERSION/chamilo-$$CHAMILO_VERSION.zip"
          echo "$$CHAMILO_SHA256  /tmp/chamilo.zip" | sha256sum -c -
          php -r '$$z = new ZipArchive(); if ($$z->open("/tmp/chamilo.zip") !== true || !$$z->extractTo("/app")) { exit(1); }'
          rm -f /tmp/chamilo.zip
          chown -R application:application /app
          echo "$$CHAMILO_VERSION" > /app/.pa-chamilo-version
        fi
        echo "chamilo: $$CHAMILO_VERSION ready"
    volumes:
      - app:/app
    mem_limit: 512m

  app:
    image: webdevops/php-apache:8.3
    restart: unless-stopped
    environment:
      WEB_DOCUMENT_ROOT: /app/public
      PHP_MEMORY_LIMIT: 512M
      PHP_MAX_EXECUTION_TIME: "300"
      PHP_POST_MAX_SIZE: 100M
      PHP_UPLOAD_MAX_FILESIZE: 100M
      PHP_DATE_TIMEZONE: UTC
      PHP_DISPLAY_ERRORS: "0"
      # The engine's proxy reaches the app from a private address; without this
      # Symfony sees http and builds http:// URLs. Overrides the installer's .env.
      TRUSTED_PROXIES: private_ranges
    volumes:
      - app:/app
    ports:
      - "8080:80"
    depends_on:
      fetch:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    # A static file: probing / boots the Symfony kernel every few seconds,
    # alongside the installer rebuilding var/cache.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/robots.txt"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 1g

  db:
    image: mariadb:11.8
    restart: unless-stopped
    env_file: ../.panelalpha/chamilo/db.env
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 512m

  # No-op gate: `compose up -d` returns only once Chamilo answers.
  ready:
    image: mariadb:11.8
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  app: {}
  db: {}
