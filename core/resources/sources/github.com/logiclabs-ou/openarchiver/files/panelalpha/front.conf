# Front proxy for Open Archiver (see overrides/docker-compose.yml). The engine's
# vhost sends `Connection: upgrade` on every request; the app's /api
# proxy forwards it to fetch(), which rejects it, so every API call answers 500.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 3000;
    # Matches the app's BODY_SIZE_LIMIT (mailbox file imports).
    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s;
    set $oa http://open-archiver:3000;

    location / {
        proxy_pass $oa;
        proxy_http_version 1.1;
        # X-Forwarded-* pass through unchanged from the engine's proxy.
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
