# Compose-replace: upstream's docker-compose.yml on the release image, with the
# settings its .env.example documents set here and the secrets from ~/.panelalpha.
services:
  open-archiver:
    image: logiclabshq/open-archiver:v0.6.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      tika:
        condition: service_started
    env_file:
      - ../.panelalpha/openarchiver/app.env
    environment:
      NODE_ENV: production
      PORT_BACKEND: "4000"
      PORT_FRONTEND: "3000"
      APP_URL: ${PA_PUBLIC_URL}
      ORIGIN: ${PA_PUBLIC_URL}
      SYNC_FREQUENCY: "* * * * *"
      MEILI_HOST: http://meilisearch:7700
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_TLS_ENABLED: "false"
      STORAGE_TYPE: local
      STORAGE_LOCAL_ROOT_PATH: /var/data/open-archiver
      BODY_SIZE_LIMIT: 100M
      JWT_EXPIRES_IN: 7d
      TIKA_URL: http://tika:9998
      # Upstream's 2048 MB heap for the indexing worker exceeds the account.
      INDEXING_WORKER_MAX_OLD_SPACE_MB: "768"
    volumes:
      - archiver-data:/var/data/open-archiver
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1536m

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/openarchiver/db.env
    environment:
      POSTGRES_DB: open_archive
      POSTGRES_USER: openarchiver
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openarchiver -d open_archive"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 384m

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/openarchiver/valkey.env
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 128m

  meilisearch:
    image: getmeili/meilisearch:v1.38
    restart: unless-stopped
    env_file:
      - ../.panelalpha/openarchiver/meili.env
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_SCHEDULE_SNAPSHOT: "86400"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m

  tika:
    image: apache/tika:3.2.2.0-full
    restart: unless-stopped
    mem_limit: 512m

  # Front proxy for engine#323 (files/panelalpha/front.conf); the only published port.
  web:
    image: nginx:1-alpine
    restart: unless-stopped
    volumes:
      - ./panelalpha/front.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:3000"
    depends_on:
      open-archiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/v1/auth/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 64m

  # No-op gate: `compose up -d` returns once migrations ran and the site answers.
  ready:
    image: nginx:1-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 32m

volumes:
  pgdata: {}
  valkeydata: {}
  meilidata: {}
  archiver-data: {}
