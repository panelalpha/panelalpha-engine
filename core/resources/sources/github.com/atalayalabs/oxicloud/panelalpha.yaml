# yaml-language-server: $schema=../../../_schema.json
description: >-
  OxiCloud, a self-hosted file, photo, calendar and contacts cloud (Rust
  server with its web UI on :8086, PostgreSQL). The repository's compose file
  names the published image but also a `build:`, so the engine compiles the
  crate tree from source; its release profile (LTO, codegen-units=1) runs rustc
  out of memory on tantivy ("The build ran out of memory") at 2500 MB and on
  the oxicloud crate itself at 4096 MB.

  This recipe runs the published image of the current release
  (diocrafts/oxicloud:0.9.2, postgres:18.2-alpine3.23 as upstream pins) with no
  build: OXICLOUD_BASE_URL is the site's own address (login fails from a
  domain without it), PostgreSQL is not published, file storage and the
  database live on named volumes, and the database password is generated once
  into ~/.panelalpha/oxicloud. The JWT secret is generated by OxiCloud itself
  into the storage volume.

  OXICLOUD_TRUST_PROXY_CIDR is left unset, as upstream ships it: OxiCloud takes
  the leftmost X-Forwarded-For entry, which the account vhost lets a visitor
  set, so its login/registration rate limits count every visitor
  as the proxy's address. The first account registered becomes the admin, as
  upstream ships it.
