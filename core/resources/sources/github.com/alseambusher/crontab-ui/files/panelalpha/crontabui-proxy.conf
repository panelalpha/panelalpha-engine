# The only thing on the account's port. Anonymous requests stop here, so they
# never reach (and never exhaust) the app's rate limiter.
server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 20m;

    # Per-request lookup, so nginx never pins a stale address for `app`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $crontabui app:8000;

    auth_basic           "Crontab UI";
    auth_basic_user_file /etc/nginx/crontabui.htpasswd;

    location / {
        # Authorization is passed on: the app checks the same credentials.
        proxy_pass http://$crontabui$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;
    }
}
