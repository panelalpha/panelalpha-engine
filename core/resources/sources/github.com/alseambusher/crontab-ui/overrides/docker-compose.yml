# Replaces the repository's docker-compose.yml (builds the clone). Runs the
# published image of the current release with the job database on a volume.
#
# Crontab UI runs any shell command as root in its container, so every path
# needs credentials. The app's own Basic auth covers every route, but its rate
# limiter counts anonymous 401s from one shared proxy IP, so ~300 anonymous
# requests locked the owner out for 15 minutes. `proxy` checks the same
# credentials first; only authenticated requests reach the app.
services:
  app:
    image: alseambusher/crontab-ui:0.4.2
    restart: unless-stopped
    # BASIC_AUTH_USER / BASIC_AUTH_PWD, generated once by hooks/prepare.sh.
    env_file:
      - ../.panelalpha/crontabui/auth.env
    environment:
      # Rewrites the crontab from the database at boot, so jobs keep running
      # after a redeploy recreates the container.
      ENABLE_AUTOSAVE: "true"
    volumes:
      # crontab.db (the jobs), env.db, backups and the per-job logs.
      - crontab-data:/crontab-ui/crontabs
    healthcheck:
      # The image's own check curls / without credentials and gets 401.
      test: ["CMD-SHELL", "curl -fs -o /dev/null -u \"$$BASIC_AUTH_USER:$$BASIC_AUTH_PWD\" http://127.0.0.1:8000/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s
    mem_limit: 256m

  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./panelalpha/crontabui-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      # A hash only (0644); the plaintext is in ~/.panelalpha/crontabui/auth.env.
      - ../.panelalpha/crontabui/htpasswd:/etc/nginx/crontabui.htpasswd:ro
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 48m

volumes:
  crontab-data: {}
