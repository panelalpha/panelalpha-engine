# yaml-language-server: $schema=../../../_schema.json
description: >-
  Crontab UI is a web UI for cron: create, edit, run, stop, back up and
  import/export cron jobs, with per-job stdout/stderr logs. Node.js (Express)
  plus busybox crond under supervisord, jobs in an NeDB file.

  The repository's docker-compose.yml builds the clone and starts with no
  authentication: an anonymous visitor could run any shell command as root in
  the container.
  overrides/docker-compose.yml runs the published alseambusher/crontab-ui
  image of the current release (0.4.2) with /crontab-ui/crontabs (crontab.db,
  env.db, backups, job logs) on a named volume and ENABLE_AUTOSAVE, so the
  crontab is rewritten from the database whenever the container starts.

  Security: hooks/prepare.sh generates the password once into
  ~/.panelalpha/crontabui/auth.env (user `admin`) and feeds it to the app's
  own Basic auth (BASIC_AUTH_USER/BASIC_AUTH_PWD, which covers every route and
  static file). The app's rate limiter runs before that auth and keys on the
  client IP, which behind the engine's proxy is one shared address, so
  anonymous requests could lock the owner out with 429 for 15 minutes. So the app
  publishes no port: `proxy` (nginx) is the only thing on the account's port,
  checks the same credentials from an htpasswd rewritten every deploy, and
  anonymous requests never reach the app. To change the password edit
  auth.env and redeploy.

  What jobs can reach: they run as root inside the app container in the
  account's own Docker, not on the server. No Docker socket, the account's
  Docker API is closed, outbound internet is open, and the named volume is
  writable. Anything the owner schedules runs with that reach.
