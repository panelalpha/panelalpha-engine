# yaml-language-server: $schema=../../../_schema.json
description: >-
  Dawarich is a self-hosted location history tracker (Google Timeline
  replacement): a Rails app on :3000 with a Sidekiq worker, PostGIS and Redis.
  The repository keeps its Dockerfile and compose under docker/, so the plain
  deploy builds docker/Dockerfile (~6 minutes) and runs it alone with no
  command, no database and no Redis; the container restart-loops on
  "bundler: exec needs a command to run".

  This recipe replaces the compose with upstream's docker/docker-compose.yml
  on the published freikin/dawarich:1.15.2 image (current release) for both the
  web and the Sidekiq service, beside postgis/postgis:17-3.5-alpine and
  redis:7.4-alpine. APPLICATION_HOSTS is the site's host name and
  APPLICATION_PROTOCOL is https (Rails force_ssl behind the engine's TLS
  proxy). SECRET_KEY_BASE and the database password are generated once by
  hooks/prepare.sh into ~/.panelalpha/dawarich/. The database, Redis, imports,
  storage and public assets are on named volumes. Per-service memory limits
  keep the stack under the account limit (~600 MB in use idle). The first
  visit opens Dawarich's sign-in page.

  LOGIN. Self-hosted Dawarich has no sign-up (ALLOW_EMAIL_PASSWORD_REGISTRATION
  is false), and upstream's db:seed creates its documented admin
  demo@dawarich.app / safepassword, which anyone with the URL could use and
  nobody deploying it is told. So the engine generates a login
  (`credentials:` below, returned by GET /projects/{name}/app-credentials)
  and the web service reads it from app-credentials.env. web-entrypoint.sh
  migrates and seeds, then runs the service's command under bundle exec:
  files/panelalpha/dawarich-login.sh runs files/panelalpha/dawarich-login.rb
  with `bin/rails runner` (Dawarich's own User model), which gives an admin
  that still has the seed's password the engine's email and password, then
  execs the Rails server. demo@dawarich.app / safepassword no longer signs
  in, and a password changed in Dawarich is never touched. Everything else
  is upstream's default.
credentials:
  login_path: /users/sign_in
  fields:
    DAWARICH_ADMIN_EMAIL: {kind: email}
    DAWARICH_ADMIN_PASSWORD: {kind: password}
