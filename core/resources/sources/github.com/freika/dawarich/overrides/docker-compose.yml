# Upstream docker/docker-compose.yml on the 1.15.2 release image, with
# generated secrets from ~/.panelalpha (hooks/prepare.sh) and memory limits.
x-dawarich-env: &dawarich-env
  RAILS_ENV: production
  REDIS_URL: redis://dawarich_redis:6379
  DATABASE_HOST: dawarich_db
  DATABASE_PORT: "5432"
  DATABASE_USERNAME: postgres
  DATABASE_NAME: dawarich_production
  APPLICATION_HOSTS: ${PA_PUBLIC_HOST}
  APPLICATION_PROTOCOL: https
  TIME_ZONE: Europe/London
  PROMETHEUS_EXPORTER_ENABLED: "false"
  RAILS_LOG_TO_STDOUT: "true"
  SELF_HOSTED: "true"
  STORE_GEODATA: "true"

services:
  dawarich_redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --save 900 1 --save 300 10 --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    mem_limit: 128m

  dawarich_db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    shm_size: 256m
    env_file:
      - ../.panelalpha/dawarich/app.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dawarich_production
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dawarich_production"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    mem_limit: 512m

  dawarich_app:
    image: freikin/dawarich:1.15.2
    restart: unless-stopped
    entrypoint: web-entrypoint.sh
    command: ["bin/rails", "server", "-p", "3000", "-b", "::"]
    env_file:
      - ../.panelalpha/dawarich/app.env
    environment:
      <<: *dawarich-env
      WEB_CONCURRENCY: "1"
    volumes:
      - public:/var/app/public
      - watched:/var/app/tmp/imports/watched
      - storage:/var/app/storage
    ports:
      - "3000:3000"
    healthcheck:
      # force_ssl redirects plain http; the engine's proxy sends this header.
      test: ["CMD-SHELL", "wget -qO - --header 'X-Forwarded-Proto: https' http://127.0.0.1:3000/api/v1/health | grep -q '\"status\"\\s*:\\s*\"ok\"'"]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    depends_on:
      dawarich_db:
        condition: service_healthy
      dawarich_redis:
        condition: service_healthy
    mem_limit: 1g

  dawarich_sidekiq:
    image: freikin/dawarich:1.15.2
    restart: unless-stopped
    entrypoint: sidekiq-entrypoint.sh
    command: ["sidekiq"]
    env_file:
      - ../.panelalpha/dawarich/app.env
    environment:
      <<: *dawarich-env
      BACKGROUND_PROCESSING_CONCURRENCY: "3"
    volumes:
      - public:/var/app/public
      - watched:/var/app/tmp/imports/watched
      - storage:/var/app/storage
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sidekiq"]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    depends_on:
      dawarich_app:
        condition: service_healthy
    mem_limit: 640m

volumes:
  db_data: {}
  redis_data: {}
  public: {}
  watched: {}
  storage: {}
