# The repository ships only docker/Dockerfile; run the official image of the
# current release. Caddy on :80 serves the SPA and proxies /api to genesis.
services:
  app:
    image: ghcr.io/simonwep/ocular:v2.4.1
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      # GENESIS_JWT_SECRET, generated by hooks/prepare.sh.
      - ../.panelalpha/ocular/genesis.env
    environment:
      # genesis panics at boot when this is unset.
      GENESIS_JWT_TOKEN_EXPIRATION: "60"
      # Optional initial users, from the project env vars: name!:password,...
      GENESIS_CREATE_USERS: ${GENESIS_CREATE_USERS:-}
    volumes:
      - ocular-data:/data/genesis
    mem_limit: 256m

  # `compose up -d` returns once genesis passes the image's own healthcheck.
  ready:
    image: alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  ocular-data: {}
