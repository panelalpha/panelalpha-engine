# yaml-language-server: $schema=../../../_schema.json
description: >-
  Linkwarden is a collaborative bookmark manager that archives each saved page
  as a screenshot, PDF, readable text and a single-file HTML snapshot. One
  Next.js web server plus a background worker (headless Chromium via
  Playwright, monolith) in one image, with PostgreSQL and Meilisearch.

  IMAGE OF THE CURRENT RELEASE. The repo's docker-compose.yml runs
  ghcr.io/linkwarden/linkwarden:latest against bind-mounted ./pgdata, ./data
  and ./meili_data and an .env nobody fills in, so a verbatim deploy
  restart-loops. overrides/docker-compose.yml runs the release image v2.16.3
  (HEAD differs only in the mobile app) with the same Postgres 16 and
  Meilisearch v1.13.3, all on named volumes that survive redeploys.

  CLOSED FIRST RUN. Linkwarden's sign-up is open by default and user id 1 is
  the server admin (NEXT_PUBLIC_ADMIN), so the first visitor would own the
  instance. A one-shot `seed` service runs before the app on every boot: the
  image's own `prisma migrate deploy`, then, only while the user table is
  empty, a loopback-only `next start` with registration open and a call to
  Linkwarden's own POST /api/v1/users that creates `admin` with the password
  the engine generates (`credentials:` below); GET
  /projects/{name}/app-credentials (MCP app_credentials_get) returns it. The published app
  starts after the seed and runs with NEXT_PUBLIC_DISABLE_REGISTRATION=true
  (a .env default the panel may override).

  SECRETS. hooks/prepare.sh writes NEXTAUTH_SECRET, the Postgres password and
  the Meilisearch master key once to ~/.panelalpha/linkwarden/ (0600 in
  0700).
  NEXTAUTH_URL is ${PA_PUBLIC_URL}/api/v1/auth. The app container gets 1.5 GB
  so V8 and Chromium are not starved while archiving.
credentials:
  login_path: /login
  adopt_from: .panelalpha/linkwarden/admin.env
  fields:
    LINKWARDEN_ADMIN_USER: {kind: username, value: admin}
    LINKWARDEN_ADMIN_PASSWORD: {kind: password}
