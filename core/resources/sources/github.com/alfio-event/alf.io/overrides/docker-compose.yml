# Compose-replace: the repo's compose runs only a Postgres 10 for development
# (the alf.io service is commented out) and the Java build does not fit the
# engine's Java strategy. Runs upstream's published image of the current release.
services:
  db:
    # Pinned major: Postgres cannot open a datadir from a newer major.
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/alfio/db.env
    environment:
      POSTGRES_DB: alfio
      POSTGRES_USER: alfio
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfio -d alfio -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 384m

  app:
    image: docker.io/alfio/alf.io:2.0-M5-2609
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # POSTGRES_ENV_POSTGRES_PASSWORD
      - ../.panelalpha/alfio/db.env
    environment:
      # alf.io's DOCKER platform (PlatformProvider) reads these names.
      POSTGRES_PORT_5432_TCP_ADDR: db
      POSTGRES_PORT_5432_TCP_PORT: "5432"
      POSTGRES_ENV_POSTGRES_DB: alfio
      POSTGRES_ENV_POSTGRES_USERNAME: alfio
      SPRING_PROFILES_ACTIVE: jdbc-session
      ALFIO_JAVA_OPTS: -Xmx768m
    ports:
      - "8080:8080"
    healthcheck:
      # /healthz is exempt from the HTTPS redirect.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1280m

  # No-op: `compose up -d` returns once alf.io answers.
  ready:
    image: docker.io/library/alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  pgdata: {}
