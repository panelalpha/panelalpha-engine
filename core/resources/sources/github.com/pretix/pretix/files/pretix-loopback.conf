# A second nginx server block, for requests that arrive addressed to the
# container's own loopback address. Mounted into the image's conf.d, which
# nginx.conf includes inside `http {}`; the image's own `listen 80
# default_server` block is untouched and still answers everything else.
#
# Why it is needed: pretix routes by Host. MultiDomainMiddleware compares the
# request's Host against the configured site URL and the KnownDomain table, and
# anything matching neither gets a 400 "Unknown host" page. AppHealth's port
# probe curls `http://127.0.0.1:8080/` from inside the account with no Host
# header, so pretix sees `Host: 127.0.0.1:8080` -- an unknown host -- and the
# probe reads a 400 error page rather than the site. The domain answers 200 at
# the same moment, which makes it a confusing way to fail.
#
# The image's own `location /` pins `proxy_set_header Host $http_host`, and
# nginx only inherits proxy_set_header from an enclosing level when the current
# level sets none, so there is no way to change that from conf.d. A separate
# vhost, selected by server_name before any of it applies, is the way in
# without forking the image's nginx.conf.
#
# `localhost` is not an arbitrary choice: pretix's LOCAL_HOST_NAMES
# (multidomain/middlewares.py) is exactly ('testserver', 'localhost'), and a
# request for one of them is served the main-domain urlconf whatever the site
# URL says. So the probe gets the same page a visitor gets.
#
# The location blocks are the image's own, copied so that the loopback vhost
# serves what the default vhost serves rather than only proxying /.
server {
    listen 80;
    server_name 127.0.0.1 localhost "";
    index index.html;
    root /var/www;

    location /media/ {
        alias /data/media/;
        expires 7d;
        access_log off;
    }
    location ^~ /media/cachedfiles {
        deny all;
        return 404;
    }
    location ^~ /media/invoices {
        deny all;
        return 404;
    }
    location /static/staticfiles.json {
        deny all;
        return 404;
    }
    location /static/CACHE/manifest.json {
        deny all;
        return 404;
    }
    location /static/ {
        alias /pretix/src/pretix/static.dist/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public";
        gzip on;
    }
    location / {
        # Trailing `:` and no `/` -- the image's own comment explains why: with
        # a `/` nginx normalises the path, and %2F%2F in an API file name
        # becomes %2F, which breaks ticket validation.
        proxy_pass http://unix:/tmp/pretix.sock:;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The whole point of this file.
        proxy_set_header Host localhost;
    }
}
