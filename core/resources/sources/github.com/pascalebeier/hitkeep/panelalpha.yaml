# yaml-language-server: $schema=../../../_schema.json
description: >-
  HitKeep is privacy-first web analytics (MIT): one Go binary with an embedded
  DuckDB, serving the dashboard, the tracking script and the ingest API on
  :8080, with data, retention archives and backup snapshots under
  /var/lib/hitkeep.

  Compose-REPLACE from the official release image
  docker.io/pascalebeier/hitkeep:2.13.18. The repository's compose.yaml builds
  its Dockerfile, whose default `release` target copies prebuilt binaries that
  are not in the checkout (and whose Go/Node versions are build args set only by
  upstream's `hk` tool), so the plain deploy fails with
  `golang:required-by-hk: not found`. This recipe is upstream's
  examples/compose.yml on the published image: the three named volumes, the
  site's address as HITKEEP_PUBLIC_URL, and HITKEEP_JWT_SECRET generated once
  into ~/.panelalpha/hitkeep/secret.env by hooks/prepare.sh (without it HitKeep
  picks a random secret per start and every restart logs everyone out).

  First run is left as upstream ships it: the first visitor creates the first
  account. Forwarded headers are not trusted, as in upstream's example, so all
  visitors appear with the proxy's address (no per-visitor country, one shared
  login rate limit); HITKEEP_TRUSTED_PROXIES and the HITKEEP_MAIL_* settings can
  be set as project environment variables.

  Verified on mariusz.panelalpha.tools (engine 705f250a), memory_limit 2500:
  create success in 153s (the first boot's own migrations take ~110s before
  :8080 listens), / is <title>HitKeep</title> (15.8 kB), /healthz "ok". After
  creating the first account through /api/initial-user, a rebuild (33s) kept
  the account and the existing session cookie stayed valid (same JWT secret).
  /.env and /.git/config are 404. App ~150 MiB idle.
