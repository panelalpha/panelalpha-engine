# Compose-replace: the repo ships only a Dockerfile, and the app will not start
# without a SQL database and Redis. Current release 1.11 from Docker Hub.
services:
  openbudgeteer:
    image: axelander/openbudgeteer:1.11
    restart: unless-stopped
    environment:
      CONNECTION_PROVIDER: postgres
      CONNECTION_SERVER: openbudgeteer-db
      CONNECTION_PORT: "5432"
      CONNECTION_DATABASE: openbudgeteer
      CONNECTION_USER: openbudgeteer
      CONNECTION_REDIS_SERVER: openbudgeteer-redis
      CONNECTION_REDIS_PORT: "6379"
      APPSETTINGS_CULTURE: en-US
    env_file:
      # CONNECTION_PASSWORD, generated by hooks/prepare.sh.
      - ../.panelalpha/openbudgeteer/db.env
    ports:
      - "8080:8080"
    depends_on:
      openbudgeteer-db:
        condition: service_healthy
      openbudgeteer-redis:
        condition: service_healthy
    # The aspnet image has no curl/wget; bash's /dev/tcp is enough for a probe.
    # Blazor needs a Host header, or "/" throws UriFormatException.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -c 12 <&3 | grep -q ' 200'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 768m

  openbudgeteer-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openbudgeteer
      POSTGRES_DB: openbudgeteer
    env_file:
      - ../.panelalpha/openbudgeteer/db.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbudgeteer -d openbudgeteer -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 256m

  openbudgeteer-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      # App settings (theme, culture) live in Redis.
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 128m

  # No-op gate: `compose up -d` returns only once the app answers.
  ready:
    image: redis:7-alpine
    restart: "no"
    command: ["true"]
    depends_on:
      openbudgeteer:
        condition: service_healthy
    mem_limit: 32m

volumes:
  db-data: {}
  redis-data: {}
