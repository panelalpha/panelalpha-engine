# Folds Chartbrew's two processes onto one public origin. The image runs the
# React SPA (served by `serve` on :4018) and the Express API (:4019) as two
# ports; the engine publishes exactly one. The SPA's own routes collide with the
# API's at root (/user/profile vs GET /user/:id, /chart/:id/embedded vs the
# embed data endpoint), so the API cannot live at root -- the client is built
# with VITE_APP_API_HOST=<origin>/api and every REST call is <origin>/api/<ep>.
# nginx serves the SPA at / and proxies /api/ to the API with the /api prefix
# stripped (routes are mounted at root: /user, /team, /project, /chart, ...).
# Only this container publishes a host port, so the engine's port scan takes it
# as the primary app (engine#231/#234).
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;   # report/snapshot image uploads

    # API: strip /api so the Express app sees /user, /team, /project, /chart,
    # /uploads, ... at its root. The client also fetches assets as
    # <origin>/api/uploads/..., handled by this same rule.
    location /api/ {
        proxy_pass http://chartbrew:4019/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;   # long chart queries against remote datasources
    }

    # Socket.IO (AI assistant realtime). The client opens it with a fixed
    # path:"/socket.io" at the API host, so the handshake lands here at root.
    # Proxied to the API with websocket upgrade. NOTE: the client passes
    # io(<origin>/api), so socket.io negotiates the "/api" namespace, which the
    # server does not register -- the AI modal's live progress is degraded. This
    # is the one same-origin cost and it touches no core dashboard/chart feature.
    location /socket.io/ {
        proxy_pass http://chartbrew:4019/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Everything else: the React SPA served by `serve -s` (SPA fallback in serve).
    location / {
        proxy_pass http://chartbrew:4018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
