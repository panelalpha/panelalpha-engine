# Compose-replace: upstream's published image of the current release with the
# Postgres its own compose uses. The repo compose also builds a self-signed
# nginx, a cert generator, a Peppol bridge and an Ollama profile; the engine
# terminates TLS, and the rest are optional add-ons.
services:
  db:
    # Same major as upstream; Postgres cannot migrate a datadir backwards.
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/timetracker/db.env
    environment:
      POSTGRES_DB: timetracker
      POSTGRES_USER: timetracker
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetracker -d timetracker -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 384m

  # One-shot, every boot, before the app is reachable: upstream's migrations,
  # then the admin's password (only while it has none) and the first-run
  # wizard (files/.../seed.py).
  seed:
    image: ghcr.io/drytrix/timetracker:5.17.2
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
      - ../.panelalpha/timetracker/app.env
      # TT_ADMIN_PASSWORD, generated and kept by the engine.
      - ../.panelalpha/app-credentials.env
    environment:
      ADMIN_USERNAMES: admin
      ALLOW_SELF_REGISTER: "false"
      APP_BASE_URL: ${PA_PUBLIC_URL}
    volumes:
      - app_data:/data
      - ./panelalpha/timetracker:/pa:ro
    entrypoint: ["python", "/pa/seed.py"]
    mem_limit: 768m

  app:
    image: ghcr.io/drytrix/timetracker:5.17.2
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
    # .env holds panel-overridable defaults; app.env the persisted secrets.
    env_file:
      - .env
      - ../.panelalpha/timetracker/app.env
    environment:
      ADMIN_USERNAMES: admin
      ALLOW_SELF_REGISTER: "false"
      APP_BASE_URL: ${PA_PUBLIC_URL}
      WTF_CSRF_TRUSTED_ORIGINS: ${PA_PUBLIC_URL}
      PREFERRED_URL_SCHEME: https
      WTF_CSRF_SSL_STRICT: "true"
      SESSION_COOKIE_SECURE: "true"
      REMEMBER_COOKIE_SECURE: "true"
      CSRF_COOKIE_SECURE: "true"
      LOG_FILE: /app/logs/timetracker.log
    ports:
      - "8080:8080"
    volumes:
      - app_data:/data
      - app_logs:/app/logs
      - app_uploads:/app/app/static/uploads
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8080/_health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1024m

  # Exits 0 once the app is healthy, so `compose up -d` returns only when
  # TimeTracker answers.
  ready:
    image: docker.io/library/alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m

volumes:
  db_data: {}
  app_data: {}
  app_logs: {}
  app_uploads: {}
