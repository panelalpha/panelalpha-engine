# The repo's compose is the dev stack (runserver, DEBUG, bind-mounted tree).
# This is upstream's production shape from deploy/: gunicorn on the repo's
# Dockerfile, PostgreSQL, and Caddy serving /static and proxying the rest.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: ../.panelalpha/mataroa/db.env
    environment:
      POSTGRES_USER: mataroa
      POSTGRES_DB: mataroa
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mataroa -d mataroa -q"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # SECRET_KEY and DATABASE_URL, generated by hooks/prepare.sh.
    env_file: ../.panelalpha/mataroa/app.env
    environment:
      # Main site and dashboard live on this host; blogs on <user>.<DOMAIN>.
      DOMAIN: ${PA_PUBLIC_HOST}
      DEBUG: "0"
      LOCALDEV: "0"
    # As upstream's deploy/templates/mataroa.service (gunicorn), after
    # migrate and collectstatic as its deploy.sh runs them. Only Caddy reaches
    # :5000, so gunicorn takes its X-Forwarded-Proto (upstream: 127.0.0.1).
    command:
      - sh
      - -c
      - >-
        .venv/bin/python manage.py migrate --noinput &&
        .venv/bin/python manage.py collectstatic --noinput &&
        exec .venv/bin/gunicorn -b 0.0.0.0:5000 -w 2 --forwarded-allow-ips '*' --access-logfile - mataroa.wsgi
    volumes:
      - static:/app/static
    healthcheck:
      # The app answers 400 to any Host but DOMAIN (or a blog/custom domain).
      test: ["CMD", "python3", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:5000/', headers={'Host': os.environ['DOMAIN']}), timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s
    mem_limit: 512m

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - static:/srv/static:ro
      - ./panelalpha/Caddyfile:/etc/caddy/Caddyfile:ro
    mem_limit: 64m

  # No-op gate: `compose up -d` returns only once gunicorn answers.
  ready:
    image: caddy:2.11.4-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 32m

volumes:
  pgdata: {}
  static: {}
