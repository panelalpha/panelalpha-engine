# Layers over the compose the dockerfile strategy generates for the `app`
# service (build = files/Dockerfile: the official SCM-Manager image + our config
# and entrypoint; it already publishes 8080 and loads env_file .env). This adds
# the persistent data dir, the admin-password secret, the account uid and a
# memory ceiling for the JVM. ${...} is interpolated from ~/project/.env, which
# hooks/prepare.sh writes before the build.
services:
  app:
    # Run as the account uid in group 0. The image runs as uid 1000 gid 0 and
    # its data/work dirs are group-0-writable (775); running as the account uid
    # keeps the ~/.panelalpha bind mount (owned by the account) writable and the
    # 0600 admin-password file readable, while group 0 keeps the image's
    # anonymous work volume writable.
    user: "${CONTAINER_UID}:0"
    volumes:
      # /var/lib/scm is ALL of SCM-Manager's state (H2 db, every hosted repo,
      # config, plugins). ${SCM_DATA} = ~/.panelalpha/scm-manager/data, which the
      # per-deploy ~/project wipe never touches.
      - "${SCM_DATA}:/var/lib/scm"
      # The one-time admin password, generated by the prepare hook, read by the
      # entrypoint to seed the first admin. Read-only.
      - "${SCM_ADMIN_PW_FILE}:/run/scm/admin_password:ro"
    environment:
      SCM_ADMIN_USER: "${SCM_ADMIN_USER}"
      SCM_ADMIN_EMAIL: "${SCM_ADMIN_EMAIL}"
    # SCM-Manager is a JVM app; idle resident is a few hundred MB, but repo
    # operations (clone/checkout working copies) need headroom.
    mem_limit: 2g
