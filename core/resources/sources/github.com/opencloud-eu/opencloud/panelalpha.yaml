# yaml-language-server: $schema=../../../_schema.json
description: >-
  OpenCloud, a self-hosted file sync and sharing platform (Go server with a
  built-in identity provider and web UI).

  The repository's Dockerfile builds the server from source, and the image it
  produces exits at start because no config exists, so the plain deploy
  restart-loops. This recipe runs upstream's release image,
  opencloudeu/opencloud-rolling:8.0.1, the way upstream's opencloud-compose
  runs it behind an external proxy: `opencloud init` writes
  /etc/opencloud/opencloud.yaml with random secrets on the first start (and
  fails harmlessly afterwards), then `opencloud server` listens on plain HTTP
  8080 (not upstream's 9200, which the engine reads as Elasticsearch and
  leaves out of its port scan) with OC_URL set to the account's https address, since TLS ends at the
  engine's proxy. Config and file storage are on named volumes that survive
  redeploys. First run is upstream's: the `admin` password is generated by
  `opencloud init`, printed in the container's first log and kept in
  opencloud.yaml (idm.service_user_passwords.admin_password).
