# Replaces the repository's docker-compose.yml, which runs `:latest` with the
# README's default admin (admin@example.com / password), fixed database
# passwords and MariaDB published on 3306. Same two services here, with:
#   - the current release image (v6.1) and MariaDB 11.4 LTS, db not published
#   - DB passwords from ~/.panelalpha/hortusfox/*.env (hook), the admin login
#     from ~/.panelalpha/app-credentials.env (the engine's)
#   - release mode when serving
#   - a sweeper that deletes web backup exports after 15 minutes
#   - a no-op `ready` gate so the deploy ends once migrations and the admin exist
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=64
      - --performance-schema=OFF
    env_file:
      - ../.panelalpha/hortusfox/db.env
    environment:
      MARIADB_DATABASE: hortusfox
      MARIADB_USER: hortusfox
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s
    mem_limit: 512m

  app:
    image: ghcr.io/danielbrendel/hortusfox-web:v6.1
    restart: unless-stopped
    ports:
      - "8000:80"
    # DB_PASSWORD, and APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD (the engine's).
    # The entrypoint creates the admin only while no admin exists, so later
    # changes in the UI are kept.
    env_file:
      - ../.panelalpha/hortusfox/app.env
      - ../.panelalpha/app-credentials.env
    environment:
      # The entrypoint's migrate/seed steps use the asatru CLI, which refuses
      # to run unless APP_DEBUG is true; `command` turns it off before serving.
      APP_DEBUG: "true"
      APP_TIMEZONE: UTC
      APACHE_SERVER_NAME: ${PA_PUBLIC_HOST}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: hortusfox
      DB_USERNAME: hortusfox
      DB_CHARSET: utf8mb4
    volumes:
      - app_images:/var/www/html/public/img
      - app_attachments:/var/www/html/public/attachments
      - app_logs:/var/www/html/app/logs
      - app_backup:/var/www/html/public/backup
      - app_themes:/var/www/html/public/themes
      - app_migrate:/var/www/html/app/migrations
    # Runs after the image's entrypoint (it ends in exec "$@"): switch the
    # generated .env to release mode (no stack traces) and hide PHP errors.
    command:
      - /bin/sh
      - -c
      - >-
        sed -i 's/^\([[:space:]]*\)APP_DEBUG=.*/\1APP_DEBUG=false/' /var/www/html/.env &&
        echo 'display_errors = Off' > /usr/local/etc/php/conf.d/errors.ini &&
        exec apache2-foreground
    depends_on:
      db:
        condition: service_healthy
    # Apache starts only after migrations and the admin row, so this is the gate.
    healthcheck:
      # The login form renders only once the schema and settings row exist.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/auth | grep -q 'name=\"password\"'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    mem_limit: 512m

  # A web export is written to public/backup as hf_backup_<timestamp>.zip and
  # never removed, so anyone guessing the second can download it. Keep the
  # window short: delete exports 15 minutes after they are written.
  backup-sweeper:
    image: ghcr.io/danielbrendel/hortusfox-web:v6.1
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - while :; do find /backup -maxdepth 1 -type f -name '*.zip' -mmin +15 -delete; sleep 60; done
    volumes:
      - app_backup:/backup
    mem_limit: 32m

  ready:
    image: ghcr.io/danielbrendel/hortusfox-web:v6.1
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  db_data: {}
  app_images: {}
  app_attachments: {}
  app_logs: {}
  app_backup: {}
  app_themes: {}
  app_migrate: {}
