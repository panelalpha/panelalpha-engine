# Replaces the repository's docker-compose.yml (a build-from-source dev stack
# with ./config, ./games bind mounts). Runs the published image of the current
# release instead, with its state on named volumes.
#
# Playerr has no authentication at all: every /api/v3 route is anonymous and
# returns the Prowlarr/Jackett/IGDB/Steam/download-client API keys it stores.
# So the app publishes nothing; `proxy` is the only thing on the account's port
# and requires HTTP Basic credentials generated by hooks/prepare.sh.
services:
  app:
    image: maikboarder/playerr:v0.4.8
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:2727
      DOTNET_RUNNING_IN_CONTAINER: "true"
    volumes:
      # playerr.db (SQLite library), *.json settings holding the API keys, log.
      - playerr-config:/app/config
      # Game library root; point Settings -> Media at /media.
      - playerr-media:/media
    healthcheck:
      # The runtime image ships python3 (for its Switch USB helper), not curl.
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:2727/api/v3/platform', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 1g

  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./panelalpha/playerr-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      # A hash only (0644); the plaintext is in ~/.panelalpha/playerr/admin.txt.
      - ../.panelalpha/playerr/htpasswd:/etc/nginx/playerr.htpasswd:ro
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 48m

volumes:
  playerr-config: {}
  playerr-media: {}
