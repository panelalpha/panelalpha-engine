# The only thing on the account's port. Playerr itself authenticates nobody,
# so every path, the UI included, requires the generated Basic credentials.
server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 100m;

    # Per-request lookup, so nginx never pins a stale address for `app`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $playerr app:2727;

    auth_basic           "Playerr";
    auth_basic_user_file /etc/nginx/playerr.htpasswd;

    location / {
        proxy_pass http://$playerr$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # The credentials stop here; the app has no use for them.
        proxy_set_header Authorization     "";
        proxy_read_timeout 300s;
    }
}
