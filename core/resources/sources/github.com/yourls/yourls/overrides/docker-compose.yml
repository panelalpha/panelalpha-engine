# Compose-replace: the checkout has no config.php and no rewrite rules, and
# needs MySQL. Runs the official image of the current release on MariaDB.
services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    # Sized for a shared 2.5 GB account, not a whole machine.
    command:
      - --innodb-buffer-pool-size=64M
      - --max-connections=32
      - --performance-schema=OFF
    environment:
      MARIADB_DATABASE: yourls
      MARIADB_USER: yourls
    env_file:
      # MARIADB_PASSWORD / MARIADB_ROOT_PASSWORD, generated by hooks/prepare.sh.
      - ../.panelalpha/yourls/db.env
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    mem_limit: 384m

  app:
    image: yourls:1.10.6-apache
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      YOURLS_SITE: ${PA_PUBLIC_URL}
      YOURLS_DB_HOST: db
      YOURLS_DB_USER: yourls
      YOURLS_DB_NAME: yourls
    env_file:
      # YOURLS_DB_PASS / YOURLS_COOKIEKEY, generated by hooks/prepare.sh.
      - ../.panelalpha/yourls/app.env
      # YOURLS_USER / YOURLS_PASS, the admin login the engine generates.
      - ../.panelalpha/app-credentials.env
    volumes:
      # Plugins the owner installs; links and stats live in MariaDB.
      - plugins:/var/www/html/user/plugins
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /admin/install.php renders before and after the tables exist.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/admin/install.php"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 384m

  # No-op: `compose up -d` returns only once YOURLS answers.
  ready:
    image: yourls:1.10.6-apache
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  db: {}
  plugins: {}
