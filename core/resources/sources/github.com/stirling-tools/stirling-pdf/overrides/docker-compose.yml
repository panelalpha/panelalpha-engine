# The Gradle build cannot be run by the Java recipe;
# this runs the official image of the current release on named volumes.
services:
  app:
    image: stirlingtools/stirling-pdf:3.0.0
    restart: unless-stopped
    volumes:
      # settings.yml, the embedded database, keys, AOT cache.
      - configs:/configs
      - pipeline:/pipeline
      - customfiles:/customFiles
      - storage:/storage
      - logs:/logs
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 10 http://127.0.0.1:8080/api/v1/info/status | grep -q UP"]
      interval: 10s
      timeout: 15s
      retries: 60
      start_period: 60s
    mem_limit: 2048m

  # No-op gate: `compose up -d` returns only once Stirling-PDF reports UP.
  ready:
    image: stirlingtools/stirling-pdf:3.0.0
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  configs: {}
  pipeline: {}
  customfiles: {}
  storage: {}
  logs: {}
