# yaml-language-server: $schema=../../../_schema.json
description: >-
  Stirling-PDF is a web toolbox for PDF work (merge, split, convert, OCR,
  sign): a Spring Boot backend serving the React UI and REST API on :8080,
  with LibreOffice, Tesseract and qpdf in the image. The repository is a Gradle
  multi-project whose root build/libs holds only restart-helper.jar (the boot
  jar is in app/core/build/libs, engine#333), and the build targets a Java 25
  toolchain that the engine's JDK 21 runtime cannot load (engine#131); its
  Dockerfiles live under docker/ and build the frontend too.

  This recipe runs upstream's official image of the current release,
  stirlingtools/stirling-pdf:3.0.0 (the standard variant, as the README's
  `docker run` does), with settings, the embedded database, pipelines, custom
  files and logs on named volumes that survive redeploys. Defaults are left as
  upstream ships them. The JVM sizes its heap from the container limit, so the
  service gets 2 GB; give the account at least 2500 MB.
