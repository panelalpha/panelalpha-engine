# The repository's compose builds the image from source (frontend and backend
# test suites included) and bind-mounts ./var. This runs the published image
# of the current release with the data directory on a named volume.
services:
  remark:
    image: ghcr.io/umputun/remark42:v1.17.1
    restart: unless-stopped
    ports:
      - "8080:8080"
    # AUTH_*, ADMIN_PASSWD, SITE and any other remark42 setting from the
    # project's env vars.
    env_file: .env
    environment:
      REMARK_URL: ${PA_PUBLIC_URL}
      SECRET: ${SECRET:?SECRET is required}
    volumes:
      - remark-var:/srv/var
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/ping"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s
    mem_limit: 512m

  # No-op gate: `compose up -d` returns only once remark42 answers /ping.
  ready:
    image: ghcr.io/umputun/remark42:v1.17.1
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      remark:
        condition: service_healthy
    mem_limit: 32m

volumes:
  remark-var: {}
