# The only thing on the account's port. Maintainerr has no login at all and
# expects a reverse proxy to provide one; this is it. Every path, UI and /api,
# needs the Basic credentials in ~/.panelalpha/maintainerr/.

server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 20m;

    auth_basic           "Maintainerr";
    auth_basic_user_file /etc/nginx/maintainerr-auth/htpasswd;

    # Per-request lookup, so nginx never pins a stale address for `app`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $maintainerr app:6246;

    location / {
        proxy_pass http://$maintainerr$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # The app has no use for the credentials.
        proxy_set_header Authorization "";
        # /api/events/stream and /api/logs/stream are Server-Sent Events.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
