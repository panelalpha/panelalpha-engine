# Maintainerr has no authentication of its own and keeps the customer's Plex
# token and *arr API keys, so the app publishes nothing: `proxy` (HTTP Basic,
# password generated into ~/.panelalpha/maintainerr) is the only published port.
services:
  app:
    image: ghcr.io/maintainerr/maintainerr:3.29.0
    restart: unless-stopped
    environment:
      TZ: Etc/UTC
      # The anonymous weekly usage report the README documents.
      TELEMETRY: "off"
    volumes:
      # maintainerr.sqlite (settings, API keys, rules, collections) and logs.
      - maintainerr-data:/opt/data
    mem_limit: 1g

  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    # user: is the account uid, set in the docker-compose.override.yml that
    # hooks/prepare.sh writes, so nginx can read the 0600 htpasswd.
    ports:
      - "8080:8080"
    volumes:
      - ./panelalpha/maintainerr-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      # The directory, not the file: a single-file bind mount is bound by inode.
      - ../.panelalpha/maintainerr/auth:/etc/nginx/maintainerr-auth:ro
    depends_on:
      # The image's own HEALTHCHECK (/api/health/ready, pings the DB), so a
      # finished deploy means migrations ran and the app answers.
      app:
        condition: service_healthy
    mem_limit: 48m

volumes:
  maintainerr-data: {}
