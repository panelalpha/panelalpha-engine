# Compose-replace: the repo compose is a Traefik stack with placeholder domains.
# This is upstream's docker-compose.prod.yml without Traefik: prebuilt images,
# only the frontend published; its nginx proxies /api/ to the backend.
services:
  backend:
    image: ghcr.io/fabianrolfmatthiasnoll/mymangadb/backend:2.8.3
    restart: unless-stopped
    env_file:
      - .env
      # Missing file aborts `up` rather than signing JWTs with the public default.
      - ../.panelalpha/mymangadb/secret.env
    environment:
      FRONTEND_URL: ${PA_PUBLIC_URL}
    volumes:
      - database:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 512m

  app:
    image: ghcr.io/fabianrolfmatthiasnoll/mymangadb/frontend:2.8.3
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m

volumes:
  database: {}
