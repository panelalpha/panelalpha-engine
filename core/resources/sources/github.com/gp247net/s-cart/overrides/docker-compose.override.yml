# Layers over the compose file the laravel strategy generates. That file is
# right about the app -- the shared PHP base image, ~/project bind-mounted at
# /app, the account's own uid, PA_DOCROOT=/app/public, Apache on 8000, the
# public https URL in APP_URL, a mariadb:11 `db` beside it and a wait-for-mysql
# loop ahead of the install stage -- and says nothing about when S-Cart is
# ready, because nothing in a Laravel checkout can.
#
# An override rather than a replacement compose file, and here that is not a
# preference: an `overrides/docker-compose.yml` is written into the checkout
# *before* detection runs, so a compose file in the project root would make
# S-Cart look like a compose project and take the laravel strategy -- with it
# the bind mount, the docroot, the Composer and Vite passes on the host and the
# staged entrypoint -- off the table entirely. It is also the reason
# hooks/prepare.sh moves the repository's own two compose files out of the root
# rather than leaving them for this file to fight with.
services:
  app:
    # Two requests, and the second is the one that proves anything.
    #
    # The install stage does all the real work before Apache binds: waiting for
    # the mariadb sidecar's first boot (initialising a fresh data directory on a
    # 2-core host is most of a minute on its own), `migrate`, then
    # `gp247:install` -- core, front and shop in turn, each migrating a large
    # schema and running its seeders, publishing the GP247Front template into
    # app/GP247 and public/GP247, and linking storage -- and then the admin
    # password. The engine runs `docker compose up -d` without --wait and probes
    # as soon as it returns, which is while all of that is still going: nothing
    # is listening and the probe reads `Failed to connect to 127.0.0.1 port
    # 8000`.
    #
    #   1. GET /                        the storefront, rendered by the
    #                                   published GP247Front template out of
    #                                   gp247_admin_store and the shop tables,
    #                                   so it already needs a seeded schema.
    #   2. GET /gp247_admin/auth/login  the admin login form, 200 to an
    #                                   anonymous client. GP247_ADMIN_PREFIX in
    #                                   .env is what names this path; the recipe
    #                                   leaves it at upstream's `gp247_admin`.
    #                                   `/gp247_admin` on its own is a 302 here
    #                                   and would prove much less.
    #
    # The probe curls 127.0.0.1, so the Host header is `127.0.0.1:8000`. S-Cart
    # registers no trusted-host middleware and answers it normally. Idempotent,
    # so a retry replays it harmlessly. curl is in the base image. No -L: there
    # is nothing to follow, and a redirect's Location would be the account's
    # absolute https URL, which is not this port.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null --max-time 30 http://127.0.0.1:8000/ &&
          curl -fsS -o /dev/null --max-time 30
          http://127.0.0.1:8000/gp247_admin/auth/login
      interval: 10s
      timeout: 40s
      retries: 30
      # The database's first boot plus a three-package install, on a 2-core
      # host. A failing check inside this window neither counts against retries
      # nor marks the container unhealthy.
      start_period: 300s

  # Does nothing and exits 0. Compose does not wait for a healthcheck on its
  # own, but it does block on a `depends_on` health condition -- so a service
  # that waits for the app is what makes `up -d` return only once S-Cart has
  # migrated, seeded, published its template and answered, and what the health
  # probe then meets. A clean exit 0 is not a crash loop as far as AppHealth is
  # concerned.
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
