# yaml-language-server: $schema=../../../_schema.json
description: >-
  Stremio Web, the browser client of the Stremio media hub (catalogues and
  streams come from addons, fetched by the browser). Upstream's own Dockerfile
  builds it: pnpm install, `pnpm build` (webpack), then an express server
  (http_server.js) serves build/ on 8080. The plain deploy used that
  Dockerfile but failed at `pnpm build`: webpack.config.js runs
  `git rev-parse HEAD` to name its asset directories, and the engine's
  generated Dockerfile.dockerignore leaves .git out of the build context
  because GitHistoryUse does not look at webpack.config.js (engine#413).
  files/Dockerfile.dockerignore takes the place of the generated one: upstream's
  own .dockerignore (node_modules) plus the engine's .env and compose files,
  and .git kept in. The final image copies only build/ and http_server.js,
  so neither .git nor .env reaches it. No data is stored server-side.

  The webpack build needs an account of about 3 GB: it ran out of memory
  at memory_limit 2500 (in TerserPlugin) and passed at 3072 and 4096.
extends: dockerfile
extra:
  # A source recipe gets no probe data; state what the dockerfile probe finds.
  dockerfile: Dockerfile
  port_hint: 8080
