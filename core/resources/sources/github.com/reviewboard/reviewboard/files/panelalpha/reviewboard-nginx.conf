# Upstream's contrib/docker/examples/nginx_templates/default.conf.template with
# the port fixed and the scheme taken from the engine's proxy (TLS ends there).
upstream reviewboard {
    server reviewboard:8080;
}

server {
    listen 80;
    root /var/www/reviewboard/htdocs;

    location / {
        proxy_pass http://reviewboard;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        client_max_body_size        10m;
        client_body_buffer_size     128k;
        proxy_connect_timeout       90;
        proxy_send_timeout          90;
        proxy_read_timeout          90;
        proxy_buffer_size           16k;
        proxy_buffers               8 32k;
        proxy_busy_buffers_size     64k;
    }

    location /media/ {
        alias /var/www/reviewboard/htdocs/media/;
        expires max;
        add_header Cache-Control public;
    }

    location /static/ {
        alias /var/www/reviewboard/htdocs/static/;
        expires max;
        add_header Cache-Control public;
    }

    location /errordocs/ {
        alias /var/www/reviewboard/htdocs/errordocs/;
        expires 5d;
    }

    location /robots.txt {
        alias /var/www/reviewboard/htdocs/robots.txt;
        expires 5d;
    }
}
