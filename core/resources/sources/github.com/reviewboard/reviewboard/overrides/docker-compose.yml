# Compose-replace: upstream's contrib/docker/examples/docker-compose.postgres.yaml
# on the current release image, without the optional RabbitMQ/Doc Converter
# (Power Pack only). The repo root is the Python package, not a deployment.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/reviewboard/db.env
    environment:
      # Review Board's own user owns the database (PostgreSQL 15+ schema rights).
      POSTGRES_USER: reviewboard
      POSTGRES_DB: reviewboard
    volumes:
      - reviewboard-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "reviewboard", "-d", "reviewboard"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 256m

  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: ["memcached", "-m", "64"]
    mem_limit: 96m

  reviewboard:
    image: beanbag/reviewboard:8.1
    restart: unless-stopped
    env_file:
      - ../.panelalpha/reviewboard/app.env
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_SERVER: db
      DATABASE_NAME: reviewboard
      DATABASE_USERNAME: reviewboard
      MEMCACHED_SERVER: memcached:11211
      DOMAIN: ${PA_PUBLIC_HOST}
      COMPANY: Review Board
      NUM_WORKERS: "2"
      NUM_THREADS: "10"
      # nginx forwards the engine proxy's X-Forwarded-Proto; gunicorn only
      # honours it from trusted peers, and nginx is another container.
      GUNICORN_FLAGS: --forwarded-allow-ips=*
    volumes:
      - reviewboard-site:/site
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
    healthcheck:
      # The first start runs rb-site install (schema + media copy).
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health/"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    mem_limit: 1024m

  # Upstream's nginx front: static media from the site directory, the rest to gunicorn.
  app:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - reviewboard-site:/var/www/reviewboard:ro
      - ./panelalpha/reviewboard-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      reviewboard:
        condition: service_healthy
    mem_limit: 64m

  # No-op gate: `compose up -d` returns only once Review Board answers.
  ready:
    image: memcached:1.6-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      reviewboard:
        condition: service_healthy
    mem_limit: 32m

volumes:
  reviewboard-db: {}
  reviewboard-site: {}
