# Compose-replace: upstream's docker/docker-compose.yml on the published image.
# The repo-root .env is a development template, so the start-critical values
# are pinned here; mail and registration settings come from the project's env.
services:
  app:
    image: ferdium/ferdium-server:2.0.13
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3333"
      APP_URL: ${PA_PUBLIC_URL}
      DB_CONNECTION: sqlite
      DATA_DIR: /data
      JWT_USE_PEM: "true"
      # Empty: the entrypoint generates the key once into /data and reuses it.
      APP_KEY: ""
    volumes:
      - data:/data
      - recipes:/app/build/recipes
    ports:
      - "3333:3333"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3333/health"]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 30s
    mem_limit: 1g

  # `compose up -d` returns only once the server answers.
  ready:
    image: ferdium/ferdium-server:2.0.13
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  data: {}
  recipes: {}
