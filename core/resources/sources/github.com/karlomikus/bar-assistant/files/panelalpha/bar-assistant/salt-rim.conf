# Salt Rim is the single public origin. It serves the SPA at / and folds the
# other two services onto the same origin under subpaths: /bar/ -> the Bar
# Assistant API, /search/ -> Meilisearch, each with its prefix stripped. Only
# this container publishes a host port, so the engine's port scan takes it as
# the primary app (engine#231/#234). Replaces the image's own default.conf
# (which only served the SPA).
tcp_nopush on;
tcp_nodelay on;

access_log off;
error_log stderr error;

client_max_body_size 100M;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /var/www/html/;

    # Bar Assistant API. Trailing slash on proxy_pass strips /bar, so Laravel
    # sees /api/... at its own root; APP_URL=<origin>/bar makes upload/image
    # URLs (APP_URL . '/uploads') resolve back through here.
    location /bar/ {
        proxy_pass http://bar-assistant:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    # Meilisearch. Every request needs a key (production master key is set), so
    # anonymous access is refused; the browser uses a per-user scoped search
    # token minted by the API, never the master key.
    location /search/ {
        proxy_pass http://meilisearch:7700/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # The Vue SPA (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
