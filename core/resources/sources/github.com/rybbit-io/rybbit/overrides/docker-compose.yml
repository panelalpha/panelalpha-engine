# Upstream docker-compose.yml (v2.9.0) on the published release images instead of
# source builds, with the secrets from ~/.panelalpha/rybbit (hooks/prepare.sh) and
# an nginx front doing the Caddyfile's routing (Caddy runs only under a profile).
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.4
    restart: unless-stopped
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./panelalpha/clickhouse/network.xml:/etc/clickhouse-server/config.d/network.xml:ro
      - ./panelalpha/clickhouse/logging_rules.xml:/etc/clickhouse-server/config.d/logging_rules.xml:ro
      - ./panelalpha/clickhouse/resource_limits.xml:/etc/clickhouse-server/config.d/resource_limits.xml:ro
      - ./panelalpha/clickhouse/user_settings.xml:/etc/clickhouse-server/users.d/user_settings.xml:ro
    env_file:
      - ../.panelalpha/rybbit/rybbit.env
    environment:
      - CLICKHOUSE_DB=analytics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 1024m

  postgres:
    image: postgres:17.4
    restart: unless-stopped
    env_file:
      - ../.panelalpha/rybbit/rybbit.env
    environment:
      - POSTGRES_USER=frog
      - POSTGRES_DB=analytics
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frog -d analytics"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 256m

  redis:
    image: redis:8.6.4-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/rybbit/rybbit.env
    volumes:
      - redis-data:/data
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --appendfsync everysec --maxmemory-policy noeviction"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    mem_limit: 128m

  backend:
    image: ghcr.io/rybbit-io/rybbit-backend:v2.9.0
    restart: unless-stopped
    env_file:
      - ../.panelalpha/rybbit/rybbit.env
    environment:
      - NODE_ENV=production
      - BASE_URL=${PA_PUBLIC_URL}
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_DB=analytics
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=analytics
      - POSTGRES_USER=frog
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Upstream defaults to 4 workers; one keeps the stack inside the account's memory.
      - CLUSTER_WORKERS=1
      - DASHBOARD_CACHE_TTL_SECONDS=30
      # Optional upstream settings, passed through from the project's env vars.
      - DISABLE_SIGNUP
      - DISABLE_TELEMETRY
      - MAPBOX_TOKEN
      - DEPLOYMENT
      - LITE_DASHBOARD
      - OPENROUTER_API_KEY
      - OPENROUTER_MODEL
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 640m

  client:
    image: ghcr.io/rybbit-io/rybbit-client:v2.9.0
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3002/"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
    mem_limit: 384m

  # Upstream's Caddyfile routing (files/panelalpha/front.conf); the only published port.
  web:
    image: nginx:1-alpine
    restart: unless-stopped
    volumes:
      - ./panelalpha/front.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
      client:
        condition: service_healthy
    mem_limit: 64m

  # No-op gate: `compose up -d` returns once the backend and the client answer.
  ready:
    image: nginx:1-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      web:
        condition: service_started
    mem_limit: 32m

volumes:
  clickhouse-data:
  postgres-data:
  redis-data:
