# Upstream's Caddyfile routing on one port: /api and the OAuth/OIDC discovery
# documents go to the backend, everything else to the Next.js client.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    # Fastify's largest route limit (event imports), as upstream's Caddyfile.
    client_max_body_size 50m;
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:3001;
    set $client http://client:3002;

    proxy_http_version 1.1;
    # X-Forwarded-For/-Proto pass through unchanged from the engine's proxy.
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/ { proxy_pass $backend; }
    location ^~ /.well-known/oauth- { proxy_pass $backend; }
    location ^~ /.well-known/openid-configuration { proxy_pass $backend; }
    location / { proxy_pass $client; }
}
