# The forward-auth proxy Hubleys is written to sit behind, made out of the one
# authenticator a shared-hosting account already has: HTTP Basic.
#
# Hubleys does not authenticate anybody. src/hooks.server.ts reads the user
# identity out of request headers (Remote-User, Remote-Groups, Remote-Name,
# Remote-Email) and trusts them completely -- that is the "forward auth" the
# README's section 3 tells you to put in front of it. With nothing in front,
# the app answers `error(500, 'forward auth not configured')` to a visitor who
# sends no header, and a full dashboard to one who sends `Remote-User:
# anything`. Both of those were measured on a stock deploy.
#
# So this file is the thing that is missing. Three jobs, in order of how much
# they matter:
#
#   1. Set all four Remote-* headers unconditionally on every proxied request.
#      `proxy_set_header` replaces whatever the client sent, so a visitor
#      cannot name themselves any more -- that is the whole security fix and it
#      is these four lines, not the password.
#   2. Accept Basic credentials when they are offered, and identify that user.
#   3. Let a visitor who offers none through as `guest`, so that `/` is a real
#      page and what a stranger may see is decided by the `allow:`/`deny:`
#      rules in config.yml, server-side, in getUserSections() --
#      src/lib/server/authz.ts, which strips tiles out of the payload rather
#      than hiding them in CSS.
#
# (3) is why auth_basic is switched by a variable instead of being on. An
# always-on realm makes `/` a 401 for everyone, which is a legitimate way to
# run this app and a bad default here: it would make the account's homepage
# unusable to the public it is on a public domain for, and the engine's own
# reachability probe reads the same 401.

# Only challenge a client that actually offered credentials. `off` is
# auth_basic's documented value for "no authentication", and the directive
# takes variables.
map $http_authorization $hubleys_realm {
    default  "Hubleys";
    ""       off;
}

# Who Hubleys is told this is. An authenticated request carries the Basic
# username; an anonymous one is `guest`, a normal Hubleys user id with no
# special standing, matched by `user:guest` in config.yml like any other.
map $remote_user $hubleys_user {
    default  $remote_user;
    ""       "guest";
}

# Group membership, from a file the account owns and can edit:
# ~/.panelalpha/hubleys/auth/groups.map. `admin  "admins";` is seeded there,
# and ADMINS=group:admins in the compose override is what turns that into the
# Settings -> Admin page. nginx reads an include at config load, so a change
# here needs `docker compose restart auth`; a change to htpasswd does not,
# because that file is read per request.
map $hubleys_user $hubleys_groups {
    default "";
    include /etc/nginx/hubleys-auth/groups.map;
}

# The public scheme. The engine's outer nginx sets X-Forwarded-Proto (see
# NginxProxy.php:630); this survives the hop even if something upstream drops
# it, and is handed on as the header SvelteKit's adapter-node is told to read
# (PROTOCOL_HEADER), so form POSTs pass its cross-origin check.
map $http_x_forwarded_proto $hubleys_proto {
    default  $http_x_forwarded_proto;
    ""       "https";
}

server {
    # 8080, not 80: this container runs as the account's own uid so that it can
    # read ~/.panelalpha/hubleys/auth without those files having to be
    # world-readable, and a non-root process cannot bind a privileged port. The
    # compose override publishes it on the account's 3000, which is where the
    # webserver looks.
    listen 8080 default_server;
    server_name _;

    # BACKGROUND_IMG_MAX_UPLOAD_MB is 10; the app answers 413 itself above
    # that, and this has to be the larger of the two or nginx answers first
    # with its own page.
    client_max_body_size 12m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    auth_basic           $hubleys_realm;
    auth_basic_user_file /etc/nginx/hubleys-auth/htpasswd;

    # The only way to make a browser ask for the password, since a browser
    # never volunteers Basic credentials. Always challenges, then hands back a
    # page that bounces to the dashboard -- which the browser now loads with
    # the Authorization header it has just learned for this origin.
    #
    # It has to serve a *file*. `return 302` here would not work: return runs
    # in nginx's rewrite phase, which is ahead of the access phase auth_basic
    # lives in, so the redirect is issued before the password is ever asked
    # for. Measured: an anonymous GET of this location answered 302, not 401.
    # try_files reaches the content phase and therefore runs after auth.
    location = /panelalpha-login {
        auth_basic           "Hubleys";
        auth_basic_user_file /etc/nginx/hubleys-auth/htpasswd;
        root /etc/nginx/hubleys-static;
        try_files /hubleys-login.html =404;
    }

    location / {
        # Resolved per request through Docker's embedded DNS rather than once
        # at config load: with a literal name in proxy_pass, nginx refuses to
        # start while the app container is still being created, and pins the
        # first address it gets for the life of the process.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $hubleys_upstream app;
        proxy_pass http://$hubleys_upstream:3000$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $hubleys_proto;
        proxy_set_header X-Forwarded-Host  $http_host;

        # The identity. Set on every request, including the anonymous ones --
        # an empty value would still be an override, but `guest` is a real user
        # id so that config.yml can talk about it.
        proxy_set_header Remote-User   $hubleys_user;
        proxy_set_header Remote-Groups $hubleys_groups;
        proxy_set_header Remote-Name   $hubleys_user;
        proxy_set_header Remote-Email  "";

        # Hubleys has no use for the credentials and no reason to see them.
        proxy_set_header Authorization "";

        proxy_read_timeout 120s;
    }
}
