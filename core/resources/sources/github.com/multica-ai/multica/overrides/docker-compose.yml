# Upstream's docker-compose.selfhost.yml with the v0.6.0 release images pinned,
# only the web UI published, and the secrets generated by hooks/prepare.sh.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file:
      - ../.panelalpha/multica/app.env
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: multica
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multica -d multica"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  backend:
    image: ghcr.io/multica-ai/multica-backend:v0.6.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Optional customer settings first (RESEND_API_KEY, SMTP_*, ALLOW_SIGNUP, ...);
    # the generated DATABASE_URL / JWT_SECRET come last and win.
    env_file:
      - path: .env
        required: false
      - ../.panelalpha/multica/app.env
    environment:
      PORT: "8080"
      APP_ENV: production
      FRONTEND_ORIGIN: ${PA_PUBLIC_URL}
      CORS_ALLOWED_ORIGINS: ${PA_PUBLIC_URL}
      MULTICA_APP_URL: ${PA_PUBLIC_URL}
      GOOGLE_REDIRECT_URI: ${PA_PUBLIC_URL}/auth/callback
      MULTICA_VCS_INTEGRATION_ENABLED: "true"
    volumes:
      - backend_uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 768m

  # The web UI; it proxies /api, /auth, /v1 ... to the backend.
  frontend:
    image: ghcr.io/multica-ai/multica-web:v0.6.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      HOSTNAME: "0.0.0.0"
      REMOTE_API_URL: http://backend:8080
    ports:
      - "3000:3000"
    mem_limit: 768m

volumes:
  pgdata: {}
  backend_uploads: {}
