# yaml-language-server: $schema=../../../_schema.json
description: >-
  Emoncms, the OpenEnergyMonitor web app for logging and graphing energy,
  temperature and other sensor data: plain PHP on MySQL, served by the
  engine's PHP platform (detection was already right).

  The plain deploy answered 200 with Emoncms's own hard stop, "missing
  settings file: Create a settings.ini file from a example.settings.ini
  template" (process_settings.php). Emoncms reads its database only from
  settings.ini or settings.php; settings.env.ini's {{MYSQL_HOST}} placeholders
  are never expanded (ini_check_envvars is commented out).

  The recipe asks for a MySQL database (`database: mysql`) and installs
  settings.php (example.settings.php's format) reading the DB_* credentials
  the engine hands the container. Emoncms creates its tables on the first
  request (db_schema_setup). Feed data (PHPFina/PHPTimeSeries files) and the
  log go to /var/opt/emoncms on the named volume emoncms-data; a one-shot
  data-init service creates the directories owned by the account's uid, since
  the app runs unprivileged. Redis and MQTT stay off, as upstream defaults.
  The first account registered on the login page is the administrator.
extends: php
database: mysql
