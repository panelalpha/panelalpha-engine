# yaml-language-server: $schema=../../../_schema.json
description: >-
  Clonarr syncs TRaSH Guides quality profiles and custom formats to Radarr and
  Sonarr: one Go binary with its web UI and API on :6060 and all state in
  /config. The repository ships only a Dockerfile; this recipe runs the
  published image pinned to the current release v3.4.0 with /config on a
  named volume.

  With no admin Clonarr sends every visitor to /setup, where the first one
  owns the instance, and by default it skips the login for private addresses,
  which is where the engine's proxy connects from. A one-shot `seed` service
  starts Clonarr privately against the same volume, creates the admin through
  /setup with the login the engine generates (`credentials:` below, written to
  ~/.panelalpha/app-credentials.env) and sets Authentication Required to
  Enabled; only then does the app service publish its port. TRUSTED_NETWORKS
  is locked to loopback. Radarr/Sonarr instances are added at runtime from
  Settings. The login is returned by GET /projects/{name}/app-credentials;
  accounts deployed before this kept it in ~/.panelalpha/clonarr/admin.env,
  which `adopt_from` carries over.

  Login attempts are rate limited per visitor: TRUSTED_PROXIES covers the
  account's Docker bridges, so Clonarr keys on the last X-Forwarded-For hop,
  the one the engine's vhost adds. Behind a further proxy (a CDN, or the
  *.panelalpha.online test edge) that hop is the proxy and all visitors share
  one bucket of 5 attempts a minute.
credentials:
  login_path: /login
  adopt_from: .panelalpha/clonarr/admin.env
  fields:
    CLONARR_ADMIN_USER: {kind: username, value: admin}
    CLONARR_ADMIN_PASSWORD: {kind: password}
