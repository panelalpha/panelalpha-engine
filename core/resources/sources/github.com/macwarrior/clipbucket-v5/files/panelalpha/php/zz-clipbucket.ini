; Written by PanelAlpha, and read because the compose override points
; PHP_INI_SCAN_DIR at this directory as well as the image's own conf.d. The
; shared PHP base image loads no php.ini at all -- `php --ini` answers
; "Loaded Configuration File: (none)" -- so what is in force without this file
; is PHP's compiled-in defaults (engine#185).
;
; On a video-sharing site those defaults are not untidy, they are fatal.

; The whole product is uploading a video, and the compiled-in defaults are
; upload_max_filesize = 2M and post_max_size = 8M.
;
; Be precise about what that does and does not break, because the obvious claim
; is wrong: ClipBucket V5 chunks by default (`enable_chunk_upload` = 'yes',
; `chunk_upload_size` = 2 in cb_install/sql/configs.sql), so the uploader posts
; 2 MB at a time and a 2 GB video would in fact go up under an 8M
; post_max_size. What the defaults break is everything around that:
;
;   - FileUpload::getMaxUploadSize() takes min(post_max_size,
;     upload_max_filesize) and that becomes the limit the upload form
;     advertises and checkUploadedSize() enforces -- so with the defaults an
;     account's videos are capped at 2 MB the moment an administrator turns
;     chunking off, which the admin area offers as a checkbox;
;   - System::check_global_configs() compares the admin area's own
;     `max_upload_size` (1000, i.e. 1 GB) against min(post_max_size,
;     upload_max_filesize) and declares the hosting misconfigured when it does
;     not fit (system.class.php:667-679), which is a banner on every admin page
;     rather than a working default.
;
; 2048M rather than something round: this is the ceiling a hosting account
; gets, and the operative limit is the account's disk and the admin area's own
; `max_upload_size`, which an administrator can lower and which ClipBucket
; enforces itself. Upstream's own docker/nginx-clipbucket.conf ships
; client_max_body_size 2M, which is a bug in their example rather than a policy.
upload_max_filesize = 2048M
post_max_size = 2048M

; Receiving two gigabytes through PHP's upload handler takes longer than the
; compiled-in 30 seconds, and max_input_time is what limits the *receive*, not
; max_execution_time.
;
; 7200 is not a guess and not a round number: System::check_global_configs()
; treats anything between 1 and 7199 as a broken hosting configuration
; (includes/classes/system.class.php:661-664) and returns false, which puts a
; permanent "your server is misconfigured" banner across every admin page
; (includes/admin_config.php:45-51). Measured at 600 and confirmed: the banner
; is there. Upstream's own nginx example sets fastcgi_read_timeout 7200s for
; the same reason -- an upload is synchronous and can be a gigabyte. The cost
; is that a wedged request can hold an Apache worker for two hours; the
; container is one account's own, so that is their worker to lose.
max_execution_time = 7200
max_input_time = 3600

; The upload request itself is cheap -- PHP streams the body to a temporary file
; -- but the same SAPI resizes thumbnails and posters with gd afterwards, and
; the CLI side runs the conversion driver. 128M is the compiled-in default and
; is not enough for a poster frame out of a 4K source.
memory_limit = 512M

; engine#185's other half. The base image leaves display_errors on, and
; ClipBucket is a 2007-vintage codebase with plenty of undefined-index notices
; left in it -- rendered into the middle of a page they are both ugly and
; informative to the wrong reader. Diagnostics belong in the container's error
; log, which the vhost already points at stderr.
;
; expose_php cannot be fixed from here: it is PHP_INI_SYSTEM, so this file can
; set it but only because PHP_INI_SCAN_DIR files are read at startup -- and it
; is set, below, because that is the one place it can be.
display_errors = Off
log_errors = On
expose_php = Off

; The container's clock is UTC. ClipBucket compares the web and CLI SAPIs'
; current time during its own precheck and complains when they disagree, and
; with no php.ini at all neither SAPI has a default set.
date.timezone = UTC

; Videos are large and slow. ClipBucket's uploader posts one file per request,
; but the video form also carries a thumbnail, a poster and a backdrop.
max_file_uploads = 20

; What php.ini-production sets and the base image, having no php.ini at all,
; leaves at the compiled-in On.
;
; It is defence in depth rather than a fix for something live, and the
; distinction is worth writing down because the first reading of this looks
; alarming. ClipBucket ships CLI-only entry points *inside the document root*
; with no php_sapi_name() guard on them -- actions/video_convert.php and
; actions/verify_converted_videos.php both begin `$argv[1] ?? false` -- and
; with register_argc_argv on, a query string containing no '=' is split on '+'
; into argv. Measured on a live deploy: `GET /pa-probe.php?x+hello` gives
; $_SERVER['argv'] == ['x','hello'] but leaves the *global* $argv NULL, because
; the Apache module populates only the superglobal. So `$argv[1]` is null,
; those scripts die() on their own first line, and nothing is reachable. Under
; the CGI and FPM SAPIs the global is populated, and then
; `/actions/video_convert.php?x+<file_name>` would reach the conversion driver
; unauthenticated with a file_name that is in the page HTML of every video.
; Off costs nothing here and makes that inert whatever SAPI the platform moves
; to. ClipBucket's own CLI workers are unaffected: the CLI SAPI always builds
; argv regardless of this setting.
register_argc_argv = Off
