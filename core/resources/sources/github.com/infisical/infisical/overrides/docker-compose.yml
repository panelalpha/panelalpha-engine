# Compose-replace: the repo's root Dockerfile is a from-source build that runs out
# of memory in the account. Upstream's docker-compose.prod.yml on the release image.
services:
  backend:
    image: infisical/infisical:v0.165.16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.panelalpha/infisical/app.env
    environment:
      NODE_ENV: production
      SITE_URL: ${PA_PUBLIC_URL}
      REDIS_URL: redis://redis:6379
      TELEMETRY_ENABLED: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/status').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1536m

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 128m

  db:
    image: postgres:14-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/infisical/db.env
    environment:
      POSTGRES_USER: infisical
      POSTGRES_DB: infisical
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 5s
      timeout: 10s
      retries: 30
    mem_limit: 384m

  # No-op gate: `compose up -d` returns once the backend (migrations first) answers /api/status.
  ready:
    image: redis:7
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 32m

volumes:
  pg_data: {}
  redis_data: {}
