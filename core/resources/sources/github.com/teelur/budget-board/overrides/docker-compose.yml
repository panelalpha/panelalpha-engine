# Compose-replace: the repo's compose.yml needs `--env-file compose.env` for
# POSTGRES_USER/POSTGRES_DATABASE. Same stack, current release v3.8.2, with the
# DB password generated once by hooks/prepare.sh.
services:
  budget-board-server:
    image: ghcr.io/teelur/budget-board/server:v3.8.2
    restart: unless-stopped
    environment:
      Logging__LogLevel__Default: Information
      CLIENT_ADDRESS: budget-board-client
      ASPNETCORE_HTTP_PORTS: "8080"
      POSTGRES_HOST: budget-board-db
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: budgetboard
      POSTGRES_USER: budgetboard
      AUTO_UPDATE_DB: "true"
      TZ: UTC
    env_file:
      # POSTGRES_PASSWORD, generated by hooks/prepare.sh.
      - ../.panelalpha/budget-board/db.env
    volumes:
      # ASP.NET data-protection keys, so sign-ins survive a redeploy.
      - keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      budget-board-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 768m

  budget-board-client:
    image: ghcr.io/teelur/budget-board/client:v3.8.2
    restart: unless-stopped
    environment:
      PORT: "6253"
      VITE_SERVER_ADDRESS: budget-board-server
      VITE_OIDC_ENABLED: "false"
      VITE_DISABLE_NEW_USERS: "false"
      VITE_DISABLE_LOCAL_AUTH: "false"
    ports:
      - "6253:6253"
    depends_on:
      budget-board-server:
        condition: service_healthy
    mem_limit: 128m

  budget-board-db:
    # Postgres cannot open a datadir from a newer major; keep upstream's 16.
    image: docker.io/library/postgres:16
    restart: unless-stopped
    command: ["-c", "timezone=UTC"]
    environment:
      POSTGRES_USER: budgetboard
      POSTGRES_DB: budgetboard
    env_file:
      - ../.panelalpha/budget-board/db.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetboard -d budgetboard -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 384m

volumes:
  db-data: {}
  keys: {}
