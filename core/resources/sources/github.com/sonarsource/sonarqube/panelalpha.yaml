# yaml-language-server: $schema=../../../_schema.json
description: >-
  SonarQube Community Build, the static-analysis server: a JVM web server,
  compute engine and embedded Elasticsearch on port 9000, with PostgreSQL as
  its database.

  The repository is the Gradle source tree with no Dockerfile or compose file;
  a plain deploy builds it with Gradle and nothing ever listens. This recipe
  runs upstream's published image of the current release,
  sonarqube:26.9.0.129388-community, with postgres:17-alpine. The database
  password is generated per account by the engine (SONAR_DB_PASSWORD) and
  kept across redeploys. Data, extensions and logs are on named volumes, and
  the Elasticsearch ulimits are upstream's documented values. A `ready` gate
  makes the deploy finish only once /api/system/status reports UP.

  A new database gets SonarQube's built-in admin with the password `admin`,
  which nobody deploying it is told and anyone with the address could use
  (the first sign-in only asks to change it). So the engine generates a login
  (`credentials:` below, returned by GET /projects/{name}/app-credentials)
  and the one-shot `admin-login`, once SonarQube reports UP, sets it on that
  admin through SonarQube's own web API
  (files/panelalpha/sonarqube/set-admin-login.sh), only while the admin still
  has the default password: a password changed in SonarQube is never
  touched. The password has a symbol, as SonarQube's password policy demands.
credentials:
  login_path: /sessions/new
  fields:
    SONARQUBE_ADMIN_USERNAME: {kind: username}
    SONARQUBE_ADMIN_PASSWORD: {kind: password, symbol: true}
