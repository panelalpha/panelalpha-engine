# Front proxy for Plex Media Server (see overrides/docker-compose.yml).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plex treats a request as local, and an unclaimed server as open to it, when
# the Host is one it recognises: an IP literal, a single label (localhost, its
# container name), an empty Host or *.plex.direct. Those never reach it.
map $host $plex_host {
    default              $host;
    ""                   plex.invalid;
    ~^[^.]+\.?$          plex.invalid;
    ~^[0-9.]+$           plex.invalid;
    ~^\[                 plex.invalid;
    ~\.plex\.direct\.?$  plex.invalid;
}

# The engine's proxy appends the visitor's address last; trust only that hop
# (set_real_ip_from is written by hooks/prepare.sh).
include /etc/nginx/plex-trusted-proxy.conf;
real_ip_header X-Forwarded-For;

server {
    listen 32400;
    client_max_body_size 0;
    resolver 127.0.0.11 valid=10s;
    set $pms http://pms:32400;

    # Claiming goes through PLEX_CLAIM only, never through the web.
    location = /myplex/claim {
        return 403;
    }

    location / {
        proxy_pass $pms;
        proxy_http_version 1.1;
        proxy_set_header Host $plex_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
