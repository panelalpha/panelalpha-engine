# packages/twenty-docker/docker-compose.yml on a pinned release, with the
# public URL and generated secrets its .env would hold.
services:
  server:
    image: twentycrm/twenty:v2.43.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    # PG_DATABASE_URL and ENCRYPTION_KEY (hooks/prepare.sh).
    env_file: ../.panelalpha/twenty/secrets.env
    environment:
      NODE_PORT: "3000"
      SERVER_URL: ${PA_PUBLIC_URL}
      REDIS_URL: redis://redis:6379
      STORAGE_TYPE: local
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/healthz"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 60
    mem_limit: 1536m

  worker:
    image: twentycrm/twenty:v2.43.0
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    env_file: ../.panelalpha/twenty/secrets.env
    environment:
      SERVER_URL: ${PA_PUBLIC_URL}
      REDIS_URL: redis://redis:6379
      STORAGE_TYPE: local
      # The server runs migrations and registers the cron jobs.
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    mem_limit: 1024m

  db:
    image: postgres:16
    restart: unless-stopped
    env_file: ../.panelalpha/twenty/secrets.env
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: twenty
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twenty -h localhost -d twenty"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 256m

  # `up -d` returns once the server has migrated and answers /healthz.
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      server:
        condition: service_healthy
    mem_limit: 32m

volumes:
  db-data: {}
  server-local-data: {}
  redis-data: {}
