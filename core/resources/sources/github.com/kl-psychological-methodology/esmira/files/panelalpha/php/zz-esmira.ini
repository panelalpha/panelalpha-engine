; PanelAlpha ESMira recipe. Reached through PHP_INI_SCAN_DIR, which the compose
; override points at this directory; the base image itself loads no php.ini at
; all (engine #185), so without this file PHP runs on its compiled-in defaults.
;
; `zz-` so it sorts after the image's own docker-php-ext-*.ini files, which are
; in the first directory on the scan path.

; The defaults are display_errors=On and expose_php=On, and ESMira does not
; override either: nothing in dist/index.php, dist/index_nojs.php or
; dist/api/*.php calls ini_set('display_errors'), and its own error handling is
; Main::reportError(), which writes the trace into the data folder for the
; administrator rather than into the response. So on the compiled-in defaults a
; PHP warning prints the account's absolute paths -- and, in the API handlers,
; prints them *into the JSON body* the phone client parses.
display_errors = Off
display_startup_errors = Off
log_errors = On
; The container's stderr, which is where the engine's deploy log and
; `docker logs` already look.
error_log = /dev/stderr
expose_php = Off

; The session cookie carries a logged-in researcher's whole authority: every
; api/admin.php feature outside the `//no permission:` block is gated on
; $_SESSION (backend/Permission.php:47-53). ESMira sets SameSite=Strict on its
; own cookies (Main::setCookie()) but PHP's session cookie is not one of those,
; so it is set here.
session.cookie_httponly = On
session.cookie_samesite = Strict
; Deliberately *not* session.cookie_secure. The container is plain HTTP behind
; the engine's proxy and the account's public URL is HTTPS, so Secure would be
; correct for the browser -- but it would also lock out an operator reaching
; the container directly on :8000, and the recipe cannot see which of the two
; this account is. The proxy is what terminates TLS and it is not optional.

; ESMira loads a study's whole response file to chart or export it
; (ResponsesStoreFS), and its own default ceiling for a file it will rewrite in
; place is 1 GB (max_filesize_for_changes, backend/defaults/configs.default.php).
; PHP's compiled-in 128M is below anything that ceiling implies. 256M is a
; compromise: enough for a study with a few thousand responses, and well inside
; the 512m the compose override gives the container.
memory_limit = 256M

; Upload limits are NOT set here. dist/.htaccess carries
;   php_value post_max_size 300M
;   php_value upload_max_filesize 300M
; and those are upstream's numbers for participant photo and audio uploads.
; They work because the base image is php:*-apache, i.e. mod_php, where
; php_value is a valid Apache directive -- checked on the deploy. Setting them
; here as well would just be a second, quieter copy of the same numbers.
