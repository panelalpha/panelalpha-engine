# Replaces the source build (default branch v5-develop, which does not build
# under the engine). Servarr publishes no image of its own; this runs the
# LinuxServer.io build of the current stable v4 release.
services:
  app:
    image: linuxserver/sonarr:4.0.20
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      # Env wins over config.xml and the UI. Forms login is always on, and never
      # relaxed for "local addresses": behind the proxy every client is local.
      SONARR__AUTH__METHOD: Forms
      SONARR__AUTH__REQUIRED: Enabled
      SONARR__SERVER__PORT: "8989"
      SONARR__SERVER__BINDADDRESS: "*"
      SONARR__SERVER__URLBASE: ""
    volumes:
      # config.xml (API key) and sonarr.db (login user, series, settings).
      - sonarr-config:/config
      # Library root folder for Settings > Media Management.
      - sonarr-tv:/tv
    ports:
      - "8989:8989"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8989/ping"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 15s
    mem_limit: 1g

  # Sets the login user once through Sonarr's own API, then exits. Same image:
  # it already has curl, jq and xmlstarlet.
  seed:
    image: linuxserver/sonarr:4.0.20
    restart: "no"
    entrypoint: ["/bin/sh", "/panelalpha-seed.sh"]
    # SONARR_ADMIN_USER / SONARR_ADMIN_PASSWORD, generated and kept by the engine.
    env_file:
      - ../.panelalpha/app-credentials.env
    volumes:
      - sonarr-config:/config:ro
      - sonarr-tv:/tv
      - ./panelalpha-seed.sh:/panelalpha-seed.sh:ro
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m

  # No-op gate: `up -d` returns only after the app is healthy and seeded.
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      seed:
        condition: service_completed_successfully
    mem_limit: 32m

volumes:
  sonarr-config: {}
  sonarr-tv: {}
