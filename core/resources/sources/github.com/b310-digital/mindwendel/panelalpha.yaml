# yaml-language-server: $schema=../../../_schema.json
description: >-
  Mindwendel is a self-hosted brainstorming tool: someone creates a
  "brainstorming" board, shares its secret link, and anyone with the link adds
  ideas, likes them and sorts them into lanes. It is an Elixir/Phoenix
  (LiveView) app backed by PostgreSQL, delivered as one official image
  (ghcr.io/b310-digital/mindwendel). This recipe is the compose-REPLACE pattern
  (cannery/calcom/n8n): no platform block is declared, so detection runs via
  fromWalk and engine#221 does not bite; ComposePlaceholders rewrites the one
  *_URL value below to the account's public https address.

  IMAGE, MATCHES HEAD. The tracker Repository URL resolves to the repo's default
  branch (HEAD f2a09183, 2026-08-05). Upstream publishes an official prebuilt
  image and the recipe pulls it rather than building the Elixir clone (a source
  build is a multi-stage Debian+Node+Elixir compile, slow and heavy). It pins
  `ghcr.io/b310-digital/mindwendel:latest`, which is byte-identical to the
  `master` tag and is built from the same default branch the engine clones, so
  the image matches the source -- it is newer than the last release tag v0.4.7
  and carries the same elixir/otp/debian upgrade (#743) that is HEAD. The tag is
  overridable with MINDWENDEL_IMAGE.

  WHAT THE RECIPE SUPPLIES. Mindwendel's own docker-compose-prod.yml is an
  operator template: an SSL-only postgres:15 that needs a self-signed cert
  generated by hand, a minio object store, and every secret left blank with
  `:?` so `docker compose up` aborts until HOST, SECRET_KEY_BASE, the DB
  password and (with uploads on) a VAULT key and S3 credentials are all
  supplied. This override replaces it with a working stack: a postgres:16-alpine
  sidecar on a NAMED volume (survives project_rebuild and storage reclaim; only
  account deletion / failed-deploy rollback wipe it), the official app image,
  and a `ready` gate (engine#204) so `docker compose up -d` returns only once
  the site actually answers on :4000. Migrations are not a separate step: the
  image's own /app/bin/server waits for the database (pg_isready) then runs
  Mindwendel.Release.migrate before starting Phoenix, so the schema is created
  in-container on boot, gated behind the db healthcheck.

  DATABASE OVER PLAIN TCP. config/runtime.exs defaults DATABASE_SSL to "true";
  the sidecar speaks plain TCP on the compose network, so the recipe sets
  DATABASE_SSL=false (the same choice upstream documents for a co-located db) and
  no server certificate is generated. Mindwendel reads discrete DATABASE_HOST /
  _PORT / _NAME / _USER / _USER_PASSWORD (not a DSN); the password is the only
  secret and is persisted, the rest are fixed compose service coordinates.

  SECRETS, PERSISTED ONCE. hooks/prepare.sh generates and stores
  SECRET_KEY_BASE (64 bytes) and the database password under
  ~/.panelalpha/mindwendel/ (0600 in 0700), the only writable place a deploy
  does not delete (~/project is emptied every redeploy, engine#173). A rebuild
  reuses them: a new SECRET_KEY_BASE would log every board-holder's session out,
  a new DB password would lock the app out of the pgdata volume that still holds
  the old one. URL_HOST cannot be baked in -- it is the account domain, unknown
  until deploy -- so the app entrypoint derives it from PA_PUBLIC_URL (rewritten
  by the engine to the account's public https URL) by stripping the scheme,
  because Phoenix's URL_HOST is a bare hostname, not a URL, and drives every
  generated link and the LiveView check_origin.

  ACCESS MODEL: SECRET-LINK BOARDS, NO LOGIN, NO GLOBAL ADMIN. Mindwendel has no
  user accounts. A board's id and its separate admin_url_id are both v4 UUIDs
  (Ecto.UUID, binary_id primary key) -- unguessable and not enumerable. Viewing
  or contributing needs the board link `/brainstormings/<uuid>`; editing/deleting
  the board needs the admin link `/admin/brainstormings/<admin_url_id>`, shown
  only to the creator. The home page `/` lists ONLY the boards the visitor
  created (kept in that browser's localStorage/session), never a global list, and
  there is no site-wide admin surface or all-boards listing. This is the
  share-link (token-gated) model, acceptable like an unlisted link; it is NOT a
  no-auth app that world-lists private data. Verified: a board created with one
  link is not reachable by guessing another id.

  FILE UPLOAD OFF BY DEFAULT (NEEDS S3). Attaching files to ideas
  (MW_FEATURE_IDEA_FILE_UPLOAD) is the one feature that needs an S3/MinIO object
  store plus a Cloak VAULT_ENCRYPTION_KEY_BASE64; runtime.exs raises on boot if
  the feature is on and any OBJECT_STORAGE_* or the vault key is missing. The
  panel hosts no object store, so the recipe defaults the flag to false: the
  whole brainstorming surface -- create board, add/like/sort ideas, lanes,
  labels, CSV export, board admin -- works fully; only per-idea file attachments
  are off. An operator who runs their own S3 can set MW_FEATURE_IDEA_FILE_UPLOAD
  and the OBJECT_STORAGE_* + VAULT_ENCRYPTION_KEY_BASE64 vars to enable it. This
  is configuration, not repair.

  DATA IS RELATIONAL. Boards, ideas, likes, lanes and labels all live in
  Postgres; with uploads off nothing is written to the app filesystem, so the
  Postgres named volume is the whole persistence surface and no bind mount is
  needed. VERIFIED end to end on this engine: deploy, create a board, add an
  idea, read it back, confirm the board URL uses the account domain, confirm
  boards are not enumerable, and survive a rebuild -- board and idea persist.

  ENGINE CAVEAT (NOT A RECIPE FAULT). Mindwendel's UI is Phoenix LiveView, which
  needs a WebSocket for live idea add/like. The app upgrades /live/websocket
  directly and through the engine's own proxy, so check_origin and URL_HOST are
  correct; but the shared panelalpha.online (WithoutDNS) tunnel may not carry the
  upgrade, in which case live edits stall while dead-render reads still work.
  On an account with its own domain pointed straight at the engine the LiveView
  UI works. This is the WebSocket analogue of the engine#170 tunnel caveat, an
  engine/tunnel limitation to report, not a recipe or app failure.
