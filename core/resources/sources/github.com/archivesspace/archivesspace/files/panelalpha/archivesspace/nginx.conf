# Upstream's proxy/default.conf.docker.release routing: the public UI at /,
# the staff UI at /staff/. TLS ends at the engine, so the scheme is https.
upstream app_public { server app:8081; }
upstream app_staff { server app:8080; }

server {
  listen 80;
  server_name _;
  charset utf-8;
  client_max_body_size 16M;

  proxy_buffer_size       128k;
  proxy_buffers           4 256k;
  proxy_busy_buffers_size 256k;
  proxy_http_version 1.1;

  proxy_set_header        Host               $host;
  proxy_set_header        X-Forwarded-For    $proxy_add_x_forwarded_for;
  proxy_set_header        X-Forwarded-Host   $host;
  proxy_set_header        X-Forwarded-Server $host;
  proxy_set_header        X-Forwarded-Proto  https;
  proxy_set_header        X-Real-IP          $remote_addr;

  location / {
    proxy_pass http://app_public;
  }

  location /staff/ {
    proxy_pass http://app_staff;
  }
}
