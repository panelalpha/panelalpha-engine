# Compose-replace: the repository's docker-compose.yml is a developer
# environment (Dev.dockerfile, source bind mount, test databases). This runs
# upstream's published release images the way docker-compose-prod.yml does.
services:
  db:
    image: docker.io/library/mysql:8.4
    restart: unless-stopped
    env_file:
      - ../.panelalpha/archivesspace/db.env
    environment:
      MYSQL_DATABASE: archivesspace
      MYSQL_USER: as
    # Upstream's flags, with a 256 MB buffer pool instead of 1 GB.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb_buffer_pool_size=256M --innodb_buffer_pool_instances=1 --log_bin_trust_function_creators=1
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  solr:
    image: docker.io/archivesspace/solr:4.2.1
    restart: unless-stopped
    environment:
      # 512 MB heap instead of upstream's 1 GB, so the stack fits in 4 GB.
      SOLR_JAVA_MEM: -Xms512m -Xmx512m
    command:
      - solr-precreate
      - archivesspace
      - /opt/solr/server/solr/configsets/archivesspace
    volumes:
      - solr-data:/var/solr

  app:
    image: docker.io/archivesspace/archivesspace:4.2.1
    restart: unless-stopped
    env_file:
      - ../.panelalpha/archivesspace/app.env
    environment:
      ASPACE_DB_MIGRATE: "true"
      # The launcher's own default heap (docker-compose-prod.yml's 2 GB does
      # not fit beside Solr and MySQL in a 4 GB account).
      ASPACE_JAVA_XMX: -Xmx1024m
      JAVA_OPTS: -Djava.awt.headless=true -Dfile.encoding=UTF-8 -server -Xss1024k
      APPCONFIG_SOLR_URL: http://solr:8983/solr/archivesspace
      APPCONFIG_FRONTEND_PROXY_URL: ${PA_PUBLIC_URL}/staff/
      APPCONFIG_PUBLIC_PROXY_URL: ${PA_PUBLIC_URL}/
    volumes:
      - app-data:/archivesspace/data
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_started
    healthcheck:
      # GET, not --spider: the staff app has no HEAD route.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/ && wget -q -O /dev/null http://127.0.0.1:8080/staff/"]
      interval: 15s
      timeout: 10s
      # First boot (migrations, indexer) took ~7 min; stay under the
      # engine's 900 s no-output limit on `compose up`.
      retries: 40
      start_period: 120s

  proxy:
    image: docker.io/library/nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./panelalpha/archivesspace/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app
    mem_limit: 64m

  # No-op gate: `up` returns only once both web UIs answer.
  ready:
    image: docker.io/library/alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
      proxy:
        condition: service_started
    mem_limit: 32m

volumes:
  db-data: {}
  solr-data: {}
  app-data: {}
