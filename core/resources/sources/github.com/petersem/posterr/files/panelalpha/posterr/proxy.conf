# The only thing on the account's port. Posterr's own settings "login" is a
# client-side redirect: GET /settings renders the password and every Plex/*arr
# token into the HTML, and POST /settings saves without any check. So every path
# needs HTTP Basic except the poster wall a display screen loads anonymously.
server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 20m;

    # Per-request lookup, so nginx never pins a stale address for `app`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $posterr app:3000;

    auth_basic           "Posterr";
    auth_basic_user_file /etc/nginx/posterr-auth/htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Authorization     "";

    # Default: settings, logon, debug and anything unlisted.
    location / {
        proxy_pass http://$posterr$request_uri;
    }

    # Public poster wall: the page, its two polling endpoints, the sleep status.
    location = / {
        auth_basic off;
        proxy_pass http://$posterr$request_uri;
    }
    location = /getcards {
        auth_basic off;
        proxy_pass http://$posterr$request_uri;
    }
    location = /conncheck {
        auth_basic off;
        proxy_pass http://$posterr$request_uri;
    }
    location = /api/sleep {
        auth_basic off;
        # POST sleeps/wakes the wall; only reading the state is anonymous.
        limit_except GET {
            auth_basic           "Posterr";
            auth_basic_user_file /etc/nginx/posterr-auth/htpasswd;
        }
        proxy_pass http://$posterr$request_uri;
    }
    # Static assets and the poster/theme caches the wall displays.
    location ~ ^/(css|js|images|favicons|webfonts|webfontkit|custom|imagecache|mp3cache|randomthemes)/ {
        auth_basic off;
        limit_except GET { deny all; }
        proxy_pass http://$posterr$request_uri;
    }
}
