# The tracker home (config.ini with the session secret, schema.py, the sqlite
# db, uploaded attachments) is the data and must outlive a redeploy. Bind it to
# ~/.panelalpha/roundup, the tree the wipe leaves alone; hooks/prepare.sh writes
# the absolute host path to .env as ROUNDUP_DATA. The :- default names the same
# directory relative to ~/project, for when compose runs before that write; an
# absolute /root path would be refused by the hardener.
services:
  app:
    volumes:
      - ${ROUNDUP_DATA:-../.panelalpha/roundup}:/data
