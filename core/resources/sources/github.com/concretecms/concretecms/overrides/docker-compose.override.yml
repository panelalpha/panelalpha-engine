# Layers over the compose file the php strategy generates. That file is right
# about the app -- the shared PHP base image, ~/project bind-mounted at /app,
# the account's own uid, PA_DOCROOT=/app (there is no public/ here), Apache on
# 8000, APP_URL from the account's main domain and DB_* from the database
# `database: mysql` asked the engine to provision -- and it cannot know three
# things: where this account's generated password is kept, which of Concrete's
# directories hold data rather than code, and when Concrete is ready.
#
# An override rather than a replacement compose file, and here that is not a
# preference: an `overrides/docker-compose.yml` is written into the checkout
# *before* detection runs, so a compose file in the project root would make
# Concrete look like a compose project and take the php strategy -- and with it
# the bind mount, the docroot, the Composer pass and the staged entrypoint --
# off the table entirely.
services:
  app:
    # The second env_file is the whole reason this file has one at all. The
    # administrator password is generated once per account by hooks/prepare.sh
    # and must be the same on every deploy, so it cannot live in ~/project --
    # which is re-cloned each time -- and it must not live in .env, which
    # ProjectEnvironment::apply() copies to a world-readable .env.default
    # (engine#173). It is read from ~/.panelalpha/concrete/concrete.env at 0600
    # instead.
    #
    # `.env` is restated rather than left to be inherited: Compose merges some
    # sequences across files and replaces others, and naming both is correct
    # under either rule. The path is relative to the project directory, which
    # is ~/project, so `..` is the account's home.
    env_file:
      - .env
      - ../.panelalpha/concrete/concrete.env

    # Everything Concrete writes that is data rather than code. All three are
    # inside the checkout by default, and
    # GitRepository::cloneConfiguredRepository() empties ~/project before every
    # deploy (engine#173) -- so without these a redeploy is a factory reset
    # that leaves the database behind: the site would come back pointing at its
    # own data with no credentials to reach it and no files to serve.
    #
    # Created and owned by hooks/prepare.sh. A bind mount whose source does not
    # exist is created by the daemon as root, and this container runs as the
    # account.
    volumes:
      # database.php (the connection), generated_overrides/ (every setting
      # changed from the dashboard, and the installed schema version), and
      # doctrine/ (generated entity proxies). The repository ships this
      # directory containing one .gitignore, so nothing of the checkout's is
      # shadowed.
      - ../.panelalpha/concrete/config:/app/application/config
      # The file manager: every uploaded image and document, their generated
      # thumbnails, and Concrete's own file cache. This is the one that makes a
      # redeploy survivable rather than merely non-fatal.
      - ../.panelalpha/concrete/files:/app/application/files
      # Add-ons and themes installed from the marketplace. Empty in the
      # repository (one .gitignore); a package installed here has rows in the
      # database that a redeploy would otherwise leave pointing at nothing.
      - ../.panelalpha/concrete/packages:/app/packages

    # ServiceLimits caps an app-role service it did not write at 384m.
    # c5:install builds ~250 tables and imports a starting point in a single
    # process, and panelalpha/concrete-setup.sh asks PHP for 512M to do it; a
    # container ceiling below that turns the overrun into a kill rather than an
    # error message. In an override the line reaches Docker as written -- the
    # hardener never sees it. Measured steady-state after the install is ~120
    # MB with an idle Apache; the headroom is for the install and for image
    # manipulation in the file manager.
    mem_limit: 768m

    # The install stage does all of Concrete's setup before Apache binds: the
    # connection file, the schema, the starting point, the administrator. The
    # engine runs `docker compose up -d` without --wait and probes as soon as
    # it returns, which is while that is still going: nothing is listening and
    # the probe reads `Failed to connect to 127.0.0.1 port 8000` (engine#90).
    #
    #   1. GET /       the home page of the starting point, rendered through
    #                  the theme. A 200 means the schema exists, Concrete
    #                  booted against it and the theme compiled. An
    #                  *uninstalled* Concrete answers this with a 302 to
    #                  /install, and `curl -f` does not fail on a 302, which
    #                  is why there is a second request.
    #   2. GET /login  Concrete's own sign-in form. It is a real page only on
    #                  an installed site; on an uninstalled one it is another
    #                  redirect to the installer. A 200 here is the check that
    #                  the site is not sitting open waiting to be claimed.
    #
    # `-L` is deliberately absent: a redirect must not be followed, because
    # following it is exactly how an uninstalled site would pass.
    # Host is 127.0.0.1:8000 for both, as it is for AppHealth's own probe;
    # Concrete does not validate the request host.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null --max-time 30 http://127.0.0.1:8000/ &&
          curl -fsS -o /dev/null --max-time 30 http://127.0.0.1:8000/login
      interval: 10s
      timeout: 40s
      retries: 30
      # The install on two slow cores. A failing check inside this window
      # neither counts against retries nor marks the container unhealthy.
      start_period: 300s

  # Does nothing and exits 0. Compose does not wait for a healthcheck on its
  # own, but it does block on a `depends_on` health condition -- so a service
  # that waits for the app is what makes `up -d` return only once Concrete has
  # built its schema, created its administrator and answered, and what the
  # health probe then meets. A clean exit 0 is not a crash loop as far as
  # AppHealth::isCrashing() is concerned.
  #
  # alpine:3 and not, say, the MySQL image: a datastore image here makes
  # RuntimeSidecars read this file as declaring a service the app depends on,
  # and the generated compose then has app -> ready -> app.
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
