# tracksapp/tracks 2.7.1 (current release) on MariaDB, following upstream's
# docker install docs; secrets from ~/.panelalpha (hooks/prepare.sh).
x-tracks-env: &tracks-env
  RAILS_ENV: production
  DATABASE_HOST: db
  DATABASE_NAME: tracks
  DATABASE_USERNAME: tracks

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    env_file:
      - ../.panelalpha/tracks/app.env
    environment:
      MARIADB_DATABASE: tracks
      MARIADB_USER: tracks
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 384m

  # One-shot: the image never migrates. Load the schema into an empty database
  # (upstream's `rake db:reset` step, without the drop), otherwise migrate.
  migrate:
    image: tracksapp/tracks:2.7.1
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.panelalpha/tracks/app.env
    environment: *tracks-env
    command:
      - sh
      - -c
      - |
        if bin/rake db:version | grep -q 'Current version: 0$$'; then
          bin/rake db:schema:load
        else
          bin/rake db:migrate
        fi
    mem_limit: 512m

  web:
    image: tracksapp/tracks:2.7.1
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ../.panelalpha/tracks/app.env
    environment: *tracks-env
    # A restarted container keeps Puma's pid file, and Rails then refuses to boot.
    command: ["sh", "-c", "rm -f tmp/pids/server.pid && exec ./bin/rails server -b 0.0.0.0"]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s
    mem_limit: 768m

  # No-op gate: `compose up -d` returns only once Tracks answers.
  ready:
    image: mariadb:11.8
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 32m

volumes:
  db_data: {}
