# Compose-replace: upstream's docker-compose.yml with the release image, data on
# named volumes (upstream keeps ./data in ~/project, which every deploy wipes),
# generated secrets from ~/.panelalpha, and a health gate. cap_drop/cap_add and
# read_only are left out: the engine keeps cap_drop but strips cap_add,
# and the entrypoint needs CHOWN/SETUID/SETGID to hand /data to the app user.
services:
  app:
    image: ghcr.io/bookorbit/bookorbit:3.1.0
    restart: unless-stopped
    init: true
    env_file:
      - ../.panelalpha/bookorbit/app.env
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: bookorbit
      POSTGRES_DB: bookorbit
      APP_URL: ${PA_PUBLIC_URL}
      TZ: UTC
    ports:
      - "3000:3000"
    volumes:
      - bookorbit_data:/data
      - bookorbit_books:/books
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Answers once migrations ran and the database is reachable.
      test: ["CMD-SHELL", "wget -q -T 4 -O /dev/null http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g
    stop_grace_period: 30s

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    env_file:
      - ../.panelalpha/bookorbit/db.env
    environment:
      POSTGRES_USER: bookorbit
      POSTGRES_DB: bookorbit
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - bookorbit_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m

  # No-op: `compose up -d` returns once BookOrbit answers.
  ready:
    image: docker.io/library/alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  bookorbit_data: {}
  bookorbit_books: {}
  bookorbit_db: {}
