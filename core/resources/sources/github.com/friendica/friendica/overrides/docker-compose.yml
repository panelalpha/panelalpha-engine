# The official friendica image of the current stable release (2026.05) with
# MariaDB and the cron worker, as in upstream's docker stack.yml. The image
# installs itself (autoinstall) from FRIENDICA_ADMIN_MAIL + MYSQL_* + FRIENDICA_URL.
x-friendica: &friendica
  image: friendica:2026.05-apache
  restart: unless-stopped
  env_file:
    # FRIENDICA_ADMIN_MAIL and optional SMTP / FRIENDICA_* settings.
    - .env
    # MYSQL_PASSWORD, generated once by hooks/prepare.sh.
    - ../.panelalpha/friendica/db.env
  environment:
    MYSQL_HOST: db
    MYSQL_USER: friendica
    MYSQL_DATABASE: friendica
    FRIENDICA_URL: ${PA_PUBLIC_URL}
  volumes:
    - html:/var/www/html
    - data:/var/www/data

services:
  # One-shot: without FRIENDICA_ADMIN_MAIL the image falls back to the web
  # installer, which asks for the generated database password. Fail naming it.
  check:
    image: friendica:2026.05-apache
    restart: "no"
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$FRIENDICA_ADMIN_MAIL" ]; then
          echo "Error: set FRIENDICA_ADMIN_MAIL (the administrator's e-mail address) in the project's environment variables"
          exit 1
        fi
    mem_limit: 64m

  db:
    image: mariadb:11.8
    restart: unless-stopped
    env_file: ../.panelalpha/friendica/db.env
    environment:
      MARIADB_DATABASE: friendica
      MARIADB_USER: friendica
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 512m

  app:
    <<: *friendica
    ports:
      - "8080:80"
    depends_on:
      check:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 768m

  cron:
    <<: *friendica
    # Upstream's worker, started once the app is up and installed.
    entrypoint: ["/bin/sh", "-c", "until [ -f /var/www/html/config/local.config.php ]; do sleep 10; done; exec /cron.sh"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 384m

volumes:
  dbdata: {}
  html: {}
  data: {}
