# Operational from its published image of the current release. Upstream's
# docker/docker-compose.yml pins an older tag, hard-codes the database
# passwords and publishes the API on a second port; here the API is proxied
# under /backend/ on the app's own port.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: operational
      MYSQL_USER: operational
    env_file:
      - ../.panelalpha/operational/db.env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    # Idles at ~460 MiB with default buffers.
    mem_limit: 768m

  operational:
    image: ghcr.io/operational-co/operational.co:0.4.0
    restart: unless-stopped
    environment:
      APP_URL: ${PA_PUBLIC_URL}
      API_URL: ${PA_PUBLIC_URL}/backend
      VITE_API_URL: ${PA_PUBLIC_URL}/backend
      CORS: ${PA_PUBLIC_URL}
    env_file:
      - ../.panelalpha/operational/app.env
    ports:
      - "8080:80"
    volumes:
      - ./panelalpha/operational-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/monorepo/backend/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/backend/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 768m

  # No-op: holds `compose up -d` until migrations ran and the API answers.
  ready:
    image: mysql:8.4
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      operational:
        condition: service_healthy
    mem_limit: 64m

volumes:
  mysql-data: {}
  uploads: {}
