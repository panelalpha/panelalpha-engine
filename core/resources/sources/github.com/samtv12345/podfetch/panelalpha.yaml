# yaml-language-server: $schema=../../../_schema.json
description: >-
  PodFetch is a podcast downloader and player (SamTV12345/PodFetch, MIT): one
  Rust binary on :8000 serving the React UI under /ui/, the API under /api/v1
  and the downloaded episodes under /podcasts. SQLite database.

  == Why compose-replace from the published image ==

  The repo's docker-compose.yml runs samuel19982/podfetch:latest as
  `user: 1000:1000` on named volumes; the volumes start root-owned (the image
  ships /app/db as root), so the process cannot create podcast.db and exits
  101 in a restart loop - which is why a bare deploy never answered. It also
  runs with no authentication. This recipe runs the image of the current
  release, samuel19982/podfetch:v5.2.3, as the image's own user, with the
  database on podfetch-db (/app/db) and episodes on podfetch-podcasts
  (/app/podcasts).

  == What the recipe supplies ==

  1. hooks/prepare.sh writes, once, ~/.panelalpha/podfetch/auth.env
     (BASIC_AUTH=true, USERNAME=admin, PASSWORD=<generated>; 0600 in 0700)
     and credentials.txt. PodFetch's built-in auth creates and checks the
     admin from these on every start; nothing is reachable without it, and
     further users can only be onboarded through an admin-created invite.
  2. The server URL is derived per request from X-Forwarded-Host/-Proto, so
     no SERVER_URL is needed (the variable no longer exists upstream);
     /api/v1/sys/config reports https://<domain>/.
  3. The image has no shell, so it cannot healthcheck itself: `wait` (alpine)
     polls /ui/ and `ready` waits on it completing, so `up -d` returns only
     once PodFetch answers (engine#204).

  == Verified on 10.10.10.25 (engine 705f250a), memory_limit 2000 ==

  Deploy 54s. /ui/ title "Podfetch" (1036 B SPA shell, 392 KB JS bundle).
  Anonymous /api/v1/podcasts, /api/v1/users, /api/v1/sys/info, /rss 403;
  login with a wrong password 403, generated one 200; /users/me admin/admin.
  POST /api/v1/podcasts/feed with the NPR Planet Money RSS feed added the
  podcast; listed and its 75 episodes returned. Rebuild 32s: auth.env
  unchanged, same admin id, podcast and episodes still there. /.env,
  /.git/config, /db/podcast.db and /podcasts/../db/podcast.db 404. App
  ~12-22 MiB.

  Notes: auto-download is on by default (5 newest episodes per podcast, 154 MB
  for one feed), so disk use grows with subscriptions - tune it in Settings.
  Downloaded episode files under /podcasts/<podcast>/<episode>/ are served
  without auth by upstream design (external players, Chromecast); they are
  copies of public feeds, and there is no directory listing.

  Credentials: ~/.panelalpha/podfetch/credentials.txt. To change the admin
  password edit auth.env and redeploy.
