# yaml-language-server: $schema=../../../_schema.json
description: >-
  UpSnap, a Wake-on-LAN dashboard (Go + PocketBase, SvelteKit UI embedded in
  the binary). Upstream's docker-compose.yml runs the image with
  `network_mode: host` and publishes no port, so the engine has no port to
  proxy and the domain answers 502; its ./data bind mount also lives in
  ~/project, which every deploy wipes.
  This recipe runs the same release image, ghcr.io/seriousm4x/upsnap at the
  current release (5.7.2), on the account's bridge network with :8090
  published, Docker's default capabilities (they include NET_RAW, which
  upstream adds after cap_drop ALL; the engine strips cap_add but keeps
  cap_drop, so the upstream pair would leave none) and the
  PocketBase data directory (/app/pb_data) on a named volume. The first
  visit shows UpSnap's own welcome page, which creates the first admin, as
  upstream ships it. Wake-on-LAN magic packets and the network scan only
  reach the account's own container network, not the customer's LAN.
