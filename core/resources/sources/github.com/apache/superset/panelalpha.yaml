# yaml-language-server: $schema=../../../_schema.json
description: >-
  Apache Superset, data exploration and dashboards (Flask). A plain deploy
  builds the repository's Dockerfile and the frontend webpack build dies with
  "cannot allocate memory" in a 2500 MB account. This recipe runs upstream's
  docker-compose-image-tag.yml stack on the release image
  apache/superset:6.1.0: gunicorn, the one-shot superset-init (migrations,
  admin user, roles), the Celery worker and beat, Postgres 17 and Redis 7,
  with upstream's 6.1.0 docker/pythonpath_dev/superset_config.py.
  hooks/prepare.sh generates SUPERSET_SECRET_KEY and the database password
  once into ~/.panelalpha/superset/superset.env. Example datasets are not
  loaded (SUPERSET_LOAD_EXAMPLES=no). First run is upstream's: superset-init
  creates the account admin / admin.
