# The repository compose files build the checkout or run a dev stack; this is
# upstream's docker-compose-image-tag.yml on the release image, using the
# image's own docker/*.sh scripts and upstream's 6.1.0 superset_config.py.
x-superset-image: &superset-image apache/superset:6.1.0
x-superset-env: &superset-env
  DATABASE_DIALECT: postgresql
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DATABASE_DB: superset
  DATABASE_USER: superset
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SUPERSET_ENV: production
  FLASK_DEBUG: "false"
  SUPERSET_LOAD_EXAMPLES: "no"
  SUPERSET_LOG_LEVEL: info
  DEV_MODE: "false"
  PYTHONUNBUFFERED: "1"
x-superset-volumes: &superset-volumes
  - superset-home:/app/superset_home
  - ./panelalpha/superset_config.py:/app/pythonpath/superset_config.py:ro
# docker-bootstrap.sh skips the Postgres driver for the worker and beat.
x-celery-volumes: &celery-volumes
  - superset-home:/app/superset_home
  - ./panelalpha/superset_config.py:/app/pythonpath/superset_config.py:ro
  - ./panelalpha/requirements-local.txt:/app/docker/requirements-local.txt:ro

services:
  app:
    image: *superset-image
    # Root, as upstream: docker-bootstrap.sh installs the Postgres driver,
    # which the release image does not ship.
    user: "root"
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    restart: unless-stopped
    env_file:
      - ../.panelalpha/superset/superset.env
    environment: *superset-env
    ports:
      - "8088:8088"
    volumes: *superset-volumes
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s
    mem_limit: 1g

  superset-init:
    image: *superset-image
    user: "root"
    command: ["/app/docker/docker-init.sh"]
    restart: "no"
    env_file:
      - ../.panelalpha/superset/superset.env
    environment: *superset-env
    volumes: *superset-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    mem_limit: 1g

  superset-worker:
    image: *superset-image
    user: "root"
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    restart: unless-stopped
    env_file:
      - ../.panelalpha/superset/superset.env
    environment:
      <<: *superset-env
      CELERYD_CONCURRENCY: "1"
    volumes: *celery-volumes
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]
    mem_limit: 768m

  superset-worker-beat:
    image: *superset-image
    user: "root"
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    restart: unless-stopped
    env_file:
      - ../.panelalpha/superset/superset.env
    environment: *superset-env
    volumes: *celery-volumes
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    mem_limit: 384m

  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - ../.panelalpha/superset/superset.env
    environment:
      POSTGRES_USER: superset
      POSTGRES_DB: superset
    volumes:
      - superset-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 384m

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - superset-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 128m

  ready:
    image: docker.io/library/alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m

volumes:
  superset-home: {}
  superset-db: {}
  superset-redis: {}
