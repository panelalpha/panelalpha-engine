# Compose-replace: the repository's Dockerfile builds the web application from
# source with Maven. This runs upstream's published images of the current
# release: guacamole (Tomcat), guacd and PostgreSQL for authentication.
services:
  # One-shot: writes upstream's schema script (initdb.sh, as the image's
  # README documents) for PostgreSQL's first-init directory.
  initdb:
    image: docker.io/guacamole/guacamole:1.6.0
    restart: "no"
    user: root
    entrypoint: ["/bin/sh", "-c", "/opt/guacamole/bin/initdb.sh --postgresql > /initdb/initdb.sql"]
    volumes:
      - initdb:/initdb
    mem_limit: 256m

  database:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/guacamole/db.env
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
    volumes:
      - postgres:/var/lib/postgresql/data
      # Runs only on the first init (empty data directory).
      - initdb:/docker-entrypoint-initdb.d:ro
    depends_on:
      initdb:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "guacamole_user", "-d", "guacamole_db"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 256m

  guacd:
    image: docker.io/guacamole/guacd:1.6.0
    restart: unless-stopped
    mem_limit: 512m

  app:
    image: docker.io/guacamole/guacamole:1.6.0
    restart: unless-stopped
    env_file:
      - ../.panelalpha/guacamole/app.env
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: database
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USERNAME: guacamole_user
      # Serve at the site root instead of /guacamole/.
      WEBAPP_CONTEXT: ROOT
      # TLS ends at the engine's proxy. Tomcat's RemoteIpValve reads
      # X-Forwarded-For right to left, so the client is the hop the proxy added.
      REMOTE_IP_VALVE_ENABLED: "true"
      JAVA_OPTS: -Xmx512m
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
      guacd:
        condition: service_started
    healthcheck:
      # The login page's API answers once Tomcat has deployed the webapp;
      # bash /dev/tcp: the Tomcat base image does not promise curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/languages HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200'"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    mem_limit: 1024m

  # No-op gate: `compose up -d` returns only once Guacamole answers.
  ready:
    image: docker.io/library/alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  initdb: {}
  postgres: {}
