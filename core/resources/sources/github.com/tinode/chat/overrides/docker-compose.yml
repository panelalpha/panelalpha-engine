# Compose-replace: the repository has no deployable compose at its root and a
# plain deploy builds the keygen tool. This runs upstream's published image of
# the current release (tinode/tinode-postgres:0.25.3) with PostgreSQL.
services:
  database:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    # POSTGRES_PASSWORD; Tinode's init-db creates its own `tinode` database.
    env_file:
      - ../.panelalpha/tinode/db.env
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 256m

  app:
    image: docker.io/tinode/tinode-postgres:0.25.3
    restart: unless-stopped
    # POSTGRES_DSN, AUTH_TOKEN_KEY, UID_ENCRYPTION_KEY generated by prepare.sh.
    # API_KEY_SALT stays upstream's: the bundled web client's API key is
    # derived from it.
    env_file:
      - ../.panelalpha/tinode/app.env
    environment:
      WAIT_FOR: database:5432
      SMTP_HOST_URL: ${PA_PUBLIC_URL}/
      TEL_HOST_URL: ${PA_PUBLIC_URL}/
    volumes:
      # Files sent in chats (media handler `fs`) and the chatbot's credentials.
      - uploads:/opt/tinode/uploads
      - botdata:/botdata
    ports:
      - "6060:6060"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:6060/"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 5s
    mem_limit: 512m

  # No-op gate: `compose up -d` returns only once Tinode answers.
  ready:
    image: docker.io/library/alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  postgres: {}
  uploads: {}
  botdata: {}
