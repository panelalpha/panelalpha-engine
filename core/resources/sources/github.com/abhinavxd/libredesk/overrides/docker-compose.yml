# Replaces upstream's docker-compose.yml, which bind-mounts ./uploads and
# ./config.toml into the project dir a redeploy wipes, publishes Postgres and
# Redis on the host, and runs install+upgrade+serve in one command with no
# ready gate. Same stack, made durable and self-configuring:
#   - the official image libredesk/libredesk, pinned to release v2.8.0
#     (v2.9.0 is only RC on Docker Hub at time of writing)
#   - postgres:17-alpine and redis:7-alpine on named volumes, no host ports
#   - a one-shot `install` that creates the schema + System user and runs
#     migrations to completion before the app is allowed to serve
#   - uploads on a named volume; secrets from ~/.panelalpha/libredesk
#   - only the app publishes a port (9000), so it is the primary
# The Go binary serves the built Vue SPA and the JSON API on the one port.
services:
  db:
    # Match upstream's Postgres major. A major cannot migrate its datadir
    # backwards, so pin it: a floating tag would break the named volume the
    # first time the major moves.
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    # POSTGRES_PASSWORD only, written once by hooks/prepare.sh and baked into
    # the data volume; never regenerated. No host port -- internal only.
    env_file:
      - ../.panelalpha/libredesk/db.env
    environment:
      POSTGRES_DB: libredesk
      POSTGRES_USER: libredesk
      # A named volume is not always empty (lost+found); postgres refuses to
      # init into a non-empty dir, so give it a clean subdir.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libredesk -d libredesk -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 512m

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 256m

  # One-shot: create the schema and the System user, then run migrations to
  # completion before the app is allowed to serve. `--install` reads
  # LIBREDESK_SYSTEM_USER_PASSWORD from admin.env to set the admin password (and
  # enforces its strength). --idempotent-install makes a redeploy a no-op on an
  # already-installed DB. `app` waits on this with service_completed_successfully
  # so a failed install fails the deploy instead of publishing a broken site.
  install:
    image: libredesk/libredesk:v2.8.0
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.panelalpha/libredesk/admin.env
    volumes:
      - ./config.toml:/libredesk/config.toml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "./libredesk --install --idempotent-install --yes --config /libredesk/config.toml && ./libredesk --upgrade --yes --config /libredesk/config.toml"
    mem_limit: 512m

  app:
    image: libredesk/libredesk:v2.8.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    volumes:
      - ./config.toml:/libredesk/config.toml:ro
      - uploads:/libredesk/uploads
    # The Go server serves the SPA + API on 9000; publish it so the port scan
    # takes it as the primary. No other service publishes a port.
    ports:
      - "9000:9000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "./libredesk --config /libredesk/config.toml"
    healthcheck:
      # alpine image ships busybox wget (no curl). /api/v1/config is a public
      # (no-auth) endpoint that renders through the DB, so a 200 proves the
      # server, the SPA config API and the database are all up.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/api/v1/config || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 30s
    mem_limit: 1536m

  # Starts nothing, exits 0, waits on app's healthcheck. `docker compose up -d`
  # blocks on a depends_on health condition, so this makes `up` return only once
  # the site actually answers rather than the moment containers start
  # (engine#204).
  ready:
    image: docker.io/library/alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m

volumes:
  pgdata: {}
  redis-data: {}
  uploads: {}
