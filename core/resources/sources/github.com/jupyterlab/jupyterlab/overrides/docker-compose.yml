# Compose-replace: the repo ships only a contributor dev image (no server CMD).
# Official Docker Stacks image of the current JupyterLab release.
services:
  app:
    image: quay.io/jupyter/minimal-notebook:lab-4.6.4
    restart: unless-stopped
    ports:
      - "8888:8888"
    env_file:
      # JUPYTER_TOKEN, the token the engine generates (the project's own
      # JUPYTER_TOKEN env var wins). Without it JupyterLab makes a new random
      # token on every start and prints it only to the log.
      - ../.panelalpha/app-credentials.env
    volumes:
      # Notebooks, ~/.local installs and settings survive a redeploy.
      - jupyter-home:/home/jovyan

volumes:
  jupyter-home: {}
