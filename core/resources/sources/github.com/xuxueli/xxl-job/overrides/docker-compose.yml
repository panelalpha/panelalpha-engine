# Compose-replace: the repository's only compose file is docker/docker-compose.yml,
# which needs MYSQL_PATH and the admin port set and a jar built beforehand. Runs
# what it describes, MySQL 8.4 with doc/db/tables_xxl_job.sql and xxl-job-admin built
# from this checkout, without the sample executor, and with the engine's login.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # Upstream's charset and collation, sized for a shared account.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=64
    environment:
      MYSQL_DATABASE: xxl_job
      MYSQL_USER: xxl_job
    env_file:
      # MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD, generated by hooks/prepare.sh.
      - ../.panelalpha/xxl-job/db.env
      # XXL_JOB_ADMIN_USERNAME / XXL_JOB_ADMIN_PASSWORD, the login the engine generates.
      - ../.panelalpha/app-credentials.env
    volumes:
      - db:/var/lib/mysql
      # Run in this order, on a new database only: the schema and its admin/123456,
      # then the engine's login on that admin.
      - ./doc/db/tables_xxl_job.sql:/docker-entrypoint-initdb.d/10-tables_xxl_job.sql:ro
      - ./panelalpha-xxl-job-login.sh:/docker-entrypoint-initdb.d/20-panelalpha-login.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u xxl_job -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    mem_limit: 512m

  app:
    build:
      context: .
      dockerfile: panelalpha-xxl-job-admin.Dockerfile
    restart: unless-stopped
    environment:
      # Spring Boot reads these over application.properties (127.0.0.1, root).
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: xxl_job
      JAVA_OPTS: -Xms128m -Xmx512m
    env_file:
      # SPRING_DATASOURCE_PASSWORD, generated by hooks/prepare.sh.
      - ../.panelalpha/xxl-job/app.env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Spring's health includes the database, so UP means it can log in.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: 768m

  # No-op: `compose up -d` returns once XXL-JOB answers with its database.
  ready:
    image: mysql:8.4
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  db: {}
