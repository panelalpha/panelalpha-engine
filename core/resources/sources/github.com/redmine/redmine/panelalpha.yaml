# yaml-language-server: $schema=../../../_schema.json
description: >-
  Redmine, the Rails project-management and issue-tracking app. The repository
  ships no config/database.yml (only the .example), and its Gemfile installs a
  database adapter only when that file exists, so the generic rails strategy
  builds an image with no adapter and no server gem (puma sits in the :test
  group) and the container restart-loops on "Please configure your
  config/database.yml first".

  This recipe runs the official redmine image of the current release (7.0.1)
  on port 3000. With no database variables set the image configures SQLite
  (sqlite/redmine.db) and runs db:migrate on start; the database and uploaded
  files live on named volumes that survive redeploys. hooks/prepare.sh
  generates REDMINE_SECRET_KEY_BASE once into ~/.panelalpha/redmine so
  sessions survive a rebuild. db:migrate gives a new database Redmine's
  built-in admin with the password admin, which nobody deploying it is told,
  and the Register page only queues an account for that admin to activate. So
  the engine generates a login (`credentials:` below, returned by GET
  /projects/{name}/app-credentials) and files/panelalpha-redmine-start.sh,
  run by the image's entrypoint after db:migrate, sets it on that admin with
  Redmine's own User model (rails runner), only while the admin still has the
  password admin: a password changed in Redmine is never touched. Then it
  starts the server as the image's CMD does.
credentials:
  login_path: /login
  fields:
    REDMINE_ADMIN_USERNAME: {kind: username}
    REDMINE_ADMIN_PASSWORD: {kind: password}
