# Upstream's docker-compose.prod.yml on the v3.13.0 images, with the library,
# config and datastores on named volumes and the secrets generated per account.
x-secrets: &secrets
  POSTGRES_USER: meelo
  POSTGRES_DB: meelo
  POSTGRES_PASSWORD: ${MEELO_DB_PASSWORD:?MEELO_DB_PASSWORD is required}
  RABBITMQ_URL: amqp://meelo:${MEELO_MQ_PASSWORD:?MEELO_MQ_PASSWORD is required}@mq:5672
  API_KEYS: ${MEELO_API_KEY:?MEELO_API_KEY is required}
  INTERNAL_DATA_DIR: /data
  INTERNAL_CONFIG_DIR: /config

services:
  server:
    init: true
    image: arthichaud/meelo-server:v3.13.0
    restart: unless-stopped
    # ALLOW_ANONYMOUS, ENABLE_USER_REGISTRATION, LASTFM_* from the project's env vars.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *secrets
      JWT_SIGNATURE: ${MEELO_JWT_SECRET:?MEELO_JWT_SECRET is required}
      MEILI_MASTER_KEY: ${MEELO_MEILI_KEY:?MEELO_MEILI_KEY is required}
      MEILI_HOST: http://meilisearch:7700
      TRANSCODER_URL: http://transcoder:7666
      DATABASE_URL: postgresql://meelo:${MEELO_DB_PASSWORD:?MEELO_DB_PASSWORD is required}@db:5432/meelo?schema=public
    volumes:
      - data:/data
      - config:/config
      # Upstream's default settings.json from the repository.
      - ./settings.json:/config/settings.json:ro
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      mq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:4000"]
      interval: 3s
      timeout: 5s
      retries: 60
    mem_limit: 768m

  scanner:
    image: arthichaud/meelo-scanner:v3.13.0
    restart: unless-stopped
    environment:
      <<: *secrets
      API_URL: http://server:4000
    volumes:
      - data:/data:ro
      - config:/config:ro
      - ./settings.json:/config/settings.json:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:8133"]
      interval: 3s
      timeout: 5s
      retries: 40
    mem_limit: 256m

  front:
    image: arthichaud/meelo-front:v3.13.0
    restart: unless-stopped
    environment:
      PUBLIC_SERVER_URL: ${PA_PUBLIC_URL}/api
      SSR_SERVER_URL: http://server:4000
      PUBLIC_SCANNER_URL: ${PA_PUBLIC_URL}/scanner
      SSR_SCANNER_URL: http://scanner:8133
      PUBLIC_MATCHER_URL: ${PA_PUBLIC_URL}/matcher
      SSR_MATCHER_URL: http://matcher:6789
    depends_on:
      server:
        condition: service_healthy
      scanner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: 384m

  matcher:
    image: arthichaud/meelo-matcher:v3.13.0
    restart: unless-stopped
    environment:
      <<: *secrets
      API_URL: http://server:4000
    volumes:
      - config:/config:ro
      - ./settings.json:/config/settings.json:ro
    depends_on:
      server:
        condition: service_healthy
      mq:
        condition: service_healthy
    mem_limit: 256m

  transcoder:
    image: ghcr.io/zoriya/kyoo_transcoder:5.2.1
    restart: unless-stopped
    cpus: 1
    environment:
      GOCODER_SAFE_PATH: /data
      PGUSER: meelo
      PGPASSWORD: ${MEELO_DB_PASSWORD:?MEELO_DB_PASSWORD is required}
      PGDATABASE: meelo
      PGHOST: db
      PGPORT: 5432
    volumes:
      - data:/data:ro
      - transcoder_cache:/cache
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m

  db:
    image: postgres:alpine3.14
    restart: unless-stopped
    environment:
      POSTGRES_USER: meelo
      POSTGRES_DB: meelo
      POSTGRES_PASSWORD: ${MEELO_DB_PASSWORD:?MEELO_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meelo -d meelo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - db:/var/lib/postgresql/data
    mem_limit: 384m

  meilisearch:
    image: getmeili/meilisearch:v1.5
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEELO_MEILI_KEY:?MEELO_MEILI_KEY is required}
      MEILI_LOG_LEVEL: WARN
    volumes:
      - search:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://0.0.0.0:7700/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 384m

  mq:
    image: rabbitmq:4.3-alpine
    hostname: meelo-mq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: meelo
      RABBITMQ_DEFAULT_PASS: ${MEELO_MQ_PASSWORD:?MEELO_MQ_PASSWORD is required}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 384m

  nginx:
    image: nginx:1.31.3-alpine
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      FRONT_URL: http://front:3000
      SERVER_URL: http://server:4000
      SCANNER_URL: http://scanner:8133
      MATCHER_URL: http://matcher:6789
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/meelo.conf.template:ro
    depends_on:
      server:
        condition: service_started
      front:
        condition: service_started
    mem_limit: 64m

  # No-op gate: `compose up -d` returns only once the web front answers.
  ready:
    image: nginx:1.31.3-alpine
    restart: "no"
    entrypoint: ["true"]
    depends_on:
      front:
        condition: service_healthy
      nginx:
        condition: service_started
    mem_limit: 32m

volumes:
  db: {}
  config: {}
  data: {}
  search: {}
  transcoder_cache: {}
  rabbitmq_data: {}
