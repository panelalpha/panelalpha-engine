# Layers over the compose file the laravel strategy generates. That file is
# right about everything it says -- the shared PHP 8.4 base image against
# `"php": "^8.4"`, ~/project bind-mounted at /app, the account's own uid,
# PA_DOCROOT=/app/public, Apache on 8000, the public https URL -- and says
# nothing about where a bookmark manager keeps its bookmarks, because a
# checkout cannot say that.
#
# An override rather than a replacement compose file: an
# `overrides/docker-compose.yml` is written into the checkout *before*
# detection, and a docker-compose.yml in the project root would make Servas
# look like a compose project and take the laravel strategy -- with it the bind
# mount, the document root, the Composer pass, the host Vite build and the
# staged entrypoint -- off the table entirely.
services:
  app:
    volumes:
      # ~/.panelalpha/servas. Everything this installation accumulates lives
      # here and nowhere else:
      #
      #   /data/database.sqlite   every bookmark, tag, group and user
      #   /data/app.key           the application key
      #   /data/credentials       the generated account, 0600
      #
      # A redeploy clears and re-clones ~/project (engine#173), so a SQLite
      # file under database/ -- which is where Servas's own config/database.php
      # points, and where its Dockerfile puts it -- would be destroyed by the
      # next deploy along with every bookmark in it. ~ itself is root-owned
      # 0755 and nothing can be created in it; ~/.panelalpha is created with
      # the account and belongs to it, which is why the data directory is a
      # child of that one. The prepare hook creates it before this mount is
      # made, so Docker never gets to create it as root.
      - ../.panelalpha/servas:/data
