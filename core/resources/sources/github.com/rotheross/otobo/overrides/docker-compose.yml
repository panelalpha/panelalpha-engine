# Upstream's otobo-docker (rel-11_0: otobo-base.yml + otobo-override-http.yml)
# on the images of the current stable release, 11.0.18. The source repo has
# no compose file. cap_drop/cap_add removed: the engine strips cap_add but
# keeps cap_drop, which would leave MariaDB without SYS_CHROOT.
services:
  db:
    image: mariadb:11.8
    user: mysql:mysql
    restart: unless-stopped
    env_file: ../.panelalpha/otobo/db.env
    environment:
      MARIADB_AUTO_UPGRADE: "1"
    command: --max-allowed-packet=136314880 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-log-file-size=268435456 --query-cache-size=33554432
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 512m

  web:
    image: rotheross/otobo:rel-11_0_18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      elastic:
        condition: service_started
      redis:
        condition: service_started
    command: web
    ports:
      - "8080:5000"
    volumes:
      - opt_otobo:/opt/otobo
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -o /dev/null http://localhost:5000/robots.txt"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    mem_limit: 1g

  daemon:
    image: rotheross/otobo:rel-11_0_18
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    command: daemon
    volumes:
      - opt_otobo:/opt/otobo
    mem_limit: 512m

  elastic:
    image: rotheross/otobo-elasticsearch:rel-11_0_18
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -o /dev/null http://localhost:9200/_cat/health"]
      interval: 10s
      timeout: 10s
      retries: 60
    mem_limit: 1200m

  redis:
    image: redis:8-bookworm
    user: redis:redis
    restart: unless-stopped
    command: ["redis-server", "--save", ""]
    mem_limit: 128m

  # No-op gate: `compose up -d` returns only once OTOBO answers.
  ready:
    image: redis:8-bookworm
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 32m

volumes:
  mariadb_data: {}
  opt_otobo: {}
  elasticsearch_data: {}
