# yaml-language-server: $schema=../../../_schema.json
description: >-
  Seerr (the merged successor of Overseerr and Jellyseerr) is a media request
  manager for Plex, Jellyfin and Emby with the *arr stack (Sonarr, Radarr):
  one Node/Next.js server on port 5055 with an embedded SQLite database and
  settings.json under /app/config.

  UPSTREAM IMAGE. The repo's compose.yaml is a dev environment
  (Dockerfile.local, the checkout bind-mounted over /app), so
  overrides/docker-compose.yml replaces it with upstream's published release
  image ghcr.io/seerr-team/seerr:v3.5.0 instead of building the Dockerfile.

  CLOSED FIRST RUN. Seerr's setup wizard makes the first Plex account, or the
  first administrator of any Jellyfin/Emby server the caller names, the ADMIN
  (server/routes/auth.ts). While mediaServerType is NOT_CONFIGURED the
  Jellyfin route even rewrites an existing user 1 as that caller (measured:
  a seeded local owner became evil@example.com, userType Jellyfin). A
  one-shot `seed` service runs before the app on every boot: it migrates with
  Seerr's own compiled datasource, creates a local owner (User entity, bcrypt
  via User.setPassword, Permission.ADMIN) only when no user exists, pins
  mediaServerType while no server or account is linked, and sets
  public.initialized, applicationUrl and network.trustProxy. The owner email
  has a random local part (admin-<hex>@<domain>) so a Plex account with a
  guessable address cannot match it.

  MEDIA SERVER. SEERR_MEDIA_SERVER (project env) is plex (default), jellyfin
  or emby. Seerr cannot start in Jellyfin/Emby mode without a server API key
  (settings migration 0002 exits), so those modes also need
  SEERR_JELLYFIN_URL and SEERR_JELLYFIN_API_KEY; the seed checks them against
  /System/Info and saves the server, which also stops the sign-in form from
  accepting a host chosen by the caller. Plex: set SEERR_OWNER_EMAIL to the
  customer's Plex email and redeploy (only while the owner has no linked
  account), then sign in with Plex.

  SECRETS AND PERSISTENCE. hooks/prepare.sh writes the owner password once to
  ~/.panelalpha/seerr/ (0600 in 0700) with a credentials.txt note. The
  database, settings.json (API key, session secret) and logs live on the
  seerr-config named volume and survive redeploys.
