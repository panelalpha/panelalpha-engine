# Compose-replace of upstream's docker-compose.yml: same services and images (pinned to
# the current release), env from api/.env.docker and client/.env.docker inlined, secrets
# from ~/.panelalpha (hooks/prepare.sh), nginx config addressing services by name.
x-api: &api
  image: jhumanj/opnform-api:2.5.0
  restart: unless-stopped
  env_file:
    - ../.panelalpha/opnform/secrets.env
  environment: &api-env
    APP_NAME: OpnForm
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: ${PA_PUBLIC_URL}
    FRONT_URL: ${PA_PUBLIC_URL}
    LOG_CHANNEL: errorlog
    LOG_LEVEL: warning
    FILESYSTEM_DRIVER: local
    LOCAL_FILESYSTEM_VISIBILITY: public
    CACHE_DRIVER: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    REDIS_HOST: redis
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_DATABASE: opnform
    DB_USERNAME: opnform
    MAIL_MAILER: log
    MAIL_FROM_ADDRESS: noreply@${PA_PUBLIC_HOST}
    MAIL_FROM_NAME: OpnForm
    JWT_TTL: "1440"
    JWT_SKIP_IP_UA_VALIDATION: "false"
    SHOW_OFFICIAL_TEMPLATES: "true"
    PHP_MEMORY_LIMIT: 512M
    PHP_MAX_EXECUTION_TIME: "600"
    PHP_UPLOAD_MAX_FILESIZE: 64M
    PHP_POST_MAX_SIZE: 64M
  volumes:
    - opnform_storage:/usr/share/nginx/html/storage
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  mem_limit: 512m

services:
  api:
    <<: *api
    healthcheck:
      test: ["CMD-SHELL", "php /usr/share/nginx/html/artisan about > /dev/null || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 60s

  api-worker:
    <<: *api
    command: ["php", "artisan", "queue:work"]
    depends_on:
      api:
        condition: service_healthy

  api-scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api:
        condition: service_healthy

  ui:
    image: jhumanj/opnform-client:2.5.0
    restart: unless-stopped
    env_file:
      - ../.panelalpha/opnform/secrets.env
    environment:
      NUXT_PUBLIC_APP_URL: /
      NUXT_PUBLIC_API_BASE: /api
      NUXT_PRIVATE_API_BASE: http://ingress/api
      NUXT_PUBLIC_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 128m

  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ../.panelalpha/opnform/secrets.env
    environment:
      POSTGRES_DB: opnform
      POSTGRES_USER: opnform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opnform -d opnform"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 384m

  ingress:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./opnform-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/login || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
    mem_limit: 64m

  # No-op gate: `compose up -d` returns once the front page is served.
  ready:
    image: nginx:1.29-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      ingress:
        condition: service_healthy
    mem_limit: 32m

volumes:
  opnform_storage: {}
  postgres_data: {}
  redis_data: {}
