# Compose-replace: the repository ships no deployable Dockerfile (upstream
# generates one with cpp). Runs the published image of the current release;
# database, config and uploads live on the `data` volume.
services:
  app:
    image: zusam/zusam:0.6.1
    restart: unless-stopped
    env_file:
      # INIT_USER / INIT_PASSWORD, the login the engine generates: run.sh creates
      # the first user with them while the database is empty.
      - ../.panelalpha/app-credentials.env
      # The project's env vars (ALLOW_EMAIL, ...), last so they still win.
      - .env
    environment:
      APP_ENV: prod
      DOMAIN: ${PA_PUBLIC_HOST}
    volumes:
      - data:/zusam/data
    ports:
      - "8080:8080"
    healthcheck:
      # nginx starts last in run.sh, after composer install and the DB init
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/info"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 512m

  # `compose up -d` returns only once the API answers. Then, on an installation
  # from before the engine owned the login, it changes upstream's default
  # zusam / zusam to the engine's (files/panelalpha-zusam-login.php).
  ready:
    image: zusam/zusam:0.6.1
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "php /panelalpha-zusam-login.php; exit 0"]
    env_file:
      - ../.panelalpha/app-credentials.env
      - .env
    volumes:
      - ./panelalpha-zusam-login.php:/panelalpha-zusam-login.php:ro
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m

volumes:
  data: {}
