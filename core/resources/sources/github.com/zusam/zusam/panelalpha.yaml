# yaml-language-server: $schema=../../../_schema.json
description: >-
  Zusam is a private forum for friends and family groups (PHP/Symfony API with
  a prebuilt web app, SQLite, nginx and php-fpm under s6 in one image).

  The repository has no Dockerfile or compose file to deploy: upstream
  assembles its Dockerfile with the C preprocessor (`cpp -o Dockerfile
  container/dockerfile/prod.docker`) and builds the web app into public/ in a
  separate `make` step, so a plain deploy detects PHP and answers 403 (no
  index.php anywhere in the checkout). overrides/docker-compose.yml runs the
  image upstream publishes for the current release, zusam/zusam:0.6.1, with
  its data directory (SQLite database, config with the generated APP_SECRET,
  uploaded files) on the named volume `data`.

  First run is upstream's: container/run.sh creates the first user and group
  from INIT_USER / INIT_GROUP / INIT_PASSWORD while the database is empty, and
  INIT_USER / INIT_PASSWORD default to zusam / zusam, a login nobody deploying
  it was told and anyone with the address could use. So the engine generates
  them (`credentials:` below, returned by GET /projects/{name}/app-credentials)
  and the compose file hands them to the container from
  ~/.panelalpha/app-credentials.env; the project's own environment variables
  still win, and the engine then reports those. zusam:init makes a user only
  when no user has that login yet (in 0.6.1 run.sh runs it on every start, as
  its database path check reads empty), so a password changed in Zusam is
  never touched. An
  installation from before still signing in with zusam / zusam is moved to the
  engine's login once, through Zusam's own API, by the `ready` service
  (files/panelalpha-zusam-login.php). INIT_GROUP stays upstream's `zusam`.
credentials:
  login_path: /login
  fields:
    INIT_USER: {kind: username}
    INIT_PASSWORD: {kind: password}
