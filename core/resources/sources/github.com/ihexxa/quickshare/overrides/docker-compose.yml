# Compose-replace: the repo ships no compose file and its Dockerfile builds the
# frontend and backend from source. Runs the published image of the current
# release (v0.11.4), as upstream's `docker run` example does.
services:
  app:
    image: hexxa/quickshare:v0.11.4
    restart: unless-stopped
    ports:
      - "8686:8686"
    env_file:
      # DEFAULTADMIN / DEFAULTADMINPWD, the login the engine generates. The
      # app reads them only on first start, while it has no database yet, so a
      # password changed in QuickShare is never overwritten. Without them it
      # would generate the password and print it only to its log.
      - ../.panelalpha/app-credentials.env
    volumes:
      # Uploaded files and quickshare.sqlite.
      - quickshare-root:/quickshare/root
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8686"]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 512m

  # No-op gate: `compose up -d` returns once QuickShare listens.
  ready:
    image: hexxa/quickshare:v0.11.4
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  quickshare-root: {}
