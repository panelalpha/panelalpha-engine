# Compose-replace: the repo is Keycloak's Maven source tree, whose build does
# not fit an account. Runs the official image of the current release.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
    env_file:
      # POSTGRES_PASSWORD, generated by hooks/prepare.sh.
      - ../.panelalpha/keycloak/db.env
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 256m

  app:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: ["start"]
    ports:
      - "8000:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      # TLS ends at the engine's proxy, which sets X-Forwarded-*.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${PA_PUBLIC_URL}
      KC_HEALTH_ENABLED: "true"
      # The first admin, from the project's env vars (checked below).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
    env_file:
      # KC_DB_PASSWORD, generated by hooks/prepare.sh.
      - ../.panelalpha/keycloak/app.env
    depends_on:
      db:
        condition: service_healthy
      env-check:
        condition: service_completed_successfully
    healthcheck:
      # The image has no curl; /health/ready is on the management port 9000.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q 'HTTP/1.1 200' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    mem_limit: 1536m

  # Fails `compose up` (and so the deploy) while a required variable is unset.
  env-check:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: "no"
    entrypoint: ["/bin/bash", "/keycloak-env-check.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./keycloak-env-check.sh:/keycloak-env-check.sh:ro
    mem_limit: 32m

  # No-op: `compose up -d` returns only once Keycloak is ready.
  ready:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: "no"
    entrypoint: ["/bin/bash", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  db: {}
