# Upstream's docker-compose.yml on the v1.53.0 release images, with one
# public port: the front, which also serves the API by path (api.conf).
x-backend-env: &backend-env
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  REDIS_URL: redis://redis:6379
  LAGO_REDIS_CACHE_URL: redis://redis:6379
  LAGO_PDF_URL: http://pdf:3000
  LAGO_USE_AWS_S3: "false"
  LAGO_USE_GCS: "false"
  LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com

services:
  db:
    image: getlago/postgres-partman:15.0-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/lago/db.env
    environment:
      POSTGRES_DB: lago
      POSTGRES_USER: lago
      PGDATA: /data/postgres
    volumes:
      - lago_postgres_data:/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lago -d lago -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - lago_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 128m

  migrate:
    image: getlago/api:v1.53.0
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["./scripts/migrate.sh"]
    env_file:
      - ../.panelalpha/lago/app.env
    environment:
      <<: *backend-env
      LAGO_API_URL: ${PA_PUBLIC_URL}
      LAGO_FRONT_URL: ${PA_PUBLIC_URL}
    mem_limit: 768m

  api:
    image: getlago/api:v1.53.0
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["./scripts/start.api.sh"]
    env_file:
      - ../.panelalpha/lago/app.env
    environment:
      <<: *backend-env
      LAGO_API_URL: ${PA_PUBLIC_URL}
      LAGO_FRONT_URL: ${PA_PUBLIC_URL}
    volumes:
      - lago_storage_data:/app/storage
    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    mem_limit: 1024m

  api-worker:
    image: getlago/api:v1.53.0
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["./scripts/start.worker.sh"]
    env_file:
      - ../.panelalpha/lago/app.env
    environment:
      <<: *backend-env
      LAGO_API_URL: ${PA_PUBLIC_URL}
      LAGO_FRONT_URL: ${PA_PUBLIC_URL}
    volumes:
      - lago_storage_data:/app/storage
    mem_limit: 1024m

  api-clock:
    image: getlago/api:v1.53.0
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["./scripts/start.clock.sh"]
    env_file:
      - ../.panelalpha/lago/app.env
    environment:
      <<: *backend-env
      LAGO_API_URL: ${PA_PUBLIC_URL}
      LAGO_FRONT_URL: ${PA_PUBLIC_URL}
    mem_limit: 512m

  front:
    image: getlago/front:v1.53.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: ${PA_PUBLIC_URL}
      APP_ENV: production
      LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
    volumes:
      - ./panelalpha-lago/api.conf:/etc/nginx/extra-conf.d/api.conf:ro
    ports:
      - "80:80"
    mem_limit: 64m

  pdf:
    image: getlago/lago-gotenberg:7.8.2
    restart: unless-stopped
    mem_limit: 512m

  # No-op gate: `compose up -d` returns once the API answers its health check.
  ready:
    image: redis:7-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      api:
        condition: service_healthy
      front:
        condition: service_started
    mem_limit: 32m

volumes:
  lago_postgres_data: {}
  lago_redis_data: {}
  lago_storage_data: {}
