# Mounted over /etc/nginx/sites-enabled/default, which is a symlink to
# /etc/nginx/sites-available/default in the published image.
#
# Two things at once, and both are needed. It adds a plain-HTTP vhost for the
# admin UI, because the image's own nginx-configs/bluecherry.conf says
# `listen 7001 ssl;` with `#  listen 80;` commented out one line above it and
# nothing else serves /usr/share/bluecherry/www over http. And it removes the
# Debian default site, which is what actually answers on port 80 in the
# published image -- the .deb the image is built from reinstates
# sites-enabled/default after actions/Dockerfile removed it, so port 80 serves
# "Welcome to nginx!" and would be what the engine proxied the account's domain
# to.
#
# TLS is the engine's job, not this container's: the account's domain already
# terminates a real certificate at the host proxy, and the app-deploy path
# hardcodes an http upstream (AppDeploy 'upstream_protocol' => 'http'), so the
# snakeoil listener on 7001 is unreachable and unused.
server {
  listen 80 default_server;
  server_name _;

  index index.php;
  root  /usr/share/bluecherry/www;

  error_log  /var/log/nginx/bluecherry-http-error.log;
  access_log /var/log/nginx/bluecherry-http-access.log;

  # Camera snapshots and event exports; the default 1m rejects a media upload.
  client_max_body_size 64m;

  location /.well-known/ {
      try_files $uri $uri/ =404;
  }

  location / {
      try_files $uri $uri/ /index.php$is_args$args;
  }

  # bc-server's own listeners, proxied here exactly as bluecherry.conf does on
  # 7001: HLS live view on 7003 and the JSON API on 7005. Without these the
  # live-view player and every /api call 404 on the nginx that serves the UI.
  location /hls {
      proxy_pass http://127.0.0.1:7003;
  }

  location /api {
      proxy_pass http://127.0.0.1:7005;
  }

  # The image's own FPM map: fastcgi_pass to /etc/alternatives/php-fpm.sock,
  # the symlink actions/entrypoint.sh points at whichever php-fpm it found.
  include /usr/share/bluecherry/nginx-includes/php-generic.conf;
}
