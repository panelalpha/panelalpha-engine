# A full replacement for the repository's own docker-compose.yml, which is the
# one from upstream's docker.md and is written to be read, not hosted: it runs
# MySQL with an empty root password, gives nothing a healthcheck, and leaves
# SolidInvoice unconfigured so that the first visitor to reach the account's
# public address gets the install wizard and becomes the only administrator.
#
# Everything here is the same two images and the same published port. What is
# added is ordering (a database that is ready before anything talks to it, an
# installer that has finished before the web server accepts a request), one
# generated credential per secret, and a `ready` gate so `docker compose up -d`
# returns only once the site actually answers.
services:
  # Upstream's choice. SolidInvoice supports MySQL, MariaDB, PostgreSQL and
  # SQLite (src/InstallBundle/Doctrine/Drivers.php), and the static binary is
  # built with pdo_mysql, pdo_pgsql and pdo_sqlite alike, so SQLite would fit an
  # account better than a second container does. It is not used because the
  # app's own messenger transport is `doctrine://default?queue_name=async`
  # (config/services.php) and the image runs a consumer process beside the web
  # server: two writers against one SQLite file, for a saving of about 400 MB.
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - mysqld
      # Sized for an account, not for a host. The default buffer pool plus the
      # performance schema is most of what a stock mysql:8.0 resident set is.
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
      # Character set and collation are deliberately left at mysql:8.0's own
      # defaults (utf8mb4 / utf8mb4_0900_ai_ci): that is what upstream's compose
      # file runs and what the migrations were written against.
      #
      # 8.0 defaults new accounts to caching_sha2_password. mysqlnd can do that
      # exchange over a plain connection, but only by fetching the server's RSA
      # key first; native password takes the failure mode off the table for a
      # connection that never leaves the compose network.
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: solidinvoice
      MYSQL_USER: solidinvoice
      # Generated by hooks/prepare.sh into ~/project/.env, which is what
      # compose interpolates. Upstream ships MYSQL_ALLOW_EMPTY_PASSWORD: 1.
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - solidinvoice_db:/var/lib/mysql
    # Not `mysqladmin ping`: during initialisation mysqld runs on a socket with
    # TCP closed, and after it a wrong grant still pings fine. This is the
    # query the installer is about to make -- the database exists, the account
    # the installer will use can reach it over the network.
    healthcheck:
      test:
        - CMD-SHELL
        - mysql -h 127.0.0.1 -u solidinvoice -p"$$MYSQL_PASSWORD" -e 'SELECT 1' solidinvoice
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 120s
    mem_limit: 512m

  # Runs once, before the web server exists, and is the whole reason this
  # recipe exists. SolidInvoice seeds no user and has no default password: with
  # nothing installed, RequestListener redirects every route to /install, and
  # /install is PUBLIC_ACCESS (config/packages/security.php). A deploy that
  # stops at "the wizard renders" has published a form on which the first
  # stranger to arrive becomes the administrator.
  #
  # It does three things the app container is deliberately not asked to do:
  # unpack the application out of the binary (an expensive, fragile, once-per-
  # image step), build the schema, and run upstream's non-interactive installer
  # so the admin account exists before the site is reachable. Each is explained
  # where it happens. Note that the engine re-dumps this file and drops YAML
  # comments, so the deployed copy keeps only the ones inside the script.
  install:
    image: ${SOLIDINVOICE_IMAGE:-solidinvoice/solidinvoice:latest}
    restart: "no"
    # The image's ENTRYPOINT is the binary itself, so the guard needs a shell.
    # /bin/sh is there: the image is FROM alpine with one file copied in.
    entrypoint: ["/bin/sh", "-c"]
    # Both the guard and the verdict read one file, because the exit status of
    # `solidinvoice console` cannot be used for either. The cobra `console`
    # subcommand (frankenphp/app.go) calls frankenphp.ExecuteScriptCLI and
    # discards what it returns, under `Run:` rather than `RunE:`, so the
    # process exits 0 whatever the Symfony command did. Measured: a container
    # whose installer had been OOM-killed halfway answered
    # `solidinvoice:is-installed` with exit 0 and the recipe happily skipped
    # the install. (Upstream's own isAppInstalled() in app.go has the same
    # hole, which is why the messenger worker starts consuming against a
    # database that is not there yet.)
    #
    # solidinvoice.list.php is the index of SolidInvoice's own secret vault:
    # ConfigWriter seals each key into SOLIDINVOICE_CONFIG_DIR and lists its
    # name there. InstallCommand writes `installed` last, after the migrations
    # and the admin user, so the name being present is the one durable fact
    # that says the install finished. A half-run install leaves
    # SOLIDINVOICE_BUILD_ID and nothing else -- which is exactly what the
    # OOM-killed run left behind.
    command:
      - |
        set -e
        LIST=/etc/solidinvoice/solidinvoice.list.php
        installed() { [ -f "$$LIST" ] && grep -q SOLIDINVOICE_INSTALLED "$$LIST"; }
        # Unpack the embedded application into the shared volume, here rather
        # than in the app container: the untar wants ~1.9 GB of cgroup, and
        # extractEmbeddedApp() only os.Stat()s the directory, so an untar that
        # is killed halfway is never retried and the app serves nothing for
        # ever. Any subcommand unpacks; `version` is the cheapest.
        APPROOT="$${HOME:-/root}/.SolidInvoice"
        for d in "$$APPROOT"/app_*; do
          if [ -d "$$d" ] && [ ! -f "$$d/bin/console" ]; then
            echo "[panelalpha] Removing a half-unpacked $$d; it would never complete on its own."
            rm -rf "$$d"
          fi
        done
        solidinvoice version >/dev/null 2>&1 || true
        install_with() {
          solidinvoice console "$$1" \
            --database-driver=pdo_mysql \
            --database-host=db \
            --database-port=3306 \
            --database-name=solidinvoice \
            --database-user=solidinvoice \
            --database-password="$$DB_PASSWORD" \
            --admin-email="$$ADMIN_EMAIL" \
            --admin-password="$$ADMIN_PASSWORD" \
            --locale=en \
            --application-url="$$SOLIDINVOICE_APPLICATION_URL" \
            --disable-telemetry || true
        }
        if installed; then
          echo "[panelalpha] SolidInvoice is already installed; nothing to do."
          exit 0
        fi
        # The schema. SolidInvoice builds a fresh one from the entity metadata
        # and then marks every migration complete without running it
        # (InstallBundle\Installer\Database\Migration) -- migrations/ is an
        # upgrade path and replaying it on an empty MySQL 8 fails outright. In
        # the published 3.0.1 image the installer never gets there: its steps
        # are Generators it does not iterate. So these three commands stand in
        # for the step, and SOLIDINVOICE_APP_SECRET is faked for them only,
        # because booting Symfony's security with no secret is fatal and the
        # real secret is one the installer has not written yet. See the
        # recipe's README.
        bootstrap_console() { SOLIDINVOICE_APP_SECRET=bootstrap solidinvoice console "$$@" || true; }
        echo "[panelalpha] Creating the database schema..."
        bootstrap_console doctrine:schema:update --force --no-interaction
        bootstrap_console doctrine:migrations:sync-metadata-storage --no-interaction
        bootstrap_console doctrine:migrations:version --add --all --no-interaction
        echo "[panelalpha] Installing SolidInvoice..."
        # Two names for one command: :latest (3.0.1) calls it app:install, the
        # 3.1.x branch renamed it solidinvoice:install, the options are the
        # same, and nothing here can ask which image this is. The wrong name
        # costs one "Command is not defined" line in the log.
        for cmd in app:install solidinvoice:install; do
          installed && break
          install_with "$$cmd"
        done
        if installed; then
          echo "[panelalpha] SolidInvoice installed."
          exit 0
        fi
        echo "[panelalpha] Install did not finish: SOLIDINVOICE_INSTALLED was never written." >&2
        exit 1
    environment:
      # The one variable the whole stack turns on, and it is set here rather
      # than left to the installer because on 3.0.1 the installer cannot set
      # it. Its saveConfig() seals SOLIDINVOICE_DATABASE_DRIVER, _HOST, _PORT,
      # _NAME, _USER, _PASSWORD and _VERSION into the vault, while
      # config/packages/doctrine.php reads exactly one key,
      # SOLIDINVOICE_DATABASE_URL -- and the only code that turns those parts
      # into a URL (CoreBundle\Config\Loader\EnvLoader) runs solely when it
      # finds a legacy config/env.php, which a container never has. A
      # CLI-installed 3.0.1 therefore falls back to the default,
      # `sqlite:///$$SOLIDINVOICE_CONFIG_DIR/db/solidinvoice.db`, and dies on
      # `SQLSTATE[HY000] [14] unable to open database file` -- observed, on
      # this host, before this line existed. 3.1.x seals `database_url`
      # directly. A real environment variable outranks the vault in Symfony
      # either way, so this line is correct on both and depends on neither.
      SOLIDINVOICE_DATABASE_URL: mysql://solidinvoice:${DB_PASSWORD}@db:3306/solidinvoice
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Rewritten by the engine. ComposePlaceholders replaces a bare
      # http://localhost under a key ending in _URL with the account's own
      # https address, which is the only way this file can learn the domain:
      # hooks run before the compose file is read and are told nothing about
      # it. SolidInvoice uses the value for the links it puts in e-mailed
      # invoices and in the MCP OAuth metadata, neither of which can be derived
      # from a request.
      SOLIDINVOICE_APPLICATION_URL: http://localhost
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - solidinvoice_config:/etc/solidinvoice
      # Shared with the app service: the unpacked application, so it is
      # unpacked once by the container that has the memory for it.
      - solidinvoice_app:/root/.SolidInvoice
    mem_limit: 1900m

  app:
    image: ${SOLIDINVOICE_IMAGE:-solidinvoice/solidinvoice:latest}
    restart: unless-stopped
    # Upstream's port, and the one the failed tracker deploy already published,
    # so the account's proxy rule already expects it. The image's CMD is
    # `run --disable-https`, which is correct behind the engine's proxy: it
    # also sets SYMFONY_TRUSTED_PROXIES=PRIVATE_SUBNETS,REMOTE_ADDR so Symfony
    # reads X-Forwarded-Proto and builds https links (frankenphp/app.go).
    #
    # The Host header is not a problem here, unusually. The image sets
    # SOLIDINVOICE_DOCKER=true, and serverconfig.BuildServerName then makes the
    # Caddy site address `http://:8765` -- a port with no hostname, which
    # matches any Host. That is what lets the engine's health probe reach it on
    # 127.0.0.1:8765 without a 400 (engine#165).
    ports:
      - "8765:8765"
    environment:
      # Same reason as on the installer: on 3.0.1 nothing else points Doctrine
      # at MySQL, and on any version a real environment variable is the one
      # place this cannot be got wrong.
      SOLIDINVOICE_DATABASE_URL: mysql://solidinvoice:${DB_PASSWORD}@db:3306/solidinvoice
      SOLIDINVOICE_APPLICATION_URL: http://localhost
      # Both are already the defaults in config/services.php. They are written
      # out because this is a public address: registration open on an invoicing
      # instance is an account anyone can make, and telemetry is a decision for
      # whoever owns the data, not for the recipe.
      SOLIDINVOICE_ALLOW_REGISTRATION: "0"
      SOLIDINVOICE_ENABLE_TELEMETRY: "0"
      # The default (frankenphp/app.go, --messenger-workers). One consumer
      # process beside the web server; it is what sends mail and runs the
      # scheduled tasks, and it idles until the app is installed.
      SOLIDINVOICE_MESSENGER_WORKERS: "1"
    volumes:
      # The image's only VOLUME: the secret vault the installer wrote, the
      # generated MCP OAuth keypair, and any uploaded logo.
      - solidinvoice_config:/etc/solidinvoice
      # Written by the install service, read-write here because Symfony writes
      # var/cache and var/log inside it. The app never has to unpack anything.
      - solidinvoice_app:/root/.SolidInvoice
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    # busybox wget, which is what `FROM alpine` provides; there is no curl in
    # this image.
    #
    #   /health   answered by Caddy itself (Caddyfile), so it goes true as soon
    #             as the server binds -- a liveness probe and nothing more.
    #   /login    a real page out of PHP, and the reason the body is grepped
    #             rather than the status code taken: with nothing installed
    #             InstallBundle's RequestListener 302s every route to /install,
    #             wget follows the redirect, and the wizard answers 200. A
    #             status-code check would call that healthy. `type="password"`
    #             is on the login form and not on the wizard's first step, and
    #             rendering it at all means the container compiled, the vault
    #             decrypted and MySQL answered.
    #
    # start_period covers the boot, which is not just a server starting: the
    # binary unpacks its embedded application, then lu's AppStartup event runs
    # `cache:clear` and `mcp:keys:generate` (an RSA keypair) as forked console
    # processes before Caddy is loaded.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:8765/health &&
          wget -q -O - http://127.0.0.1:8765/login | grep -qE 'type="?password"?'
      interval: 10s
      timeout: 30s
      retries: 40
      start_period: 300s
    # The hardener would give this the account's whole budget less an eighth
    # (ServiceLimits::underAccountCeiling), which on a 2500 MB account is
    # 2188 MB -- more than the account has left once MySQL is in it, and the
    # tracker run's app container was OOM-killed in a loop (`Restarting (137)`).
    # A ceiling that the account cannot honour is not a ceiling.
    #
    # 1024m is for serving: measured resident set is about 600 MB with the
    # Caddy/FrankenPHP server and one messenger consumer. The peak this does
    # not have to cover is the unpack, which the install service did.
    mem_limit: 1024m

  # Does nothing and exits 0. The engine runs `docker compose up -d` without
  # `--wait` and takes the deploy to be finished when that returns; compose
  # does block on a depends_on health condition, so a service gated on the
  # app's healthcheck is what makes `up -d` return only once the site answers.
  # Without it the health probe arrives while the container is still unpacking
  # itself and clearing caches, and the verdict is `serving-unknown` for an
  # application that came up fine thirty seconds later.
  ready:
    image: ${SOLIDINVOICE_IMAGE:-solidinvoice/solidinvoice:latest}
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m

volumes:
  solidinvoice_db: {}
  solidinvoice_config: {}
  solidinvoice_app: {}
