; Written by PanelAlpha, and read because the compose override points
; PHP_INI_SCAN_DIR at /data/php as well as the image's own conf.d --
; hooks/prepare.sh copies this file there, off the served tree. The shared PHP
; base image loads no php.ini at all ("Loaded Configuration File: (none)"), so
; without this what is in force is PHP's compiled-in defaults (engine#185).
;
; Two of those defaults make a digital-collections platform unusable rather
; than untidy.

; **An Omeka item is a file somebody uploaded.** The compiled-in defaults are
; upload_max_filesize 2M and post_max_size 8M, and a scanned page, a photograph
; off any modern camera or the PDF of an archival document is larger than
; either. A POST over post_max_size is discarded before PHP is entered, so
; $_POST and $_FILES both arrive empty and Omeka's item form reports a request
; that carried a file as one that did not.
upload_max_filesize = 128M
post_max_size = 128M

; Omeka makes three derivatives of every uploaded image (fullsize, thumbnail,
; square_thumbnail) through ext/imagick, which holds the decoded raster in
; memory. 128M is the compiled-in default and is not enough for a large scan.
; The installer is cheaper than that and runs under the CLI's own -d override.
memory_limit = 256M

; Writing a large file through PHP's upload handler and then making three
; derivatives of it takes longer than the compiled-in 30 seconds. The CLI is
; unlimited already.
max_execution_time = 300
max_input_time = 300

; A production site does not put PHP's diagnostics in the response body.
; application/config/application.ini sets `phpSettings.display_errors = 0` for
; the production environment, but Zend applies that partway through the
; bootstrap -- anything that goes wrong before it, in bootstrap.php or in a
; resource, is printed to whoever asked. On the CLI it is worse: a single
; notice on stdout makes headers_sent() true and breaks a script that has not
; yet finished its work. Errors go to the container's stderr instead, which is
; where `docker logs` and the deploy log read from.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; The Server header already says Apache; the PHP patch level does not need to
; be in every response as well.
expose_php = Off

; bootstrap.php falls back to `date_default_timezone_get()` when php.ini does
; not say, which on this image is UTC anyway. Stated so that Omeka's own
; timestamps and a future edit both have one answer.
date.timezone = UTC
