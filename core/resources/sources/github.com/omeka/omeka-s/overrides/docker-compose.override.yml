# Layers over the compose file the php strategy generates. That file is right
# about the app -- the shared PHP base image, ~/project bind-mounted at /app,
# the account's own uid, PA_DOCROOT=/app, Apache on 8000, DB_* from the
# database the engine provisioned -- and says nothing about when Omeka S is
# ready, because nothing in a PHP checkout can.
#
# An override rather than a replacement compose file, and here that is not a
# preference: an `overrides/docker-compose.yml` is written into the checkout
# *before* detection runs, so a compose file in the project root would make
# Omeka look like a compose project and take the php strategy -- and with it
# the bind mount, the docroot, the Composer pass and the staged entrypoint --
# off the table entirely.
#
# There is no database service here on purpose. `database: mysql` in
# panelalpha.yaml gets one on the account's own MySQL server: visible in the
# panel, openable in phpMyAdmin, inside the account's backup, and costing this
# 3.7 GB host neither a container nor a volume.
services:
  app:
    # The install stage does all of Omeka's setup before Apache binds --
    # config/database.ini, the theme, the schema, four RDF vocabularies, the
    # resource templates and the first administrator -- and on this host that
    # is tens of seconds. The engine runs `docker compose up -d` without
    # --wait and probes as soon as it returns, which is while that is still
    # going: nothing is listening and the probe reads `Failed to connect to
    # 127.0.0.1 port 8000`.
    #
    #   1. GET /       IndexController: the list of public sites, rendered
    #                  through the admin layout. 200 only once the schema
    #                  exists and Doctrine can reach it.
    #   2. GET /login  grepped, not trusted for its status code. With nothing
    #                  installed MvcListeners::redirectToInstallation() sends
    #                  every route to /install, and the wizard answers 200 --
    #                  a status check would call that healthy and publish a
    #                  form on which the first stranger becomes the global
    #                  administrator. `type="password"` is on the login form
    #                  and not on the installer's first screen, and rendering
    #                  it means Doctrine, the session table and the view stack
    #                  all work.
    #
    # Host is `127.0.0.1:8000` for both, as it is for AppHealth's own probe.
    # Omeka accepts it: Laminas validates no host, and no route here is
    # host-dependent.
    #
    # Idempotent, so a retry replays it harmlessly. curl is in the base image.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null --max-time 30 http://127.0.0.1:8000/ &&
          curl -fsS --max-time 30 http://127.0.0.1:8000/login | grep -q 'type="password"'
      interval: 10s
      timeout: 40s
      retries: 30
      # The install stage on two slow cores. A failing check inside this window
      # neither counts against retries nor marks the container unhealthy.
      start_period: 300s

  # Does nothing and exits 0. Compose does not wait for a healthcheck on its
  # own, but it does block on a `depends_on` health condition -- so a service
  # that waits for the app is what makes `up -d` return only once Omeka has
  # built its schema, created its administrator and answered, and what the
  # health probe then meets. A clean exit 0 is not a crash loop as far as
  # AppHealth is concerned.
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
