# Compose-replace: taiga-back is only the API, and its image dies without a
# secret key, PostgreSQL and RabbitMQ. This is upstream's taiga-docker stack
# (API, async worker, front, events, protected media, nginx gateway) on the
# published images of the current release.
x-back: &back
  image: docker.io/taigaio/taiga-back:6.10.2
  restart: unless-stopped
  # POSTGRES_*, TAIGA_SECRET_KEY, RABBITMQ_* generated by hooks/prepare.sh.
  env_file:
    - ../.panelalpha/taiga/back.env
  environment:
    TAIGA_SITES_SCHEME: https
    TAIGA_SITES_DOMAIN: ${PA_PUBLIC_HOST}
    TAIGA_SUBPATH: ""
    EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  volumes:
    - static:/taiga-back/static
    - media:/taiga-back/media
  depends_on:
    taiga-db:
      condition: service_healthy
    taiga-events-rabbitmq:
      condition: service_started
    taiga-async-rabbitmq:
      condition: service_started

x-rabbitmq: &rabbitmq
  image: docker.io/library/rabbitmq:3.8-management-alpine
  restart: unless-stopped
  env_file:
    - ../.panelalpha/taiga/rabbitmq.env
  mem_limit: 256m

services:
  taiga-db:
    image: docker.io/library/postgres:12.3
    restart: unless-stopped
    env_file:
      - ../.panelalpha/taiga/db.env
    environment:
      POSTGRES_DB: taiga
      POSTGRES_USER: taiga
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taiga"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 384m

  taiga-back:
    <<: *back
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/')"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 768m

  taiga-async:
    <<: *back
    entrypoint: ["/taiga-back/docker/async_entrypoint.sh"]
    # Celery with 4 workers sits at ~350 MB.
    mem_limit: 768m

  taiga-async-rabbitmq:
    <<: *rabbitmq
    hostname: taiga-async-rabbitmq
    volumes:
      - async-rabbitmq:/var/lib/rabbitmq

  taiga-events-rabbitmq:
    <<: *rabbitmq
    hostname: taiga-events-rabbitmq
    volumes:
      - events-rabbitmq:/var/lib/rabbitmq

  taiga-front:
    image: docker.io/taigaio/taiga-front:6.10.3
    restart: unless-stopped
    environment:
      TAIGA_URL: ${PA_PUBLIC_URL}
      TAIGA_WEBSOCKETS_URL: wss://${PA_PUBLIC_HOST}
      TAIGA_SUBPATH: ""
    mem_limit: 64m

  taiga-events:
    image: docker.io/taigaio/taiga-events:6.10.0
    restart: unless-stopped
    env_file:
      - ../.panelalpha/taiga/events.env
    depends_on:
      taiga-events-rabbitmq:
        condition: service_started
    mem_limit: 128m

  taiga-protected:
    image: docker.io/taigaio/taiga-protected:6.10.1
    restart: unless-stopped
    env_file:
      - ../.panelalpha/taiga/protected.env
    environment:
      MAX_AGE: "360"
    mem_limit: 128m

  # Upstream's gateway: routes /, /api, /admin, /static, /media and /events.
  taiga-gateway:
    image: docker.io/library/nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "9000:80"
    volumes:
      - ./taiga-gateway/taiga.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/taiga/static:ro
      - media:/taiga/media:ro
    depends_on:
      - taiga-front
      - taiga-back
      - taiga-events
    mem_limit: 64m

  # No-op gate: `compose up -d` returns only once the API has migrated and answers.
  ready:
    image: docker.io/library/alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      taiga-back:
        condition: service_healthy
    mem_limit: 32m

volumes:
  db: {}
  static: {}
  media: {}
  async-rabbitmq: {}
  events-rabbitmq: {}
