# yaml-language-server: $schema=../../../_schema.json
description: >-
  LeafWiki, a Markdown-on-disk wiki with tree navigation (Go, single binary,
  UI and API on :8080). The repository's Dockerfile builds and runs, but the
  binary exits at once without a JWT secret and an initial admin password, so
  a plain deploy restart-loops on "JWT secret is required".

  This recipe runs the published ghcr.io/perber/leafwiki image of the current
  release (v0.13.0) with /app/data on a named volume. hooks/prepare.sh
  generates LEAFWIKI_JWT_SECRET once into ~/.panelalpha/leafwiki. The initial
  admin password is the customer's: LEAFWIKI_ADMIN_PASSWORD (and optionally
  LEAFWIKI_ADMIN_USERNAME, default admin) comes from the project env vars,
  and a one-shot check fails the deploy naming it when it is unset.
