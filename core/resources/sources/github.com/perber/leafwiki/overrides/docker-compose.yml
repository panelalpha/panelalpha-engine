# Compose-replace: runs the published image of the current release instead of
# building the repo's Dockerfile (Node + Go build, ~160s per deploy).
services:
  app:
    image: ghcr.io/perber/leafwiki:v0.13.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      # LEAFWIKI_JWT_SECRET; a missing file aborts `up`.
      - ../.panelalpha/leafwiki/app.env
      # LEAFWIKI_ADMIN_USERNAME / LEAFWIKI_ADMIN_PASSWORD, applied only while no admin exists.
      - ../.panelalpha/app-credentials.env
    environment:
      LEAFWIKI_HOST: 0.0.0.0
      LEAFWIKI_PORT: "8080"
      LEAFWIKI_DATA_DIR: /app/data
    volumes:
      # Pages (Markdown), assets, users and snapshots.
      - leafwiki-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 512m

  # No-op: `compose up -d` returns once LeafWiki answers.
  ready:
    image: ghcr.io/perber/leafwiki:v0.13.0
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  leafwiki-data: {}
