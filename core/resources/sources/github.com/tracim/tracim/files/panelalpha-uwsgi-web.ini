; Mounted over /etc/tracim/tracim_web.ini. This is the image's own
; tools_docker/Debian_Uwsgi/uwsgi.ini.sample with the three lines common.sh
; would have written itself — socket, workers, threads — already filled in, and
; workers at 2 rather than 4.
;
; Why at all: each uwsgi worker holds its own copy of the Tracim backend, and
; on a first measurement four of them plus the master came to ~830 MB RSS in a
; container that also runs an rq worker, the mail notifier, the connection
; monitor, redis, pushpin's five processes, Xvfb and Apache — 1.16 GiB of a
; 1.375 GiB limit, 84%, at idle with nobody logged in. Two workers of four
; threads is eight concurrent requests, which is a different thing from four
; workers only under a load one team's Tracim does not produce, and it leaves
; the headroom a file preview (unoconv, inkscape, ffmpeg) needs.
;
; Why a whole file rather than a sed: /etc/tracim is a named volume the image
; writes on first boot only, so there is no host-side file to patch before the
; container starts. common.sh copies the sample in `if [ ! -f
; /etc/tracim/tracim_web.ini ]`, so a file already mounted there is left alone,
; and the symlink into /etc/uwsgi/apps-enabled/ still points at it.
;
; Verified against algoo/tracim:latest (2025-04.00): its uwsgi.ini.sample is
; byte-identical to the one on the develop branch. If a future image needs an
; option this file does not carry, this is the file to update.
[uwsgi]
plugins = python3
chdir = /tracim/backend/
module = wsgi.web:application
env = TRACIM_CONF_PATH=/etc/tracim/development.ini
; uwsgi protocol socket: what Apache's ProxyPassMatch ^/ uwsgi://127.0.0.1:8081
; talks to. The http-socket below is the same application over plain HTTP.
socket = :8081
http-socket = :8080
socket-timeout = 360
workers = 2
threads = 4
logto = /var/tracim/logs/tracim_web.log
; How the TRACIM_* container environment reaches uwsgi at all: uwsgi is started
; by `service uwsgi restart`, which does not inherit the entrypoint's
; environment, so the entrypoint dumps `printenv | grep TRACIM` into this file
; and uwsgi reads it back line by line.
for-readline = /var/tracim/data/tracim_env_variables
  env = %(_)
endfor =
