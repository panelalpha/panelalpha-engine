# Compose-replace: the repo compose leaves APP_KEY empty, pulls the AI face
# recognition service, and relies on cap_add (stripped by the engine, engine#349).
# Runs upstream's api + worker + MariaDB shape on the current release.
x-lychee: &lychee
  image: ghcr.io/lycheeorg/lychee:v7.10.0
  restart: unless-stopped
  env_file:
    # APP_KEY and DB_PASSWORD; a missing file aborts `up`.
    - ../.panelalpha/lychee/app.env
  volumes:
    - uploads:/app/public/uploads
    - logs:/app/storage/logs
    - tmp:/app/storage/tmp

x-lychee-env: &lychee-env
  APP_ENV: production
  APP_URL: ${PA_PUBLIC_URL}
  # The site is served over https by the engine's proxy.
  APP_FORCE_HTTPS: "true"
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: lychee
  DB_USERNAME: lychee
  QUEUE_CONNECTION: database
  # The optional face-recognition service is not deployed.
  AI_VISION_ENABLED: "false"

services:
  app:
    <<: *lychee
    environment:
      <<: *lychee-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1g

  worker:
    <<: *lychee
    environment:
      <<: *lychee-env
      LYCHEE_MODE: worker
    depends_on:
      app:
        condition: service_healthy
    # Upstream's check; the image's own one curls :8000, which a worker does not serve.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 512m

  db:
    image: mariadb:11
    restart: unless-stopped
    env_file:
      - ../.panelalpha/lychee/db.env
    environment:
      MARIADB_DATABASE: lychee
      MARIADB_USER: lychee
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 512m

  # No-op gate: `compose up -d` returns only once Lychee answers /up.
  ready:
    image: mariadb:11
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  uploads: {}
  logs: {}
  tmp: {}
  mysql: {}
