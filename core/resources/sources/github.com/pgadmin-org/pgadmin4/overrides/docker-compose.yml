# Compose-replace: the repo only ships a Dockerfile whose webpack build does not
# fit an account. Runs the official image of the current release.
services:
  app:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Unprivileged port: no reliance on the image's file capability for :80.
      PGADMIN_LISTEN_PORT: "8080"
      # Initial admin login, from the project's env vars (checked below).
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
    volumes:
      # pgadmin4.db (users, saved servers, preferences) and sessions.
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      env-check:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/misc/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 768m

  # Fails `compose up` (and so the deploy) while a required variable is unset.
  env-check:
    image: dpage/pgadmin4:9.18
    restart: "no"
    entrypoint: ["/bin/sh", "/pgadmin-env-check.sh"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
    volumes:
      - ./pgadmin-env-check.sh:/pgadmin-env-check.sh:ro
    mem_limit: 32m

  # No-op: `compose up -d` returns once pgAdmin answers (first boot creates its DB).
  ready:
    image: dpage/pgadmin4:9.18
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  pgadmin-data: {}
