# Compose-replace: the repo's docker-compose.yml runs sismics/docs:v1.10 on H2
# with a bind mount and a published example admin hash ("superSecure"). This
# runs the current release image on PostgreSQL with a generated admin password.
services:
  db:
    # Pinned major: Postgres cannot open a datadir from a newer major.
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/teedy/db.env
    environment:
      POSTGRES_DB: teedy
      POSTGRES_USER: teedy
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teedy -d teedy -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 384m

  app:
    image: docker.io/sismics/docs:v1.11
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # DATABASE_PASSWORD and DOCS_ADMIN_PASSWORD_INIT (bcrypt hash).
      - ../.panelalpha/teedy/app.env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/teedy
      DATABASE_USER: teedy
      DOCS_BASE_URL: ${PA_PUBLIC_URL}
      DOCS_ADMIN_EMAIL_INIT: admin@${PA_PUBLIC_HOST}
    volumes:
      # Encrypted document files, thumbnails, Lucene index, logs.
      - teedy-data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/app"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    # The image's JAVA_OPTS cap the heap at 1 GB; OCR and ffmpeg run beside it.
    mem_limit: 1536m

  # `up -d` returns only once Teedy answers (engine#204).
  ready:
    image: docker.io/library/postgres:16-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  pgdata: {}
  teedy-data: {}
