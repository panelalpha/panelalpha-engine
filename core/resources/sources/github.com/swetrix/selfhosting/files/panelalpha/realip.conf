# The engine's proxy appends the client to X-Forwarded-For. Take the last
# entry (real_ip_recursive off), never a client-supplied left-most one; the
# upstream config then passes it on as X-Real-IP.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
