# Compose-replace of the repo's standalone Postgres stack (FEATBIT_VERSION comes
# from the repo's .env): generated secrets instead of the placeholders, and
# UI + API + evaluation server on one domain.
services:
  postgresql:
    image: postgres:15.10
    restart: unless-stopped
    env_file:
      - ../.panelalpha/featbit/app.env
    environment:
      POSTGRES_USER: postgres
    volumes:
      - ./infra/postgresql/docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/:ro
      - postgres:/var/lib/postgresql/data
    healthcheck:
      # TCP, so it stays red while the init scripts run on the socket-only server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d featbit"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 512m

  api-server:
    image: featbit/featbit-api-server:${FEATBIT_VERSION:-6.0.0-preview}
    restart: unless-stopped
    env_file:
      - ../.panelalpha/featbit/app.env
    environment:
      DbProvider: Postgres
      MqProvider: Postgres
      CacheProvider: None
      Jwt__Algorithm: HS256
    depends_on:
      postgresql:
        condition: service_healthy
    mem_limit: 640m

  evaluation-server:
    image: featbit/featbit-evaluation-server:${FEATBIT_VERSION:-6.0.0-preview}
    restart: unless-stopped
    env_file:
      - ../.panelalpha/featbit/app.env
    environment:
      DbProvider: Postgres
      MqProvider: Postgres
      CacheProvider: None
    depends_on:
      postgresql:
        condition: service_healthy
    mem_limit: 640m

  ui:
    image: featbit/featbit-ui:${FEATBIT_VERSION:-6.0.0-preview}
    restart: unless-stopped
    environment:
      # Same origin: the router below sends /api and /streaming to the backends.
      API_URL: ${PA_PUBLIC_URL}
      EVALUATION_URL: ${PA_PUBLIC_URL}
      DEMO_URL: https://featbit-samples.vercel.app
      BASE_HREF: /
    mem_limit: 128m

  # The only published port; routes by path to the UI, API and evaluation server.
  web:
    image: nginx:1-alpine
    restart: unless-stopped
    volumes:
      - ./panelalpha/router.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      api-server:
        condition: service_started
      ui:
        condition: service_started
      evaluation-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://api-server:5000/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 64m

  # No-op gate: `up` returns only once the site answers.
  ready:
    image: nginx:1-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 32m

volumes:
  postgres: {}
