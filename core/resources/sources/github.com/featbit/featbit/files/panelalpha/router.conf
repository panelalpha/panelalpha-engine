# One domain for the whole stack: the UI's API_URL and EVALUATION_URL both
# point at the site itself and this routes by path.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=10s;
    set $ui   http://ui:80;
    set $api  http://api-server:5000;
    set $eval http://evaluation-server:5100;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;

    # Evaluation server: SDK websocket and the public SDK endpoints.
    location /streaming  { proxy_pass $eval; }
    location /api/public/ { proxy_pass $eval; }

    # Management API (and its MCP endpoint).
    location /api/ { proxy_pass $api; }
    location /mcp  { proxy_pass $api; }

    location / { proxy_pass $ui; }
}
