# Compose-replace: the repo's compose file is the developer stack. Runs the
# published image of the current release.
services:
  app:
    image: offen/offen:v1.4.2
    restart: unless-stopped
    command: ["serve"]
    ports:
      - "8080:8080"
    env_file:
      # OFFEN_SECRET; a missing file aborts `up`.
      - ../.panelalpha/offen/app.env
    environment:
      # Unprivileged port: no reliance on the binary's file capability for :80.
      OFFEN_SERVER_PORT: "8080"
      # The engine terminates TLS and forwards plain HTTP.
      OFFEN_SERVER_REVERSEPROXY: "true"
    volumes:
      # SQLite database (accounts, events).
      - offen-data:/var/opt/offen
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 512m

  # No-op: `compose up -d` returns once Offen answers.
  ready:
    image: offen/offen:v1.4.2
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  offen-data: {}
