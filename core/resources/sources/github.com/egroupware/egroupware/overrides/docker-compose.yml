# Upstream's doc/docker/docker-compose.yml on the published image of the
# current release, reduced to EGroupware itself: FPM, nginx and MariaDB.
# Rocket.Chat, Collabora, the push server and watchtower are left out.
services:
  egroupware:
    image: egroupware/egroupware:26.9.20260928-2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # EGW_DB_ROOT_PW: the entrypoint installs on first boot, creating the
    # egroupware database and user with a random password (kept in
    # header.inc.php on the data volume).
    env_file: ../.panelalpha/egroupware/db.env
    environment:
      EGW_DB_HOST: db
      EGW_DB_GRANT_HOST: "%"
    volumes:
      # The entrypoint rsyncs the image's sources here for nginx on every start.
      - sources:/usr/share/egroupware
      - data:/var/lib/egroupware
      - sessions:/var/lib/php/sessions
      - push-config:/var/lib/egroupware-push
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/egroupware/header.inc.php && php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 60s
    mem_limit: 1g

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      egroupware:
        condition: service_healthy
    volumes:
      - sources:/usr/share/egroupware:ro
      - ./panelalpha/egroupware-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/egroupware/login.php || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
    mem_limit: 128m

  db:
    image: mariadb:11.8
    restart: unless-stopped
    env_file: ../.panelalpha/egroupware/db.env
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 512m

volumes:
  sources: {}
  data: {}
  sessions: {}
  push-config: {}
  db: {}
