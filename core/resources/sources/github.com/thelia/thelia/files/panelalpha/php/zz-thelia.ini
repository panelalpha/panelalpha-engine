; Read by every PHP process in the container -- the Apache module and the CLI
; alike -- because the compose override puts this directory on
; PHP_INI_SCAN_DIR. `zz-` so it is scanned after the image's own
; docker-php-ext-*.ini files and wins on any key they set.
;
; Thelia enforces these three itself, in Thelia\Core\Install\CheckPermission,
; and it does so before it will install: on the base image's stock values the
; first deploy stopped at
;
;   FAIL: The PHP "post_max_size" configuration value (currently 8M) is below
;         minimal requirements to run Thelia
;   ERROR: Permission checks failed.
;
; which failed the install stage, crash-looped the container and left the
; account with no shop at all. The same check runs in the back office's system
; page, so the web SAPI needs the values as much as the installer does.
;
; The minimums CheckPermission asks for are memory_limit 128M (the image's
; exact default, so one bad merge away from failing), post_max_size 20M and
; upload_max_filesize 2M. These are those minimums with room above them:
; upload_max_filesize is raised to match post_max_size, because a product image
; larger than upload_max_filesize is silently dropped rather than refused, and
; 2M is small for a shop's photography.

memory_limit = 256M
post_max_size = 20M
upload_max_filesize = 20M
