# Layers over the compose file the php strategy generates. That file is right
# about the app -- the shared PHP 8.3 base image, ~/project bind-mounted at
# /app, the account's own uid, PA_DOCROOT=/app/public, Apache on 8000, DB_*
# from the database the engine provisioned -- and says nothing about when
# Thelia is ready, because nothing in a PHP checkout can.
#
# An override rather than a replacement compose file, and here that is not a
# preference: an `overrides/docker-compose.yml` is written into the checkout
# *before* detection runs, so a compose file in the project root would make
# Thelia look like a compose project and take the php strategy -- and with it
# the bind mount, the docroot, the Composer pass and the staged entrypoint --
# off the table entirely.
#
# There is no database service here on purpose. `database: mysql` in
# panelalpha.yaml gets one on the account's own MySQL server: visible in the
# panel, openable in phpMyAdmin, inside the account's backup, and costing the
# host neither a container nor a volume.
services:
  app:
    environment:
      # The one way to give this container a php.ini. The base image loads no
      # php.ini at all -- `php --ini` says "Loaded Configuration File: (none)"
      # -- and scans /usr/local/etc/php/conf.d, a directory inside the image
      # that the account uid cannot write to. PHP reads PHP_INI_SCAN_DIR from
      # its own environment at startup whatever the SAPI, so naming a second
      # directory here reaches the Apache module and the CLI both; measured in
      # this image, `ini_get('post_max_size')` over http answers 20M with it
      # and 8M without.
      #
      # The image's directory is listed first and explicitly: PHP_INI_SCAN_DIR
      # replaces the compiled-in path rather than adding to it, and dropping it
      # would unload every docker-php-ext-*.ini -- intl, pdo_mysql, opcache,
      # the lot -- which is a container with no PHP extensions.
      #
      # Why the file exists at all is in files/panelalpha/php/zz-thelia.ini:
      # Thelia refuses to install below post_max_size 20M.
      PHP_INI_SCAN_DIR: /usr/local/etc/php/conf.d:/app/panelalpha/php

    # ServiceLimits caps an app-role service it did not write at 384m, and the
    # install stage does not fit in it: `composer dump-autoload --optimize`
    # over 174 packages, then bin/install, which imports setup/thelia.sql,
    # builds Propel's model classes and compiles the Symfony prod container in
    # one process. In an override file this reaches Docker as written -- the
    # hardener never sees it -- which is the point.
    mem_limit: 1g

    # The install stage does all of Thelia's setup before Apache binds: the
    # module relocation, the autoloader dump, the schema and its seed data, the
    # four templates out of vendor/, the JWT key pair, module post-activation,
    # the administrator and a cache warmup. On a shared host that is minutes.
    # The engine runs `docker compose up -d` without --wait and probes as soon
    # as it returns, which is while all of that is still going: nothing is
    # listening and the probe reads `Failed to connect to 127.0.0.1 port 8000`.
    #
    #   1. GET /             the front office, rendered by the Flexy theme. A
    #                        200 means the schema exists, Propel can reach it,
    #                        the theme was copied out of vendor/ and Twig
    #                        compiled. 500 for as long as any of that is
    #                        half-done, and `-f` fails on it.
    #   2. GET /admin/login  grepped, not trusted for its status code. The back
    #                        office is the half that a missing module or a
    #                        missing back-office template breaks while the
    #                        front office still answers, and `type="password"`
    #                        is on the login form -- rendering it means the
    #                        admin routes loaded and the back-office template
    #                        is where Thelia looks for it.
    #
    # Host is `127.0.0.1:8000` for both, as it is for AppHealth's own probe.
    # Thelia accepts it: framework.trusted_hosts is not configured, so
    # Symfony's host check is off and no route here is host-dependent.
    #
    # Idempotent, so a retry replays it harmlessly. curl is in the base image.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null --max-time 30 http://127.0.0.1:8000/ &&
          curl -fsS --max-time 30 http://127.0.0.1:8000/admin/login | grep -q 'type="password"'
      interval: 10s
      timeout: 40s
      retries: 30
      # The install stage on a shared host. A failing check inside this window
      # neither counts against retries nor marks the container unhealthy.
      start_period: 600s

  # Does nothing and exits 0. Compose does not wait for a healthcheck on its
  # own, but it does block on a `depends_on` health condition -- so a service
  # that waits for the app is what makes `up -d` return only once Thelia has
  # built its schema, created its administrator and answered, and what the
  # health probe then meets. A clean exit 0 is not a crash loop as far as
  # AppHealth is concerned.
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
