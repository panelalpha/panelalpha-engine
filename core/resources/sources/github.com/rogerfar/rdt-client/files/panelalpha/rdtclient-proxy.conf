# The only thing on the account's port. rdt-client gates its API itself; this
# adds what upstream lacks:
#   /hub  SignalR hub with no [Authorize] (RdtHub.cs), pushing the torrent list
#         to every connection: a session is required.
#   /Api/Authentication/Create  first-user setup; the seed service already did
#         it on the compose network, so it is never needed from outside.
#   /api/v2/app/preferences  anonymous in upstream (below).
# Locations match nginx's normalised path case-insensitively; the raw
# $request_uri is what goes upstream.

map $http_upgrade $rdt_connection {
    default upgrade;
    ''      close;
}

server {
    listen 8080 default_server;
    server_name _;
    # .torrent / .nzb uploads.
    client_max_body_size 100m;

    # Per-request lookup, so nginx never pins a stale address for `app`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rdt app:6500;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 300s;

    # 200 for a valid SID cookie (or when auth is switched off), 403 otherwise.
    location = /_rdt_session {
        internal;
        proxy_pass http://$rdt/Api/Authentication/IsLoggedIn;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location ~* /authentication/+create {
        return 403;
    }

    # qBittorrent API app/preferences is [AllowAnonymous] and returns the login
    # username and download path; *arr clients call it after auth/login anyway.
    location ~* /api/+v2/+app/+preferences {
        auth_request /_rdt_session;
        proxy_pass http://$rdt$request_uri;
    }

    location ~* ^/+hub {
        auth_request /_rdt_session;
        proxy_pass http://$rdt$request_uri;
        # A location that sets any header inherits none from the server block.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $rdt_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://$rdt$request_uri;
    }
}
