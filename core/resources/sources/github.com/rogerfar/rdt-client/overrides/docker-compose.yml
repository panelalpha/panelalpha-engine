# Replaces the repository's source build (Angular + .NET SDK multi-stage) with
# the image upstream publishes for the current release.
#
# A fresh rdt-client lets the first visitor create the only login
# (POST /Api/Authentication/Create is [AllowAnonymous] until a user exists),
# and its SignalR hub (/hub) has no authorization and pushes the torrent list
# to every connection. So the app publishes nothing: `seed` creates the login
# directly on the compose network, and only then does `proxy` take the
# account's port, requiring a session for /hub.
services:
  app:
    image: rogerfar/rdtclient:2.0.142
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      # rdtclient.db (login, settings incl. the debrid API key, torrents), logs.
      - rdtclient-db:/data/db
      - rdtclient-downloads:/data/downloads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:6500/"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s
    mem_limit: 1g

  # Creates the login from ~/.panelalpha/rdtclient/admin.env through the app's
  # own setup API, once. Same image: it already has curl.
  seed:
    image: rogerfar/rdtclient:2.0.142
    restart: "no"
    entrypoint: ["/bin/sh", "/panelalpha/rdtclient-seed.sh"]
    env_file:
      - ../.panelalpha/rdtclient/admin.env
    volumes:
      - ./panelalpha/rdtclient-seed.sh:/panelalpha/rdtclient-seed.sh:ro
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m

  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./panelalpha/rdtclient-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      seed:
        condition: service_completed_successfully
    mem_limit: 48m

volumes:
  rdtclient-db: {}
  rdtclient-downloads: {}
