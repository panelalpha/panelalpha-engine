# yaml-language-server: $schema=../../../_schema.json
description: >-
  rdt-client manages Real-Debrid / AllDebrid / Premiumize / TorBox torrents and
  downloads the finished files, and speaks the qBittorrent (and SABnzbd) API so
  Sonarr, Radarr and the rest of the *arr stack can use it as a download
  client. One .NET process with an Angular UI on :6500, SQLite in /data/db.
  The repository's Dockerfile is a Node + .NET SDK source build; this recipe
  runs the image upstream publishes for the current release
  (rogerfar/rdtclient:2.0.142) with /data/db and /data/downloads on named
  volumes that survive redeploys.

  Security: a fresh rdt-client shows a setup page on which the first visitor
  creates the only login (POST /Api/Authentication/Create is [AllowAnonymous]
  until a user exists). Its SignalR hub (/hub) has no authorization and pushes
  the torrent list to every connection, and the qBittorrent
  /api/v2/app/preferences endpoint is anonymous and returns the login name.
  The engine generates the login (`credentials:` below) and writes it to
  ~/.panelalpha/app-credentials.env; a one-shot `seed` service creates `admin`
  through the setup API on the compose network after the app is healthy. The
  app publishes no port: `proxy` (nginx) takes the account's port only after
  the seed succeeded, refuses Create outright, and requires a session
  (auth_request against /Api/Authentication/IsLoggedIn) for /hub and
  app/preferences. The debrid provider and its API key are runtime settings.
  The login is returned by GET /projects/{name}/app-credentials; accounts
  deployed before this kept it in ~/.panelalpha/rdtclient/admin.env, which
  `adopt_from` carries over.

  Measured on 10.10.10.25 (2026-09-28, engine 705f250a): deploy 65s, rebuild
  49s; app 94 MiB, proxy 5 MiB. Anonymous Create, /Api/Settings,
  /Api/Torrents, /api/v2/torrents/info, /api/v2/app/preferences, the SABnzbd
  queue and /hub negotiate -> 403; the same hub negotiate sent straight to
  app:6500 -> 200, which is what the proxy exists to stop. Websocket upgrade
  on /hub with a session -> 101.
credentials:
  adopt_from: .panelalpha/rdtclient/admin.env
  fields:
    RDTCLIENT_ADMIN_USER: {kind: username, value: admin}
    RDTCLIENT_ADMIN_PASSWORD: {kind: password}
