# docker/manticore.conf from this repository, with the RAM chunk sizes brought
# down to fit a hosting account.
#
# Upstream's piler1 index asks for `rt_mem_limit = 512M` and the compose file
# reserves 512M for the container to match. That is sized for a dedicated
# archive host; an account here gets 2000 MB for the whole four-service stack.
# rt_mem_limit is the size of the in-memory RAM chunk before searchd flushes it
# to a disk chunk, so lowering it costs more frequent flushes and more disk
# chunks, not capacity and not correctness. The schema below is otherwise
# byte-for-byte upstream's: the field and attribute lists are what
# src/sphinx.c and webui/model/search expect, and changing one of them breaks
# indexing rather than tuning it.
#
# Mounted read-only. Piler's own copy at /etc/piler/manticore.conf is a
# different file for a different purpose -- start.sh rewrites MYSQL_* into it
# for the non-realtime `indexer` path, which RT=1 does not use.

index piler1
{
    type = rt
    path = /var/lib/manticore/piler1
    rt_mem_limit = 128M
    stored_fields =
    min_word_len = 1
    min_prefix_len = 5
    rt_field = sender
    rt_field = rcpt
    rt_field = senderdomain
    rt_field = rcptdomain
    rt_field = subject
    rt_field = body
    rt_field = attachment_types
    rt_attr_bigint = arrived
    rt_attr_bigint = sent
    rt_attr_uint = size
    rt_attr_uint = direction
    rt_attr_uint = folder
    rt_attr_uint = attachments
}

index tag1
{
    type = rt
    path = /var/lib/manticore/tag1
    rt_mem_limit = 8M
    stored_fields = tag
    min_word_len = 2
    min_prefix_len = 5
    rt_field = tag
    rt_attr_bigint = mid
    rt_attr_uint = uid
}

index note1
{
    type = rt
    path = /var/lib/manticore/note1
    rt_mem_limit = 8M
    stored_fields = note
    min_word_len = 2
    min_prefix_len = 5
    rt_field = note
    rt_attr_bigint = mid
    rt_attr_uint = uid
}

index audit1
{
    type = rt
    path = /var/lib/manticore/audit1
    rt_mem_limit = 8M
    stored_fields = *
    min_word_len = 2
    min_prefix_len = 5
    rt_field = email
    rt_field = ipaddr
    rt_field = description
    rt_attr_bigint = ts
    rt_attr_bigint = meta_id
    rt_attr_uint = action
}

searchd
{
    # Bound to the compose network only -- the manticore service publishes no
    # host port, and searchd has no authentication of any kind, so anything
    # that can reach 9306 can read every archived message's index and write to
    # it. 0.0.0.0 here means "every interface of this container".
    listen                  = 0.0.0.0:9312
    listen                  = 0.0.0.0:9306:mysql
    listen                  = 0.0.0.0:9307:mysql_readonly
    log                     = /var/lib/manticore/manticore.log
    # 256M upstream. The binlog is replayed on startup and truncated at each
    # RAM-chunk flush; with rt_mem_limit down to 128M a 256M binlog cap only
    # buys a longer replay after an unclean stop.
    binlog_max_log_size     = 64M
    binlog_path             = /var/lib/manticore
    binlog_flush            = 2
    network_timeout         = 5
    pid_file                = /var/lib/manticore/manticore.pid
    seamless_rotate         = 1
    preopen_tables          = 1
    unlink_old              = 1
    thread_stack            = 512k
    # Manticore Buddy is a PHP sidecar process inside the same container. Left
    # empty, as upstream ships it: piler issues plain SphinxQL and the buddy
    # adds another runtime to feed.
    buddy_path              =
    rt_flush_period         = 300
}
