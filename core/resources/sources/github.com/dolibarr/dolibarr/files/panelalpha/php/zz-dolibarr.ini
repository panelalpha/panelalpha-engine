; Written by PanelAlpha, and read because the compose override points
; PHP_INI_SCAN_DIR at this directory as well as the image's own conf.d. The
; shared PHP base image loads no php.ini at all — `php --ini` answers
; "Loaded Configuration File: (none)", measured on a deployed account — so
; what is otherwise in force is PHP's compiled-in defaults (engine #185).

; PHP's compiled-in memory_limit is 128M. Dolibarr's own installer checks for
; at least 64M and its documentation asks for 256M; the two paths that need it
; are TCPDF rendering an invoice and PhpSpreadsheet building an export, both of
; which hold the whole document in memory. Inside the container's 768m.
memory_limit = 256M

; Dolibarr calls date_default_timezone_set() itself once a user session has a
; timezone, but not before — and the install stage runs as the CLI, where a
; missing date.timezone is a warning on every date() call and those warnings
; land in the middle of the installer's output.
date.timezone = UTC

; display_errors is compiled in as On. Dolibarr turns it off itself, but only
; when conf.php says so: filefunc.inc.php:245 reads $dolibarr_main_prod and
; calls ini_set('display_errors', 'Off') only if it is set —
; panelalpha-dolibarr-setup.php writes '1' there, because step1.php:615 writes
; '0'. Saying it here as well covers every request that dies before conf.php is
; read, which is precisely the requests whose backtrace names the account's
; paths and its database. log_errors sends the same text to stderr, which is
; the container's, so it lands in `docker logs` and the panel's log view.
display_errors = Off
display_startup_errors = Off
log_errors = On

; expose_php is On by default in the image; Dolibarr sends no version header of
; its own that this would hide.
expose_php = Off

; An ERP's uploads are attachments and scanned supplier invoices. The
; compiled-in post_max_size is 8M and upload_max_filesize 2M, which is below
; what a two-page scan takes. Dolibarr has its own per-module limit on top of
; this (MAIN_UPLOAD_DOC, default 2048 KB), so raising these does not by itself
; let anyone upload more — it stops the ones the application does allow from
; being truncated by PHP first.
post_max_size = 32M
upload_max_filesize = 32M

; The admin interface is a PHP session and Dolibarr sets no cookie flags of its
; own in php.ini terms.
;
; session.cookie_secure is deliberately *not* set. TLS terminates at the
; engine's proxy and the container only ever sees plain HTTP, so PHP would have
; to be told; an account also reachable over http:// would then have a login
; form that never logs anyone in, with no error to explain it. The proxy's 301
; to https is what keeps the cookie off the wire.
session.cookie_httponly = 1
session.cookie_samesite = Lax

; Dolibarr's install stage loads roughly 600 CREATE TABLE statements and then a
; reference data set; its own installer raises this with set_time_limit(1800)
; (step2.php:56), which only works when PHP is not in safe mode and is ignored
; on some builds. The CLI default is already 0, so this is for the Apache side,
; where a first-run migration after a version bump is the long request.
max_execution_time = 300
