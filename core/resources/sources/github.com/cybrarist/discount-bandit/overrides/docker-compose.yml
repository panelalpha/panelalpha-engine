# Upstream's docker-compose.yaml on the current release, with APP_KEY from
# hooks/prepare.sh and named volumes for the SQLite dir and logs.
services:
  discount-bandit:
    image: cybrarist/discount-bandit:v4.0.4
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_CONNECTION: sqlite
      APP_TIMEZONE: UTC
      THEME_COLOR: Red
      APP_URL: ${PA_PUBLIC_URL}
      ASSET_URL: ${PA_PUBLIC_URL}
      CRON: "*/5 * * * *"
    env_file:
      # APP_KEY, generated by hooks/prepare.sh.
      - ../.panelalpha/discount-bandit/app.env
    volumes:
      - db:/app/database/sqlite
      - logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:80/up"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    # Octane workers plus headless Chromium for the scrapers.
    mem_limit: 1536m

  # No-op gate: `compose up -d` returns only once the app answers.
  ready:
    image: cybrarist/discount-bandit:v4.0.4
    restart: "no"
    entrypoint: ["true"]
    depends_on:
      discount-bandit:
        condition: service_healthy
    mem_limit: 32m

volumes:
  db: {}
  logs: {}
