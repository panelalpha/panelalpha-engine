# Headplane config (config.example.yaml, no integrations). base_url,
# headscale.public_url and cookie_secret come from HEADPLANE_* environment
# overrides in the compose file and ~/.panelalpha/headplane.
server:
  host: "0.0.0.0"
  port: 3000
  base_url: "http://localhost:3000"
  cookie_secure: true
  cookie_max_age: 86400
  data_path: "/var/lib/headplane"

headscale:
  url: "http://headscale:8080"
  config_path: "/etc/headscale/config.yaml"
