# One domain: /admin is Headplane, everything else is Headscale (the
# Tailscale control protocol upgrades the connection on /ts2021).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s;
    set $headplane http://headplane:3000;
    set $headscale http://headscale:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 3600s;

    location = /     { return 302 /admin/; }
    location /admin  { proxy_pass $headplane; }
    location /       { proxy_pass $headscale; }
}
