# Compose-replace of the repo's compose.yaml, which is upstream's developer
# setup (self-signed Caddy certs from ./test, not in the repo). Headscale and
# Headplane from their release images, behind one domain.
services:
  headscale:
    image: headscale/headscale:v0.29.4
    restart: unless-stopped
    command: serve
    environment:
      HEADSCALE_SERVER_URL: ${PA_PUBLIC_URL}
    volumes:
      - ./panelalpha/headscale/config.yaml:/etc/headscale/config.yaml:ro
      # Noise key and SQLite database.
      - headscale_data:/var/lib/headscale
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    mem_limit: 256m

  headplane:
    image: ghcr.io/tale/headplane:0.7.1
    restart: unless-stopped
    env_file:
      - ../.panelalpha/headplane/headplane.env
    environment:
      HEADPLANE_SERVER__BASE_URL: ${PA_PUBLIC_URL}
      HEADPLANE_HEADSCALE__PUBLIC_URL: ${PA_PUBLIC_URL}
    volumes:
      - ./panelalpha/headplane/config.yaml:/etc/headplane/config.yaml:ro
      # Read-only: Headplane shows Headscale's settings but cannot change them.
      - ./panelalpha/headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headplane_data:/var/lib/headplane
    depends_on:
      headscale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/hp_healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    mem_limit: 256m

  # The only published port; /admin to Headplane, the rest to Headscale.
  web:
    image: nginx:1-alpine
    restart: unless-stopped
    volumes:
      - ./panelalpha/router.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      headplane:
        condition: service_healthy
    mem_limit: 64m

volumes:
  headscale_data: {}
  headplane_data: {}
