# yaml-language-server: $schema=../../../_schema.json
description: >-
  Black Candy is a self-hosted music streaming server (Rails). Every page is
  behind a login and there is no open sign-up: the admin creates users from
  Settings, so the login is the boundary.

  OFFICIAL IMAGE, COMPOSE-REPLACE. The repo ships only a Dockerfile. This
  recipe runs the maintainer's image ghcr.io/blackcandy-org/blackcandy pinned
  to the current release 3.2.1 on SQLite (the upstream default), with
  /rails/storage (all four SQLite databases) and /media_data (MEDIA_PATH, the
  music library) on named volumes, so users, the synced library and the music
  survive a redeploy. The image's thruster serves on :80; only the app service
  publishes a port.

  SECRET_KEY_BASE. Without it the image generates a new one on every start and
  logs everyone out; prepare.sh generates it once into ~/.panelalpha/blackcandy
  (0600 in 0700) and the compose file reads it from there.

  SEEDED ADMIN CLOSED BEFORE THE PORT OPENS. db/seeds.rb creates
  admin@admin.com / foobar when the database is created. A one-shot `init`
  service on the same storage volume runs `rails db:prepare` (which creates and
  seeds the database), then a `rails runner` script that changes that admin's
  email and password to the login the engine generates (`credentials:` below)
  into ~/.panelalpha/app-credentials.env.
  The app service depends on it completing, so the default login never answers
  on the public port. It acts only while admin@admin.com still authenticates
  with foobar, so a login changed in the app survives a redeploy. GET
  /projects/{name}/app-credentials (MCP app_credentials_get) returns the
  login. A `ready` gate holds the deploy until
  /up answers.
credentials:
  login_path: /sessions/new
  adopt_from: .panelalpha/blackcandy/app.env
  fields:
    BC_ADMIN_EMAIL: {kind: email, value: admin@blackcandy.local}
    BC_ADMIN_PASSWORD: {kind: password}
