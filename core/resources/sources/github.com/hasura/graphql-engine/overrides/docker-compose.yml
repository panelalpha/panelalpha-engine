# Compose-replace: the repo's root compose is a dev database harness with no
# graphql-engine. Runs the release image with install-manifests/docker-compose.
services:
  postgres:
    # Postgres cannot open a datadir from a newer major; keep this pinned.
    image: docker.io/library/postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hasura
      POSTGRES_DB: hasura
    env_file:
      # POSTGRES_PASSWORD, generated by hooks/prepare.sh.
      - ../.panelalpha/hasura/db.env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hasura -d hasura -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 384m

  app:
    image: docker.io/hasura/graphql-engine:v2.50.3
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      # Serve the console from the image instead of Hasura's CDN.
      HASURA_GRAPHQL_CONSOLE_ASSETS_DIR: /srv/console-assets
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
    env_file:
      # HASURA_GRAPHQL_METADATA_DATABASE_URL and PG_DATABASE_URL.
      - ../.panelalpha/hasura/app.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: 1024m

  # No-op: `compose up -d` returns once Hasura has applied its metadata schema.
  ready:
    image: docker.io/library/postgres:15-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  db_data: {}
