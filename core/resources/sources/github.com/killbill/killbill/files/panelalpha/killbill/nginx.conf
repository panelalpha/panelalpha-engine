# One origin for both upstream services: Kaui (the admin UI) at /, the Kill Bill
# REST API at /1.0/ and its Swagger page. TLS ends at the engine.
server {
  listen 80;
  server_name _;
  client_max_body_size 64M;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port  443;
  proxy_read_timeout 300s;

  location /1.0/ {
    proxy_pass http://killbill:8080;
  }

  location = /api.html {
    proxy_pass http://killbill:8080;
  }

  location / {
    proxy_pass http://kaui:8080;
  }
}
