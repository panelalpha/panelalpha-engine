# The repo is the Maven source tree of the server alone. This runs upstream's
# published images of the current release the way its Docker guide does
# (Kill Bill, Kaui, killbill/mariadb), behind one nginx so the UI and the API
# share the site's address.
services:
  db:
    # MariaDB with the Kill Bill and Kaui schemas in its init scripts.
    image: docker.io/killbill/mariadb:0.24
    restart: unless-stopped
    env_file:
      - ../.panelalpha/killbill/db.env
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      # TCP answers only once the init scripts have run.
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: 512m

  killbill:
    image: docker.io/killbill/killbill:0.24.22
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.panelalpha/killbill/db.env
    environment:
      KILLBILL_DAO_URL: jdbc:mysql://db:3306/killbill
      KILLBILL_DAO_USER: root
      KILLBILL_CATALOG_URI: SpyCarAdvanced.xml
      # The image defaults to -Xmx2G, more than the container limit.
      TOMCAT_JAVA_XMX: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/1.0/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 60s
    mem_limit: 1536m

  kaui:
    image: docker.io/killbill/kaui:4.0.31
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.panelalpha/killbill/db.env
    environment:
      KAUI_CONFIG_DAO_URL: jdbc:mysql://db:3306/kaui
      KAUI_CONFIG_DAO_USER: root
      KAUI_KILLBILL_URL: http://killbill:8080
      # -Xmx2G by default; JRuby needs a lot off-heap (~1.1 GB resident).
      TOMCAT_JAVA_XMX: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/users/sign_in"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 60s
    mem_limit: 1536m

  proxy:
    image: docker.io/library/nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./panelalpha/killbill/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - killbill
      - kaui
    mem_limit: 64m

  # No-op gate: `compose up -d` returns only once both JVMs answer.
  ready:
    image: docker.io/library/nginx:stable-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      killbill:
        condition: service_healthy
      kaui:
        condition: service_healthy
      proxy:
        condition: service_started
    mem_limit: 32m

volumes:
  db: {}
