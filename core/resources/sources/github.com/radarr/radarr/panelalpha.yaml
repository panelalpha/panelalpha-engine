# yaml-language-server: $schema=../../../_schema.json
description: >-
  Radarr is a movie collection manager (a Sonarr fork): one .NET process
  serving its web UI and REST API on :7878, SQLite in /config. The
  repository's default branch (develop) is a source build that fails under the
  engine ("A build step failed"), and Servarr publishes no image of its own;
  this recipe replaces the build with the LinuxServer.io image of the current
  stable v6 release, config and library on named volumes that survive
  redeploys.

  Radarr with no authentication configured shows every visitor a "set up
  authentication" modal, which would let the first visitor own the instance.
  RADARR__AUTH__METHOD=Forms and RADARR__AUTH__REQUIRED=Enabled pin a login
  form from the very first boot (environment wins over config.xml and the UI;
  "disabled for local addresses" would open it to everyone, since every
  request arrives through the local proxy). hooks/prepare.sh generates the
  login password once into ~/.panelalpha/radarr/admin.env; a one-shot `seed`
  service, after the app is healthy, reads Radarr's own API key from
  config.xml and sets the user through PUT /api/v3/config/host, only when no
  user exists. `ready` makes `compose up -d` return only after that.
