# Upstream's compose (Pad + PostgreSQL + Redis) on the published image of the
# current release instead of a from-source build. The encryption key comes from
# ~/.panelalpha (see hooks/prepare.sh); the DB password is generated by the engine.
services:
  pad:
    image: ghcr.io/perpetualsoftware/pad:0.16.1
    restart: unless-stopped
    ports:
      - "7777:7777"
    env_file:
      - ../.panelalpha/pad/encryption.env
    environment:
      PUID: "1000"
      PGID: "1000"
      PAD_HOST: "0.0.0.0"
      PAD_PORT: "7777"
      PAD_URL: ${PA_PUBLIC_URL}
      PAD_DB_DRIVER: "postgres"
      PAD_DATABASE_URL: "host=postgres port=5432 user=pad password=${PAD_DB_PASSWORD:?PAD_DB_PASSWORD is required} dbname=pad sslmode=disable"
      PAD_REDIS_URL: "redis://redis:6379"
      PAD_DATA_DIR: "/data"
      PAD_LOG_LEVEL: "info"
    volumes:
      - pad-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7777/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 512m

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pad
      POSTGRES_PASSWORD: ${PAD_DB_PASSWORD:?PAD_DB_PASSWORD is required}
      POSTGRES_DB: pad
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pad"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 384m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction as in upstream's production override: Redis holds session presence.
    command: redis-server --maxmemory 64mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 128m

  # No-op gate: `compose up -d` returns only once Pad answers its health check.
  ready:
    image: redis:7-alpine
    restart: "no"
    command: ["true"]
    depends_on:
      pad:
        condition: service_healthy
    mem_limit: 32m

volumes:
  pad-data: {}
  pg-data: {}
  redis-data: {}
