# yaml-language-server: $schema=../../../_schema.json
description: >-
  Node-RED is a flow-based programming editor (Node, file storage, no
  database). The repository is the source monorepo with no deployment, so
  overrides/docker-compose.yml runs the official nodered/node-red image of
  the current release, 5.0.7, on :1880 with /data on the `data` named volume.

  Security: the image's default settings.js leaves the editor and admin API
  open to anyone, and the editor can run arbitrary code (function and exec
  nodes). files/panelalpha/nodered/settings.js, mounted read-only as
  /data/settings.js, sets adminAuth (credentials, user `admin`, bcrypt) and a
  fixed credentialSecret, and refuses to start when either is missing.
  The login is generated by the engine (`credentials:` below), delivered in
  ~/.panelalpha/app-credentials.env and returned by
  GET /projects/{name}/app-credentials (MCP app_credentials_get);
  hooks/prepare.sh generates the secret once into
  ~/.panelalpha/nodered/admin.env (0600 in 0700); settings.js deletes them from the process environment after
  reading, so env.get() in a function node does not return them. The fixed
  secret keeps flows_cred.json decryptable across rebuilds; never change it.
  httpNodeAuth is deliberately unset: HTTP In endpoints are the user's own
  public API, like any site's pages. Set it in settings.js to put them behind
  basic auth. A `ready` service gates on the image's healthcheck.

  The editor needs its /comms websocket (debug output, node status). It works
  against the engine host; the *.panelalpha.online test relay strips
  `Upgrade` (panelalpha/engine#170), so on a test domain the editor shows
  "lost connection" while deploys over HTTP still work. Use a real domain.

  Measured on mariusz.panelalpha.tools (2026-09-28, engine 705f250a): deploy
  56s, rebuild 26s, app 59 MiB. Anonymous: /flows, /settings, /nodes,
  /diagnostics, /context/global, POST /flows and POST /nodes 401; /comms
  answers {"auth":"fail"} to a bad token; /.env, /.git/config, flows.json,
  flows_cred.json and settings.js 404. As admin: token via /auth/token, a
  flow deployed through POST /flows (http in -> function -> http response,
  plus an http request node with basic-auth credentials) answered, and
  env.get() of the password and secret returned undefined; after rebuild the
  flows, the pre-rebuild token and the decrypted credentials were all intact.
credentials:
  adopt_from: .panelalpha/nodered/admin.env
  fields:
    NODE_RED_ADMIN_USER: {kind: username, value: admin}
    NODE_RED_ADMIN_PASSWORD: {kind: password}
