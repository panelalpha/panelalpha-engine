# Compose-replace: the repository is ioBroker's shell installer, not a server.
# Runs ioBroker's official image of the current release instead.
services:
  app:
    image: iobroker/iobroker:v11.1.0
    # ioBroker keys its objects database to the host name; keep it stable
    # so a recreated container finds its own installation.
    hostname: iobroker
    restart: unless-stopped
    environment:
      TZ: Etc/UTC
    volumes:
      - data:/opt/iobroker
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8081/"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    mem_limit: 1536m

  # No-op gate: `compose up -d` returns only once the admin UI answers.
  ready:
    image: docker.io/library/alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  data: {}
