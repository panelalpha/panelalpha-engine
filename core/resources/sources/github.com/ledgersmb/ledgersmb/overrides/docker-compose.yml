# Compose-replace: upstream's ledgersmb-docker 1.13 compose from the 1.13.8
# image. The postgres password comes from ~/.panelalpha (hooks/prepare.sh).
services:
  postgres:
    # Upstream's major for 1.13; pinned, a datadir cannot move back a major.
    image: docker.io/library/postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/ledgersmb/db.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 512m

  lsmb:
    image: ghcr.io/ledgersmb/ledgersmb:1.13.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LSMB_WORKERS: "5"
    # nginx in the image serves the static assets and proxies to Starman.
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/login.pl"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  # No-op gate: `compose up -d` returns once LedgerSMB answers.
  ready:
    image: docker.io/library/alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      lsmb:
        condition: service_healthy
    mem_limit: 32m

volumes:
  pgdata: {}
