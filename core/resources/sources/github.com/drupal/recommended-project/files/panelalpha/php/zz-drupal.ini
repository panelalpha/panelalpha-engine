; PanelAlpha Drupal recipe. Loaded because the compose override names this
; directory in PHP_INI_SCAN_DIR; without it the container has no php.ini at all
; (engine #185) and runs on the compiled-in defaults.
;
; zz- so it sorts after the image's own docker-php-ext-*.ini files.

; The compiled-in default is 128M, which is below what a standard-profile
; install needs: install_drupal() holds the whole config graph -- ~900 objects
; across 50-odd modules -- in memory while it writes it. Measured peak on the
; install stage: 186 MB. Also the floor for an editor uploading an image that
; Drupal's image toolkit then derives four styles from.
memory_limit = 256M

; Off, and this is the one that matters. The compiled-in default is On, and a
; PHP warning rendered into a Drupal page prints /home/<account>/project/... to
; whoever triggered it. Drupal routes its own errors through its logger and
; shows nothing by default; this closes the path that goes around it.
display_errors = Off
display_startup_errors = Off
; Still reported -- Docker collects the container's stderr and the deploy log
; shows it. Silencing the log as well as the page would make a broken module
; invisible.
log_errors = On
error_log = /dev/stderr
; E_ALL minus the two Drupal contrib routinely trips, which would otherwise
; fill the account's log with third-party noise on every request.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; The version banner in the Server: header and on every 404 page, which is a
; free inventory of what to attack.
expose_php = Off

; Drupal's own minimum for the media it accepts is 2M; an editor uploading a
; PDF or a photo straight off a phone needs more, and the two have to move
; together or the larger one is never reachable.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 50

; The install stage runs under the CLI, which ignores this; it is here for the
; Apache module, where a cron run or a module install triggered from /admin can
; take longer than the default 30s.
max_execution_time = 120

; Drupal is an opcode-heavy application -- a request touches several hundred
; PHP files -- and the image enables OPcache but leaves the file count at the
; default 10000, which a Drupal 11 core plus contrib exceeds.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

; Drupal's status report asks for this by name: "Output buffering is not
; enabled. This may degrade Drupal's performance." -- measured on the first
; deploy of this recipe, before this line existed. php.ini-production ships
; 4096; the image ships no php.ini at all, so the compiled-in default (off)
; was what Drupal saw.
output_buffering = 4096

; Drupal writes session data itself through its own handler, but PHP's
; serialiser still decides how it is stored.
session.cookie_httponly = 1
session.use_strict_mode = 1
