# Compose-replace: the repo's compose builds from source (the Remix build asks
# for a 4 GB V8 heap) and its default profile is a bind-mounted dev server.
# This runs the image upstream publishes for its latest release.
services:
  app:
    # `stable` is the latest release, v1.0.0 (the main-branch images lack wrangler).
    image: ghcr.io/stackblitz-labs/bolt.diy:stable
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RUNNING_IN_DOCKER: "true"
      VITE_LOG_LEVEL: info
    # The image's own CMD: wrangler pages dev serving ./build on 5173.
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 1536m

  # No-op gate: `compose up -d` returns only once the app answers.
  ready:
    image: ghcr.io/stackblitz-labs/bolt.diy:stable
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m
