# Upstream config/nginx.conf (v0.26.1) plus the /config.json location.
server {
    listen       8080;
    server_name  localhost;

    root   /app;
    gzip_static on;
    gzip_vary on;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=30, stale-while-revalidate=30";
    }

    # assets can be cached because they have hashed filenames
    location /assets {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Generated by the config service from the project's env vars (recipe addition).
    location = /config.json {
        alias /etc/element-call/config.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location /apple-app-site-association {
        default_type application/json;
    }
}

