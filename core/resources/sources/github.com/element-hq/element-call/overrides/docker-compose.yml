# Compose-replace: the repo ships only dev/playwright compose files.
# Runs the published image of the current release.
services:
  app:
    image: ghcr.io/element-hq/element-call:v0.26.1
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Upstream nginx.conf plus a location serving the generated config.json.
      - ./element-call-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - element-call-config:/etc/element-call:ro
    depends_on:
      config:
        condition: service_completed_successfully
    mem_limit: 64m

  # Fails `compose up` (and so the deploy) while no homeserver is set; else writes config.json.
  config:
    image: ghcr.io/element-hq/element-call:v0.26.1
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "/element-call-config.sh"]
    environment:
      ELEMENT_CALL_HOMESERVER_URL: ${ELEMENT_CALL_HOMESERVER_URL:-}
      ELEMENT_CALL_SERVER_NAME: ${ELEMENT_CALL_SERVER_NAME:-}
      ELEMENT_CALL_LIVEKIT_SERVICE_URL: ${ELEMENT_CALL_LIVEKIT_SERVICE_URL:-}
    volumes:
      - ./element-call-config.sh:/element-call-config.sh:ro
      - element-call-config:/etc/element-call
    mem_limit: 32m

volumes:
  element-call-config: {}
