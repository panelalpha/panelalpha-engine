# Front proxy for Calibre-Web Automated (see overrides/docker-compose.yml).
# The engine's vhost sends `Connection: upgrade` on every request (engine#323);
# gevent then reads a POST body until EOF and every form POST hangs. Send
# `upgrade` only with a real Upgrade header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8083;
    # Book uploads.
    client_max_body_size 0;
    resolver 127.0.0.11 valid=10s;
    set $cwa http://calibre-web-automated:8083;

    location / {
        proxy_pass $cwa;
        proxy_http_version 1.1;
        # X-Forwarded-* pass through unchanged, so the app's ProxyFix (one
        # trusted hop) still sees what the engine's proxy appended.
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
