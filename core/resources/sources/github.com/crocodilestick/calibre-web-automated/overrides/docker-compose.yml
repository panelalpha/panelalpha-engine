# Compose-replace: the repo's docker-compose.yml is a template with
# /path/to/... bind mounts and a placeholder HARDCOVER_TOKEN. This runs the
# official release image with named volumes, closes the default admin login
# before the port is published, and fronts it with a small nginx (engine#323).
services:
  # One-shot, before the app exists: creates app.db and replaces
  # admin/admin123 with the engine's password (Calibre-Web's `cps.py -s`).
  set-admin:
    image: crocodilestick/calibre-web-automated:v4.0.7
    restart: "no"
    entrypoint: ["/bin/bash", "/panelalpha/set-admin.sh"]
    env_file:
      - .env
      - ../.panelalpha/calibre-web-automated/app.env
      # CWA_ADMIN_USER / CWA_ADMIN_PASSWORD, generated and kept by the engine.
      - ../.panelalpha/app-credentials.env
    volumes:
      - ./panelalpha:/panelalpha:ro
      - config:/config
    mem_limit: 512m

  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:v4.0.7
    restart: unless-stopped
    env_file:
      - .env
      - ../.panelalpha/calibre-web-automated/app.env
    environment:
      TZ: "UTC"
      NETWORK_SHARE_MODE: "false"
      # Served only over the engine's https proxy.
      SESSION_COOKIE_SECURE: "true"
    volumes:
      - config:/config
      - ingest:/cwa-book-ingest
      - library:/calibre-library
    depends_on:
      set-admin:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsL --max-time 5 http://127.0.0.1:8083/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 60s
    mem_limit: 2g

  # The only published port. The engine's vhost sends `Connection: upgrade` on
  # every request and gevent then never finishes reading a POST body
  # (engine#323); files/panelalpha/front.conf sends it only for real upgrades.
  web:
    image: nginx:1-alpine
    restart: unless-stopped
    volumes:
      - ./panelalpha/front.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8083:8083"
    depends_on:
      calibre-web-automated:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8083/login || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 64m

  # No-op gate: `up` returns only once the site answers (engine#204).
  ready:
    image: nginx:1-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 32m

volumes:
  config: {}
  ingest: {}
  library: {}
