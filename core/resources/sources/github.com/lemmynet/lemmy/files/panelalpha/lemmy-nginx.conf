# Upstream's internal proxy (lemmy-ansible nginx_internal.conf): lemmy-ui for
# pages, the lemmy backend for the API, pict-rs, feeds and federation.
worker_processes 1;
events {
    worker_connections 1024;
}
http {
    upstream lemmy {
        server "lemmy:8536";
    }
    upstream lemmy-ui {
        server "lemmy-ui:1234";
    }

    # The engine's proxy appends the visitor's address as the LAST
    # X-Forwarded-For hop; earlier entries are client-supplied.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    server {
        listen 8080;
        server_name _;
        server_tokens off;

        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_vary on;

        client_max_body_size 20M;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        location / {
            set $proxpass "http://lemmy-ui";
            if ($http_accept ~ "^application/.*$") {
                set $proxpass "http://lemmy";
            }
            if ($request_method = POST) {
                set $proxpass "http://lemmy";
            }
            proxy_pass $proxpass;

            rewrite ^(.+)/+$ $1 permanent;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location ~ ^/(api|pictrs|feeds|nodeinfo|version|.well-known) {
            proxy_pass "http://lemmy";
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
