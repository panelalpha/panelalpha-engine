# Upstream docker-compose.yml on the published v0.14.3 release image instead
# of a ~12 minute build, with MariaDB, named volumes and generated secrets.
x-pixelfed: &pixelfed
  image: ghcr.io/pixelfed/pixelfed:v0.14.3
  restart: unless-stopped
  env_file:
    # Optional project env vars (MAIL_*, OPEN_REGISTRATION, ...).
    - path: .env
      required: false
    # APP_KEY and DB_PASSWORD, generated once by hooks/prepare.sh.
    - ../.panelalpha/pixelfed/app.env
  volumes:
    - storage:/var/www/html/storage

# Values from upstream's .env.docker.example.
x-pixelfed-env: &pixelfed-env
  APP_NAME: Pixelfed
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${PA_PUBLIC_URL}
  APP_DOMAIN: ${PA_PUBLIC_HOST}
  ADMIN_DOMAIN: ${PA_PUBLIC_HOST}
  SESSION_DOMAIN: "null"
  TRUST_PROXIES: "*"
  OPEN_REGISTRATION: "false"
  ENFORCE_EMAIL_VERIFICATION: "true"
  OAUTH_ENABLED: "true"
  ENABLE_CONFIG_CACHE: "true"
  IMAGE_DRIVER: vips
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: pixelfed
  DB_USERNAME: pixelfed
  REDIS_CLIENT: phpredis
  REDIS_SCHEME: tcp
  REDIS_HOST: redis
  REDIS_PASSWORD: "null"
  REDIS_PORT: "6379"
  SESSION_DRIVER: database
  CACHE_STORE: redis
  QUEUE_DRIVER: redis
  BROADCAST_DRIVER: log
  LOG_CHANNEL: stderr
  HORIZON_PREFIX: horizon-
  ACTIVITY_PUB: "true"
  AP_REMOTE_FOLLOW: "true"
  AP_INBOX: "true"
  AP_OUTBOX: "true"
  AP_SHAREDINBOX: "true"
  PHP_POST_MAX_SIZE: 500M
  PHP_UPLOAD_MAX_FILE_SIZE: 500M
  PHP_OPCACHE_ENABLE: "1"

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    env_file: ../.panelalpha/pixelfed/app.env
    environment:
      MARIADB_DATABASE: pixelfed
      MARIADB_USER: pixelfed
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 128m

  pixelfed:
    <<: *pixelfed
    environment:
      <<: *pixelfed-env
      SSL_MODE: "off"
      LOG_OUTPUT_LEVEL: error
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        @service_worker path /sw.js
        header @service_worker Cache-Control "no-cache"
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_MIGRATION_ISOLATION: "true"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
      AUTORUN_LARAVEL_EVENT_CACHE: "true"
      AUTORUN_LARAVEL_ROUTE_CACHE: "true"
      AUTORUN_LARAVEL_VIEW_CACHE: "true"
      AUTORUN_LARAVEL_CONFIG_CACHE: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 30s
    mem_limit: 640m

  # One-shot, after migrations: the federation actor and the OAuth keys from
  # upstream's setup steps. Both are generated once and kept (DB / storage).
  init:
    <<: *pixelfed
    restart: "no"
    environment:
      <<: *pixelfed-env
      AUTORUN_ENABLED: "false"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        php artisan instance:actor
        [ -f storage/oauth-private.key ] || php artisan passport:keys
    depends_on:
      pixelfed:
        condition: service_healthy
    mem_limit: 256m

  horizon:
    <<: *pixelfed
    command: ["php", "artisan", "horizon"]
    environment:
      <<: *pixelfed-env
      AUTORUN_ENABLED: "false"
      # Upstream's auto balancing starts one worker per queue (~18 PHP
      # processes, over 1 GB); fixed small pools through its own env knobs.
      HORIZON_BALANCE_STRATEGY: "false"
      HORIZON_MAX_PROCESSES: "2"
      HORIZON_FANOUT_MAX_PROCESSES: "1"
      HORIZON_MEDIA_MAX_PROCESSES: "1"
      HORIZON_BACKGROUND_MAX_PROCESSES: "1"
      # Every CLI worker would map its own OPcache segment; long-running
      # workers load their code once anyway.
      PHP_OPCACHE_ENABLE: "0"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 768m

  scheduler:
    <<: *pixelfed
    command: ["php", "artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      <<: *pixelfed-env
      AUTORUN_ENABLED: "false"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s
    mem_limit: 256m

volumes:
  dbdata: {}
  redisdata: {}
  storage: {}
