# The repository compose is a development stack (Dockerfile-dev, source bind
# mount, S3 emulator); this is upstream's docs/deployment/docker.md on the
# release image.
services:
  app:
    image: chiefonboarding/chiefonboarding:v2.5.0
    restart: unless-stopped
    env_file:
      - ../.panelalpha/chiefonboarding/chief.env
    environment:
      ALLOWED_HOSTS: ${PA_PUBLIC_HOST}
      BASE_URL: ${PA_PUBLIC_URL}
      # Login lockout (django-axes) keys on the client IP. Upstream reads the
      # leftmost X-Forwarded-For entry, which the visitor sets;
      # X-Real-IP is the peer the engine vhost saw and cannot be spoofed.
      AXES_USE_FORWARDED_FOR: "False"
      AXES_IPWARE_META_PRECEDENCE_ORDER: HTTP_X_REAL_IP,REMOTE_ADDR
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # First boot runs collectstatic and every migration before gunicorn binds.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    mem_limit: 1g

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/chiefonboarding/chief.env
    environment:
      POSTGRES_USER: chief
      POSTGRES_DB: chiefonboarding
    volumes:
      - chief-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U chief -d chiefonboarding"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 384m

  ready:
    image: docker.io/library/alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m

volumes:
  chief-pgdata: {}
