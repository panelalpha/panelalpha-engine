# The repository ships only a Dockerfile; this runs upstream's published image
# of the latest release the way its README's compose example does.
services:
  app:
    image: selexin/cleanarr:v2.5.2
    restart: unless-stopped
    ports:
      - "5000:80"
    environment:
      # From the project's env vars; the check below refuses the required ones empty.
      PLEX_BASE_URL: ${PLEX_BASE_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      LIBRARY_NAMES: ${LIBRARY_NAMES:-Movies}
      BYPASS_SSL_VERIFY: ${BYPASS_SSL_VERIFY:-0}
      PAGE_SIZE: ${PAGE_SIZE:-50}
      PLEX_TIMEOUT: ${PLEX_TIMEOUT:-7200}
    volumes:
      - cleanarr-config:/config
    depends_on:
      plex-check:
        condition: service_completed_successfully
    mem_limit: 384m

  # One-shot: fails `compose up` (and so the deploy) naming each missing Plex setting.
  plex-check:
    image: selexin/cleanarr:v2.5.2
    restart: "no"
    entrypoint: ["/bin/sh", "/plex-check.sh"]
    environment:
      PLEX_BASE_URL: ${PLEX_BASE_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
    volumes:
      - ./cleanarr-plex-check.sh:/plex-check.sh:ro
    mem_limit: 32m

volumes:
  cleanarr-config: {}
