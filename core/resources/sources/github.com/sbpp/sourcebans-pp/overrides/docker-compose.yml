# Upstream's docker-compose.prod.yml on the published image of the current
# release (2.2.1): the repo's root docker-compose.yml is the dev stack.
services:
  # One-shot: upstream's entrypoint installs headlessly and refuses to start
  # without the first Owner admin, so the deploy fails here naming what is
  # missing. Read from .env, not interpolated.
  check:
    image: ghcr.io/sbpp/sourcebans-pp:2.2.1
    restart: "no"
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        missing=""
        [ -n "$$INITIAL_ADMIN_NAME" ] || missing="$$missing INITIAL_ADMIN_NAME (the first admin's login name)"
        [ -n "$$INITIAL_ADMIN_STEAM" ] || missing="$$missing INITIAL_ADMIN_STEAM (their SteamID, e.g. STEAM_0:1:12345)"
        [ -n "$$INITIAL_ADMIN_EMAIL" ] || missing="$$missing INITIAL_ADMIN_EMAIL"
        [ -n "$$INITIAL_ADMIN_PASSWORD" ] || missing="$$missing INITIAL_ADMIN_PASSWORD"
        if [ -n "$$missing" ]; then
          echo "Error: set in the project's environment variables:$$missing"
          exit 1
        fi
    mem_limit: 64m

  db:
    image: mariadb:11.8
    restart: unless-stopped
    env_file: ../.panelalpha/sourcebans/db.env
    environment:
      MARIADB_DATABASE: sourcebans
      MARIADB_USER: sourcebans
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 512m

  web:
    image: ghcr.io/sbpp/sourcebans-pp:2.2.1
    restart: unless-stopped
    depends_on:
      check:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    # .env: INITIAL_ADMIN_*, optional STEAMAPIKEY / SB_EMAIL.
    # app.env: DB_PASS and SB_SECRET_KEY generated by hooks/prepare.sh.
    env_file:
      - .env
      - ../.panelalpha/sourcebans/app.env
    environment:
      DB_HOST: db
      DB_NAME: sourcebans
      DB_USER: sourcebans
    ports:
      - "8080:80"
    volumes:
      # Uploaded ban-evidence demos must persist; cache and templates_c are
      # upstream's volumes too.
      - demos:/var/www/html/web/demos
      - cache:/var/www/html/web/cache
      - smarty:/var/www/html/web/templates_c
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "8", "http://127.0.0.1/health.php"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s
    mem_limit: 512m

  # No-op gate: `compose up -d` returns only once the panel answers.
  ready:
    image: mariadb:11.8
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 32m

volumes:
  dbdata: {}
  demos: {}
  cache: {}
  smarty: {}
