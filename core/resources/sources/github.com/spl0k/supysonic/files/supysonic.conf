; Read from the working directory (/app). The defaults live in /tmp/supysonic,
; which a container restart loses; /var/lib/supysonic is a named volume.
[base]
database_uri = sqlite:////var/lib/supysonic/supysonic.db

[webapp]
cache_dir = /var/lib/supysonic/cache
log_level = INFO

[daemon]
socket = /var/lib/supysonic/supysonic.sock
