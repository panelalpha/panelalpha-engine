# The repo ships no compose file; the Go build cannot run yarr (cgo-only
# SQLite driver). This runs the official image of the current release.
services:
  app:
    image: ghcr.io/nkanaev/yarr:v2.9
    restart: unless-stopped
    environment:
      YARR_ADDR: 0.0.0.0:7070
      YARR_DB: /data/yarr.db
      YARR_AUTH: ${YARR_AUTH:-}
    volumes:
      - data:/data
    ports:
      - "7070:7070"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s
    mem_limit: 256m

  # No-op gate: `compose up -d` returns only once yarr answers.
  ready:
    image: ghcr.io/nkanaev/yarr:v2.9
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  data: {}
