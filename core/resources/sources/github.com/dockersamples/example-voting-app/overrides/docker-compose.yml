# Upstream's docker-compose.images.yml (prebuilt images). Health checks inline
# rather than from ./healthchecks, and `vote` is the only published port.
services:
  vote:
    image: dockersamples/examplevotingapp_vote
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:80"

  result:
    image: dockersamples/examplevotingapp_result
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: dockersamples/examplevotingapp_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 30

volumes:
  db-data: {}
