# Compose-replace: upstream's deployment/docker-compose on the release image
# instead of the repo's source build (which runs test suites); MongoDB 7.0.
services:
  notifo:
    image: squidex/notifo:1.3.0
    restart: unless-stopped
    depends_on:
      notifo_mongo:
        condition: service_healthy
    environment:
      URLS__BASEURL: ${PA_PUBLIC_URL}
      ASPNETCORE_URLS: http://+:5000
      STORAGE__MONGODB__CONNECTIONSTRING: mongodb://notifo_mongo
      ASSETSTORE__TYPE: Folder
      ASSETSTORE__FOLDER__PATH: /app/Assets
      # appsettings.json ships notifo.io's own Google/GitHub OAuth clients; empty disables them.
      IDENTITY__GOOGLECLIENT: ""
      IDENTITY__GITHUBCLIENT: ""
    volumes:
      - notifo_assets:/app/Assets
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: 1536m

  notifo_mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - notifo_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  # No-op gate: `compose up -d` returns once Notifo answers /healthz.
  ready:
    image: mongo:7.0
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      notifo:
        condition: service_healthy
    mem_limit: 32m

volumes:
  notifo_assets: {}
  notifo_mongo: {}
