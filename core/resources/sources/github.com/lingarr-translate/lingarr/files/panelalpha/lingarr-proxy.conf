# The only thing on the account's port. Lingarr gates its controllers itself;
# this adds a session check where upstream has none:
#   /api/auth/signup, /api/auth/onboarding  [AllowAnonymous], no "admin exists"
#       check (AuthController.cs): anyone could add a user or turn auth off.
#   /signalr/*  hubs without [Authorize]: live translation lines, errors.
# Locations match nginx's normalised, case-insensitively compared path, while
# the raw $request_uri is what goes upstream.

map $http_upgrade $lingarr_connection {
    default upgrade;
    ''      close;
}

server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 50m;

    # Per-request lookup, so nginx never pins a stale address for `app`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $lingarr app:9876;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 300s;

    # 200 for a valid Lingarr.Auth cookie (or when an admin disabled auth),
    # 401 otherwise.
    location = /_lingarr_session {
        internal;
        proxy_pass http://$lingarr/api/auth/authenticated;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location ~* /auth/+(signup|onboarding) {
        auth_request /_lingarr_session;
        proxy_pass http://$lingarr$request_uri;
    }

    location ~* ^/+signalr {
        auth_request /_lingarr_session;
        proxy_pass http://$lingarr$request_uri;
        # A location that sets any header inherits none from the server block.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $lingarr_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://$lingarr$request_uri;
    }
}
