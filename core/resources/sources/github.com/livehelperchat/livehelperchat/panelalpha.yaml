# yaml-language-server: $schema=../../../_schema.json
description: >-
  Live Helper Chat, live-support chat (PHP >= 8.2, MySQL). The plain deploy
  builds the repo's Dockerfile, which is stale: FROM php:7.4-apache (the README
  requires PHP 8.2) on an archived Debian, so `apt-get update` fails with exit
  code 100 and nothing starts.

  The application is lhc_web/ (composer.json, index.php), so this runs it on
  the engine's php platform with app_root: lhc_web: Composer and the frontend
  build run as the platform does, Apache serves lhc_web/, and the account's
  MySQL is provisioned (database: mysql; its DB_* values are what the
  customer enters in LHC's own installer, left as upstream ships it).
  Redeploys wipe ~/project, so the settings file the installer writes is
  bind-mounted from ~/.panelalpha/lhc/settings.ini.php (created empty, 0600,
  by hooks/prepare.sh) and the upload directories under var/ are named
  volumes, handed to the account user by a one-shot service.
extends: php
app_root: lhc_web
database: mysql
commands:
  - id: database-login
    stage: [install, upgrade]
    description: >-
      The installer writes the database login into settings.ini.php once,
      and the file lives in ~/.panelalpha. A staging or clone copies it while
      the engine hands the copy a database of its own in DB_*, so the db
      settings are put back from DB_* on every boot, in the form Live Helper
      Chat saves them in, and nothing is written while they already match.
      Left alone until the installer has marked the site installed.
    run: >-
      php -r '
      $f = "/app/settings/settings.ini.php";
      $c = is_file($f) ? include $f : null;
      if ((string) getenv("DB_DATABASE") === "" || ($c["settings"]["site"]["installed"] ?? false) !== true || !is_array($c["settings"]["db"] ?? null)) { exit(0); }
      $n = $c;
      $n["settings"]["db"] = array_replace($c["settings"]["db"], ["host" => getenv("DB_HOST"), "port" => (int) getenv("DB_PORT"), "user" => getenv("DB_USERNAME"), "password" => getenv("DB_PASSWORD"), "database" => getenv("DB_DATABASE")]);
      if ($n === $c) { exit(0); }
      if (file_put_contents($f, "<?php\n return " . var_export($n, true) . ";\n?>") === false) { fwrite(STDERR, "database-login: cannot rewrite $f\n"); exit(1); }
      fwrite(STDERR, "database-login: $f now points at database " . getenv("DB_DATABASE") . "\n");
      '
