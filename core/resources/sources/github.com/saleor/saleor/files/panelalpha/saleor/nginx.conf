# The account's front door.
#
# Saleor with DEBUG off routes five things and nothing else (saleor/urls.py):
# /graphql/, /plugins/..., /thumbnail/..., /image/... and
# /.well-known/jwks.json. urls.py:55 adds /, /static/ and /media/ only `if
# settings.DEBUG`, using views the file's own docstring calls unsuitable for
# production -- so with DEBUG off nothing serves them, and
# saleor/thumbnail/views.py:164 answers every product-image request with a
# redirect into /media/. Without this container every image in the shop is a
# 404. Upstream's deployment docs assume a web server or an object store in
# front for exactly this; here it is a web server.

map $http_x_forwarded_proto $pa_proto {
    # The engine's proxy sets X-Forwarded-Proto (templates/
    # virtualHost-nginx-proxy.blade.php:37) and Saleor honours it through
    # SECURE_PROXY_SSL_HEADER (settings.py:521). Pass it through rather than
    # overwriting with $scheme, which is always http on this hop.
    default $http_x_forwarded_proto;
    # Nothing reaches this port without going through that proxy except the
    # healthcheck. Calling it https keeps SECURE_SSL_REDIRECT -- which
    # settings.py:212 turns on whenever PUBLIC_URL is https -- from answering
    # the healthcheck with a 301 to a scheme it cannot speak.
    ''      https;
}

server {
    listen 8080 default_server;
    server_name _;

    # nginx's default is 1 MB, which would reject a product photo before Saleor
    # ever saw it. Saleor sets no upload ceiling of its own -- it overrides
    # neither FILE_UPLOAD_MAX_MEMORY_SIZE nor DATA_UPLOAD_MAX_MEMORY_SIZE, so
    # Django's 2.5 MB spill-to-disk threshold applies and nothing above it does
    # -- which means this line is the only limit in the stack. 64 MB is larger
    # than any product image and small enough that a stuck upload does not fill
    # the account's disk.
    client_max_body_size 64m;
    server_tokens off;

    # The image's collectstatic output, copied into this volume by init.sh.
    # Hashed filenames, so a long cache is safe.
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # User uploads: product images, and whatever an installed app writes.
    # autoindex is off by default and is named here so that stays true --
    # MEDIA_ROOT holds every image in the shop and a listing of it is a
    # catalogue of the account's files.
    location /media/ {
        alias /srv/media/;
        autoindex off;
        access_log off;
        expires 7d;
        # Product photos are shop content and are served to anyone, which is
        # what a storefront needs. Nothing else is written here by Saleor.
        # Executable content is not: a plugin that stored one would otherwise
        # have it run by whatever opens it.
        add_header X-Content-Type-Options nosniff;
        add_header Content-Disposition "inline";
    }

    # Belt and braces. Nothing under ~/project is inside this container at all
    # -- only the two volumes above and the config are mounted -- but an alias
    # is one typo away from a path traversal and a dotfile rule costs nothing.
    #
    # The lookahead is not decoration. /.well-known/jwks.json is a real Saleor
    # route (saleor/urls.py, name="jwks"): it publishes the public half of the
    # key every access token is signed with, and an app or a storefront that
    # verifies tokens itself fetches it. A plain `location ~ /\.` rule answers
    # it 403 -- measured, on the first build of this file -- which breaks token
    # verification for every client while leaving the API itself looking fine.
    # nginx normalises the URI before matching, so /.well-known/../.env is
    # /.env here and is still denied.
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
    }

    # / is not a Saleor route with DEBUG off, so it would be a bare Django 404
    # page. Point it at the one endpoint this deployment has instead: an owner
    # who opens their new site in a browser lands on the GraphQL console rather
    # than on an error.
    location = / {
        return 302 /graphql/;
    }

    location / {
        # Resolved per request, not at startup. nginx resolves a literal
        # upstream name once, while reading the config, and exits with
        # "host not found in upstream" if it is not in DNS yet -- which on a
        # first deploy it is not, because `api` waits on the one-shot `init`
        # and nginx does not. Measured: three restart loops and a failed
        # deploy. A variable defers the lookup to the request, so nginx comes
        # up, answers 502 until the API is there, and the healthcheck below is
        # what decides whether the deploy is finished. It also means a
        # restarted api container is picked up rather than cached forever.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $pa_api api;
        proxy_pass http://$pa_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pa_proto;
        proxy_set_header X-Forwarded-Host  $host;
        # A GraphQL mutation that triggers a synchronous webhook, or a bulk
        # product import, outlives nginx's 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Buffering a multi-megabyte introspection response to disk before
        # sending a byte of it adds latency for no gain.
        proxy_buffering off;
    }
}
