# The stack for a repository that ships no compose file Docker would load: the
# only one in the tree is .devcontainer/docker-compose.yml, which the compose
# probe never looks at, and which builds a development container that sleeps.
#
# Saleor is built from this checkout rather than pulled. That is the opposite of
# what most Python recipes should do, and it is right here for one reason: the
# root Dockerfile is the file CI publishes the official image from
# (.github/workflows/publish-containers.yml hands this context to a shared
# build-push action), so there is no CI step that the checkout lacks -- no
# separate frontend build, no generated asset. Building means a fork, a branch
# or a pinned commit gets its own code, which no image tag could give it.
#
# Every value here is literal or uses compose's ${VAR:-default} form. A bare
# ${VAR} would interpolate to an empty string (engine#212), which for
# POSTGRES_PASSWORD means a database that trusts everyone.
services:
  db:
    # The version upstream's own .devcontainer/docker-compose.yml runs. Pinned
    # to the major rather than floating: Postgres does not downgrade a data
    # directory, so a floating tag is a one-way door the account cannot come
    # back through.
    image: docker.io/library/postgres:15-alpine
    restart: unless-stopped
    # POSTGRES_PASSWORD only -- written once into ~/.panelalpha/saleor/ by
    # hooks/prepare.sh, because ~/project is emptied before every clone
    # (engine#173) and a regenerated password would lock Saleor out of this
    # volume for good.
    env_file:
      - ../.panelalpha/saleor/saleor.env
    environment:
      POSTGRES_DB: saleor
      POSTGRES_USER: saleor
      # postgres refuses to initialise into a non-empty directory, and a volume
      # mounted at the data directory is not always empty (lost+found).
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleor -d saleor -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 256m

  # Celery's broker and Django's cache. Upstream's devcontainer runs Valkey
  # rather than Redis and Saleor speaks to it with the redis:// client either
  # way; this follows what upstream runs.
  #
  # Two databases on one server: 0 is the cache, 1 is the broker
  # (.devcontainer/backend.env uses the same split). Broker data is queued work
  # and is worth keeping across a restart, so the volume is real; the cache half
  # is disposable and `allkeys-lru` lets it be evicted rather than making the
  # server refuse writes when the cap is reached.
  cache:
    image: docker.io/valkey/valkey:8.1-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "60"
      - "1"
    volumes:
      - cachedata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    mem_limit: 96m

  # One-shot. Migrates, publishes the static files the image built, and creates
  # this account's superuser, then exits 0. `api` will not start until it has.
  #
  # `docker compose up -d` runs without --wait (engine#204), so a deploy is
  # "finished" once containers have been *started*; a one-shot that exited 1
  # would leave the deploy green. A depends_on condition is the one thing
  # compose does block on, which is why both gates in this file are conditions
  # rather than scripts that check afterwards.
  init:
    # One image, three services. Compose builds a service's context once and the
    # shared tag is what `api` and `worker` then run, so the 220-package uv sync
    # happens once per deploy rather than three times. The name has no `/` in
    # it, which is what makes DeployCompose::builtImageName read it as a local
    # tag rather than a registry reference it should pull.
    image: saleor-app:local
    build:
      context: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file:
      - .env
      - ../.panelalpha/saleor/saleor.env
    environment: &saleor_env
      # settings.py:86 defaults this to True, which on a public domain means
      # Django's debug page -- 406 settings rows and a traceback with local
      # variables -- is the error page. Off is the whole reason the three
      # values under it have to be supplied.
      DEBUG: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: saleor
      POSTGRES_USER: saleor
      # db 0 cache, db 1 broker. CELERY_TASK_ALWAYS_EAGER is settings.py:643's
      # answer to an empty CELERY_BROKER_URL, and eager mode does not run the
      # beat schedule -- see files/panelalpha/saleor/worker.sh.
      CACHE_URL: redis://cache:6379/0
      CELERY_BROKER_URL: redis://cache:6379/1
      # Not a real address and not meant to survive: ComposePlaceholders
      # rewrites a bare http://localhost under a key ending in _URL to the
      # account's public https address before the stack starts
      # (ComposePlaceholders::PUBLIC_URL_KEY_PATTERN). env.sh turns it into
      # ALLOWED_HOSTS, ALLOWED_CLIENT_HOSTS and Saleor's own PUBLIC_URL.
      PA_PUBLIC_URL: http://localhost
      PYTHONUNBUFFERED: "1"
    volumes:
      - media:/app/media
      - staticfiles:/srv/static
    # /app/panelalpha/saleor is inside the image, not a mount: the Dockerfile's
    # `COPY . /app` picks up what files/ wrote, and .dockerignore excludes `.*`,
    # media, static and node_modules but not panelalpha/. A bind mount would be
    # the obvious way to do this and is the one thing that must not happen on a
    # service that builds -- see hooks/prepare.sh section 2.
    entrypoint: ["/bin/sh", "/app/panelalpha/saleor/init.sh"]
    mem_limit: 768m

  api:
    image: saleor-app:local
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    env_file:
      - .env
      - ../.panelalpha/saleor/saleor.env
    environment: *saleor_env
    volumes:
      - media:/app/media
    entrypoint: ["/bin/sh", "/app/panelalpha/saleor/api.sh"]
    mem_limit: 900m

  # Celery worker with beat embedded. Not optional: without it a product is
  # never indexed for search and a promotion never reaches a price.
  worker:
    image: saleor-app:local
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    env_file:
      - .env
      - ../.panelalpha/saleor/saleor.env
    environment: *saleor_env
    volumes:
      # An export task or a thumbnail generated off the request path writes here.
      - media:/app/media
    entrypoint: ["/bin/sh", "/app/panelalpha/saleor/worker.sh"]
    mem_limit: 640m

  # /static/ and /media/, which Saleor stops routing the moment DEBUG is off,
  # and a proxy for everything else. See files/panelalpha/saleor/nginx.conf.
  #
  # A bare `nginx` image is not mistaken for the host's own reverse proxy:
  # HostIngress::PROXY_REPOSITORIES is owner-qualified (jwilder/nginx-proxy,
  # nginxproxy/nginx-proxy) precisely so an application's own nginx survives.
  web:
    image: docker.io/library/nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./panelalpha/saleor/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/srv/static:ro
      - media:/srv/media:ro
    healthcheck:
      # Through the proxy on purpose: this is the only healthcheck in the file
      # and it has to prove the API answers, not that nginx started. A GET of
      # /graphql/ renders the playground, which is a real Django response
      # through the whole chain -- if `api` is down nginx answers 502 and this
      # fails. 127.0.0.1 is in ALLOWED_HOSTS because env.sh puts it there.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/graphql/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    mem_limit: 64m

  # Does nothing and exits 0. `docker compose up -d` runs without --wait
  # (engine#204), so without this the deploy is finished while Saleor is still
  # booting. Compose does block on a depends_on health condition, so a service
  # that waits on web's healthcheck makes `up -d` return only once the API
  # answers. alpine, not the Saleor image: nothing extra is pulled and nothing
  # large starts. A clean exit 0 is not a crash loop as far as AppHealth is
  # concerned.
  ready:
    image: docker.io/library/alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 64m

volumes:
  pgdata: {}
  cachedata: {}
  media: {}
  staticfiles: {}
