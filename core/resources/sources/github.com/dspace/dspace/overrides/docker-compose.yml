# Compose-replace: the repository's docker-compose.yml builds a -test image
# from source with a config bind mount. This runs upstream's published images
# of the current release, backend + Solr + PostgreSQL as that file does, plus
# the Angular UI from dspace/src/main/docker-compose/docker-compose-angular.yml,
# behind one nginx so the UI and /server share the site's address.
services:
  dspacedb:
    # Upstream's default major; Postgres cannot open a newer major's datadir.
    image: docker.io/library/postgres:15
    restart: unless-stopped
    env_file:
      - ../.panelalpha/dspace/db.env
    environment:
      PGDATA: /pgdata
      POSTGRES_DB: dspace
      POSTGRES_USER: dspace
    volumes:
      - pgdata:/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dspace -d dspace -q"]
      interval: 5s
      timeout: 5s
      retries: 30

  dspacesolr:
    image: docker.io/dspace/dspace-solr:dspace-10.1
    restart: unless-stopped
    working_dir: /var/solr/data
    volumes:
      - solr_data:/var/solr/data
    user: root
    # Upstream's entrypoint: create the cores (a no-op once they exist), then
    # run Solr as the solr user.
    entrypoint:
      - /bin/bash
      - -c
      - |
        init-var-solr
        for core in authority oai search statistics qaevent suggestion audit; do
          precreate-core $$core /opt/solr/server/solr/configsets/$$core
          cp -r /opt/solr/server/solr/configsets/$$core/* $$core
        done
        chown -R solr:solr /var/solr
        runuser -u solr -- solr-foreground

  dspace:
    image: docker.io/dspace/dspace:dspace-10.1
    restart: unless-stopped
    env_file:
      - ../.panelalpha/dspace/app.env
    environment:
      dspace__P__server__P__url: ${PA_PUBLIC_URL}/server
      dspace__P__server__P__ssr__P__url: http://dspace:8080/server
      dspace__P__ui__P__url: ${PA_PUBLIC_URL}
      dspace__P__name: DSpace
      db__P__url: jdbc:postgresql://dspacedb:5432/dspace
      db__P__username: dspace
      solr__P__server: http://dspacesolr:8983/solr
      LOGGING_CONFIG: /dspace/config/log4j2-container.xml
      # The image's JAVA_OPTS is never read by its `java -jar` entrypoint.
      JAVA_TOOL_OPTIONS: -Xmx1g
    volumes:
      - assetstore:/dspace/assetstore
    depends_on:
      dspacedb:
        condition: service_healthy
      dspacesolr:
        condition: service_started
    # Upstream's: migrate the database, then start the backend.
    entrypoint:
      - /bin/bash
      - -c
      - |
        /dspace/bin/dspace database migrate
        exec java -jar /dspace/webapps/server-boot.jar
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://127.0.0.1:8080/server/api || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

  dspace-angular:
    image: docker.io/dspace/dspace-angular:dspace-10.1-dist
    restart: unless-stopped
    environment:
      DSPACE_UI_SSL: "false"
      DSPACE_UI_HOST: 0.0.0.0
      DSPACE_UI_PORT: "4000"
      DSPACE_UI_NAMESPACE: /
      DSPACE_UI_BASEURL: ${PA_PUBLIC_URL}
      DSPACE_REST_SSL: "true"
      DSPACE_REST_HOST: ${PA_PUBLIC_HOST}
      DSPACE_REST_PORT: "443"
      DSPACE_REST_NAMESPACE: /server
      DSPACE_REST_SSRBASEURL: http://dspace:8080/server
    volumes:
      # Two pm2 workers instead of one per host CPU.
      - ./panelalpha/dspace/dspace-ui.json:/app/dspace-ui.json:ro
    depends_on:
      dspace:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  proxy:
    image: docker.io/library/nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./panelalpha/dspace/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - dspace
      - dspace-angular
    mem_limit: 64m

  # No-op gate: `up` returns only once the UI answers.
  ready:
    image: docker.io/library/alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      dspace-angular:
        condition: service_healthy
      proxy:
        condition: service_started
    mem_limit: 32m

volumes:
  pgdata: {}
  solr_data: {}
  assetstore: {}
