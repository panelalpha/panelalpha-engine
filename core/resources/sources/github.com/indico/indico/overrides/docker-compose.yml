# Compose-replace: the repository is the Python/JS source. Runs upstream's
# production setup (indico/indico-containers, indico-prod) on the published
# getindico/indico image of the current release. Secrets and PG* come from
# ~/.panelalpha (hooks/prepare.sh); declared here they trip engine#419.
x-indico: &indico
  image: getindico/indico:3.3.13
  restart: unless-stopped
  env_file:
    - ../.panelalpha/indico/indico.env
  environment:
    INDICO_BASE_URL: ${PA_PUBLIC_URL}
    INDICO_TIMEZONE: ${INDICO_TIMEZONE:-UTC}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_USE_TLS: ${SMTP_USE_TLS:-}
    INDICO_NO_REPLY_EMAIL: ${INDICO_NO_REPLY_EMAIL:-}
    INDICO_SUPPORT_EMAIL: ${INDICO_SUPPORT_EMAIL:-}
  volumes:
    - archive:/opt/indico/archive
    - customization:/opt/indico/custom
    - static-files:/opt/indico/static-shared
    - indico-logs:/opt/indico/log
    # files/panelalpha-indico/ (this recipe)
    - ./panelalpha-indico/indico.conf:/opt/indico/etc/indico.conf:ro
    - ./panelalpha-indico/logging.yaml:/opt/indico/etc/logging.yaml:ro
  tmpfs:
    - /opt/indico/tmp:mode=0777

services:
  # Copies static files to the shared volume, prepares the DB on first boot,
  # then runs uWSGI on :59999.
  indico-web:
    <<: *indico
    command: /opt/indico/run_indico.sh
    depends_on:
      indico-postgres:
        condition: service_healthy
      indico-redis:
        condition: service_started
    healthcheck:
      # Any HTTP answer: uWSGI starts only after the DB is prepared.
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://127.0.0.1:59999/"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
    mem_limit: 1024m

  indico-celery:
    <<: *indico
    command: /opt/indico/run_celery.sh
    depends_on:
      indico-web:
        condition: service_healthy
    mem_limit: 512m

  indico-celery-beat:
    <<: *indico
    command: /opt/indico/run_celery.sh beat
    depends_on:
      indico-web:
        condition: service_healthy
    mem_limit: 256m

  indico-redis:
    image: redis:7.4
    restart: unless-stopped
    volumes:
      - redis:/data
    mem_limit: 128m

  indico-postgres:
    image: postgres:15-bookworm
    restart: unless-stopped
    env_file:
      - ../.panelalpha/indico/indico.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indico -d indico"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 384m

  # Upstream's nginx: static files from the shared volume, the rest to uWSGI.
  indico-nginx:
    image: ghcr.io/nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - static-files:/opt/indico/static:ro
      - ./panelalpha-indico/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      indico-web:
        condition: service_healthy
    mem_limit: 64m

volumes:
  postgres-data: {}
  archive: {}
  static-files: {}
  customization: {}
  indico-logs: {}
  redis: {}
