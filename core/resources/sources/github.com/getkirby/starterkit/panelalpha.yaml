# yaml-language-server: $schema=../../../_schema.json
#
# Kirby Starterkit -- the runnable flat-file CMS (getkirby/starterkit,
# "type": "project", ships a root index.php that requires kirby/bootstrap.php).
# It is a PHP application, so this extends `php`: the shared base image serves
# ~/project as the document root with Apache and .htaccess honoured.
#
# The whole point of the recipe is persistence. Kirby's database is three
# directories inside the checkout -- content/ (pages + files), site/accounts/
# (Panel password hashes) and site/config/ (config + the content.salt). A
# rebuild empties ~/project (engine#173, ProjectTree::clearContents), so those
# three are moved to ~/.panelalpha/kirby -- the only writable, rebuild-surviving
# place (the home is root-owned, Project.php:813) -- and symlinked back in
# hooks/prepare.sh. The start command creates the first Panel admin from a
# persisted password before Apache binds, so /panel/installation is closed
# before the port ever opens (engine#200).
description: 'Kirby Starterkit, the runnable flat-file CMS. Extends php. Kirby stores its content, Panel accounts and config as files inside the checkout, which a rebuild wipes; the recipe persists them in ~/.panelalpha/kirby and symlinks them back, and creates the first Panel admin before the port opens.'
extends: php

# The starterkit serves from its own root (root index.php + .htaccess); there is
# no public/. PhpDocroot folds '' and '.' to the same result here because the
# root has an index.php (engine#172), but declare it so PA_DOCROOT is /app by
# intent rather than by detection.
docroot: .

commands:
  # The php platform installs getkirby/cms into vendor/ (host build, and the
  # base image re-runs composer if vendor is missing). kirby/bootstrap.php
  # prefers /app/vendor/autoload.php when it exists, so index.php's bare
  # `new Kirby()` (no explicit roots) autodetects its index root from Kirby's
  # location -- /app/vendor/getkirby -- and reads content/, site/ and
  # accounts/ from that empty tree, so every page 404s. The starterkit ships
  # its whole runtime in the committed kirby/ (it is a downloadable zip, not a
  # composer install), so the vendor tree is redundant. Removing it makes the
  # bootstrap fall back to kirby/vendor/autoload.php, and the index root
  # resolves to /app. before: true so it runs ahead of the admin bootstrap and
  # the serve command. Configuration (dropping an engine-generated build
  # artifact), not a source patch.
  - id: kirby-drop-vendor
    stage: start
    before: true
    description: 'Remove the redundant composer vendor tree so Kirby loads from the committed kirby/ and resolves its index root to /app.'
    run: 'rm -rf /app/vendor'

  # Runs in the app container (php + kirby are present) at every boot, before
  # the serve command execs Apache -- so on the first boot the admin exists
  # before the port opens (engine#200, first-visitor-wins). Idempotent: it
  # does nothing once a Panel user exists, so a redeploy keeps the persisted
  # account and its password untouched. Single-line description on purpose
  # (a multi-line one crash-loops the container, engine#198).
  - id: kirby-init-admin
    stage: start
    description: 'Create the first Panel admin from the persisted password before Apache binds, closing /panel/installation before the port opens.'
    run: 'php /data/pa-kirby-init.php'
