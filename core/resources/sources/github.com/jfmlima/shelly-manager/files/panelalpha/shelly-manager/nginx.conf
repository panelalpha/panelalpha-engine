# Upstream packages/web/nginx.conf (v1.10.0) plus the /api proxy below: the
# account publishes one port, so the UI reaches the API on its own origin.
server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # The API, on the same origin (^~ so the asset regex below cannot take it).
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Bulk operations and firmware updates run long.
        proxy_read_timeout 600s;
        client_max_body_size 100m;
    }

    # Handle React Router (SPA routing)
    # Revalidate the document: it names the hashed asset files, so a cached
    # copy keeps loading an earlier build's bundle. expires rather than
    # add_header, which would drop the inherited security headers.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # Rewritten at container start with the API URL, so it cannot be cached as
    # a build artefact. Exact match, which the extension rule below cannot beat.
    location = /config.js {
        expires -1;
    }

    # The alpine nginx mime.types has no webmanifest entry, so it would be
    # served as application/octet-stream.
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Security: deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
