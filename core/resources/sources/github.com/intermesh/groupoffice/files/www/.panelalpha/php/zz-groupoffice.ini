; Written by PanelAlpha. Reached through PHP_INI_SCAN_DIR, which the compose
; override sets to `/usr/local/etc/php/conf.d:/app/.panelalpha/php`.
;
; The shared PHP base image loads no php.ini at all -- `Loaded Configuration
; File => (none)`, measured -- so every value below is PHP's compiled-in
; default until something says otherwise, and there is no per-host ini to say
; it in (engine#185). PHP reads PHP_INI_SCAN_DIR from its own environment
; whatever the SAPI, so this file reaches both the Apache module that takes an
; attachment upload and the CLI that runs the install.
;
; The directory lives at /app/.panelalpha -- a dot directory, so the generated
; vhost's <DirectoryMatch "/\.(?!well-known)"> denies it. The document root is
; /app itself here, so that matters.

; --- what a groupware site actually has to accept ---------------------------
;
; The compiled-in post_max_size is 8M and upload_max_filesize is 2M, and Group
; Office reports both to its client as maxSizeRequest and maxSizeUpload -- so
; without this the browser refuses a 3 MB attachment before it is sent. 64M is
; a mail attachment, a scanned contract in the Files module or a contact photo
; set; post_max_size is a little larger so a multipart body with a file plus
; its fields still fits.
upload_max_filesize = 64M
post_max_size = 72M
max_file_uploads = 40

; Group Office's own installer sets max_execution_time to 0 for the duration of
; the install; ordinary requests should not run for two minutes, but a
; mailbox sync or a large ICS import can, and 30s is the compiled-in default.
max_execution_time = 120
max_input_time = 120
; The client sends whole JMAP batches; the default 1000 input variables is
; low for a form with a long custom-field set.
max_input_vars = 4000

; 128M is the compiled-in default and Group Office's own system test asks for
; more: PhpSpreadsheet exports, TCPDF rendering and imagick thumbnails are the
; peaks. Well inside the container's mem_limit.
memory_limit = 256M

; --- what should never reach a visitor --------------------------------------
;
; display_errors defaults to on with no ini, which on this application put an
; absolute path and a stack frame into the response body. Diagnostics belong in
; the container's error log, which the vhost already points at stderr.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; expose_php defaults to On, which puts `X-Powered-By: PHP/8.2.33` on every
; response -- the exact patch level, for free.
expose_php = Off

; --- session and cookies ----------------------------------------------------
;
; Group Office sets its own cookie flags on the `groupoffice` and `accessToken`
; cookies (secure, HttpOnly, SameSite=Lax) but not on PHP's own session cookie,
; which the legacy half still uses. The site is https-only behind the engine's
; proxy.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; --- misc -------------------------------------------------------------------
;
; Everything inside the container is UTC and Group Office stores UTC; users pick
; their own timezone in their profile. Without this PHP warns on every date call
; that reads the default.
date.timezone = UTC
