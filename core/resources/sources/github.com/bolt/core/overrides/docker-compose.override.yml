# Layers over the compose file the php strategy generates. That file is right
# about the app -- the shared PHP base image, ~/project bind-mounted at /app,
# the account's own uid, PA_DOCROOT=/app/public, Apache on 8000 -- and says
# nothing about when Bolt is ready, because nothing in a PHP checkout can.
#
# An override rather than a replacement compose file, and here that is not a
# preference: an `overrides/docker-compose.yml` is written into the checkout
# *before* detection runs, so a compose file in the project root would make
# Bolt look like a compose project and take the php strategy -- and with it the
# bind mount, the docroot, the Composer pass and the staged entrypoint -- off
# the table entirely.
services:
  app:
    # The install stage does all of Bolt's setup before Apache binds:
    # `extensions:configure`, `doctrine:schema:update` over an empty SQLite
    # file, `assets:install`, `bolt:add-user`, the fixtures, and a
    # `cache:clear` that compiles the production container. On this host that
    # is around two minutes. The engine runs `docker compose up -d` without
    # --wait and probes as soon as it returns, which is while all of that is
    # still going: nothing is listening and the probe reads `Failed to connect
    # to 127.0.0.1 port 8000`.
    #
    #   1. GET /         the homepage record from the fixtures, rendered
    #                    through the skeleton theme -- so a 200 means the
    #                    schema exists, the content is in it and Twig compiled.
    #                    404 while the database is empty, 500 while it is
    #                    half-built, and `-f` fails on both.
    #   2. GET /bolt/login  the control panel's own login form. It is the
    #                    request that proves the backend routes loaded, which
    #                    is exactly what the committed extension wiring broke.
    #
    # Host is `127.0.0.1:8000` for both, as it is for AppHealth's own probe.
    # Bolt accepts it: the repository leaves SYMFONY_TRUSTED_HOSTS commented
    # out, so Symfony's host check is off and no route is host-dependent.
    #
    # Idempotent, so a retry replays it harmlessly. curl is in the base image.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null --max-time 30 http://127.0.0.1:8000/ &&
          curl -fsS -o /dev/null --max-time 30 http://127.0.0.1:8000/bolt/login
      interval: 10s
      timeout: 40s
      retries: 30
      # The install stage on two slow cores. A failing check inside this window
      # neither counts against retries nor marks the container unhealthy.
      start_period: 300s

  # Does nothing and exits 0. Compose does not wait for a healthcheck on its
  # own, but it does block on a `depends_on` health condition -- so a service
  # that waits for the app is what makes `up -d` return only once Bolt has
  # built its schema, created its user and answered, and what the health probe
  # then meets. A clean exit 0 is not a crash loop as far as AppHealth is
  # concerned.
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
