-->

             font: 16px/1.6 system-ui, sans-serif; }
      div  { text-align: center; }
      a    { color: #6cf; }
      code { color: #9c9; }
    </style>
  </head>
  <body>
    <div>
      <p>Signed in. Opening the terminal&hellip;</p>
      <p><a href="/">Continue</a></p>

    </div>
