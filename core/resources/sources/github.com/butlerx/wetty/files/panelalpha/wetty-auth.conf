# The authenticator WeTTY does not have.
#
# WeTTY serves five routes and gates none of them: `/`, `/ssh/:user`,
# `/client/*`, `/sw.js` and `/metrics` (src/server/socketServer.ts:30-50).
# There is no login, no session and no password anywhere in the application.
# What it does instead is open a pty running `ssh` the moment a socket
# connects, and let the sshd at the far end do the asking.
#
# That leaves two request-controlled inputs that decide *what* the ssh is, and
# both of them are why this file exists:
#
#   1. the `remote-user` request header. src/server/command/address.ts:13 reads
#      it and uses it as the ssh username, ahead of the configured SSHUSER and
#      without any check at all. A visitor who sends `Remote-User: root` is
#      asking for `ssh root@shell`.
#   2. the Referer. src/server/command.ts:22-26 parses the query string out of
#      it and *always* honours `pass`, whatever the allowRemoteHosts and
#      allowRemoteCommand settings are -- so `https://<domain>/?pass=hunter2`
#      becomes `sshpass -p hunter2 ssh ...` (src/server/command/ssh.ts:21).
#
# `proxy_set_header` replaces whatever the client sent, so four lines in the
# two proxy blocks below close both: the username is pinned to the account and
# the Referer is removed. Neither is the password -- the password is sshd's --
# but without them the password would be asked of the wrong account, or not
# asked at all.
#
# On top of that, the socket that opens a session is behind HTTP Basic. That is
# a second gate using the same secret, not a second factor, and it is here for
# a reason the ssh password cannot cover: every socket.io connection spawns a
# pty and an ssh process (src/server/spawn.ts:17) before anybody has proved
# anything, so without it an anonymous visitor can exhaust the container's
# pids_limit and take the customer's terminal down without ever guessing a
# password.
#
# `/` itself is deliberately left open. It is WeTTY's own page and nothing more
# -- there is no session on it -- and the engine's reachability probe and
# health check both read `/` anonymously, so a 401 there would report the
# application as broken. What an anonymous visitor gets is a terminal that
# cannot connect, plus the banner below telling them where to sign in.

# The account this terminal belongs to, written by hooks/prepare.sh as
# `default "<account>";`. Keyed on $http_host only because `map` needs a source
# variable; the value does not depend on it.
map $http_host $wetty_account {
    include /etc/nginx/wetty-auth/account.map;
}

# Websocket or not. socket.io tries long-polling first and upgrades, and the
# upgrade is what needs this pair forwarded intact.
map $http_upgrade $wetty_connection {
    default upgrade;
    ''      close;
}

# Injected into WeTTY's own HTML for a visitor who has not signed in, because
# the page it serves has no way to say so itself: the terminal would simply sit
# there while socket.io retried a 401 forever.
map $http_authorization $wetty_banner {
    default '';
    ''      '<div style="position:fixed;left:0;right:0;bottom:0;z-index:99;background:#1e1e1e;color:#ddd;font:14px system-ui,sans-serif;padding:12px;text-align:center;border-top:1px solid #444">You are not signed in, so this terminal will not connect. <a style="color:#6cf" href="/panelalpha-login">Sign in</a></div>';
}

server {
    listen 8080 default_server;
    server_name _;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # A terminal sends keystrokes. Nothing here has a use for a large body, and
    # socket.io's polling POSTs are small.
    client_max_body_size 1m;

    # Resolved per request through Docker's embedded DNS rather than once at
    # config load: with a literal name in proxy_pass, nginx refuses to start
    # while the app container is still being created, and pins the first
    # address it gets for the life of the process.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WeTTY mounts prom-client's default metrics at $base/metrics
    # (src/server/socketServer.ts:33) with no authentication. Process uptime,
    # heap, file descriptors and the number of live terminal sessions are not
    # anybody's business on a public name.
    location = /metrics {
        return 404;
    }

    # The only way to make a browser ask for the password, since a browser
    # never volunteers Basic credentials. Always challenges, then serves a page
    # that bounces to `/` -- which the browser now loads with the Authorization
    # header it has just learned for this origin, and sends on the socket.io
    # requests too.
    #
    # It has to serve a *file*. `return 302` here would not work: return runs
    # in nginx's rewrite phase, which is ahead of the access phase auth_basic
    # lives in, so the redirect would be issued before the password was ever
    # asked for.
    location = /panelalpha-login {
        auth_basic           'Terminal';
        auth_basic_user_file /etc/nginx/wetty-auth/htpasswd;
        root /etc/nginx/wetty-static;
        try_files /wetty-login.html =404;
    }

    # The session. Everything that can open a pty is on this path.
    location /socket.io/ {
        auth_basic           'Terminal';
        auth_basic_user_file /etc/nginx/wetty-auth/htpasswd;

        set $wetty_upstream app;
        proxy_pass http://$wetty_upstream:3000$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host            $http_host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade         $http_upgrade;
        proxy_set_header Connection      $wetty_connection;

        # The two inputs WeTTY trusts. Set on every request, so what the client
        # sent is gone.
        proxy_set_header remote-user     $wetty_account;
        proxy_set_header Referer         '';
        # WeTTY has no use for the credentials and no reason to see them.
        proxy_set_header Authorization   '';

        # A terminal is idle for long stretches and then bursts. Buffering
        # would hold keystrokes back.
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        set $wetty_upstream app;
        proxy_pass http://$wetty_upstream:3000$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host            $http_host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Same two, for the same reason. This path opens no session, but
        # /ssh/:user is served here and it is the other half of the username
        # question (src/server/command/address.ts:21).
        proxy_set_header remote-user     $wetty_account;
        proxy_set_header Referer         '';
        proxy_set_header Authorization   '';

        # WeTTY compresses its responses (src/server/socketServer.ts:45) and
        # sub_filter cannot read a gzipped body, so ask for it uncompressed.
        # Only the HTML is rewritten; the bundle is served as it comes.
        proxy_set_header Accept-Encoding '';
        sub_filter       '</body>' '$wetty_banner</body>';
        sub_filter_once  on;

        proxy_read_timeout 60s;
    }
}
