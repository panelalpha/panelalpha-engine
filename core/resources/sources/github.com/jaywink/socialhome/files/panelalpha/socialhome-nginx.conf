# Routing from upstream's docs/installation/docker.rst and socialhome-ui's
# INSTALLATION.md: backend paths and federation Accept headers go to Daphne,
# /media is served from the media volume, everything else is the SPA.
map $http_accept$http_content_type $ap_request {
  default 0;
  "~*application/(activity|ld)\+json.*" 1;
  "~*application/(xrd\+|magic-envelope\+)xml.*" 1;
}
# The engine terminates TLS; keep the scheme Django's SSL redirect expects.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  "" https;
}

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 20m;
  root /ui/dist;

  # Set here only: a proxy_set_header inside a location drops all of these.
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $fwd_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_http_version 1.1;

  location ~ ^/(ch|receive|admin|api|fetch|hcard|jsi18n|nodeinfo|static|webfinger|\.well-known) {
    proxy_pass http://app:23564;
  }

  location /media/ {
    alias /media/;
    add_header X-Robots-Tag "noindex, nofollow";
  }

  location / {
    if ($ap_request = 1) {
      proxy_pass http://app:23564;
      break;
    }
    try_files $uri $uri/ $uri.html /index.html;
  }
}
