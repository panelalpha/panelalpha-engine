# The account's port. The controller serves its UI and API only over HTTPS on
# 8443 with a self-signed certificate; the engine's proxy speaks plain HTTP to
# the app, so this re-encrypts to it without verifying (same container network).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 512m;

    # Per-request lookup, so nginx never pins a stale address for `unifi`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $unifi unifi:8443;

    location / {
        proxy_pass https://$unifi$request_uri;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # The UI's live updates are a websocket (/wss/...).
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        # Absolute redirects name the backend; keep them on the public origin.
        proxy_redirect https://$http_host:8443/ /;
        proxy_redirect https://unifi:8443/ /;
    }
}
