# Compose-replace: the repository is LinuxServer.io's image build (Dockerfile +
# s6 scripts), which needs an external MongoDB the repo does not ship. This runs
# the published image of the current release with a MongoDB sidecar.
services:
  mongo:
    # 7.0: supported by the controller since 8.1 (README). Every 8.x image
    # refuses to start on Linux >= 6.19 (SERVER-121912); 7.0 needs AVX.
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    env_file:
      - ../.panelalpha/unifi/db-root.env
      - ../.panelalpha/unifi/db.env
    volumes:
      - mongo-data:/data/db
      - ./panelalpha/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 10s
    mem_limit: 512m

  unifi:
    image: linuxserver/unifi-network-application:10.6.106
    restart: unless-stopped
    env_file:
      - .env
      - ../.panelalpha/unifi/db.env
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MEM_LIMIT: "1024"
    volumes:
      # system.properties, keystore, backups, logs.
      - unifi-config:/config
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      # /status answers 200 while starting too; "up":true means ready.
      test: ["CMD-SHELL", "curl -ksf https://127.0.0.1:8443/status | grep -q '\"up\":true'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1536m

  # Closes the first-run wizard (first visitor wins) with the generated admin
  # before the proxy opens the port.
  setup:
    image: linuxserver/unifi-network-application:10.6.106
    restart: "no"
    entrypoint: ["/bin/bash", "/panelalpha/unifi-setup.sh"]
    env_file:
      - ../.panelalpha/unifi/admin.env
    volumes:
      - ./panelalpha/unifi-setup.sh:/panelalpha/unifi-setup.sh:ro
    depends_on:
      unifi:
        condition: service_healthy
    mem_limit: 128m

  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    ports:
      - "8000:8080"
    volumes:
      - ./panelalpha/unifi-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/status"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 48m

  # No-op gate: `up -d` returns only once the controller answers through the proxy.
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      proxy:
        condition: service_healthy
    mem_limit: 32m

volumes:
  mongo-data: {}
  unifi-config: {}
