# Layers over the compose file the laravel strategy generates. That file is
# right about the app -- the shared PHP base image, ~/project bind-mounted at
# /app, the account's own uid, PA_DOCROOT=/app/public, Apache on 8000, the
# public https URL in APP_URL -- and says nothing about when Heimdall is ready,
# because nothing in a Laravel checkout can.
#
# An override rather than a replacement compose file, and here that is not a
# preference: an `overrides/docker-compose.yml` is written into the checkout
# *before* detection runs, so a compose file in the project root would make
# Heimdall look like a compose project and take the laravel strategy -- with it
# the bind mount, the docroot, the Composer pass and the staged entrypoint --
# off the table entirely.
services:
  app:
    # Two requests, and the second is the one that proves anything.
    #
    # The entrypoint's install stage does the real work before Apache binds:
    # `key:generate`, `storage:link`, `migrate`, and -- inside the very first of
    # those, because AppServiceProvider::boot() runs for artisan as well --
    # Heimdall's own setupDatabase(), which creates database/app.sqlite, runs
    # `migrate --seed` over it and then fetches the 320 KB supported-apps list
    # over the network (SupportedApps::getList(), 15s connect timeout). The
    # engine runs `docker compose up -d` without --wait and probes as soon as it
    # returns, which is while all of that is still going: nothing is listening
    # and the probe reads `Failed to connect to 127.0.0.1 port 8000`.
    #
    #   1. GET /        302 to /login once the admin account has a password,
    #                   200 while it does not. `-f` accepts both and fails on
    #                   the 500 a half-built database would give. No -L: the
    #                   Location is the account's absolute https URL, which is
    #                   not this port.
    #   2. GET /login   renders App\User::currentUser() and Setting::fetch()
    #                   out of the seeded schema, so a 200 here is proof the
    #                   migration and the seeders both finished -- which a
    #                   redirect on its own would not be.
    #
    # Idempotent, so a retry replays it harmlessly. curl is in the base image.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null --max-time 30 http://127.0.0.1:8000/ &&
          curl -fsS -o /dev/null --max-time 30 http://127.0.0.1:8000/login
      interval: 10s
      timeout: 40s
      retries: 24
      # The install stage on a 2-core host, with the supported-apps fetch in it.
      # A failing check inside this window neither counts against retries nor
      # marks the container unhealthy.
      start_period: 240s

  # Does nothing and exits 0. Compose does not wait for a healthcheck on its
  # own, but it does block on a `depends_on` health condition -- so a service
  # that waits for the app is what makes `up -d` return only once Heimdall has
  # migrated, seeded and answered, and what the health probe then meets. A clean
  # exit 0 is not a crash loop as far as AppHealth is concerned.
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
