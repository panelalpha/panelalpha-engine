; The php.ini this container would otherwise not have.
;
; The shared base image loads none at all -- `Loaded Configuration File =>
; (none)`, measured -- so every setting below is PHP's compiled-in default
; unless something writes it (engine#185). The compose override points
; PHP_INI_SCAN_DIR at this directory, which reaches the Apache module and the
; CLI both, and both need it: the CLI runs the installer, the Apache module
; takes the attachment.

; The installer is the peak, not a request: `setup.php --install` creates the
; schema for 29 applications in one process, building Doctrine metadata and
; parsing every Setup XML along the way, and tine's bootstrap.php even reserves
; a megabyte up front to be able to report its own OOM. The compiled-in default
; is 128M. 512M also covers the request-time peaks -- an ODS/XLSX export
; through PhpSpreadsheet and an imagick thumbnail of a large attachment.
memory_limit = 512M

; The install and the schema updates run in the CLI SAPI, where the default is
; already 0; the Apache module's default is 30 seconds, which a Filemanager
; upload of a few hundred MB or a large export will exceed.
max_execution_time = 300

; Groupware means attachments, and the compiled-in ceilings are 8M for a POST
; body and 2M for a file. tine reports both to its own client, so without this
; the browser refuses a 3 MB attachment before it is even sent.
post_max_size = 128M
upload_max_filesize = 128M
max_file_uploads = 50

; On by default with no php.ini, which on this application means a PHP warning
; rendered into the middle of a JSON-RPC response -- tine's own bootstrap.php
; sets display_errors=1 as well, deliberately, but that is for a development
; checkout. log_errors sends the same text to stderr, where `docker logs` and
; the panel's log viewer read it.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; The version banner in every response header, for no benefit.
expose_php = Off

; tine stores and compares everything in UTC (bootstrap.php calls
; date_default_timezone_set('UTC')) but PHP warns when the ini value is unset
; in some code paths, and the CLI installer is one of them.
date.timezone = UTC

; Opcache is compiled in and enabled by the image's extension config; these are
; the two settings that matter for a tree this size. 20000 files because tine
; plus vendor/ is around 15000 PHP files and the default 10000 evicts half of
; them on every request.
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
