# Replaces the repository's docker-compose.yml (builds from source, ./config
# bind mount wiped with ~/project). Runs the published image of the current
# release instead, with /config on a named volume.
#
# Boxarr has no authentication at all: /setup renders the stored Radarr API
# key into the page and every /api route (save config, add movies to Radarr)
# is anonymous. So the app publishes nothing; `proxy` is the only thing on the
# account's port and requires HTTP Basic credentials generated by
# hooks/prepare.sh.
services:
  app:
    image: ghcr.io/iongpt/boxarr:2.1.0
    restart: unless-stopped
    environment:
      TZ: Etc/UTC
    volumes:
      # local.yaml (Radarr URL + API key), history, ignore list, logs.
      - boxarr-config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8888/api/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 512m

  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./panelalpha/boxarr-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      # A hash only (0644); the plaintext is in ~/.panelalpha/boxarr/admin.txt.
      - ../.panelalpha/boxarr/htpasswd:/etc/nginx/boxarr.htpasswd:ro
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 48m

volumes:
  boxarr-config: {}
