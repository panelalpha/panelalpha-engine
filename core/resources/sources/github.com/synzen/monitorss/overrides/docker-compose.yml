# Upstream's production docker-compose.yml, running the published images of the
# current release (7.4.0) with nothing built: its `build:` (via extends) is what
# was OOM-killed. mongo:7.0 as a one-node replica set (as upstream's dev and e2e
# stacks run it; its .env.example URIs name replicaSet=dbrs), since mongo:8.0
# refuses to start on this host's kernel.
x-env: &env
  - .env
  - ../.panelalpha/monitorss/secrets.env

services:
  # One-shot: MonitoRSS is a Discord bot and its panel logs in with Discord,
  # so the deploy fails here naming each missing variable. Read from .env at
  # runtime, not interpolated (engine#336).
  check:
    image: ghcr.io/synzen/monitorss-monolith:7.4.0
    restart: "no"
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        missing=""
        case "$$DISCORD_BOT_TOKEN" in ""|*_HERE) missing="$$missing DISCORD_BOT_TOKEN (Bot > Token)";; esac
        case "$$DISCORD_CLIENT_ID" in ""|*_HERE) missing="$$missing DISCORD_CLIENT_ID (General Information > Application ID)";; esac
        case "$$DISCORD_CLIENT_SECRET" in ""|*_HERE) missing="$$missing DISCORD_CLIENT_SECRET (OAuth2 > Client Secret)";; esac
        if [ -n "$$missing" ]; then
          echo "Error: MonitoRSS needs a Discord application (https://discord.com/developers/applications). Set in the project's environment variables:$$missing"
          exit 1
        fi
    mem_limit: 64m

  mongo:
    image: mongo:7.0
    hostname: mongo
    restart: unless-stopped
    command: ["--replSet", "dbrs", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongodb-data:/data/db
    # Initiates the one-node replica set on first start (upstream's e2e stack).
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate(); quit(1) }"]
      interval: 5s
      timeout: 10s
      retries: 30
    mem_limit: 512m

  rabbitmq-broker:
    image: rabbitmq:3-management-alpine
    # Fixed node name, so the data directory is the same after a recreate.
    hostname: rabbitmq-broker
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 384m

  feed-requests-redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1
    volumes:
      - feed-requests-redis-data:/data
    mem_limit: 128m

  feed-requests-postgres-db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ../.panelalpha/monitorss/secrets.env
    environment:
      POSTGRES_USER: postgres
    volumes:
      - feed-requests-postgres17-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 256m

  feed-requests-postgres-migration:
    image: ghcr.io/synzen/monitorss-feed-requests:7.4.0
    restart: on-failure:5
    command: "npm run migration:up"
    env_file: *env
    environment:
      NODE_ENV: production
      FEED_REQUESTS_POSTGRES_SCHEMA: feedrequests
      FEED_REQUESTS_API_KEY: feed-requests-api-key
      FEED_REQUESTS_API_PORT: "5000"
      FEED_REQUESTS_RABBITMQ_BROKER_URL: amqp://rabbitmq-broker:5672
      FEED_REQUESTS_FAILED_REQUEST_DURATION_THRESHOLD_HOURS: "48"
      FEED_REQUESTS_REDIS_URI: redis://feed-requests-redis-cache:6379
      FEED_REQUESTS_REDIS_DISABLE_CLUSTER: "true"
      FEED_REQUESTS_START_TARGET: service
      FEED_REQUESTS_S3_API_KEY_ID: "1"
      FEED_REQUESTS_S3_API_KEY: "1"
    depends_on:
      check:
        condition: service_completed_successfully
      feed-requests-postgres-db:
        condition: service_healthy
    mem_limit: 384m

  feed-requests-service:
    image: ghcr.io/synzen/monitorss-feed-requests:7.4.0
    restart: unless-stopped
    command: ["node", "dist/main.js"]
    env_file: *env
    # Runs the API (health on :5000) and the service; the migration runs "service" only.
    environment:
      NODE_ENV: production
      FEED_REQUESTS_POSTGRES_SCHEMA: feedrequests
      FEED_REQUESTS_API_KEY: feed-requests-api-key
      FEED_REQUESTS_API_PORT: "5000"
      FEED_REQUESTS_RABBITMQ_BROKER_URL: amqp://rabbitmq-broker:5672
      FEED_REQUESTS_FAILED_REQUEST_DURATION_THRESHOLD_HOURS: "48"
      FEED_REQUESTS_REDIS_URI: redis://feed-requests-redis-cache:6379
      FEED_REQUESTS_REDIS_DISABLE_CLUSTER: "true"
    healthcheck:
      test: "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/v1/feed-requests/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 60
    depends_on:
      check:
        condition: service_completed_successfully
      feed-requests-postgres-db:
        condition: service_healthy
      rabbitmq-broker:
        condition: service_healthy
      mongo:
        condition: service_healthy
    mem_limit: 512m

  user-feeds-postgres-migration:
    image: ghcr.io/synzen/monitorss-user-feeds:7.4.0
    restart: on-failure:5
    command: "node ./dist/src/scripts/run-migrations.js"
    env_file: *env
    environment:
      NODE_ENV: production
    depends_on:
      check:
        condition: service_completed_successfully
      feed-requests-postgres-db:
        condition: service_healthy
    mem_limit: 256m

  user-feeds-service:
    image: ghcr.io/synzen/monitorss-user-feeds:7.4.0
    restart: unless-stopped
    env_file: *env
    environment:
      NODE_ENV: production
      USER_FEEDS_API_PORT: "5000"
      USER_FEEDS_RABBITMQ_BROKER_URL: amqp://guest:guest@rabbitmq-broker:5672
      USER_FEEDS_FEED_REQUESTS_API_URL: http://feed-requests-service:5000/v1/feed-requests
      USER_FEEDS_FEED_REQUESTS_API_KEY: feed-requests-api-key
      USER_FEEDS_API_KEY: user-feeds-api-key
      USER_FEEDS_REDIS_URI: redis://feed-requests-redis-cache:6379
      USER_FEEDS_REDIS_DISABLE_CLUSTER: "true"
      USER_FEEDS_DISCORD_API_TOKEN: ${DISCORD_BOT_TOKEN}
      USER_FEEDS_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
    healthcheck:
      test: "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/v1/user-feeds/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 60
    depends_on:
      feed-requests-service:
        condition: service_healthy
      user-feeds-postgres-migration:
        condition: service_completed_successfully
    mem_limit: 512m

  discord-rest-listener-service:
    image: ghcr.io/synzen/monitorss-discord-rest-listener:7.4.0
    restart: unless-stopped
    command: ["node", "build/app.js"]
    env_file: *env
    environment:
      NODE_ENV: production
      DISCORD_REST_LISTENER_RABBITMQ_URI: amqp://rabbitmq-broker:5672
      DISCORD_REST_LISTENER_MAX_REQ_PER_SEC: "40"
      DISCORD_REST_LISTENER_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_REST_LISTENER_BOT_CLIENT_ID: ${DISCORD_CLIENT_ID}
    depends_on:
      check:
        condition: service_completed_successfully
      rabbitmq-broker:
        condition: service_healthy
      mongo:
        condition: service_healthy
    mem_limit: 256m

  bot-presence-service:
    image: ghcr.io/synzen/monitorss-bot-presence:7.4.0
    restart: unless-stopped
    command: ["node", "dist/main.js"]
    env_file: *env
    environment:
      BOT_PRESENCE_RABBITMQ_URL: amqp://rabbitmq-broker:5672
      BOT_PRESENCE_DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      BOT_PRESENCE_DISCORD_BOT_CLIENT_ID: ${DISCORD_CLIENT_ID}
    depends_on:
      check:
        condition: service_completed_successfully
      rabbitmq-broker:
        condition: service_healthy
    mem_limit: 256m

  schedule-emitter-service:
    image: ghcr.io/synzen/monitorss-monolith:7.4.0
    restart: unless-stopped
    command: ["node", "dist/scripts/schedule-emitter.js"]
    env_file: *env
    environment:
      NODE_ENV: production
      BACKEND_API_RABBITMQ_BROKER_URL: amqp://guest:guest@rabbitmq-broker:5672/
      BACKEND_API_USER_FEEDS_API_HOST: http://user-feeds-service:5000
      BACKEND_API_FEED_REQUESTS_API_HOST: http://feed-requests-service:5000
      BACKEND_API_USER_FEEDS_API_KEY: user-feeds-api-key
      BACKEND_API_FEED_REQUESTS_API_KEY: feed-requests-api-key
      BACKEND_API_FEED_USER_AGENT: MonitoRSS
      BACKEND_API_DEFAULT_MAX_FEEDS: "10"
      BACKEND_API_DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      BACKEND_API_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      BACKEND_API_DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      BACKEND_API_LOGIN_REDIRECT_URI: ${PA_PUBLIC_URL}
      BACKEND_API_DISCORD_REDIRECT_URI: ${PA_PUBLIC_URL}/api/v1/discord/callback-v2
    depends_on:
      check:
        condition: service_completed_successfully
      rabbitmq-broker:
        condition: service_healthy
      mongo:
        condition: service_healthy
    mem_limit: 384m

  # The control panel and its API on :8000.
  monolith:
    image: ghcr.io/synzen/monitorss-monolith:7.4.0
    restart: unless-stopped
    command: ["node", "dist/main.js"]
    env_file: *env
    environment:
      NODE_ENV: production
      BACKEND_API_NODE_ENV: local
      BACKEND_API_PORT: "8000"
      BACKEND_API_DEFAULT_MAX_FEEDS: "999999"
      BACKEND_API_USER_FEEDS_API_HOST: http://user-feeds-service:5000
      BACKEND_API_FEED_REQUESTS_API_HOST: http://feed-requests-service:5000
      BACKEND_API_FEED_USER_AGENT: MonitoRSS
      BACKEND_API_RABBITMQ_BROKER_URL: amqp://guest:guest@rabbitmq-broker:5672/
      BACKEND_API_USER_FEEDS_API_KEY: user-feeds-api-key
      BACKEND_API_FEED_REQUESTS_API_KEY: feed-requests-api-key
      LOG_LEVEL: info
      BACKEND_API_DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      BACKEND_API_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      BACKEND_API_DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      BACKEND_API_LOGIN_REDIRECT_URI: ${PA_PUBLIC_URL}
      BACKEND_API_DISCORD_REDIRECT_URI: ${PA_PUBLIC_URL}/api/v1/discord/callback-v2
    ports:
      - "8000:8000"
    healthcheck:
      test: "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    depends_on:
      user-feeds-service:
        condition: service_healthy
      feed-requests-service:
        condition: service_healthy
      mongo:
        condition: service_healthy
    mem_limit: 768m

  # No-op gate: `compose up -d` returns only once the panel answers (engine#204).
  ready:
    image: ghcr.io/synzen/monitorss-monolith:7.4.0
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      monolith:
        condition: service_healthy
    mem_limit: 32m

volumes:
  mongodb-data: {}
  rabbitmq-data: {}
  feed-requests-postgres17-data: {}
  feed-requests-redis-data: {}
