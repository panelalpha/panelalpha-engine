# One origin: the browser uploads/downloads straight to S3 with presigned
# path-style URLs (https://<site>/safebucket/<key>), everything else is the app.
server {
    listen 80;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Host is kept: the presigned signature covers it.
    location /safebucket/ {
        proxy_set_header Host $host;
        proxy_pass http://bucket:9000;
    }
    location / {
        proxy_set_header Host $host;
        proxy_pass http://safebucket:8080;
    }
}
