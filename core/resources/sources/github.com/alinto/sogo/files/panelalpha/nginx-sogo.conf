# SOGo behind nginx, following upstream's own sample with one change that
# matters here: the scheme.
#
# sogod builds every absolute URL it emits -- redirects, the login form's
# action, the Angular bootstrap -- from x-webobjects-server-url. Upstream's
# sample sets that from $scheme, which inside this container is always `http`,
# because the engine's proxy terminates TLS in front of it. A browser on the
# https:// domain would then be sent to http:// on every redirect. The map below
# prefers the X-Forwarded-Proto the proxy sets and falls back to $scheme when
# there is none.
map $http_x_forwarded_proto $sogo_scheme {
    default   $scheme;
    "~^https$" https;
    "~^http$"  http;
}

server {
    listen 80 default_server;
    server_name _;

    # SOGo owns /SOGo and nothing else. Landing on / is what a visitor does.
    location = / {
        return 302 $sogo_scheme://$http_host/SOGo;
    }

    # Served by nginx straight off disk: 53 MB of css/js/fonts that sogod
    # should never be asked for.
    location /SOGo.woa/WebServerResources/ {
        alias /usr/local/lib/GNUstep/SOGo/WebServerResources/;
        expires max;
    }
    location /SOGo/WebServerResources/ {
        alias /usr/local/lib/GNUstep/SOGo/WebServerResources/;
        expires max;
    }
    location ~* ^/SOGo/so/ControlPanel/Products/([^/]*)/Resources/(.*)$ {
        alias /usr/local/lib/GNUstep/SOGo/$1.SOGo/Resources/$2;
    }

    location ^~ /SOGo {
        proxy_pass http://127.0.0.1:20000;
        proxy_redirect http://127.0.0.1:20000 default;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header x-webobjects-server-protocol HTTP/1.0;
        proxy_set_header x-webobjects-remote-host 127.0.0.1;
        proxy_set_header x-webobjects-server-name $server_name;
        proxy_set_header x-webobjects-server-url $sogo_scheme://$http_host;
        proxy_set_header x-webobjects-server-port $server_port;

        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 64k;
        proxy_temp_file_write_size 64k;
        client_max_body_size 50m;
        client_body_buffer_size 128k;
    }

    # Apple's CalDAV/CardDAV autodiscovery asks for these at the root.
    location = /.well-known/caldav  { return 301 $sogo_scheme://$http_host/SOGo/dav/; }
    location = /.well-known/carddav { return 301 $sogo_scheme://$http_host/SOGo/dav/; }

    # Nothing else is a SOGo URL. The checkout is not mounted into this image at
    # all -- the build stage is where it lived -- but an explicit 404 keeps a
    # future mount from turning nginx into a file browser over it.
    location / { return 404; }
}
