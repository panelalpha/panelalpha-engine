# yaml-language-server: $schema=../../../_schema.json
description: >-
  ChatGPT-web, a browser front end for the OpenAI (and compatible) chat API:
  a static Svelte app built with Vite, with no server side. Chats, settings
  and the API key live in the visitor's browser.

  The repository's Dockerfile is a development container (CMD `npm run
  dev:public`, i.e. `vite --host 0.0.0.0`), so the engine's dev-server check
  failed the plain deploy. Upstream's own production build is its GitHub Pages
  workflow: `npm ci` then `vite build`. This recipe uses the Vite platform
  instead of that Dockerfile: the same install and build, and nginx serves
  dist/.

  Optional build-time settings are the project's VITE_* env vars (e.g.
  VITE_API_BASE for an OpenAI-compatible endpoint); a VITE_API_KEY set there
  is compiled into the public bundle, so leave it unset on a public site.
extends: vite
