# yaml-language-server: $schema=../../../_schema.json
description: >-
  SnapOtter is a self-hosted file-processing web app (AGPL-3.0 core; the
  community edition needs no licence key): image, video, audio, PDF and file
  tools, pipelines and a REST API.

  == Why compose-replace from the published image ==

  The repository has no root compose file; docker/docker-compose.yml builds
  the image from source, which compiles Redis, libheif, LibRaw and more (about
  10 minutes and a lot of build memory). This recipe runs the official image of
  the current release, docker.io/snapotter/snapotter:2.2.0, in the
  single-container mode of the README's quick start: with neither DATABASE_URL
  nor REDIS_URL set, the entrypoint starts an embedded Postgres 17 and Redis 8
  bound to loopback, with their data under /data.

  == What the recipe supplies ==

  The image, /data and /tmp/workspace on named volumes, EXTERNAL_URL (used only
  for OIDC/SAML callbacks) set to the site's address, and a `ready` service
  that holds `up -d` until /api/v1/health answers. Nothing else: the first-run
  state is left as upstream ships it, i.e. the admin/admin login with a
  password change required on first login.

  File uploads through the *.panelalpha.online test domain time out at its
  edge; they work on a real domain or against the
  engine host directly.
