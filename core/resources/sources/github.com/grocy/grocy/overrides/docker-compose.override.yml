# Layers over the compose file the php strategy generates. That file is right
# about the app -- the shared PHP base image, ~/project bind-mounted at /app,
# the account's own uid, PA_DOCROOT=/app/public, Apache on 8000 -- and says
# nothing about when grocy is ready, because nothing in a PHP checkout can.
#
# An override rather than a replacement compose file, and here that is not a
# preference: an `overrides/docker-compose.yml` is written into the checkout
# *before* detection runs, so a compose file in the project root would make
# grocy look like a compose project and take the php strategy -- and with it
# the bind mount, the docroot and the Composer pass -- off the table entirely.
services:
  app:
    # grocy builds its schema on the first HTTP request, not at boot:
    # SystemController::Root calls DatabaseMigrationService, which runs all 258
    # files in migrations/ against an empty data/grocy.db, hashes argon2id for
    # the default user and then redirects to the entry page. Apache is
    # listening long before any of that, so `docker compose up -d` -- which the
    # engine runs without --wait -- would return while the first visitor's
    # request is still creating tables.
    #
    # Three requests, not one, and the sequence is the whole point. A single
    # `curl /` passes without having migrated anything: the very first request
    # after a deploy takes app.php's other branch -- the version hash changed,
    # so it empties data/viewcache and answers 302 without reaching the root
    # route at all. A healthcheck satisfied by that 302 reported healthy, the
    # gate below opened, and the engine's own probe then arrived *during* the
    # migration that the next request had just started: one 500 from a
    # half-built database, on a site that answered 302 a second later and 200
    # from the public domain. So:
    #
    #   1. GET /        absorbs the viewcache-and-redirect boot request
    #   2. GET /        the root route: DatabaseMigrationService, synchronous,
    #                   ~1.5s against an empty file
    #   3. GET /login   a page that renders from the migrated schema, 200 --
    #                   proof the first two did their job rather than a
    #                   redirect that proves nothing
    #
    # Idempotent, so a retry replays it harmlessly. curl is in the base image
    # (php:8.5-apache-bookworm ships it). `-f` accepts the 302s and there is
    # nothing to follow: grocy's Location is absolute and https (the base
    # image's auto_prepend proxy shim sets HTTPS for every request), so -L
    # would only hit TLS on a plain HTTP port.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null --max-time 20 http://127.0.0.1:8000/ &&
          curl -fsS -o /dev/null --max-time 120 http://127.0.0.1:8000/ &&
          curl -fsS -o /dev/null --max-time 20 http://127.0.0.1:8000/login
      interval: 15s
      timeout: 170s
      retries: 20
      # The migration run, on a host where it is the only thing happening. A
      # failing check inside this window neither counts against retries nor
      # marks the container unhealthy.
      start_period: 240s

  # Does nothing and exits 0. Compose does not wait for a healthcheck on its
  # own, but it does block on a `depends_on` health condition -- so a service
  # that waits for the app is what makes `up -d` return only once grocy has
  # migrated and answered, and what the health probe then meets. A clean exit 0
  # is not a crash loop as far as AppHealth is concerned.
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
