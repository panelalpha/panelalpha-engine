# The repository ships no compose file and its Dockerfile's last stage is a
# CI coverage run. This runs the published 2.6.0 image with /app/data on a
# named volume. Generated secrets come from ~/.panelalpha; .env (the
# project's environment variables) is loaded after it, so it overrides them.
services:
  app:
    image: ghcr.io/iamspido/github-release-monitor:2.6.0
    restart: unless-stopped
    env_file:
      - ../.panelalpha/ghrm/app.env
      - .env
    environment:
      BETTER_AUTH_URL: ${PA_PUBLIC_URL}
      # The engine terminates TLS; the rate limiter reads the last,
      # proxy-added X-Forwarded-For hop, not the spoofable first one.
      HTTPS: "true"
      AUTH_TRUST_PROXY_HEADERS: "true"
      AUTH_TRUSTED_PROXY_HOPS: "1"
    volumes:
      - data:/app/data
    ports:
      - "3000:3000"
    depends_on:
      data-perms:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/en/login"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 1024m

  # /app/data does not exist in the image, so a fresh volume is root-owned;
  # the app runs as uid 1001.
  data-perms:
    image: ghcr.io/iamspido/github-release-monitor:2.6.0
    restart: "no"
    user: "0"
    entrypoint: ["chown", "1001:1001", "/app/data"]
    volumes:
      - data:/app/data
    mem_limit: 32m

  # No-op gate: `compose up -d` returns only once the app answers.
  ready:
    image: ghcr.io/iamspido/github-release-monitor:2.6.0
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  data: {}
