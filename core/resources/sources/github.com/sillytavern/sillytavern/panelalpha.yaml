# yaml-language-server: $schema=../../../_schema.json
description: >-
  SillyTavern, a self-hosted LLM chat frontend (Node.js). Plain deploys built
  the repo Dockerfile and answered 403 to every visitor: the default config
  keeps whitelistMode on, and with it off the app exits on its own security
  check unless whitelisting, basic auth or user accounts protect it. This recipe
  runs the official image of the current release
  (ghcr.io/sillytavern/sillytavern:1.19.0) on port 8000 in SillyTavern's own
  basic-auth mode with a login the engine generates (`credentials:`, returned
  by `GET /projects/{name}/app-credentials`; project env vars
  SILLYTAVERN_BASICAUTHUSER_USERNAME / _PASSWORD set before the first deploy
  are kept instead). Config, data,
  plugins and third-party extensions live on named volumes.
credentials:
  fields:
    SILLYTAVERN_BASICAUTHUSER_USERNAME: {kind: username}
    SILLYTAVERN_BASICAUTHUSER_PASSWORD: {kind: password}
