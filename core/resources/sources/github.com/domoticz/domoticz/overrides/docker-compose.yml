# Compose-replace: the repository is the C++ source tree. Runs upstream's
# published image at the current stable release.
services:
  app:
    image: domoticz/domoticz:2026.3
    restart: unless-stopped
    environment:
      TZ: Etc/UTC
      WWW_PORT: "8080"
    volumes:
      # domoticz.db, scripts, plugins, logs.
      - userdata:/opt/domoticz/userdata
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/ || wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
    mem_limit: 512m

  # No-op gate: `compose up -d` returns once the web UI answers.
  ready:
    image: domoticz/domoticz:2026.3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  userdata: {}
