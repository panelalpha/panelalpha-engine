# Persist PmWiki's page store (wiki.d) and attachments (uploads) across the
# redeploy that empties ~/project (engine#173). The account home survives, so
# mount ~/.panelalpha (../.panelalpha relative to this file, which sits in
# ~/project) into the app container; pmwiki-setup.sh writes under /pa-data.
services:
  app:
    volumes:
      - '../.panelalpha:/pa-data'
