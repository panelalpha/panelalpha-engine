# Compose-replace: the repo's docker-compose.yaml is a development stack (source
# bind mount, go run, three databases) and its Dockerfiles copy a GoReleaser
# dist/ that a clone does not have. This runs the published release image.
services:
  # One-shot: creates the generated owner and deletes the default shiori/gopher
  # before `app` starts, so the site never opens with the default login.
  init:
    build:
      context: ./panelalpha/shiori
      args:
        SHIORI_IMAGE: ghcr.io/go-shiori/shiori:alpine-v1.8.0
    image: panelalpha/shiori-init:local
    restart: "no"
    # SHIORI_ADMIN_USER / SHIORI_ADMIN_PASSWORD, generated and kept by the engine.
    env_file:
      - ../.panelalpha/app-credentials.env
    environment:
      SHIORI_DIR: /shiori
    volumes:
      - shiori-data:/shiori
    mem_limit: 256m

  app:
    image: ghcr.io/go-shiori/shiori:alpine-v1.8.0
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    env_file:
      # SHIORI_HTTP_SECRET_KEY only; keeps sessions valid across restarts.
      - ../.panelalpha/shiori/secret.env
    environment:
      SHIORI_DIR: /shiori
      SHIORI_HTTP_PORT: "8080"
    volumes:
      # shiori.db, archives, thumbnails and ebooks; survives redeploys.
      - shiori-data:/shiori
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/system/liveness"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s
    mem_limit: 384m

  # `up -d` runs without --wait; this blocks it until Shiori answers.
  ready:
    image: ghcr.io/go-shiori/shiori:alpine-v1.8.0
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  shiori-data: {}
