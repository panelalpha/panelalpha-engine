# Replaces the repo's compose.yaml (the FrankenPHP template's dev shape: auto-TLS
# on :443, a Mercure hub, a messenger worker, and a public !ChangeMe! DB
# password) with the real stack Habitat needs. The app image is the project's
# official Docker Hub build (assets precompiled, APP_ENV=prod baked); postgres is
# the only other pulled image. Mercure and the worker are intentionally absent:
# no app code uses Mercure and messenger routes nothing off sync://.
services:
  habitat-database:
    # Pinned major: Postgres cannot migrate a datadir backwards, so a floating
    # latest would break the named volume the first time the major moves.
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_PASSWORD only, written once by hooks/prepare.sh and baked into the
    # database_data volume; never regenerated.
    env_file:
      - ../.panelalpha/habitat/db.env
    environment:
      POSTGRES_DB: habitat
      POSTGRES_USER: habitat
      # A named volume is not always empty (lost+found); postgres refuses to init
      # into a non-empty dir, so give it a clean subdir.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitat -d habitat -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 512m

  # One-shot: migrate the schema to completion before the app is allowed to
  # serve. RUN_MIGRATIONS=false stops the image entrypoint from also migrating,
  # so this is the single migration path; `habitat-app` gates on it with
  # service_completed_successfully, so a failed migration fails the deploy
  # instead of publishing a 500 site.
  habitat-init:
    image: docker.io/carlnewton/habitat:1.6.0
    restart: "no"
    depends_on:
      habitat-database:
        condition: service_healthy
    env_file:
      - .env
      - ../.panelalpha/habitat/app.env
    environment:
      RUN_MIGRATIONS: "false"
      APP_ENV: prod
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--all-or-nothing"]
    mem_limit: 1024m

  habitat-app:
    image: docker.io/carlnewton/habitat:1.6.0
    restart: unless-stopped
    depends_on:
      habitat-database:
        condition: service_healthy
      habitat-init:
        condition: service_completed_successfully
    env_file:
      - .env
      - ../.panelalpha/habitat/app.env
    environment:
      # Caddy serves plain HTTP on :80 -- no auto-TLS -- because the engine
      # terminates TLS in front of the account. ":80" makes the FrankenPHP
      # Caddyfile site address bind every host on port 80 without a cert.
      SERVER_NAME: ":80"
      APP_ENV: prod
      # Migrations already ran in habitat-init; do not repeat them here.
      RUN_MIGRATIONS: "false"
      # MERCURE_PUBLISHER_JWT_KEY / MERCURE_SUBSCRIBER_JWT_KEY come from app.env
      # (env_file above): the bundled Caddyfile's `mercure` directive refuses to
      # load without them, even though no application code publishes to Mercure.
    volumes:
      # Local image uploads (imageStorage defaults to 'local' -> /uploads).
      - habitat_uploads:/uploads
      # Caddy runtime state (no certs are issued in :80 mode, but the image
      # writes here on boot).
      - caddy_data:/data
      - caddy_config:/config
    # Publish the app's HTTP port on 8080 so the engine's port scan takes 8080 as
    # the primary (engine#231).
    ports:
      - "8080:80"
    healthcheck:
      # `/` renders through the DB (the setup/redirect listener reads Settings),
      # so a non-5xx proves FrankenPHP, PHP and Postgres. A fresh site 302s to
      # /setup; curl without -L treats 302 as success, -f fails only on >=400.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    mem_limit: 1536m

  # Starts nothing, exits 0, waits on the app's healthcheck. `docker compose up
  # -d` blocks on a depends_on health condition, so this makes `up` return only
  # once the site actually answers, not the moment the container starts
  # (engine#204).
  ready:
    image: docker.io/library/alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      habitat-app:
        condition: service_healthy
    mem_limit: 64m

volumes:
  database_data: {}
  habitat_uploads: {}
  caddy_data: {}
  caddy_config: {}
