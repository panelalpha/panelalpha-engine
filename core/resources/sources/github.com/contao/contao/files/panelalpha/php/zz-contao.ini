; Read through PHP_INI_SCAN_DIR, which the compose override points at this
; directory as well as the image's own conf.d. The shared PHP base image loads
; no php.ini at all -- `php --ini` says "Loaded Configuration File: (none)" --
; so what applies without this file are PHP's compiled-in defaults, measured in
; this image as memory_limit 128M, post_max_size 8M, upload_max_filesize 2M.

; Contao's own system requirements ask for 256M and its back end warns below
; that. cache:warmup over the whole DCA set and the Twig namespace map is the
; peak, and the demo theme compiles its SCSS with scssphp on the first request.
memory_limit = 512M

; The file manager is half of what a CMS is for. 2M would reject a photograph.
upload_max_filesize = 32M
post_max_size = 32M

; A Contao back-end form is one input per DCA field plus one per palette row,
; and a long content element list goes past the default 1000 -- at which point
; PHP silently drops the rest of the POST and the record saves half-edited.
max_input_vars = 5000

; The back end posts large records; the front end never needs this long.
max_execution_time = 300
