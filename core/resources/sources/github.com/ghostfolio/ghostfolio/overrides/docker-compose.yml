# Compose-replace: building the repo's Dockerfile runs out of memory in an
# account. Runs the release image with upstream's docker/docker-compose.yml stack.
services:
  postgres:
    # Postgres cannot open a datadir from a newer major; keep this pinned.
    image: docker.io/library/postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghostfolio
      POSTGRES_DB: ghostfolio
    env_file:
      # POSTGRES_PASSWORD, generated by hooks/prepare.sh.
      - ../.panelalpha/ghostfolio/db.env
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostfolio -d ghostfolio -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 384m

  redis:
    image: docker.io/library/redis:8.2-alpine
    restart: unless-stopped
    env_file:
      # REDIS_PASSWORD, generated by hooks/prepare.sh.
      - ../.panelalpha/ghostfolio/redis.env
    command: ["/bin/sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --pass \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 128m

  app:
    image: docker.io/ghostfolio/ghostfolio:3.75.0
    restart: unless-stopped
    init: true
    ports:
      - "3333:3333"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ROOT_URL: ${PA_PUBLIC_URL}
    env_file:
      # DATABASE_URL, REDIS_PASSWORD, ACCESS_TOKEN_SALT, JWT_SECRET_KEY.
      - ../.panelalpha/ghostfolio/app.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3333/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1024m

  # No-op: `compose up -d` returns once Ghostfolio has migrated and answers.
  ready:
    image: docker.io/library/redis:8.2-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  postgres: {}
  redis: {}
