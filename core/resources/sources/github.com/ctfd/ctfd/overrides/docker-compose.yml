# Compose-replace: the engine rewrites the repo compose's mysql+pymysql://
# DATABASE_URL to mysql://, which the image cannot load. Runs the official
# image of the current release on MariaDB and Redis.
services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    # CTFd's required defaults (upstream compose), sized for a shared account.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --wait_timeout=28800
      - --innodb-buffer-pool-size=128M
      - --max-connections=64
      - --performance-schema=OFF
    environment:
      MARIADB_DATABASE: ctfd
      MARIADB_USER: ctfd
      MARIADB_AUTO_UPGRADE: "1"
    env_file:
      # MARIADB_PASSWORD / MARIADB_ROOT_PASSWORD, generated by hooks/prepare.sh.
      - ../.panelalpha/ctfd/db.env
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    mem_limit: 512m

  cache:
    image: redis:8.2-alpine
    restart: unless-stopped
    volumes:
      - cache:/data
    mem_limit: 128m

  app:
    image: ctfd/ctfd:3.8.7
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      UPLOAD_FOLDER: /var/uploads
      REDIS_URL: redis://cache:6379
      WORKERS: "1"
      ACCESS_LOG: "-"
      ERROR_LOG: "-"
      # Behind the account proxy: trust one hop (the proxy-added one).
      REVERSE_PROXY: "true"
    env_file:
      # DATABASE_URL / SECRET_KEY, generated by hooks/prepare.sh.
      - ../.panelalpha/ctfd/app.env
    volumes:
      - uploads:/var/uploads
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthcheck', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    mem_limit: 768m

  # No-op: `compose up -d` returns once CTFd has migrated and answers.
  ready:
    image: redis:8.2-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  db: {}
  cache: {}
  uploads: {}
