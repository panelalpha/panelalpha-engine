# Front proxy for Squidex (see overrides/docker-compose.yml). The engine's health
# probe sends no X-Forwarded-Proto; Squidex's antiforgery cookie is
# secure-only, so that probe gets a 500. Default the header to https only when absent.
map $http_x_forwarded_proto $xfp {
    ''      https;
    default $http_x_forwarded_proto;
}

# Send `Connection: upgrade` only for real upgrades.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 5000;
    # Asset uploads.
    client_max_body_size 0;
    resolver 127.0.0.11 valid=10s;
    set $sq http://squidex:5000;

    location / {
        proxy_pass $sq;
        proxy_http_version 1.1;
        # X-Forwarded-For/-Host pass through unchanged from the engine's proxy.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
