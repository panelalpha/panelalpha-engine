# Compose-replace: upstream's squidex-hosting compose on the release image
# instead of the repo's multi-stage source build; MongoDB 7.0 (engine#146).
services:
  squidex:
    image: squidex/squidex:7.24.0
    restart: unless-stopped
    depends_on:
      squidex_mongo:
        condition: service_healthy
    environment:
      URLS__BASEURL: ${PA_PUBLIC_URL}
      URLS__ENABLEFORWARDHEADERS: "true"
      ASPNETCORE_HTTP_PORTS: "5000"
      EVENTSTORE__MONGODB__CONFIGURATION: mongodb://squidex_mongo
      STORE__MONGODB__CONFIGURATION: mongodb://squidex_mongo
      ASSETSTORE__TYPE: Folder
      ASSETSTORE__FOLDER__PATH: /app/Assets
      # appsettings.json ships the hosted squidex.io OAuth clients; empty disables them.
      IDENTITY__GOOGLECLIENT: ""
      IDENTITY__GITHUBCLIENT: ""
      IDENTITY__MICROSOFTCLIENT: ""
    volumes:
      - squidex_assets:/app/Assets
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: 1536m

  squidex_mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - squidex_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  # Front proxy for engine#429 (files/panelalpha/front.conf); the only published port.
  web:
    image: nginx:1-alpine
    restart: unless-stopped
    volumes:
      - ./panelalpha/front.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5000:5000"
    depends_on:
      squidex:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 64m

  # No-op gate: `compose up -d` returns once Squidex answers /healthz through the front.
  ready:
    image: nginx:1-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 32m

volumes:
  squidex_assets: {}
  squidex_mongo: {}
