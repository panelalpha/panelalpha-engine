# yaml-language-server: $schema=../../../_schema.json
description: >-
  Prowlarr is the indexer manager of the *arr stack: one .NET process serving
  its web UI and REST API (/api/v1) on :9696, SQLite in /config. The
  repository's default branch (develop) is a .NET + frontend source build that
  fails under the engine ("A build step failed"), and Servarr publishes no
  image of its own; this recipe replaces the build with the LinuxServer.io
  image of the current stable release, config on a named volume that survives
  redeploys.

  With no authentication configured Prowlarr shows every visitor a "set up
  authentication" modal, which would let the first visitor own the instance.
  PROWLARR__AUTH__METHOD=Forms and PROWLARR__AUTH__REQUIRED=Enabled pin a
  login form from the very first boot (environment wins over config.xml and
  the UI; "disabled for local addresses" would open it to everyone, since
  every request arrives through the local proxy). hooks/prepare.sh generates
  the login password once into ~/.panelalpha/prowlarr/admin.env; a one-shot
  `seed` service, after the app is healthy, reads Prowlarr's own API key from
  config.xml and sets the user through PUT /api/v1/config/host, only when no
  user exists. `ready` makes `compose up -d` return only after that.
