# yaml-language-server: $schema=../../../_schema.json
description: >-
  SVG Path Editor, a browser editor for SVG path data: a static Angular 17
  app with no server side (paths live in the visitor's browser).

  The repository's Dockerfile is a development container (CMD `npx ng serve
  --host 0.0.0.0 --port 4200`). The Angular dev server rejects any Host it
  does not know, so through the project's domain it answers 200 with the body
  "Invalid Host header". Upstream publishes
  with `npm run build-prod` (ng build, production configuration) to GitHub
  Pages; this recipe uses the Angular platform instead of that Dockerfile:
  `npm ci`, the project's own `npm run build` (ng build, production by
  default, base href /) and nginx serving dist/svg-path-editor, the browser
  builder's outputPath in angular.json.
extends: angular
output_directory: dist/svg-path-editor
