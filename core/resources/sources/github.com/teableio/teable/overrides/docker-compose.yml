# The repository is the monorepo source; this is upstream's
# dockers/examples/standalone/docker-compose.yaml on the release image.
services:
  app:
    image: ghcr.io/teableio/teable:release.2026-09-27T13-21-53Z.3275
    restart: unless-stopped
    env_file:
      - ../.panelalpha/teable/teable.env
    environment:
      TZ: UTC
      PUBLIC_ORIGIN: ${PA_PUBLIC_URL}
      BACKEND_CACHE_PROVIDER: redis
    ports:
      - "3000:3000"
    volumes:
      - teable-data:/app/.assets
    depends_on:
      teable-db:
        condition: service_healthy
      teable-cache:
        condition: service_healthy
    # First boot runs the Prisma migrations before the server binds.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    mem_limit: 2g

  teable-db:
    image: postgres:15.4
    restart: unless-stopped
    env_file:
      - ../.panelalpha/teable/teable.env
    environment:
      TZ: UTC
      POSTGRES_DB: teable
      POSTGRES_USER: teable
    volumes:
      - teable-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U teable -d teable"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 512m

  teable-cache:
    image: redis:7.2.4
    restart: unless-stopped
    env_file:
      - ../.panelalpha/teable/teable.env
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - teable-cache:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 128m

  ready:
    image: docker.io/library/alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m

volumes:
  teable-data: {}
  teable-db: {}
  teable-cache: {}
