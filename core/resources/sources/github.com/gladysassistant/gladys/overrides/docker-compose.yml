# docker/docker-compose.yml is a host install (privileged, host network, /dev,
# docker.sock, Watchtower). This keeps its image and environment, without those.
services:
  app:
    image: docker.io/gladysassistant/gladys:v5.1.3
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SQLITE_FILE_PATH: /var/lib/gladysassistant/gladys-production.db
      SERVER_PORT: "80"
      TZ: Etc/UTC
    volumes:
      - data:/var/lib/gladysassistant
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:80/',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: 1g

  # No-op gate: `compose up -d` returns only once Gladys answers.
  ready:
    image: docker.io/gladysassistant/gladys:v5.1.3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  data: {}
