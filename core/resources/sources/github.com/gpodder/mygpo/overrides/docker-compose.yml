# Compose-replace: the repository ships no Dockerfile or compose file, and
# needs PostgreSQL, Redis and a Celery worker next to the Django site.
services:
  # Front: serves collectstatic output (Django does not with DEBUG off) and
  # proxies the rest to gunicorn.
  app:
    image: nginx:1.29.5-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./mygpo-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - mygpo-static:/var/www/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 64m

  web:
    image: python:3.12.14-bookworm
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/mygpo-start.sh", "web"]
    env_file:
      - ../.panelalpha/mygpo/app.env
    environment: &mygpo-env
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      BROKER_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
      ARCHIVE_ROOT: /data/archive
      DEFAULT_BASE_URL: ${PA_PUBLIC_URL}
      # The site has no SMTP settings of its own besides the backend; activation
      # mails go to the log unless the owner sets another backend.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      # Podcast feeds are parsed by the separate mygpo-feedservice (upstream default).
      FEEDSERVICE_URL: ${FEEDSERVICE_URL:-http://feeds.gpodder.net/}
    volumes:
      - ./:/src:ro
      - ./mygpo-start.sh:/usr/local/bin/mygpo-start.sh:ro
      - mygpo-venv:/opt/venv
      - mygpo-static:/var/www/staticfiles
      - mygpo-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
    mem_limit: 768m

  # Celery worker with the beat scheduler (subscriptions, feed updates).
  worker:
    image: python:3.12.14-bookworm
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/mygpo-start.sh", "worker"]
    env_file:
      - ../.panelalpha/mygpo/app.env
    environment: *mygpo-env
    volumes:
      - ./:/src:ro
      - ./mygpo-start.sh:/usr/local/bin/mygpo-start.sh:ro
      - mygpo-venv:/opt/venv
      - mygpo-data:/data
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 512m

  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/mygpo/db.env
    volumes:
      - mygpo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygpo -d mygpo"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    volumes:
      - mygpo-redis:/data
    mem_limit: 128m

  # No-op: `compose up -d` returns once the first-boot install and migrations
  # are done and the site answers.
  ready:
    image: nginx:1.29.5-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_started
      web:
        condition: service_healthy
    mem_limit: 32m

volumes:
  mygpo-venv: {}
  mygpo-static: {}
  mygpo-data: {}
  mygpo-db: {}
  mygpo-redis: {}
