# Layers over the compose file the laravel strategy generates. That file is
# right about the app -- the shared PHP base image, ~/project bind-mounted at
# /app, the account's own uid, PA_DOCROOT=/app, Apache on 8000, the public
# https URL in APP_URL -- and says nothing about when Winter is ready, because
# nothing in a Laravel checkout can.
#
# An override rather than a replacement compose file, and here that is not a
# preference: an `overrides/docker-compose.yml` is written into the checkout
# *before* detection runs, so a compose file in the project root would make
# Winter look like a compose project and take the laravel strategy -- with it
# the bind mount, the docroot, the Composer pass and the staged entrypoint --
# off the table entirely.
services:
  app:
    # Two requests, and the second is the one that proves anything.
    #
    # The install stage does the real work before Apache binds: `winter:up`,
    # which is UpdateManager::update() -- 40-odd migrations across the system,
    # backend and cms modules and the committed Winter.Demo plugin, then each
    # module's DatabaseSeeder, which is what creates the roles, the Owners
    # group and the `admin` user -- and then the password reset.
    # The engine runs `docker compose up -d` without --wait and probes as soon
    # as it returns, which is while all of that is still going: nothing is
    # listening and the probe reads `Failed to connect to 127.0.0.1 port 8000`.
    #
    #   1. GET /                              the Demo theme's home page, 200.
    #                                         Cms\Classes\Theme reads the active
    #                                         theme out of the database, so this
    #                                         already needs a migrated schema.
    #   2. GET /backend/backend/auth/signin   the backend login form, 200 —
    #                                         rendered from backend_users and
    #                                         the seeded roles, so a 200 here is
    #                                         proof the seeders finished and not
    #                                         only the migrations. `/backend` on
    #                                         its own is a 302 to this address
    #                                         and would prove much less.
    #
    # The probe curls 127.0.0.1, so the Host header is `127.0.0.1:8000`. Winter
    # registers no trusted-host middleware and answers it normally. Idempotent,
    # so a retry replays it harmlessly. curl is in the base image. No -L: there
    # is nothing to follow, and a redirect's Location would be the account's
    # absolute https URL, which is not this port.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null --max-time 30 http://127.0.0.1:8000/ &&
          curl -fsS -o /dev/null --max-time 30
          http://127.0.0.1:8000/backend/backend/auth/signin
      interval: 10s
      timeout: 40s
      retries: 24
      # The install stage on a 2-core host. A failing check inside this window
      # neither counts against retries nor marks the container unhealthy.
      start_period: 240s

  # Does nothing and exits 0. Compose does not wait for a healthcheck on its
  # own, but it does block on a `depends_on` health condition -- so a service
  # that waits for the app is what makes `up -d` return only once Winter has
  # migrated, seeded and answered, and what the health probe then meets. A
  # clean exit 0 is not a crash loop as far as AppHealth is concerned.
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
