# Compose-replace: the repo's docker-compose.yml publishes both the web client
# and the API, hard-codes DB password 12345 and runs postgres:latest (18, which
# refuses the /var/lib/postgresql/data mount). Same official image here, with a
# pinned Postgres major and generated secrets.
services:
  db:
    # Pinned major: Postgres cannot open a datadir from a newer major.
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/peppermint/db.env
    environment:
      POSTGRES_DB: peppermint
      POSTGRES_USER: peppermint
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peppermint -d peppermint -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 384m

  app:
    # 0.5.5 is the latest release; upstream publishes it only as :latest.
    image: docker.io/pepperlabs/peppermint:latest@sha256:d13932713561c8d69baea49820ba2d42ea145b28193b6a7e33950a05812406fd
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.panelalpha/peppermint/app.env
    environment:
      DB_USERNAME: peppermint
      DB_HOST: db
    volumes:
      # Ticket attachments (multer dest uploads/ under the API's cwd).
      - peppermint-uploads:/apps/api/uploads
    # Only the web client; it proxies /api/v1 to the API on localhost:5003.
    ports:
      - "3000:3000"
    healthcheck:
      # Next.js binds to $HOSTNAME (the container's address), not loopback.
      # The API answers 401 without a token, so any answer counts there.
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:5003/ && curl -fsS -o /dev/null http://$$(hostname):3000/"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1024m

  # `up -d` returns only once both processes answer.
  ready:
    image: docker.io/library/alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  pgdata: {}
  peppermint-uploads: {}
