# yaml-language-server: $schema=../../../_schema.json
description: >-
  listmonk on the compose stack its own repository ships, with one change:
  the Super Admin exists before listmonk listens. Upstream's compose leaves
  LISTMONK_ADMIN_USER and LISTMONK_ADMIN_PASSWORD empty, so a fresh install
  answers /admin/login with "Pick a username and password for the Super Admin
  account" to whoever opens it first. The engine generates the login
  (`credentials:` below, returned by GET /projects/{name}/app-credentials, MCP
  app_credentials_get), and overrides/docker-compose.override.yml runs
  files/panelalpha/listmonk/start.sh in place of upstream's command: listmonk's
  own install with that login, its upgrade, a claim on a loopback address for a
  database installed earlier without any user, and only then the server. A
  database that already has a user is left alone. The app-management script
  talks to PostgreSQL directly because listmonk is a compiled binary with no
  plugin system.
credentials:
  login_path: /admin/login
  adopt_from: .panelalpha/listmonk/admin.env
  fields:
    PA_ADMIN_USER: {kind: username, value: admin}
    PA_ADMIN_PASSWORD: {kind: password}
