# Upstream's docker/config/nginx.conf without the PowerSync location.
upstream wger {
    server web:8000;
}

server {
    listen 80;

    # Only the engine vhost reaches this port, and it appends the peer it saw
    # as the LAST X-Forwarded-For entry (a client-supplied value stays
    # first). Take that hop and hand wger exactly one address, so the
    # axes login lockout is per visitor, not one shared bucket.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    location / {
        proxy_pass http://wger;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        proxy_http_version 1.1;
    }

    location /static/ {
        alias /wger/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
    }

    location /media/ {
        alias /wger/media/;
    }

    client_max_body_size 100M;
}
