# Compose-replace: the official sosedoff/pgweb image (release 0.17.0) plus a
# PostgreSQL sidecar as its database. The repo compose is a dev setup with
# hard-coded credentials and no authentication in front of pgweb.
services:
  app:
    image: sosedoff/pgweb:0.17.0
    restart: unless-stopped
    # Image entrypoint already binds 0.0.0.0:8081. --lock-session disables
    # /api/connect and /api/switchdb, so pgweb cannot be pointed at other hosts.
    command: ["--lock-session", "--no-ssh", "--open-retry=20"]
    env_file:
      - ../.panelalpha/pgweb/pgweb.env
      # PGWEB_AUTH_USER / PGWEB_AUTH_PASS, generated and kept by the engine.
      - ../.panelalpha/app-credentials.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      # Authenticated and connected: /api/connection needs both
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -u \"$$PGWEB_AUTH_USER:$$PGWEB_AUTH_PASS\" http://127.0.0.1:8081/api/connection"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 256m

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/pgweb/postgres.env
    environment:
      POSTGRES_USER: pgweb
      POSTGRES_DB: pgweb
    volumes:
      # postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker
      - pgweb-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgweb -d pgweb -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  # `compose up -d` returns only once pgweb serves and refuses anonymous
  # requests (engine#204); fails the deploy if it would be open.
  ready:
    image: sosedoff/pgweb:0.17.0
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        code=$$(curl -s -o /dev/null -w '%{http_code}' http://app:8081/)
        [ "$$code" = 401 ] && echo "[ready] anonymous refused (401)" && exit 0
        echo "[ready] ERROR: anonymous request got $$code, expected 401"; exit 1
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  pgweb-db: {}
