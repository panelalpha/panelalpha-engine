# GlobaLeaks redirects every plain-HTTP request to https://<same host>, which
# loops behind the engine's TLS-terminating proxy; hand it TLS on :8443 instead.
server {
    listen 80;
    client_max_body_size 1g;

    location / {
        proxy_pass https://globaleaks:8443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
