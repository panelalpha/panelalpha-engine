# Isso expands ${VAR} from its environment in every value (compose sets them).
[general]
dbpath = /db/comments.db
# Sites allowed to embed the comments: this domain (for /demo/) and the
# customer's own site from ISSO_HOST.
host =
    ${PA_PUBLIC_URL}
    ${ISSO_HOST}

[server]
public-endpoint = ${PA_PUBLIC_URL}
# Empty as upstream: X-Forwarded-For is not trusted unless the customer sets it.
trusted-proxies = ${ISSO_TRUSTED_PROXIES}
