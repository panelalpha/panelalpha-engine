# The only thing on the account's port; it opens once the admin password is
# seeded. Jeedom takes the client address straight from X-Real-IP /
# X-Forwarded-For / CF-Connecting-IP (login bans, "internal" network, localOnly
# users), so it gets exactly one value: the hop the engine added.
server {
    listen 8080 default_server;
    server_name _;
    # Backup restore and plugin uploads.
    client_max_body_size 1g;

    # The last untrusted X-Forwarded-For entry is the one the engine appended.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Per-request lookup, so nginx never pins a stale address for `jeedom`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $jeedom jeedom:80;

    location / {
        proxy_pass http://$jeedom$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header CF-Connecting-IP  "";
        proxy_set_header Client-IP         "";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 600s;
    }
}
