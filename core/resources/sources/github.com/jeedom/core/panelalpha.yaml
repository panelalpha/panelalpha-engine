# yaml-language-server: $schema=../../../_schema.json
description: >-
  Jeedom is a home-automation platform (jeedom/core, GPL-2.0): PHP on Apache
  with MariaDB, cron-driven scenarios and a plugin market.

  == Why compose-replace from the official image ==

  Jeedom documents Docker as an install path and publishes
  jeedom/jeedom. The repo's docker-compose.yml runs jeedom/jeedom:4.4 with
  80 and 443 published straight away. This recipe runs the current release
  image jeedom/jeedom:4.6-http-bookworm. The "http-" tags are the variant WITH
  the internal MariaDB (DATABASE=1; plain 4.6-bookworm has none and opens a
  first-visitor database setup page). On first boot the image's own
  /root/init.sh downloads Jeedom, creates the database
  with a random password, runs composer and install/install.php. That last
  step creates admin/admin (install/install.php:57-62). Code, config, plugins
  and backups live in the named volume jeedom-html, and the database in
  jeedom-db.

  == How admin/admin never reaches the public ==

  1. The engine generates the admin login (`credentials:` below), keeps it
     and writes it to ~/.panelalpha/app-credentials.env on every deploy.
  2. The jeedom service's entrypoint is files/panelalpha/jeedom/start.sh.
     It starts a background loop, then execs the image's unchanged
     /root/init.sh. As www-data, the loop runs seed.php through Jeedom's own
     user class: once `admin` exists and still accepts "admin", it sets the
     engine's password. A password that already differs is left alone, so a
     password changed in the UI is kept. When done, it writes
     /run/panelalpha-seeded.
  3. The jeedom service publishes no port. Its healthcheck needs that marker,
     and `proxy` (nginx-unprivileged, the only published port) starts only
     once jeedom is healthy. So nothing public ever answers while admin/admin
     exists, and `compose up` returns only after the site works.
  4. Jeedom takes the client address straight from X-Real-IP /
     X-Forwarded-For / CF-Connecting-IP (core/php/utils.inc.php getClientIp,
     network::getClientIp). Those addresses drive login bans, the "internal"
     network that skips 2FA, and localOnly users. The proxy therefore resolves
     the address the engine appended (real_ip_recursive over private ranges),
     sends that single value in X-Forwarded-For and X-Real-IP,
     and clears CF-Connecting-IP and Client-IP.

  Hardware plugins (Z-Wave, Zigbee, USB/serial dongles, Bluetooth) are
  runtime configuration that the customer does in the plugin market. An
  account has no USB devices, so only network-reachable integrations work.

  The login is returned by GET /projects/{name}/app-credentials (MCP
  app_credentials_get).
credentials:
  adopt_from: .panelalpha/jeedom/admin.env
  fields:
    JEEDOM_ADMIN_USER: {kind: username, value: admin}
    JEEDOM_ADMIN_PASSWORD: {kind: password}
