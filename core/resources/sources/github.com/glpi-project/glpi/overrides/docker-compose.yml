# Compose-replace: upstream's docker-compose.example.yml (glpi-project/docker-images)
# on the published image instead of the repo's dev environment.
services:
  app:
    image: glpi/glpi:11.0.9
    restart: unless-stopped
    ports:
      - "8080:80"
    # With all five GLPI_DB_* set the image installs/updates the schema on boot.
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_PORT: "3306"
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD is required}
    env_file:
      # GLPI_ADMIN_USER / GLPI_ADMIN_PASSWORD, the login the engine generates.
      - ../.panelalpha/app-credentials.env
    # The image's entrypoint installs or updates the schema and then runs this
    # command: it sets the engine's login on the built-in glpi account and
    # disables tech, normal and post-only while they have their default
    # passwords, then execs the image's own command.
    command: ["/bin/bash", "/panelalpha/glpi-login.sh", "/usr/bin/supervisord", "-c", "/etc/supervisor/supervisord.conf"]
    volumes:
      - glpi-data:/var/glpi
      - ./panelalpha/glpi-login.sh:/panelalpha/glpi-login.sh:ro
      - ./panelalpha/glpi-default-logins.php:/panelalpha/glpi-default-logins.php:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1g

  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD is required}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: 512m

  # No-op gate (mariadb's entrypoint execs `true`): `compose up -d` returns
  # once the schema is installed and Apache answers.
  ready:
    image: mariadb:11.8
    restart: "no"
    command: ["true"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  glpi-data: {}
  db-data: {}
