# Layers over the compose file the php strategy generates. That file is right
# about the app -- the shared PHP 8.4 base image, ~/project bind-mounted at
# /app, the account's own uid, PA_DOCROOT=/app/public, Apache on 8000, DB_*
# from the database the engine provisioned and APP_URL from the account's own
# address -- and says nothing about when Shopware is ready, because nothing in
# a PHP checkout can.
#
# An override rather than a replacement compose file, and here that matters
# twice over: an `overrides/docker-compose.yml` is written into the checkout
# *before* detection runs, so a compose file in the project root is exactly
# the thing hooks/prepare.sh had to move out of the way (engine defect #166,
# and the reason this repository was detected as `compose` to begin with).
#
# There is no database service here on purpose. `database: mysql` in
# panelalpha.yaml gets one on the account's own MySQL server: visible in the
# panel, openable in phpMyAdmin, inside the account's backup, and costing the
# host neither a container nor a volume. Measured MariaDB 12.2.2 on this
# engine, against Shopware's floor of 10.11
# (DatabaseConnectionFactory::checkVersion()).
services:
  app:
    environment:
      # The one way to give this container a php.ini. The base image loads
      # none and scans /usr/local/etc/php/conf.d, a directory inside the image
      # that the account uid cannot write to. PHP reads PHP_INI_SCAN_DIR from
      # its own environment at startup whatever the SAPI, so naming a second
      # directory here reaches the Apache module and the CLI both.
      #
      # The image's directory is listed first and explicitly: PHP_INI_SCAN_DIR
      # replaces the compiled-in path rather than adding to it, and dropping
      # it would unload every docker-php-ext-*.ini -- intl, pdo_mysql, gd,
      # sodium, opcache, the lot -- which is a container with no PHP
      # extensions and, for Shopware, a composer platform check that fails.
      #
      # It also keeps panelalpha-proxy.ini, whose auto_prepend_file is what
      # makes Symfony see https:// on a site the engine terminates TLS for.
      # Shopware needs that: a request whose scheme and host do not match a
      # sales channel domain is answered 400, not redirected.
      PHP_INI_SCAN_DIR: /usr/local/etc/php/conf.d:/app/panelalpha/php

    # ServiceLimits caps an app-role service it did not write at 384m, and the
    # install stage does not fit in it: `composer dump-autoload --optimize`
    # over ~170 packages, then system:install, which imports the base schema,
    # runs every core migration, indexes the DAL and compiles the Symfony prod
    # container. In an override file this reaches Docker as written -- the
    # hardener never sees it -- which is the point.
    mem_limit: 1g

    # Engine defect #90. The install stage does all of Shopware's setup before
    # Apache binds: the autoloader dump, the schema and its migrations, the
    # administrator, the sales channel and a theme compile. The engine runs
    # `docker compose up -d` without --wait and probes as soon as it returns,
    # which is while all of that is still going.
    #
    #   1. GET /                 the storefront home page. A 200 means the
    #                            schema exists, the sales channel resolves for
    #                            this host, and the theme was compiled.
    #   2. GET /account/login    grepped, not trusted for its status code. It
    #                            is the half that a missing public/.htaccess
    #                            breaks while `/` still answers -- without the
    #                            rewrite, `/` reaches index.php through
    #                            DirectoryIndex and every other route is a
    #                            filesystem 404. `type="password"` is on the
    #                            customer login form.
    #
    # The Host header is not optional. Shopware resolves a request to a sales
    # channel by matching scheme and host against sales_channel_domain.url,
    # and answers an unmatched one with HTTP 400 and a "Domain Mapping
    # Misconfiguration" page -- so a bare `curl http://127.0.0.1:8000/` is a
    # 400 on a perfectly healthy shop. APP_URL is the account's own address;
    # `$$` is an escaped `$`, because compose interpolates the file itself.
    #
    # Idempotent, so a retry replays it harmlessly. curl is in the base image.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          H=$$(printf '%s' "$$APP_URL" | sed -e 's#^[a-z][a-z]*://##' -e 's#/.*##') &&
          curl -fsS -o /dev/null --max-time 30 -H "Host: $$H" http://127.0.0.1:8000/ &&
          curl -fsS --max-time 30 -H "Host: $$H" http://127.0.0.1:8000/account/login | grep -q 'type="password"'
      interval: 10s
      timeout: 40s
      retries: 30
      # The install stage on a shared host. A failing check inside this window
      # neither counts against retries nor marks the container unhealthy.
      start_period: 900s

  # Does nothing and exits 0. Compose does not wait for a healthcheck on its
  # own, but it does block on a `depends_on` health condition -- so a service
  # that waits for the app is what makes `up -d` return only once Shopware has
  # migrated its schema, created its administrator and answered, and what the
  # health probe then meets. A clean exit 0 is not a crash loop as far as
  # AppHealth is concerned.
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
