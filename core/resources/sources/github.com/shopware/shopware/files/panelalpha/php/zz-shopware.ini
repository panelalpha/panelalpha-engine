; Read through PHP_INI_SCAN_DIR, which overrides/docker-compose.override.yml
; points at this directory as well as the image's own conf.d.
;
; The shared PHP base image loads no php.ini at all -- `php --ini` says
; "Loaded Configuration File: (none)" -- so what applies are PHP's compiled-in
; defaults: memory_limit 128M, upload_max_filesize 2M, post_max_size 8M.
; Shopware starts and serves a storefront on those, but they are below what
; the shop needs the moment anyone uses it.

; Shopware's own requirement check asks for 512M. The storefront renders well
; under it; what does not are the administration's API calls -- a product
; import, a media batch, dal:refresh:index over a real catalogue.
memory_limit = 512M

; 2M is smaller than a single product photograph off a phone, and it is also
; the ceiling on uploading a plugin zip in the administration.
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 300

; Shopware compiles a large Symfony container and a great many Twig templates.
; The default 10000 interned files is not enough for the storefront plus the
; administration, and the misses show up as a slow first request per worker.
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 20
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
