# yaml-language-server: $schema=../../../_schema.json
description: >-
  WordPress on the official image with MySQL 8, since the repository ships
  source and no compose file. The prepare hook generates the database
  credentials and all eight secret keys once into ~/.panelalpha/wordpress,
  outside the checkout a redeploy empties, and the stack reads them through
  env_file. The db service sets a MySQL volume made earlier to the stored
  passwords on every start, so a password file written again cannot lock the
  site out of its database. wp-content lives on a volume seeded from the checkout, so uploads,
  plugins and themes survive a redeploy; a must-use plugin provides user
  management and SSO. A wp-cli service on wordpress:cli carries the MySQL
  client WP-CLI's database commands need; db-auth moves the wordpress user to
  mysql_native_password, the only one of MySQL 8's logins that client has.
