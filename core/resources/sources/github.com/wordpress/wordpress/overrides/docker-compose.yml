services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    # MYSQL_PASSWORD and MYSQL_ROOT_PASSWORD, written once by hooks/prepare.sh
    # outside ~/project so a redeploy does not regenerate them.
    env_file:
      - ../.panelalpha/wordpress/db.env
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
    # A real login over TCP. `mysqladmin ping` exits 0 even on access denied,
    # and answers the init-time server, which listens on the socket only.
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u wordpress -e 'SELECT 1' wordpress >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ~/project is emptied on every deploy, so wp-content (uploads, plugins and
  # themes installed from the admin) lives on a volume. This seeds it from the
  # checkout without overwriting anything already there, refreshes the
  # PanelAlpha must-use plugin, and hands new files to www-data, as the
  # official image does for its own copy.
  wp-content:
    image: wordpress:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        cp -R --update=none /seed/. /wp-content/ &&
        cp -f /seed/mu-plugins/panelalpha-app.php /wp-content/mu-plugins/ &&
        find /wp-content ! -user www-data -exec chown www-data:www-data {} +
    volumes:
      - ./wp-content:/seed:ro
      - wp_content:/wp-content

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - wp_content:/var/www/html/wp-content
      # The document root is the checkout: keep .git and other dot paths off the web.
      - ./panelalpha/apache-deny-dotfiles.conf:/etc/apache2/conf-enabled/zz-panelalpha-deny-dotfiles.conf:ro
    # WORDPRESS_DB_PASSWORD and the eight keys/salts, read by the image's
    # wp-config.php through getenv, so a regenerated wp-config.php keeps them.
    env_file:
      - ../.panelalpha/wordpress/wordpress.env
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      db:
        condition: service_healthy
      wp-content:
        condition: service_completed_successfully

  # The MariaDB client in wp-cli has no caching_sha2_password plugin, which
  # MySQL 8 gives every new user, so the wordpress user is switched to
  # mysql_native_password on every start, which also covers a database made
  # before this service existed. A failure is logged here and leaves the site
  # as it was: only WP-CLI's database commands need it.
  db-auth:
    image: mysql:8.0
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h db -u root -e
        "ALTER USER 'wordpress'@'%' IDENTIFIED WITH mysql_native_password BY '$$MYSQL_PASSWORD'"
        || echo 'Could not switch the wordpress user to mysql_native_password; WP-CLI database commands will fail to log in.' >&2
    env_file:
      - ../.panelalpha/wordpress/db.env
    depends_on:
      db:
        condition: service_healthy

  # WP-CLI's database commands (wp db query, export and import) run the MySQL
  # client, which the wordpress image does not have; the engine runs them here.
  # Same tree and environment as the wordpress service, so wp-config.php reads
  # the same credentials. It only waits for WP-CLI to be run in it. The client
  # names on PATH are panelalpha/mysql-client.sh, copied out executable.
  wp-cli:
    image: wordpress:cli
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /tmp/panelalpha-bin &&
        for c in mysql mysqldump mysqlcheck; do
        install -m 0755 /etc/panelalpha/mysql-client.sh /tmp/panelalpha-bin/$$c || exit 1;
        done &&
        exec tail -f /dev/null
    volumes:
      - ./:/var/www/html
      - wp_content:/var/www/html/wp-content
      - ./panelalpha/mysql-client.sh:/etc/panelalpha/mysql-client.sh:ro
    env_file:
      - ../.panelalpha/wordpress/wordpress.env
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_NAME: wordpress
      PATH: /tmp/panelalpha-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    depends_on:
      wordpress:
        condition: service_started

volumes:
  db_data: {}
  wp_content: {}
