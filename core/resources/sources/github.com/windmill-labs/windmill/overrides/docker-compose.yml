# Upstream's docker-compose.yml sized down to one account: the release image
# instead of :main, one default and one native worker instead of 3+1 with 2 GB
# each, no privileged workers, and no Caddy (it only fronts the optional
# windmill_extra LSP/debugger and an SMTP listener on :25), so the server's
# own port is the site.
x-windmill: &windmill
  image: ghcr.io/windmill-labs/windmill:1.820.0
  restart: unless-stopped
  # DATABASE_URL, with the password generated by hooks/prepare.sh.
  env_file:
    - ../.panelalpha/windmill/db.env
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18
    restart: unless-stopped
    shm_size: 256m
    env_file:
      - ../.panelalpha/windmill/db.env
    environment:
      POSTGRES_DB: windmill
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 384m

  windmill_server:
    <<: *windmill
    environment:
      MODE: server
    ports:
      - "8000:8000"
    volumes:
      - worker_logs:/tmp/windmill/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/api/version"]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 30s
    mem_limit: 768m

  windmill_worker:
    <<: *windmill
    environment:
      MODE: worker
      WORKER_GROUP: default
    volumes:
      - worker_dependency_cache:/tmp/windmill/cache
      - worker_logs:/tmp/windmill/logs
    mem_limit: 768m

  # Native jobs (HTTP, SQL) run in-process here; lightweight.
  windmill_worker_native:
    <<: *windmill
    environment:
      MODE: worker
      WORKER_GROUP: native
      NATIVE_MODE: "true"
      SLEEP_QUEUE: "200"
    volumes:
      - worker_logs:/tmp/windmill/logs
    mem_limit: 256m

  # No-op gate: `compose up -d` returns only once the server answers.
  ready:
    image: postgres:18
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      windmill_server:
        condition: service_healthy
    mem_limit: 32m

volumes:
  db_data: {}
  worker_dependency_cache: {}
  worker_logs: {}
