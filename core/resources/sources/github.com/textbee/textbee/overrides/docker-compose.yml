# Compose-replace of the repo's docker-compose.yaml: API and dashboard built
# from the repo's own Dockerfiles (no public images), Mongo 7.0, one domain.
services:
  # One-shot: the API cannot start without a Firebase service account (it
  # pushes SMS jobs to the phone over FCM), so the deploy fails here naming
  # each missing variable. Read from .env, not interpolated (engine#336).
  check:
    image: redis:7-alpine
    restart: "no"
    env_file:
      - path: .env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        missing=""
        [ -n "$$FIREBASE_PROJECT_ID" ] || missing="$$missing FIREBASE_PROJECT_ID"
        [ -n "$$FIREBASE_CLIENT_EMAIL" ] || missing="$$missing FIREBASE_CLIENT_EMAIL"
        [ -n "$$FIREBASE_PRIVATE_KEY" ] || missing="$$missing FIREBASE_PRIVATE_KEY"
        if [ -n "$$missing" ]; then
          echo "Error: TextBee needs a Firebase service account. Set in the project's environment variables (from the service account JSON; FIREBASE_PRIVATE_KEY with \\n for line breaks):$$missing"
          exit 1
        fi
    mem_limit: 32m

  textbee-db:
    image: mongo:7.0
    restart: unless-stopped
    env_file:
      - ../.panelalpha/textbee/db.env
    environment:
      MONGO_INITDB_DATABASE: textbee
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 512m

  textbee-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 64m

  textbee-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      # Generated secrets first, so a project env var of the same name wins.
      - ../.panelalpha/textbee/api.env
      - path: .env
        required: false
    environment:
      PORT: "3001"
      REDIS_URL: redis://textbee-redis:6379
      FRONTEND_URL: ${PA_PUBLIC_URL}
      APP_PUBLIC_URL: ${PA_PUBLIC_URL}
      API_PUBLIC_URL: ${PA_PUBLIC_URL}
    depends_on:
      check:
        condition: service_completed_successfully
      textbee-db:
        condition: service_healthy
      textbee-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 768m

  textbee-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.panelalpha/textbee/web.env
    environment:
      # Next's standalone server binds to $HOSTNAME, which Docker sets to the container id.
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXTAUTH_URL: ${PA_PUBLIC_URL}
      NEXT_PUBLIC_SITE_URL: ${PA_PUBLIC_URL}
    depends_on:
      - textbee-api
    mem_limit: 512m

  # The only published port; routes /api/v1 to the API and the rest to the dashboard.
  web:
    image: nginx:1-alpine
    restart: unless-stopped
    volumes:
      - ./panelalpha/router.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - textbee-web
      - textbee-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/login || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
    mem_limit: 64m

  # No-op gate: `up` returns only once the dashboard and the API answer.
  ready:
    image: nginx:1-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      web:
        condition: service_healthy
      textbee-api:
        condition: service_healthy
    mem_limit: 32m

volumes:
  mongodb_data: {}
  redis_data: {}
