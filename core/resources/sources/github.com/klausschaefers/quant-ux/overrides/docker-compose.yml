# Compose-replace: upstream's published images (docker/docker-compose.yml)
# instead of building the front end, whose build runs out of memory.
services:
  app:
    image: docker.io/klausenschaefersinho/quant-ux:latest
    restart: unless-stopped
    environment:
      QUX_HTTP_PORT: "8082"
      QUX_PROXY_URL: http://backend:8080
      QUX_AUTH: qux
      # No websocket server (it needs its own public port); the site itself
      # keeps the client off upstream's hosted default.
      QUX_WS_URL: wss://${PA_PUBLIC_HOST}/ws
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/ && wget -q -O /dev/null http://127.0.0.1:8082/rest/status.json"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    mem_limit: 256m

  backend:
    image: docker.io/klausenschaefersinho/quant-ux-backend:latest
    restart: unless-stopped
    env_file:
      # QUX_JWT_PASSWORD, generated by hooks/prepare.sh.
      - ../.panelalpha/quantux/backend.env
    environment:
      # The image's SMTP client always fails to start (MailClient.createShared
      # gets a null pool name); debug mode logs mail instead of sending it.
      QUX_DEBUG: "true"
      QUX_HTTP_HOST: ${PA_PUBLIC_URL}
      QUX_HTTP_PORT: "8080"
      QUX_MONGO_DB_NAME: quantux
      QUX_MONGO_TABLE_PREFIX: quantux
      QUX_MONGO_CONNECTION_STRING: mongodb://mongo:27017
      QUX_IMAGE_FOLDER_USER: /app-data/qux-images
      QUX_IMAGE_FOLDER_APPS: /app-data/qux-image-apps
      QUX_AUTH_SERVICE: qux
    volumes:
      - data:/app-data
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 1g

  # 7.0, not 8.x: MongoDB 8.0+ refuses to start on Linux 6.19+ (SERVER-121912).
  mongo:
    image: docker.io/library/mongo:7.0
    restart: unless-stopped
    volumes:
      - db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 768m

  # No-op gate: `compose up -d` returns only once the front end and, through
  # its /rest proxy, the backend answer.
  ready:
    image: docker.io/library/alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  db: {}
  data: {}
