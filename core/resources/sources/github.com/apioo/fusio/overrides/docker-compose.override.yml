# Layers over the compose file the php strategy generates. That file is right
# about the app -- the shared PHP base image, ~/project bind-mounted at /app,
# the account's own uid, PA_DOCROOT=/app/public, Apache on 8000, APP_URL from
# the account's main domain and DB_* from the database the engine provisioned
# -- and says nothing about when Fusio is ready, because nothing in a PHP
# checkout can.
#
# An override rather than a replacement compose file, and here that is not a
# preference: an `overrides/docker-compose.yml` is written into the checkout
# *before* detection runs, so a compose file in the project root would make
# Fusio look like a compose project and take the php strategy -- and with it
# the bind mount, the docroot, the Composer pass and the staged entrypoint --
# off the table entirely.
#
# There is no database service here on purpose. `database: mysql` in
# panelalpha.yaml gets one on the account's own MySQL server: visible in the
# panel, openable in phpMyAdmin, inside the account's backup, and costing the
# host neither a container nor a volume. It is also what keeps this file from
# being mined for sidecars -- RuntimeSidecars globs every `docker-compose.*`
# in the checkout, including this one, and PhpStrategy skips that whole step
# when the manifest declares a database.
services:
  app:
    # ServiceLimits caps an app-role service it did not write at 384m. Fusio's
    # install stage compiles a Symfony service container over ~200 packages
    # and then runs Doctrine migrations in the same process, and the setup
    # script asks PHP for 512M to do it; a container ceiling below that turns
    # the overrun into a kill rather than an error message. In an override the
    # line reaches Docker as written -- the hardener never sees it.
    mem_limit: 768m

    # The install stage does all of Fusio's setup before Apache binds: the
    # migrations that *are* the installation (every table, category, scope,
    # role and default operation), the administrator, and the download of the
    # administration app. The engine runs `docker compose up -d` without
    # --wait and probes as soon as it returns, which is while that is still
    # going: nothing is listening and the probe reads `Failed to connect to
    # 127.0.0.1 port 8000`.
    #
    #   1. GET /              meta.getAbout, a public operation that only
    #                         exists once the migrations have inserted it,
    #                         answered by the router reading its routes out of
    #                         the database. A 200 here means the schema is
    #                         built and Doctrine can reach it.
    #   2. GET /system/health grepped for a true `healthy`, not trusted for
    #                         its status code -- the operation answers 200
    #                         whether or not the system is healthy, and what
    #                         it reports is a live ping of every connection
    #                         stored in the database. Since those connection
    #                         configs are encrypted with APP_PROJECT_KEY, this
    #                         is also the one request that proves the key the
    #                         deploy generated is the key the data was written
    #                         with.
    #
    # Host is `127.0.0.1:8000` for both, as it is for AppHealth's own probe.
    # Fusio accepts it: PSX validates no host, and with APP_URL set it no
    # longer needs the Host header to know its own address.
    #
    # Both routes are public, which matters more than it looks: Fusio runs a
    # fail2ban-style firewall counting client errors per address, and a probe
    # every 10s onto a route that 401s would eventually ban the container's
    # own loopback.
    #
    # The pattern allows the whitespace, because PSX pretty-prints its JSON
    # whatever psx_debug says: the body is `"healthy": true`, and a check
    # grepping for `"healthy":true` never matches and never goes healthy.
    #
    # Idempotent, so a retry replays it harmlessly. curl is in the base image.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null --max-time 30 http://127.0.0.1:8000/ &&
          curl -fsS --max-time 30 http://127.0.0.1:8000/system/health |
          grep -Eq '"healthy" *: *true'
      interval: 10s
      timeout: 40s
      retries: 30
      # The install stage on two slow cores, including one download from
      # api.fusio-project.org. A failing check inside this window neither
      # counts against retries nor marks the container unhealthy.
      start_period: 300s

  # Does nothing and exits 0. Compose does not wait for a healthcheck on its
  # own, but it does block on a `depends_on` health condition -- so a service
  # that waits for the app is what makes `up -d` return only once Fusio has
  # built its schema, created its administrator and answered, and what the
  # health probe then meets. A clean exit 0 is not a crash loop as far as
  # AppHealth is concerned.
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
