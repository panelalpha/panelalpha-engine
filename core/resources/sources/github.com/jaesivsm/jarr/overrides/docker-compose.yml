# Replaces the repo's dev/CI compose files with the real stack JARR needs on one
# public origin. jarr-server and jarr-worker are pulled from Docker Hub (latest
# tracks master); only the React front is built from the repo's own
# Dockerfiles/front, because the official front image bakes app.jarr.info as the
# API URL. Postgres and Redis run as sidecars on named volumes; nginx folds the
# SPA and the API onto one origin.
#
# Detection re-reads this file after it is written and must keep resolving to
# `compose`, so no service both `build:`s and bind-mounts a `./` path (the
# local-dev heuristic in ComposeFileInspector): the only build service (front)
# mounts nothing, and the services that bind-mount ./panelalpha do not build.
# Only nginx publishes a host port, so the engine's port scan takes it as the
# primary (engine#231).
services:
  db:
    # Pinned major: a datadir cannot be migrated backwards, so a floating latest
    # would break the named volume the first time the major moves.
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_PASSWORD only, written once by hooks/prepare.sh and baked into the
    # pgdata volume; never regenerated.
    env_file:
      - ../.panelalpha/jarr/db.env
    environment:
      POSTGRES_DB: jarr
      POSTGRES_USER: jarr
      # A named volume is not always empty (lost+found); postgres refuses to init
      # into a non-empty dir, so give it a clean subdir.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarr -d jarr -q"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    mem_limit: 512m

  redis:
    # Celery broker (db 2) + result backend (db 0) and JARR's own cache (db 1).
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 320m

  # React SPA, built from the repo's own Dockerfile with this instance's API URL.
  # REACT_APP_API_URL=/api makes every request same-origin under /api/, so the
  # bundle does not depend on the (build-time-unknown) public domain. PUBLIC_URL=/
  # roots the static asset paths at the domain root, where nginx serves them.
  # `serve -s` (the image CMD) does the single-page fallback. No bind mount, so
  # this build service does not trip the local-dev heuristic.
  front:
    build:
      context: .
      dockerfile: Dockerfiles/front
      args:
        PUBLIC_URL: /
        REACT_APP_API_URL: /api
    image: jarr-front-local:latest
    restart: unless-stopped
    # No `expose:` on internal services: nginx reaches them by service name on
    # their container port regardless, and the engine's port scan reads `expose`
    # too (ComposePortScan), where a bare 80 would outrank nginx's published 8080
    # in its PREFERRED order and become the proxy upstream (engine#231) -- a port
    # nothing publishes, giving a 502.
    mem_limit: 256m

  # One-shot: create the schema and seed the admin before server/worker serve.
  init:
    image: docker.io/jaesivsm/jarr-server:latest
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    # app.env carries JARR_ADMIN_LOGIN/PASSWORD (not JARR config keys); init.sh
    # reads them from the environment to seed the admin.
    env_file:
      - ../.panelalpha/jarr/app.env
    volumes:
      - ./panelalpha/jarr/jarr.json:/etc/jarr/jarr.json:ro
      - ./panelalpha/jarr:/pa:ro
    entrypoint: ["/bin/sh", "/pa/init.sh"]
    mem_limit: 768m

  # gunicorn REST API on :8000 (internal only; nginx reaches it by name).
  jarr-server:
    image: docker.io/jaesivsm/jarr-server:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    volumes:
      - ./panelalpha/jarr/jarr.json:/etc/jarr/jarr.json:ro
    healthcheck:
      # The image is python:3.13-slim with no curl/wget; the venv python is on
      # PATH via pipenv. `/` renders the swagger UI (200) and proves the app boots.
      test: ["CMD-SHELL", "pipenv run python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/',timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    mem_limit: 1024m

  # Celery worker: crawls feeds and clusters articles. Consumes all three queues
  # so the stack works whether or not crawler.use_queues is turned on.
  jarr-worker:
    image: docker.io/jaesivsm/jarr-worker:latest
    restart: unless-stopped
    command: ["pipenv", "run", "celery", "--app", "ep_celery.celery_app", "worker", "-Q", "jarr,jarr-crawling,jarr-clustering", "--concurrency", "2", "--loglevel", "warning"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    volumes:
      - ./panelalpha/jarr/jarr.json:/etc/jarr/jarr.json:ro
    mem_limit: 1024m

  # One-shot: kick the self-rescheduling scheduler once. It enqueues the
  # `scheduler` task on the Redis broker; the worker runs it, fetches due feeds,
  # and the task re-queues itself every crawler.idle_delay seconds thereafter.
  scheduler-kick:
    image: docker.io/jaesivsm/jarr-worker:latest
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
      jarr-worker:
        condition: service_started
    volumes:
      - ./panelalpha/jarr/jarr.json:/etc/jarr/jarr.json:ro
    entrypoint: ["pipenv", "run", "python", "-c", "from jarr.crawler.main import scheduler; scheduler.apply_async()"]
    mem_limit: 512m

  # Primary published service: serves the SPA at / and proxies /api/ to the API.
  nginx:
    image: docker.io/library/nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      jarr-server:
        condition: service_healthy
      front:
        condition: service_started
    volumes:
      - ./panelalpha/jarr/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    mem_limit: 128m

  # Starts nothing, exits 0, waits on nginx's healthcheck. The engine runs
  # `docker compose up -d` without --wait (engine#204), so without this gate the
  # deploy is "done" the moment containers start and the probe lands before the
  # site answers. A clean exit 0 is not a crash loop to AppHealth.
  ready:
    image: docker.io/library/alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      nginx:
        condition: service_healthy
    mem_limit: 64m

volumes:
  pgdata: {}
  redisdata: {}
