# The repo root is a source tree the engine cannot place. This runs upstream's
# release image as contrib/container/docker-compose.yml does: Postgres, Redis,
# server, background worker and Caddy (serving /static and /media).
x-inventree-env: &inventree-env
  INVENTREE_SITE_URL: ${PA_PUBLIC_URL}
  # The public host plus the loopback the health checks use.
  INVENTREE_ALLOWED_HOSTS: ${PA_PUBLIC_HOST},localhost,127.0.0.1
  INVENTREE_USE_X_FORWARDED_HOST: "True"
  INVENTREE_USE_X_FORWARDED_PORT: "True"
  INVENTREE_USE_X_FORWARDED_PROTO: "True"
  INVENTREE_LOG_LEVEL: WARNING
  INVENTREE_PLUGINS_ENABLED: "True"
  INVENTREE_DB_ENGINE: postgresql
  INVENTREE_DB_NAME: inventree
  INVENTREE_DB_HOST: db
  INVENTREE_DB_PORT: "5432"
  INVENTREE_DB_USER: inventree
  INVENTREE_CACHE_ENABLED: "True"
  INVENTREE_CACHE_HOST: cache
  INVENTREE_CACHE_PORT: "6379"
  INVENTREE_GUNICORN_TIMEOUT: "90"
  # Image defaults are 4 + 4; scaled down to fit a 2.5 GB account.
  INVENTREE_GUNICORN_WORKERS: "2"
  INVENTREE_BACKGROUND_WORKERS: "1"

services:
  app:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      # Upstream's Caddyfile: plain HTTP on :80, any host (TLS ends at the engine).
      INVENTREE_SITE_URL: "http://"
      INVENTREE_SERVER: http://server:8000
    volumes:
      - ./contrib/container/Caddyfile:/etc/caddy/Caddyfile:ro
      # static/ and media/ written by the server.
      - data:/var/www:ro
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    mem_limit: 128m

  server:
    image: inventree/inventree:1.5.6
    restart: unless-stopped
    env_file:
      - ../.panelalpha/inventree/db.env
    environment: *inventree-env
    volumes:
      # config.yaml, secret_key.txt, static, media, plugins, backups.
      - data:/home/inventree/data
    depends_on:
      update:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "invoke server-health --address http://localhost:8000"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    mem_limit: 1g

  worker:
    image: inventree/inventree:1.5.6
    restart: unless-stopped
    command: invoke worker
    env_file:
      - ../.panelalpha/inventree/db.env
    environment: *inventree-env
    volumes:
      - data:/home/inventree/data
    depends_on:
      update:
        condition: service_completed_successfully
    # qcluster forks a sentinel, pusher, monitor and workers, each importing
    # Django (~100-230 MB apiece); with two workers it was OOM-killed at 1g.
    mem_limit: 1536m

  # One-shot `invoke update` (migrations + collectstatic), as upstream's docs
  # run before the first start and after every upgrade.
  update:
    image: inventree/inventree:1.5.6
    restart: "no"
    command: invoke update --skip-backup
    env_file:
      - ../.panelalpha/inventree/db.env
    environment: *inventree-env
    volumes:
      - data:/home/inventree/data
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    mem_limit: 1g

  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - ../.panelalpha/inventree/db.env
    environment:
      POSTGRES_USER: inventree
      POSTGRES_DB: inventree
      PGDATA: /var/lib/postgresql/data/pgdb
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventree -d inventree"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 384m

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 128m

volumes:
  data: {}
  db: {}
