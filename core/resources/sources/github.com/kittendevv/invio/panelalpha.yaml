# yaml-language-server: $schema=../../../_schema.json
description: >-
  Invio is a self-hosted invoicing app (kittendevv/invio, AGPL-3.0): one image
  running a Deno/Hono backend on :3000 and a SvelteKit frontend on :8000 (which
  proxies /api), with invio.db (SQLite) under /app/data and PDFs rendered by
  WeasyPrint.

  == Why compose-replace from the published image ==

  The repository's docker-compose.yml runs ghcr.io/kittendevv/invio:latest
  with `env_file: .env`, which the engine fills from .env.example: admin /
  supersecret and JWT_SECRET=change-me-in-production. The backend seeds the
  admin from ADMIN_USER/ADMIN_PASS while the users table is empty
  (backend/src/database/init.ts seedAdminUser), so a stock deploy is a
  business-data app with a published login. This recipe runs the image
  upstream publishes for the current release, ghcr.io/kittendevv/invio:v2.2.0.

  == What the recipe supplies ==

  1. ADMIN_USER=admin and ADMIN_PASS, generated by the engine (`credentials:`
     below) into ~/.panelalpha/app-credentials.env and returned by GET
     /projects/{name}/app-credentials (MCP app_credentials_get), and a
     JWT_SECRET written once by hooks/prepare.sh into
     ~/.panelalpha/invio/secret.env (0600, dir 0700), both delivered by env_file; nothing from .env.example
     reaches the container. The admin is seeded on first boot, before the
     site is reachable; there is no public registration or installer.
  2. ORIGIN and BASE_URL from ${PA_PUBLIC_URL} (SvelteKit CSRF check, share
     links). BACKEND_URL is http://app:3000, the service's own name: the
     engine rewrites any *_URL=http://localhost:... to the public address,
     which points the frontend at itself.
  3. Persistence: /app/data on the named volume invio_data. `ready` waits on
     a healthcheck of both processes so `up -d` returns only once the app
     answers. Only :8000 is published.

  More users: the Users page (admin only).
credentials:
  login_path: /login
  adopt_from: .panelalpha/invio/secret.env
  fields:
    ADMIN_USER: {kind: username, value: admin}
    ADMIN_PASS: {kind: password}
