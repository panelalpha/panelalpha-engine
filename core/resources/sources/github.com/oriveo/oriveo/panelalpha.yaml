# yaml-language-server: $schema=../../../_schema.json
description: >-
  Oriveo's web client is a Next.js 16 bring-your-own-key AI chat app whose
  route handlers relay requests to model providers; keys and chats live in the
  browser, there is no account and no database. The repository root holds the
  iOS, Android and macOS clients beside web/, with no root package.json, so a
  plain deploy detects nothing and serves the placeholder.

  web/ is an npm workspace (apps/app is the Next app, packages/* its
  libraries): app_root: web installs and builds it there, and the Next.js
  recipe finds apps/app as its workspace and runs upstream's own `build:app`.
  The start is spelled out because upstream's start script binds
  127.0.0.1:3001 only. Every setting in web/.env.example is optional.
extends: nextjs
# web/ holds package.json (workspaces), package-lock.json and .nvmrc.
app_root: web
commands:
  # The container mounts web/ (app_root) at /app.
  - id: oriveo-serve
    stage: start
    serve: true
    run: cd apps/app && ../../node_modules/.bin/next start -H 0.0.0.0 -p 3000
