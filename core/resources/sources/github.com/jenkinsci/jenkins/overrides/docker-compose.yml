# Compose-replace: the repo is Jenkins core's Maven source, not a deployable
# site. Runs the official image of the current LTS release.
services:
  app:
    image: jenkins/jenkins:2.568.3-lts-jdk21
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      # Heap sized for the container, not the host.
      JAVA_OPTS: "-XX:MaxRAMPercentage=60"
    volumes:
      # Jobs, plugins, credentials, build history and the setup state.
      - jenkins_home:/var/jenkins_home
    healthcheck:
      # /login answers 200 once Jenkins is up (503 while it is loading).
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/login"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1536m

  # No-op: `compose up -d` returns only once Jenkins answers.
  ready:
    image: jenkins/jenkins:2.568.3-lts-jdk21
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  jenkins_home: {}
