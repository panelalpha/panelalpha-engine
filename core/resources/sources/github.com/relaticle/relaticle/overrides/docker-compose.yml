# Upstream's compose.yml on the current release image, with APP_KEY and the DB
# password from ~/.panelalpha (hooks/prepare.sh) and APP_URL set to the site.
x-env: &env
  APP_NAME: ${APP_NAME:-Relaticle}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
  APP_URL: ${PA_PUBLIC_URL}
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: relaticle
  DB_USERNAME: relaticle
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@${PA_PUBLIC_HOST}}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Relaticle}

services:
  app:
    image: ghcr.io/relaticle/relaticle:3.5.11
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../.panelalpha/relaticle/app.env
    environment:
      <<: *env
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_MIGRATION_ISOLATION: "true"
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 1024m

  horizon:
    image: ghcr.io/relaticle/relaticle:3.5.11
    restart: unless-stopped
    # Horizon's "production" supervisors start 6+ workers and scale to 45, which
    # exhausted the 2.5 GB account in a minute; its "local" set covers the same queues.
    command: ["php", "/var/www/html/artisan", "horizon", "--environment=local"]
    stop_signal: SIGTERM
    env_file:
      - ../.panelalpha/relaticle/app.env
    environment:
      <<: *env
      AUTORUN_ENABLED: "false"
      HORIZON_CHAT_MIN: "1"
      HORIZON_CHAT_MAX: "1"
      # opcache.enable_cli gives every CLI worker its own 136 MB cache.
      PHP_OPCACHE_ENABLE: "0"
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck-horizon"]
      start_period: 10s
    mem_limit: 1024m

  scheduler:
    image: ghcr.io/relaticle/relaticle:3.5.11
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    env_file:
      - ../.panelalpha/relaticle/app.env
    environment:
      <<: *env
      AUTORUN_ENABLED: "false"
      # opcache.enable_cli gives every CLI worker its own 136 MB cache.
      PHP_OPCACHE_ENABLE: "0"
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s
    mem_limit: 256m

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ../.panelalpha/relaticle/app.env
    environment:
      POSTGRES_DB: relaticle
      POSTGRES_USER: relaticle
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaticle -d relaticle"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres:
  redis:
  storage:
