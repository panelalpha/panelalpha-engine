# The repository's own image (built from its Dockerfile) plus the CouchDB it
# needs, as in upstream's docker-compose_prod_prebuilt.yaml.
services:
  database:
    image: docker.io/library/couchdb:3.5.2
    restart: unless-stopped
    env_file:
      - ../.panelalpha/flohmarkt/db.env
    environment:
      COUCHDB_USER: admin
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5984/_up"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  app:
    build: .
    image: flohmarkt-local:latest
    restart: unless-stopped
    # Upstream's `initdb` (creates the DB, user and indexes; skips what exists),
    # then `web`. The image's default command only prints usage.
    entrypoint: ["/bin/sh", "-c", "/entrypoint.sh initdb && exec /entrypoint.sh web"]
    env_file:
      - ../.panelalpha/flohmarkt/db.env
    environment:
      FLOHMARKT_EXTERNAL_URL: ${PA_PUBLIC_URL}
      FLOHMARKT_DB_HTTPS: "0"
      FLOHMARKT_DB_HOST: database
      FLOHMARKT_DB_PORT: "5984"
      FLOHMARKT_DB_NAME: flohmarkt
      FLOHMARKT_DB_USER: admin
    ports:
      - "8000:8000"
    volumes:
      - flohmarkt_data:/var/lib/flohmarkt
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    mem_limit: 768m

  # Makes `compose up -d` return only once flohmarkt answers.
  ready:
    image: docker.io/library/alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m

volumes:
  couchdb_data: {}
  flohmarkt_data: {}
