# yaml-language-server: $schema=../../../_schema.json
description: >-
  GoToSocial is a single-binary ActivityPub (fediverse) server implementing the
  Mastodon client API: one Go executable that serves the web UI, the client API
  and the federation endpoints, with SQLite (or Postgres) for data and a local
  directory for the media store. AGPL-3.0. It is a personal server -- a tenant
  running their own fediverse presence on their own domain -- not a relay and
  not a mail-receiving app (it sends confirmation/notification mail but never
  receives). In scope in principle; the ceiling is federation (see below).

  == Image, not source build ==

  The repository is the Go source tree (go.mod at the root). It does not build
  into a runnable server from a bare checkout for two independent reasons, so
  the recipe runs the image upstream publishes,
  docker.io/superseriousbusiness/gotosocial, and after hooks/prepare.sh reads
  the checkout's git ref to pick a tag this checkout contributes nothing -- not
  the runtime, not a byte of the image. The same choice Readeck/Homarr/Zabbix
  make; the application runs correctly (upstream's own binary), so this is
  Supported, not a broken HEAD (scope rule 1), and nothing here patches or pins
  the source (scope rule 2).

    1. The repository's own root Dockerfile is a *packaging* Dockerfile, not a
       build: its second stage is `FROM alpine:3.21` and does
       `COPY --chown=1000:1000 gotosocial /gotosocial/gotosocial` -- it copies a
       `gotosocial` binary that goreleaser/build.sh must have produced into the
       build context first. On a bare checkout that file does not exist, so a
       `docker build` fails at the COPY. Detection would otherwise pick this
       Dockerfile (root Dockerfile, dockerfile strategy priority 970).
    2. Even the Go build is two-language: the web UI assets under web/assets/dist
       are generated by a yarn/node pipeline (Dockerfile stage 1, node:lts-alpine
       `yarn build`) before the binary is packaged, and the engine's `go`
       strategy does not run a frontend pipeline. (Unlike Readeck the assets are
       served as files copied by the Dockerfile, not `//go:embed`ed, so the Go
       compile itself would succeed -- but the result has no web UI, and the
       packaging Dockerfile above is what detection actually selects.)

  So detection is steered to compose: the recipe ships overrides/docker-compose.yml,
  which AppConfigBootstrap writes as the project's own docker-compose.yml before
  detection runs, and the compose-usable probe (priority 980) then wins over the
  root Dockerfile (970). The probe explicitly accepts a repo that also has a root
  Dockerfile (ComposeUsableProbe: `|| $context->isFile('Dockerfile')`).

  == The federation ceiling ==

  Real federation with other instances is not claimed here. GoToSocial bakes
  the host into every account and object URI and into the instance actor's
  key-id; other servers fetch those URIs and verify HTTP signatures against the
  instance's public key, so federation needs a stable, publicly resolvable
  domain.

  == What the checkout cannot state, and this recipe supplies ==

  1. The account's public host. GoToSocial's `host` has no usable default and is
     baked into every URI and the instance keypair's key-id, so it must equal
     the final public domain and be stable. `host` is a bare hostname, not a URL,
     so the engine's *_URL placeholder rewrite (ComposePlaceholders, which
     injects a full https:// URL for keys ending URL/ORIGIN/ENDPOINT/DOMAIN)
     cannot fill GTS_HOST directly. Instead the compose sets PA_PUBLIC_URL:
     http://localhost -- rewritten to the account's public https URL because the
     key ends in _URL -- and a tiny entrypoint wrapper
     (files/panelalpha/gotosocial/entrypoint.sh) strips the scheme/port/path off
     it to compute GTS_HOST before exec-ing `gotosocial server start`. GTS_HOST
     is a config value derived from an engine-provided fact, not a source edit.
     The wrapper fails closed: no public URL means no GTS_HOST means the deploy
     fails rather than baking a localhost identity into the keypair.

  2. The administrator, created before the port opens. GoToSocial's
     first admin is a CLI action (`gotosocial admin account create` + `confirm` +
     `promote`), not a web installer, and there is no default credential to
     rotate. Account signup is invite-only by default
     (accounts-registration-open defaults false; the compose pins
     GTS_ACCOUNTS_REGISTRATION_OPEN=false explicitly), so an unclaimed instance
     has no open self-signup form -- but it also has no admin, and the moderation
     surface is only reachable once one exists. A one-shot `init` service runs
     the admin create/confirm/promote (idempotent: only when the account is
     absent), and `app` declares `init: service_completed_successfully`, so the
     server never listens until the admin exists. The login is generated per
     account by the engine (`credentials:` below; GET
     /projects/{name}/app-credentials, MCP app_credentials_get, returns it),
     never a shipped default.

  3. Where the data lives. The image declares VOLUME /gotosocial/storage and
     keeps the SQLite database (sqlite.db) and the whole media store under it,
     and the instance keypair lives *inside* that database (the instance
     account's private_key row). A stock deploy would get an anonymous named
     volume the customer can never reach and that the instance identity lives in;
     an identity that regenerates on a redeploy breaks federation permanently.
     It is replaced by-target with a bind mount onto
     ~/.panelalpha/gotosocial/storage, the only directory that both survives a
     redeploy (~/project is emptied and re-cloned) and belongs to the
     account (~ is chowned root on every rebuild, Project.php). Both services run
     as the account's own uid/gid (written into docker-compose.override.yml by
     prepare.sh), so the database and media are account-owned and reachable over
     SFTP. The wazero compilation cache is redirected under the same storage dir
     (GTS_WAZERO_COMPILATION_CACHE) so nothing the app writes lands on an
     ephemeral anonymous volume.

  == The shape of the stack ==

  Three services, no database or cache container -- GoToSocial is one binary with
  SQLite. `init` runs migrations (implicitly, via the admin command's DB open)
  and creates the administrator, then exits 0. `app` runs `gotosocial server
  start` behind the entrypoint wrapper, depends on init with
  service_completed_successfully, binds 0.0.0.0:8080 with GTS_LETSENCRYPT_ENABLED
  false and GTS_PROTOCOL https (the engine terminates TLS at its proxy). Its
  healthcheck is the unauthenticated /readyz endpoint via the alpine image's
  busybox wget. `ready` is an alpine no-op that waits on app's healthcheck:
  `docker compose up -d` runs without --wait, so without it the
  deploy would finish while GoToSocial was still starting.

  == What an anonymous visitor gets ==

  The instance landing page and the public web profile/timeline of any account
  the owner has made public; the client API refuses unauthenticated requests to
  private data (401). Signup is invite-only, so a stranger cannot create an
  account. /nodeinfo/2.0 and /api/v1/instance are intentionally public (fediverse
  discovery). Mail is left unconfigured; GoToSocial needs it only for optional
  confirmation/notification mail and runs without it.
credentials:
  adopt_from: .panelalpha/gotosocial/gotosocial.env
  fields:
    PA_ADMIN_USER: {kind: username, value: admin}
    PA_ADMIN_EMAIL: {kind: email, value: admin@localhost}
    PA_ADMIN_PASSWORD: {kind: password}
