[couchdb]
; Auto-create the system databases (_users, _replicator) on first boot, which
; CouchDB 3.x otherwise leaves until an explicit cluster setup.
single_node = true

[chttpd]
; Every request must authenticate. Combined with the port never being published
; (see the override compose), this keeps CouchDB unreadable from outside the
; account network -- a readable CouchDB is total data compromise.
require_valid_user = true

[couch_httpd_auth]
timeout = 3600

[fabric]
; https://github.com/apache/couchdb/issues/4497
shard_timeout_min_msec = 5000
