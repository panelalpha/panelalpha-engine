# yaml-language-server: $schema=../../../platforms/_schema.json
description: >-
  PieFed is a Flask link aggregator for the fediverse (a Lemmy/Mbin
  alternative): gunicorn on :5000, PostgreSQL for data, Redis for cache and the
  Celery broker. This recipe is the compose-REPLACE pattern (calcom/n8n/cannery):
  no platform block is declared, so detection runs via fromWalk, the compose
  strategy takes over, engine#221 does not bite, and ComposePlaceholders
  rewrites the one PA_PUBLIC_URL below from localhost to the account's public
  https address.

  WHY REPLACE. PieFed ships a workstation compose (web/celery/notifs build the
  image and bind-mount ./media ./logs ./tmp; the db reads a gitignored
  .env.docker; postgres asks for shared_buffers=1GB) that cannot deploy inside a
  1GB account. More important, PieFed does not serve a single page until its
  Site singleton, roles, languages and first admin exist: config.py's
  before_request calls get_site_as_dict and 500s on every route while the row is
  absent. Those rows are created by `flask init-db`, which the image entrypoint
  never runs and — because init-db needs a live Postgres — a pre-up prepare hook
  cannot run either. The dockerfile strategy has no post-DB-up, run-once hook
  (DockerfileStrategy only sets PA_DEPLOY_PHASE, it never writes the staged
  entrypoint the way PhpStrategy/FrameworkStrategy do), so the only in-scope way
  to auto-initialise is a compose one-shot. This stack builds PieFed's own
  Dockerfile, right-sizes postgres+redis, and adds a `init` one-shot that runs
  `flask db upgrade` then `flask init-db` exactly once (guarded on the Site row,
  so a redeploy never re-seeds or wipes) and a `ready` gate so the deploy
  returns only once the site actually answers.

  SECRETS + ADMIN, PERSISTED ONCE. hooks/prepare.sh generates SECRET_KEY, the
  postgres password and the first admin's password once into
  ~/.panelalpha/pyfedi/ (0600 in 0700, the only writable place a redeploy does
  not delete) and records them in credentials.txt. A rebuild reuses them: a new
  SECRET_KEY logs everyone out and invalidates JWTs, a new DB password locks the
  app out of the pgdata volume that still holds the old one. init-db sets the
  seeded admin verified=True, so the owner can log in immediately with no email
  round-trip. SERVER_NAME is the account domain (unknown until deploy): the app
  and init wrappers derive it from PA_PUBLIC_URL (which the engine rewrites to
  the public https URL) by stripping the scheme, because PieFed's SERVER_NAME is
  a bare hostname, not a URL.

  FEDERATION + TUNNEL CAVEATS (NOT RECIPE FAULTS). Local create/read (register,
  communities, posts, the alpha API) work. Outbound ActivityPub delivery runs in
  a Celery worker that this lean stack does not start, so cross-instance
  federation is not exercised. Image upload is multipart and stalls through the
  shared panelalpha.online (WithoutDNS) tunnel (engine#170); it works against
  the account's own address/container. Both are engine/tunnel limitations to
  report, not recipe or app failures.
