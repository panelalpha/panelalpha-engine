# yaml-language-server: $schema=../../../_schema.json
description: >-
  LiberaForms is a Flask web app for creating and managing web forms, backed by
  PostgreSQL. Upstream publishes no image and the repo has no compose file,
  only docker-compose.yml.example plus a long list of settings the app reads
  with os.environ[...] and so crashes without (KeyError: 'GUNICORN_WORKERS').

  This recipe builds the repo's own Dockerfile and runs it beside
  postgres:18-alpine, as docs/container.md describes: the defaults from
  dotenv.example in files/panelalpha/liberaforms/defaults.env, BASE_URL from
  the account's public URL, and the database password, SECRET_KEY and the
  Fernet CRYPTO_KEY generated once into ~/.panelalpha/liberaforms. A one-shot
  init service creates the schema on a fresh database (create-tables + db
  stamp) together with the admin, or runs `flask db upgrade` on an existing
  one. The admin's username, email (ROOT_USER, LiberaForms' reserved admin
  address) and password are generated by the engine (`credentials:`, returned
  by `GET /projects/{name}/app-credentials`); ROOT_USER defaults to the
  project's email, and project env vars with these names set before the first
  deploy are kept instead. Postgres, uploads and logs are on named volumes.
credentials:
  login_path: /user/login
  fields:
    LIBERAFORMS_ADMIN_USER: {kind: username}
    ROOT_USER: {kind: email, value: '{email}'}
    LIBERAFORMS_ADMIN_PASSWORD: {kind: password}
