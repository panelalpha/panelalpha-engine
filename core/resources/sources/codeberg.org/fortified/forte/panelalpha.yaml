# yaml-language-server: $schema=../../../_schema.json
description: >-
  Forte, an ActivityPub server in plain PHP (a streams fork). It serves from
  the repository root through index.php?req=..., not from public/, which is a
  leftover Symfony stub that answers 500. The recipe points the document root
  at /app, enables upstream's htaccess.dist, provisions a MySQL database and
  keeps .htconfig.php (written by Forte's own web setup) and store/ outside
  the re-cloned checkout. Forte's setup page is left as upstream ships it.
extends: php
database: mysql
commands:
  - id: database-login
    stage: [install, upgrade]
    description: >-
      Forte's web setup writes the database login and the site's address
      into .htconfig.php once, and the file lives in ~/.panelalpha. A staging
      or clone copies it while the engine hands the copy a database of its
      own in DB_* and its own APP_URL, so both are put back on every boot,
      and nothing is written while they already match. Left alone while the
      file is still the empty one hooks/prepare.sh creates for the setup.
    run: >-
      php -r '
      $f = "/app/.htconfig.php";
      $c = (string) @file_get_contents($f);
      if ((string) getenv("DB_DATABASE") === "" || !str_contains($c, "db_data")) { exit(0); }
      $set = fn (string $s, string $at, string $v): string => preg_replace_callback("/(" . $at . ")\x27(?:[^\x27\\\\]|\\\\.)*\x27/m", fn (array $m): string => $m[1] . var_export($v, true), $s, 1) ?? exit(1);
      $u = rtrim((string) getenv("APP_URL"), "/");
      $n = $c;
      foreach (["[$]db_host" => getenv("DB_HOST"), "[$]db_port" => getenv("DB_PORT"), "[$]db_user" => getenv("DB_USERNAME"), "[$]db_pass" => getenv("DB_PASSWORD"), "[$]db_data" => getenv("DB_DATABASE")] + ($u === "" ? [] : ["App::[$]config\[\x27system\x27\]\[\x27baseurl\x27\]" => $u]) as $k => $v) { $n = $set($n, "^" . $k . "\s*=\s*", (string) $v); }
      if ($n === $c) { exit(0); }
      if (file_put_contents($f, $n) === false) { fwrite(STDERR, "database-login: cannot rewrite $f\n"); exit(1); }
      fwrite(STDERR, "database-login: $f now points at database " . getenv("DB_DATABASE") . "\n");
      '
