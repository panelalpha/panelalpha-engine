# The stack for Readeck. The repository ships no compose file Docker would
# load, so this one takes over: AppConfigBootstrap writes it as the project's
# compose file, which makes detection pick the `compose` strategy over the `go`
# strategy the root go.mod would otherwise win.
#
# Readeck runs from the image upstream publishes rather than from this checkout.
# The checkout builds, but the image is 102 MB, pulls once, and is the same
# binary; a source build wants the Go toolchain and the frontend asset pipeline
# rebuilt on every redeploy (engine#208). hooks/prepare.sh reads one thing from
# the checkout -- its git ref -- to choose the image tag.
#
# Two files reach the containers that are not in this one:
#   * ~/.panelalpha/readeck/config.toml -- secret_key (pinned once so sessions
#     survive a redeploy) and worker tuning, mounted inside the data directory.
#   * docker-compose.override.yml -- generated by prepare.sh with `user:` set to
#     the account's uid/gid and the resolved image, because neither is knowable
#     when this file is written.
services:
  # One-shot. Runs the migrations and creates this account's administrator,
  # then exits 0. `app` will not start until it has: on an instance with zero
  # users every path serves an anonymous /onboarding form that makes its
  # submitter the first user (engine#200), so creating the administrator here,
  # before anything is listening on the public domain, is what closes it.
  init:
    image: ${READECK_IMAGE:-codeberg.org/readeck/readeck:latest}
    restart: "no"
    working_dir: /readeck
    env_file:
      # READECK_ADMIN_USER / _PASSWORD / _EMAIL, written once by prepare.sh and
      # never regenerated. Only init reads them; the running server does not.
      - ../.panelalpha/readeck/readeck.env
    volumes:
      # The account's persistent data directory, replacing the image's
      # VOLUME /readeck by-target. Holds config.toml and data/.
      - ../.panelalpha/readeck:/readeck
      # The init script, read-only.
      - ./panelalpha/readeck:/pa:ro
    entrypoint: ["/bin/sh", "/pa/init.sh"]
    mem_limit: 512m

  app:
    image: ${READECK_IMAGE:-codeberg.org/readeck/readeck:latest}
    restart: unless-stopped
    working_dir: /readeck
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      # Rewritten to the account's public https URL before the stack starts,
      # because the key ends in _URL (ComposePlaceholders). Without it Readeck
      # derives absolute links and the login/CSRF origin from the request,
      # which is wrong behind an https-terminating proxy. Not secret; env is
      # applied at runtime, which config.toml's secret_key is not.
      READECK_SERVER_BASE_URL: http://localhost
      READECK_SERVER_HOST: 0.0.0.0
      READECK_SERVER_PORT: "8000"
    volumes:
      - ../.panelalpha/readeck:/readeck
    # The binary's own readiness command: opens a TCP connection to the
    # configured host/port and exits non-zero when nothing answers. The image
    # ships neither curl nor wget, and this is a truer probe than either.
    healthcheck:
      test: ["CMD", "/bin/readeck", "healthcheck", "-config", "config.toml"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    command: ["/bin/readeck", "serve", "-config", "config.toml"]
    mem_limit: 1024m

  # Does nothing and exits 0. `docker compose up -d` runs without --wait
  # (engine#204), so the deploy is finished when containers have been started
  # rather than when Readeck answers. Compose does block on a depends_on health
  # condition, so a leaf that waits on app's healthcheck makes `up -d` return
  # only once the site is really up. alpine, so nothing large is pulled.
  ready:
    image: docker.io/library/alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
