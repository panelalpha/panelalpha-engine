; PanelAlpha PHP overrides for SPIP. The shared PHP base image loads no php.ini
; (engine#185); these restore production-sane defaults and give media uploads
; room. SPIP is comfortable in this envelope on the small host.
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 33M
max_execution_time = 120
