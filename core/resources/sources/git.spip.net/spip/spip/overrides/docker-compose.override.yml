# Persist SPIP's config dir (connect.php + cles.php + mes_options.php, via
# SPIP_ETC_DIR) and IMG/ (uploaded media) across the redeploy that empties
# ~/project. The account home survives, so mount ~/.panelalpha/spip
# (../.panelalpha relative to this file, which sits in ~/project; hooks/prepare.sh
# creates it) into the app container, where spip-setup.sh writes, and the
# engine's login file read-only for spip-install.sh. Never the whole
# ~/.panelalpha: it is private to the account.
services:
  app:
    volumes:
      - '../.panelalpha/spip:/pa-data/spip'
      - '../.panelalpha/app-credentials.env:/pa-data/app-credentials.env:ro'
