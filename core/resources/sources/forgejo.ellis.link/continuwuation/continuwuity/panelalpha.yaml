# yaml-language-server: $schema=../../../_schema.json
description: >-
  Continuwuity is a Matrix homeserver written in Rust (the maintained
  continuation of conduwuit, itself a Conduit fork). It is a single binary with
  an embedded RocksDB database - no Postgres, no Redis, no external services -
  and upstream publishes an official release image,
  forgejo.ellis.link/continuwuation/continuwuity:latest. Building the Rust
  binary from source is slow and heavy and is not needed here, so the recipe
  runs the published image instead of the checkout.

  That image is `FROM scratch`: 146 MB, one binary at /sbin/conduwuit, EXPOSE
  8008, and no shell. It would ship as a one-service compose file (runtime:
  compose), but a source recipe cannot - PlatformSelector::fromSource()
  describes a recipe without probe data, so a compose strategy's compose_path
  is never filled and DeployabilityCheck fails with "Compose strategy selected
  but compose file is missing". The dockerfile strategy has no such gap
  (extra.dockerfile is resolved against the project dir), so the recipe ships a
  small Dockerfile that starts `FROM` the published image - no Rust build runs
  - and layers the hosting shape it needs through the compose override, the way
  gancio and endurain do.

  The one thing the scratch image cannot do is translate the platform's
  injected public host into the CONTINUWUITY_* environment the server reads:
  it has no shell to run an entrypoint. The Dockerfile therefore copies a
  static busybox in (only to run the wrapper; the Matrix binary is upstream's,
  untouched) and the wrapper pins server_name from the account's public host.

  server_name is the Matrix server name - the public domain - and it is
  PERMANENT: it is baked into every user id and room id and cannot change
  without a database wipe. The wrapper derives it once from the SERVER_NAME /
  PUBLIC_URL the dockerfile strategy injects (PublicUrlEnvironment) and freezes
  it into the data volume, so a later redeploy that saw a different domain
  could never rewrite it. Everything else - the RocksDB at CONTINUWUITY_DATABASE_PATH,
  the listen address/port, well-known delegation to :443, federation - is env,
  set in the override and the wrapper.

  Security. An open-registration Matrix server is abused within hours, so
  registration is token-gated: allow_registration is true but a
  registration_token (generated once by the prepare hook into
  ~/.panelalpha/continuwuity/, 0600, and reused across redeploys) is required
  for every signup, and a signup without it is refused. Continuwuity also has a
  first-run mode: on the very first boot of an empty database it prints a
  single-use setup token to the log, and the first account created with it
  becomes the server admin; the configured registration_token only takes over
  once that first admin exists. Open registration additionally needs an
  "openreg" compile-time feature the official image is not built with, so it
  cannot be turned on by accident. Federation is left on (normal for Matrix).

  Persistence. The RocksDB at /data is all the state - accounts, rooms,
  messages, media - and ~/project is wiped every redeploy (engine#173), so it
  is bind-mounted to ~/.panelalpha/continuwuity/data, which the wipe never
  touches. The pinned server_name lives beside it. A redeploy rebuilds the
  image and reuses the volume, so a registered user still logs in and their
  messages persist.
extends: dockerfile
port: 8008
extra:
  # A source recipe is applied without running the probes
  # (PlatformSelector::fromSource() calls describe() with no probe data), so the
  # dockerfile probe's dockerfile/port_hint would be null/80 even though the
  # recipe ships a Dockerfile - and the deployability check would then fail with
  # "Dockerfile strategy selected but Dockerfile is missing." State what the
  # probe would have found: the Dockerfile this recipe ships (files/Dockerfile)
  # and the port the image EXPOSEs (8008, conduwuit's default).
  dockerfile: Dockerfile
  port_hint: 8008
