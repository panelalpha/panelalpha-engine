# The repository ships a Dockerfile (Node, ffmpeg and MariaDB in one image) and
# no compose file. This builds that Dockerfile unchanged and supplies what its
# init.sh leaves at defaults: the Superuser (admin@shinobi.video / admin from
# super.sample.json) and an empty database password.
services:
  app:
    build:
      context: .
    image: panelalpha/shinobi:local
    restart: unless-stopped
    env_file:
      # DB_PASSWORD; init.sh writes it into conf.json.
      - ../.panelalpha/shinobi/db.env
    volumes:
      # Generated by hooks/prepare.sh; init.sh keeps an existing super.json.
      - ../.panelalpha/shinobi/super.json:/home/Shinobi/super.json
      - shinobi-db:/var/lib/mysql
      - shinobi-videos:/home/Shinobi/videos
    # Runs after init.sh has started MariaDB and created the database user
    # (with an empty password): set the generated one, and refuse to start with
    # the default Superuser hash.
    command:
      - /bin/sh
      - -c
      - |
        if grep -qi 21232f297a57a5a743894a0e4a801fc3 /home/Shinobi/super.json || ! grep -q '"pass"' /home/Shinobi/super.json; then
          echo "super.json is missing or holds the default password, refusing to start" >&2; exit 1
        fi
        [ "$${#DB_PASSWORD}" -ge 16 ] || { echo "DB_PASSWORD missing or short, refusing to start" >&2; exit 1; }
        mysql -e "ALTER USER 'majesticflame'@'127.0.0.1' IDENTIFIED BY '$${DB_PASSWORD}'; FLUSH PRIVILEGES;"
        exec pm2-docker /usr/local/share/shinobi/pm2.yml
    ports:
      - "8080:8080"
    # Live streams are written to /dev/shm/streams.
    shm_size: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: 1536m

  # `up -d` runs without --wait (engine#204); this blocks it until Shinobi answers.
  ready:
    image: alpine:3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m

volumes:
  shinobi-db: {}
  shinobi-videos: {}
