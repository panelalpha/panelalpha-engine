# Compose-replace: upstream's docker/docker-compose.yml with the release image
# pinned, generated secrets, and an HTTP->HTTPS proxy on the account port.
services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    env_file:
      - ../.panelalpha/eonvelope/db.env
    volumes:
      - eonvelope-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  web:
    image: dacid99/eonvelope:0.8.0
    restart: unless-stopped
    env_file:
      - .env
      - ../.panelalpha/eonvelope/app.env
    environment:
      ALLOWED_HOSTS: ${PA_PUBLIC_HOST}
      CSRF_TRUSTED_ORIGINS: ${PA_PUBLIC_URL}
      DATABASE_TYPE: mysql
      DATABASE_HOST: db
      LOG_DIRECTORY_PATH: /var/log/eonvelope
      REGISTRATION_ENABLED: "False"
      GUNICORN_WORKER_NUMBER: "2"
      CELERY_WORKER_NUMBER: "2"
      ENABLE_FLOWER: "False"
      DEBUG: "False"
    volumes:
      - eonvelope-archive:/mnt/archive
      - eonvelope-logs:/var/log/eonvelope
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1536m

  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    ports:
      - "8000:8080"
    volumes:
      - ./panelalpha/eonvelope-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # Answers once gunicorn is up (migrations run before it starts).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
    mem_limit: 48m

  # No-op gate: `up -d` returns once the app answers through the proxy.
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      proxy:
        condition: service_healthy
    mem_limit: 32m

volumes:
  eonvelope-db-data: {}
  eonvelope-archive: {}
  eonvelope-logs: {}
