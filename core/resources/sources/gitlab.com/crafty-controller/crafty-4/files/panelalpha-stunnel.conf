# TLS bridge in front of Crafty. The engine's reverse proxy terminates the
# public TLS and forwards plain HTTP here; Crafty only speaks HTTPS on :8443.
# client = yes means stunnel accepts plaintext on `accept` and originates TLS to
# `connect`, tunnelling the HTTP request through unchanged. Crafty's cert is
# self-signed and local, so no peer verification is configured.
foreground = yes
pid =
syslog = no

[crafty]
client = yes
accept = 0.0.0.0:8000
connect = 127.0.0.1:8443
