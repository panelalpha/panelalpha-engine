# Layers over the compose the dockerfile strategy generates. The generated app
# service is correct about the build, the published port and env_file — it just
# has nowhere durable to keep state. LazyLibrarian stores EVERYTHING (the SQLite
# db, config.ini, logs, cache) in its --datadir, and ~/project is wiped on every
# redeploy. This bind-mounts the account's persistent
# ~/.panelalpha/lazylibrarian (relative to the compose project dir ~/project;
# the prepare hook creates it) onto /pa-data/lazylibrarian, where the image's
# CMD points --datadir — so config.ini (pre-seeded with BASIC auth by the
# prepare hook), lazylibrarian.db and any created record survive a rebuild.
# Only that subdirectory: ~/.panelalpha itself is private to the account.
services:
  app:
    volumes:
      - ../.panelalpha/lazylibrarian:/pa-data/lazylibrarian
