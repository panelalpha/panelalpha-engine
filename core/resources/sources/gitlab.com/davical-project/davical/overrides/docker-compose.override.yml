# Layers over the compose file the php strategy generates. That file is right
# about the app -- the shared PHP base image, ~/project bind-mounted at /app,
# the account's own uid, Apache on 8000, the staged entrypoint, and
# PA_DOCROOT=/app/htdocs from the manifest's `docroot:` -- and knows nothing
# about DAViCal's database, because nothing in the checkout says there is one.
#
# An override rather than a replacement compose file, and that is not a
# preference: an `overrides/docker-compose.yml` is written into the checkout
# before detection runs, so a compose file in the project root would make
# DAViCal look like a compose project and take the php strategy -- the bind
# mount, the staged entrypoint, the install-stage schema load, the document
# root -- off the table entirely.
services:
  app:
    # Compose merges `environment` maps across files, so this adds to what the
    # strategy wrote rather than replacing it.
    environment:
      # Where the database is. Read by config/config.php, which
      # hooks/prepare.sh writes, and by panelalpha-davical-setup.php. The
      # password is not here: it comes in by env_file below, from a path
      # outside the checkout.
      #
      # PostgreSQL and nothing else, and this is the decision this recipe is
      # really about. `database: mysql` is the manifest key that provisions a
      # database on the account's own MySQL server -- visible in the panel,
      # openable in phpMyAdmin, inside the account's backup, costing no
      # container -- and PlatformManifest::DATABASES is `['mysql']`, the only
      # value the engine accepts. There is no MySQL port of DAViCal to point it
      # at and there is not going to be one: dba/ is 47 KB of plpgsql in
      # caldav_functions.sql and 26 KB more in rrule_functions.sql, the
      # application's own queries call privilege_to_bits() and
      # get_permissions() in the WHERE clause, and INSTALL states
      # "PostgreSQL: 8.2 or greater" as a prerequisite rather than an option.
      # So this recipe ships a sidecar and pays for it: a second container, and
      # a volume the panel does not manage or back up. That is a real downgrade
      # against an account-provisioned database, and it is not avoidable here.
      DAVICAL_DB_HOST: davical-db
      DAVICAL_DB_PORT: "5432"
      DAVICAL_DB_NAME: davical
      DAVICAL_DB_USER: davical

      # The one way to give this container a php.ini. The base image loads none
      # at all and scans /usr/local/etc/php/conf.d, a directory inside the image
      # that the account uid cannot write to (engine #185). PHP reads
      # PHP_INI_SCAN_DIR from its own environment at startup whatever the SAPI,
      # so naming a second directory here reaches the Apache module and the CLI
      # both -- and both need it: the CLI runs the schema load, the Apache
      # module serves every CalDAV request, and neither can find AWL without
      # the include_path the file sets.
      #
      # The image's own directory is listed first and explicitly:
      # PHP_INI_SCAN_DIR *replaces* the compiled-in path rather than adding to
      # it, and dropping it would unload every docker-php-ext-*.ini -- pdo_pgsql
      # among them, which is the database driver.
      PHP_INI_SCAN_DIR: /usr/local/etc/php/conf.d:/app/panelalpha/php

      # Corrections, not configuration. DAViCal reads none of these, but the
      # engine puts them in the app's environment anyway: having mined
      # davical-db out of this file it hands the application that sidecar's
      # connection settings under every spelling it knows
      # (SidecarCredentials::envForSidecar), and the password it uses is the
      # literal `app` that resolvedComposeValue() substitutes for a value it
      # cannot resolve (engine #189). Left alone the container advertises a DSN
      # that does not work. Restated here from the same variable the database is
      # started with, so anything an operator reads out of the environment is
      # true.
      POSTGRES_PASSWORD: ${PA_DAVICAL_DB_PASSWORD}
      POSTGRES_USER: davical
      POSTGRES_DB: davical
      DB_PASSWORD: ${PA_DAVICAL_DB_PASSWORD}
      DATABASE_URL: postgres://davical:${PA_DAVICAL_DB_PASSWORD}@davical-db:5432/davical

    # The two secrets, by a path that climbs out of the document root.
    # ~/.panelalpha survives the clone; ~/project does not (engine #173), and
    # hooks/prepare.sh rewrites this file's contents on every deploy before
    # compose runs.
    #
    # env_file rather than `environment:` because nothing else sets these two
    # keys -- see the note on davical-db for the one place where that is not
    # true and a compose variable has to be used instead.
    # ComposeEnvFiles refuses a path with a `..` segment, so the engine does not
    # try to create it on the stack's behalf; the hook is what guarantees it
    # exists.
    env_file:
      - ../.panelalpha/davical-app.env

    depends_on:
      davical-db:
        condition: service_healthy

    # Apache with mod_php and one PHP process per request. DAViCal holds a
    # recurring event's expanded instances in memory for a REPORT
    # ($c->rrule_loop_limit = 100), which is the peak; the install stage's
    # largest single statement is the 47 KB caldav_functions.sql. ServiceLimits
    # would cap an app-role service it did not write at 384m, which the schema
    # load fits in but leaves nothing for concurrent clients. 768 + 448 + 64
    # fits the 2000 MB this was tested at.
    mem_limit: 768m

    # The engine runs `docker compose up -d` without `--wait` and probes as soon
    # as it returns (engine #90), which here is while the install stage is still
    # loading 90 KB of schema and stored procedures into an empty database.
    # Without this the probe reads `Failed to connect to 127.0.0.1 port 8000`.
    #
    #   1. /  grepped, not trusted for its status. index.php answers 200 with
    #      AWL's login panel; it would also answer 200 with an error page, and
    #      `type="password"` is on the form (awl/inc/Session.php:548) and not on
    #      the error page. Rendering it means always.php found AWL, found
    #      config/config.php, opened the database and read awl_db_revision --
    #      every part of this recipe, in one request.
    #
    #   2. OPTIONS /caldav.php/ must answer 401. It is the CalDAV entry point
    #      and the only thing that proves the part of DAViCal an admin page
    #      cannot: a 401 means caldav.php parsed the request and asked for
    #      credentials, where a 500 would mean it died in always.php and a 404
    #      would mean PATH_INFO is not reaching it. curl -f is not used for
    #      this one because 401 is the pass.
    #
    # curl is in the shared base image.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 30 http://127.0.0.1:8000/ | grep -q 'type="password"' &&
          [ "$$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X OPTIONS http://127.0.0.1:8000/caldav.php/)" = "401" ]
      interval: 10s
      timeout: 40s
      retries: 30
      # The schema load, on a shared host.
      start_period: 240s

  # DAViCal cannot use the account's own database server. See the note on
  # DAVICAL_DB_HOST above: the engine provisions MySQL and only MySQL, and this
  # application is PostgreSQL to its stored procedures. So this is a sidecar,
  # and the cost is honest: a second container and a volume the panel does not
  # manage or back up.
  davical-db:
    # 17, not 18. Postgres 18 moved PGDATA to /var/lib/postgresql/18/docker and
    # its entrypoint refuses to start when /var/lib/postgresql/data is a mount
    # point (docker-library/postgres#1259).
    image: postgres:17-alpine
    restart: unless-stopped
    # These three have to be `environment:` with a compose variable, and that is
    # worth explaining, because `env_file:` would be the tidier way to keep a
    # password out of the checkout and it does not work here.
    #
    # RuntimeSidecars mines this file -- exampleComposeFilenames() globs
    # `docker-compose.*.yml` in the project directory and
    # `docker-compose.override.yml` matches it -- and copies this service into
    # the generated compose with SidecarCredentials::pinSidecarCredentials()
    # applied. That fills in every one of the engine's init_vars (POSTGRES_DB,
    # POSTGRES_USER, POSTGRES_PASSWORD) from whatever `environment:` says, and
    # resolvedComposeValue() turns an absent or unresolvable value into the
    # literal string `app` (engine #189). So the generated file would declare
    # `POSTGRES_PASSWORD: app` as `environment:`, compose gives `environment:`
    # precedence over `env_file:`, and the database would initialise with a
    # password the application was never told.
    #
    # Naming them here fixes it, because this file is the *last* `-f` compose is
    # given, so its `environment:` wins the merge, and `${...}` is interpolated
    # from the project's own .env at that point rather than by the engine.
    #
    # One role, not upstream's two. dba/create-database.sh creates davical_dba
    # (owner) and davical_app (minimum privileges) and then needs a superuser
    # and a Perl program to grant between them. That split is worth having when
    # the database server is shared with other applications; this one is a
    # container on the account's own compose network with no published port and
    # exactly one client. The role that owns the schema is the role the
    # application connects as, and there is nothing left to grant.
    environment:
      POSTGRES_DB: davical
      POSTGRES_USER: davical
      POSTGRES_PASSWORD: ${PA_DAVICAL_DB_PASSWORD}
      # C collation on a UTF-8 encoding, which is what create-database.sh asks
      # for with `createdb --encoding UTF8 --template template0`. DAViCal
      # compares dav_name paths as text and its own test suite assumes byte
      # ordering; a locale-aware collation changes which principal a range query
      # returns first.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # No `ports`. Nothing outside the account's compose network has any business
    # reaching 5432, and ComposePortScan would have to be told to ignore it.
    volumes:
      - davical_pgdata:/var/lib/postgresql/data
    # A stock postgres sizes itself for a machine of its own. This one shares
    # the account with Apache and mod_php.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
    healthcheck:
      # -U and -d rather than a bare pg_isready: the bare form asks whether the
      # postmaster accepts connections, which is true during initdb, before the
      # role and the database exist.
      test: ["CMD-SHELL", "pg_isready -U davical -d davical"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s
    mem_limit: 448m

  # Does nothing and exits 0. Compose does not wait for a healthcheck on its
  # own, but it does block on a `depends_on` health condition -- so a service
  # gated on the app is what makes `up -d` return only once DAViCal has loaded
  # its schema, rotated the admin password and answered a CalDAV OPTIONS. A
  # clean exit 0 is not a crash loop as far as AppHealth is concerned. This is
  # the engine #90 workaround.
  #
  # alpine:3, and the image is load-bearing rather than a size preference.
  # Reusing postgres:17-alpine here would make ServiceRole::isKnownDatastore()
  # recognise this service as a database too, so the miner would keep it as a
  # second sidecar, the generated compose would give `app` a
  # `depends_on: [davical-db, ready]`, and this service's own `depends_on: app`
  # would close the loop:
  #
  #   Deploy failed: Failed to start app: dependency cycle detected:
  #   app -> ready -> app
  ready:
    image: alpine:3
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m

volumes:
  davical_pgdata: {}
