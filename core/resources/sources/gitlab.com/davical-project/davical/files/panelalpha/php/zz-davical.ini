; Written by PanelAlpha, and read because the compose override points
; PHP_INI_SCAN_DIR at this directory as well as the image's own conf.d. The
; shared PHP base image loads no php.ini at all -- `php --ini` answers
; "Loaded Configuration File: (none)" -- so what is in force without this file
; is PHP's compiled-in defaults (engine#185).

; The reason this file is load-bearing rather than tidy-up.
;
; DAViCal is two source trees. htdocs/always.php -- the first line of every
; entry point -- tries `include_once('AWLUtilities.php')` against the
; include_path, and only if that fails does it walk a hard-coded list:
; '../../awl/inc', '/usr/share/awl/inc', '/usr/share/php/awl/inc',
; '/usr/local/share/awl/inc'. Every one of those is either an absolute path
; inside the image that the account cannot create, or -- for '../../awl/inc',
; resolved from the working directory, which is the document root
; /app/htdocs -- the path /awl/inc at the root of the container filesystem.
; None of them is reachable from a bind-mounted ~/project, and when the list
; runs out always.php prints
;
;   Could not find the AWL libraries. Are they installed?
;
; and exits, for every request including the CalDAV ones. hooks/prepare.sh
; vendors AWL r0.65 into ~/project/awl; this line is what makes it findable.
;
; /app/inc as well, because always.php's own `set_include_path('../inc'...)`
; is relative to the working directory and the CLI setup script does not run
; from htdocs/. /usr/local/lib/php is PHP's own default, restated because
; assigning include_path replaces it rather than adding to it.
include_path = ".:/app/awl/inc:/app/inc:/usr/local/lib/php"

; display_errors is compiled in as On (engine#185), and DAViCal is unusually
; badly served by that. Its early_exception_handler and
; early_catch_fatal_error both print the exception message, the file, the line
; and a full stack trace to the response body -- and the path they print is
; the account's own directory layout. Worse, always.php reaches the database
; before it renders anything, so a sidecar that has not finished starting
; turns into a page naming the host, the database and the user it failed to
; connect as. The handlers still run; log_errors sends the same text to
; stderr, which is the container's, so it lands in `docker logs` and the
; panel's log view where it belongs.
display_errors = Off
display_startup_errors = Off
log_errors = On

; E_NOTICE and E_DEPRECATED off, not for tidiness: DAViCal targets PHP 5.4 and
; up ($c->minimum_php_version) and on 8.3 the CalDAV path emits deprecations
; from AWL's iCalendar parser. With display_errors already off these would
; only fill the log, but caldav.php sets Content-type before it parses, and a
; warning printed by a handler that ignores display_errors would corrupt an
; XML multistatus body.
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_STRICT

; expose_php is On by default in the image (engine#185). DAViCal already sends
; a `Server: 1.1` header of its own from always.php -- it is a CalDAV server
; and clients read the version -- so this removes the PHP version, not the
; application's.
expose_php = Off

; always.php reads ini_get('date.timezone') into $c->default_timezone and
; hands it to PostgreSQL as `SET TIMEZONE TO ?`. Empty -- which is the
; compiled-in default -- makes it fall back to UTC anyway; saying so means the
; value PHP uses and the value the database session uses are the same string
; rather than two independent defaults.
date.timezone = UTC

; The admin interface is a session cookie. httponly costs nothing here: no
; script in htdocs/js reads document.cookie.
session.cookie_httponly = 1
session.cookie_samesite = Lax
; session.cookie_secure is deliberately *not* set. TLS terminates at the
; engine's proxy and the container only ever sees plain HTTP, so PHP would
; have to be told; but an account reachable over http:// as well would then
; have a login form that never logs anyone in, with no error to explain it.
; The proxy's https redirect is what keeps the cookie off the wire.

; A vCard with a photo is the largest thing a CardDAV client PUTs, and
; $c->carddav_max_resource_size is 6.5 MB in always.php's own defaults. The
; compiled-in post_max_size is 8M, which is over that but not by much once a
; multipart boundary and headers are counted; 16M leaves DAViCal's own limit
; as the one that decides.
post_max_size = 16M
upload_max_filesize = 16M

; The RRULE expander (inc/RRule.php, $c->rrule_loop_limit = 100) holds every
; generated instance of a recurring event in memory for a REPORT that spans a
; wide time range. 128M is PHP's own default; this is headroom for that one
; path, inside the container's 768m.
memory_limit = 256M
