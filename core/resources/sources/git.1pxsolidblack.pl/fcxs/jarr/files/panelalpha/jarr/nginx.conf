# Folds JARR's two processes onto one public origin. The SPA calls the API as
# `/api/<endpoint>` (built with REACT_APP_API_URL=/api), so /api/ is proxied to
# the gunicorn API with the /api prefix stripped (the flask-restx API is mounted
# at root), and everything else is served by the SPA's static server, which does
# its own single-page fallback. Only this container publishes a host port, so the
# engine's port scan takes it as the primary app (engine#231).
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;   # OPML import upload

    # API: strip the /api prefix (trailing slash on proxy_pass) so the server
    # sees /auth, /unreads, /clusters, /feed, /user, ... at its root.
    location /api/ {
        proxy_pass http://jarr-server:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Everything else: the React SPA served by `serve -s` (SPA fallback in serve).
    location / {
        proxy_pass http://front:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
