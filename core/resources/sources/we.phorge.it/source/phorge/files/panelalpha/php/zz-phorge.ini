; Read through PHP_INI_SCAN_DIR, which overrides/docker-compose.override.yml
; points at this directory as well as the image's own conf.d.
;
; The shared PHP base image loads no php.ini at all -- `php --ini` says
; "Loaded Configuration File: (none)" -- so what applies are PHP's compiled-in
; defaults. Two of those are wrong for any site and two are wrong for Phorge.

; The compiled-in default is On, and it is On for every PHP application on this
; engine. Phorge turns it on again for itself inside the request
; (PhabricatorStartup sets its own error handling) and routes what it catches
; into its own error page, so nothing is lost -- but a notice raised before
; Phorge's handler is installed, in the auto_prepend_file or during library
; loading, would be written into the response body. On the CLI that is worse
; than untidy: the first byte PHP writes to stdout makes headers_sent() true,
; and `bin/storage` and the bootstrap below both run in that SAPI.
display_errors = Off
display_startup_errors = Off
; Errors still have to go somewhere, and the container's stderr is where the
; deploy log and `docker logs` read from.
log_errors = On
error_log =

; The compiled-in default is On, so every response on this engine carries
; X-Powered-By naming the exact PHP build.
expose_php = Off

; Arcanist's init-script sets date.timezone to UTC itself when it is empty, but
; only for the CLI -- support/init/init-script.php is not on the web path. On
; the web, an empty date.timezone is a PHP warning on every date parse, and
; PhabricatorTimezoneSetupCheck raises a setup issue for it. `bin/config set
; phabricator.timezone` (the install stage does) governs what users see; this
; governs what PHP does before Phorge is loaded.
date.timezone = UTC

; The default 128M is not enough for `bin/storage upgrade`, which loads the
; full patch list and applies ~900 of them across 54 schemas in one process,
; nor for rendering a large diff.
memory_limit = 512M

; The defaults are 2M and 8M. Phorge's file store is how attachments, pastes
; and profile images get in, and 2M is smaller than a screenshot. Phorge reads
; post_max_size itself (PhabricatorFileUploadController) and refuses uploads
; over it with a message naming this setting.
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 300

; Phorge is ~8,000 PHP files and loads its class map lazily per request; the
; default 10,000 interned files does not cover the working set and the misses
; show up as a slow first request per Apache worker.
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
; Left on: the account can edit the checkout over SFTP, and an opcache that
; never revalidates would serve the old file until the container restarts.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
