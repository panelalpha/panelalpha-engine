# yaml-language-server: $schema=../../../_schema.json
description: >-
  Phorge is the community fork of Phabricator: code review, tasks, a wiki,
  repository hosting and a dozen more applications in about 8,000 files of
  plain PHP, with no Composer and no build step. Detection read the repository
  correctly -- the `php` strategy, PHP 8.3, the shared Apache base image with
  ~/project bind-mounted -- and the verdict was `serving-error_page`, because a
  Phorge checkout on its own is not a runnable application. Four things it
  needs are not in the repository and cannot be inferred from it, and two of
  them were worth deciding before writing a line of this file.

  Measured with this recipe on mariusz.panelalpha.tools (15 GB, shared with
  other work), images already in the host cache: **120 seconds** from API call
  to `deploy-ok`, every health check passing, 54 schemas built. Verified over
  the public HTTPS domain with the generated credential: logged in as `admin`,
  created a Maniphest task and read it back at /T1, title and description
  intact. Replaying the install command by hand -- which is exactly what the
  upgrade stage does on a redeploy -- reports the credentials already rotated,
  the storage up to date and the administrator already present, and changes
  nothing.

  **It needs a sibling checkout of `arcanist`, and that is a load path rather
  than a suggestion.** `support/startup/PhabricatorStartup.php:195-212` (the web
  path) and `scripts/init/lib.php:12-26` (every `bin/*` command) both compute
  `dirname()` of the Phorge root, prepend it to `include_path`, and
  `@include_once 'arcanist/src/init/init-library.php'`; when that fails they
  print "Put `arcanist/` next to `phorge/` on disk." and stop. libphutil was
  merged into arcanist in 2019, so this is not an optional dependency -- it is
  most of the framework Phorge is written in. A single-repository deploy has no
  sibling directory: `/app`'s parent inside the container is the image's own
  `/`, which the account uid cannot write to. This is solved rather than fatal:
  `hooks/prepare.sh` clones arcanist from we.phorge.it into the checkout, and
  `overrides/docker-compose.override.yml` bind-mounts it at `/arcanist` -- which
  IS one directory above `/app`. The sibling is then real, for the web SAPI and
  the CLI alike, and Phorge's own `include_path` finds it with nothing else
  changed. (`PHUTIL_LIBRARY_ROOT` is the other candidate and it does not work
  here: both call sites read it from `$_SERVER`, which under mod_php carries
  Apache's subprocess environment rather than the container's, so it would
  satisfy `bin/storage` and leave every web request fataling.) A recipe
  assembling something the clone does not provide is the ordinary case --
  Contao, Craft and Kirby all do it -- and this is a `git clone` in a hook.

  **It needs 54 MySQL schemas, and the engine provisions one.** This is the
  real decision in this recipe. `PhabricatorLiskDAO::establishLiveConnection()`
  computes the schema per application -- `$database = $namespace.'_'.
  $this->getApplicationName()` -- and `resources/sql/quickstart.sql` opens with
  54 `CREATE DATABASE {$NAMESPACE}_<app>` statements: `phabricator_maniphest`,
  `phabricator_differential`, `phabricator_user`, and 51 more. There is no
  single-schema mode, no table-prefix mode, and no configuration that folds
  them together; `storage.default-namespace` renames the prefix and nothing
  else. Meanwhile `database: mysql` -- the manifest key Matomo, OpenEMR and
  Omeka S use -- creates exactly one database and grants the account user
  `ALL PRIVILEGES` on that one name (`app/System/Project/Dind/AppDatabase.php`,
  lines 60-62). A grant on one schema cannot `CREATE DATABASE` the other 53, so
  the account's own MySQL server is not a server Phorge can be installed on at
  all: not by this recipe, not by hand over SSH, not by the account owner in
  phpMyAdmin. So this recipe ships a MySQL sidecar in its compose override, and
  Phorge connects to it as root. That is a real cost and it is not hidden: the
  data lives in a Docker volume the panel cannot list, phpMyAdmin cannot open
  and the account's backup does not include. The README says so in the first
  paragraph. It is also the only shape in which this application runs, which is
  why the answer here is a recipe and not a rejection.

  **It needs rewrite rules, and ships none.** `webroot/` contains `index.php`
  and `rsrc/` and nothing else -- no `.htaccess`, because upstream documents the
  rules as a `<VirtualHost>` block the administrator writes. Without them
  `support/startup/PhabricatorStartup.php:604` answers every URL with "Request
  parameter '__path__' is not set. Your rewrite rules are not configured
  correctly." `files/webroot/.htaccess` is upstream's block translated to a
  per-directory context, which needs one extra line -- a loop guard, because in
  `.htaccess` mod_rewrite re-runs the ruleset over its own substitution.

  **The engine's own health probe is a different site, and that alone is the
  difference between `deploy-ok` and `serving-error_page`.** Phorge chooses a
  "site" by matching the request's Host against `phabricator.base-uri`,
  `phabricator.production-uri` and `phabricator.allowed-uris`
  (`PhabricatorPlatformSite::newSiteForRequest`), and answers a request that
  matches none with an HTTP 500 "Site Not Found" page
  (`AphrontApplicationConfiguration::buildSiteForRequest`, line 545). AppHealth
  probes `http://127.0.0.1:8000/`. Measured: a deploy that finished
  successfully, whose container was healthy, and whose public domain served the
  login page with correct https:// asset URLs, was scored `serving-error_page`
  with "HTTP 500" on port 8000 -- purely because of the Host header on the
  probe. The install stage adds the loopback address to
  `phabricator.allowed-uris`; only the host is compared, and no request from
  outside the container can carry it.

  **The document root needed no help at all**, which is worth writing down
  because the other large PHP applications here all needed some.
  `PhpDocroot::CANDIDATES` already lists `webroot` (the constant's own comment
  says "`webroot/` is Phorge"), so the probe finds `webroot/index.php` without
  being told. `docroot: webroot` is set below anyway: it costs nothing, and it
  makes the document root a fact this file states rather than one the engine
  re-derives.

  **The first registered user becomes an administrator, on a public URL.**
  `PhabricatorAuthController::isFirstTimeSetup()` (line 27) is true whenever
  there are no enabled auth providers and no accounts, and in that state
  `/auth/start/` is an open registration form whose handler applies
  `setIsApproved(1)` and an empower transaction unconditionally
  (`PhabricatorAuthRegisterController`, lines 420-470). No token, no invite, no
  rate limit: the first stranger to load the page owns the install, from the
  moment Apache binds. Upstream's answer is a human at a terminal within
  seconds of first boot. `files/panelalpha/phorge-bootstrap.php` is the
  unattended answer -- it creates the administrator with a password generated
  per account into `~/.panelalpha/phorge/admin-password` (0600, in a 0700
  directory), and configures the username/password auth provider with
  registration switched **off**, which is what actually closes the door: either
  condition alone ends first-time setup. There is no upstream CLI for this;
  `bin/user` has approve, empower and enable but no create, and `bin/auth` has
  no provider commands.

  **The database's credentials are the engine's, for a few seconds.** The
  engine harvests this recipe's own `overrides/docker-compose.override.yml` for
  backing services -- `RuntimeSidecars::exampleComposeFilenames()` globs
  `docker-compose.*.yml` -- keeps the service's image, command and volumes, and
  replaces its `environment` with credentials derived from the application's
  database settings. For an application that is not Laravel those settings are
  the empty array (`PhpStrategy::deploy`, line 76), so every value falls back to
  a default and the generated compose file carries `MYSQL_USER: app`,
  `MYSQL_PASSWORD: app`, `MYSQL_ROOT_PASSWORD: app`
  (`MysqlSidecar::FALLBACK_PASSWORD`) and `MYSQL_ROOT_HOST: '%'`. A password
  passed through `env_file:` loses to that, because Compose ranks
  `environment:` higher, and the only other channel is `.env`, which
  `ProjectEnvironment::apply()` copies to a 644 `.env.default`. So
  `files/panelalpha/phorge-db-secure.php` fixes it from inside instead: it
  connects as root with whichever password works, sets root's to the one
  generated for this account, and drops the `app` user. Verified on the live
  deploy: `root` with the engine's default password is refused, and `app`@'%'
  no longer exists.

  **What is not running: the daemons.** `bin/phd start` wants a supervised
  process per worker and this is a one-container app, so there is no
  `PhabricatorTaskmasterDaemon`. The consequences are bounded and worth knowing:
  no full-text search indexing of new objects, no outbound mail (the install
  stage therefore sets `metamta.mail-adapter` to the test adapter, so mail is
  discarded rather than queued forever), no repository fetching, and a
  "daemons are not running" setup warning for administrators. Tasks, code
  review, the wiki and every synchronous action work. Phorge is happy to run
  this way -- `PhabricatorDaemonsSetupCheck` is a warning, never fatal -- but a
  tracker that needs search or notifications needs a second process this
  platform has nowhere to put.
# `php-plain`, not `php`, and the difference is not cosmetic. Both carry the
# same `php` strategy -- same runtime, same shared image, same document root --
# and differ in that php.yaml is Composer-PHP and php-plain.yaml is not, so
# php-plain ships no `composer install` command. Phorge has no composer.json
# anywhere in the tree.
#
# `extends: php` is also refused outright, which is worth knowing before
# writing it: DeployabilityCheck::REQUIRED_ROOT_FILE maps the `php` strategy to
# composer.json, and the only escape is namedByItsOwnManifest() -- true when
# the decision's `platform` differs from its `strategy`. With `extends: php`
# both are "php" and the deploy fails at the deployability check, 30 seconds
# in, with "PHP strategy selected but composer.json is missing." (Measured.)
# With `extends: php-plain` the platform is "php-plain", the strategy is still
# "php", and the check passes for the reason it was written -- the same reason
# osTicket needs it.
extends: php-plain
# `webroot/`, which the probe would find anyway (PhpDocroot::CANDIDATES has it),
# stated here so the fact lives in the manifest. Unlike OpenEMR this is a real
# subdirectory, so `docroot:` expresses it directly -- none of the '.'-folding
# in PlatformManifest::readDocroot() applies.
docroot: webroot
#
# No `database: mysql`, and that is the recipe's central decision rather than
# an omission. It provisions one schema; Phorge creates 54 and cannot be told
# otherwise. See the description and the `db` service in
# overrides/docker-compose.override.yml.
#
# No `requires:` either: Phorge has no composer.json, no package.json and no
# lockfile. It is PHP source, served.
commands:
  - id: phorge-setup
    stage:
      - install
      - upgrade
    description: >-
      Writes conf/local/local.json, applies the storage patches across all 54
      schemas, and creates the first administrator and the auth provider.
      Idempotent: the patches are recorded in {namespace}_meta_data.patch_status
      and the bootstrap refuses to act when any account already exists, so the
      upgrade stage replays it safely on every redeploy.
    run: 'sh panelalpha/phorge-setup.sh'
