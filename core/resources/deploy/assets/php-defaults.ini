; PanelAlpha defaults for every deployed PHP application.
;
; The official php image loads no php.ini at all, so without this file PHP
; runs on its compiled-in defaults. A conf.d file, so .user.ini, .htaccess
; php_flag and ini_set still override it for an app that wants to.

; An error printed into the body sends the response headers with it, and
; everything after that -- session_start(), a redirect, a Set-Cookie -- is
; already too late. One notice in a fresh checkout is a 500, not a blemish.
; Paths and exception messages were going to anonymous visitors too.
display_errors = Off
display_startup_errors = Off

; Still readable where an operator reads them: with no error_log set, Apache
; logs them (so `docker logs`), and the CLI writes them to stderr, which is
; where a deploy log picks them up.
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; No `X-Powered-By: PHP/8.3.33` on every response.
expose_php = Off
