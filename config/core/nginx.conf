user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    client_max_body_size 0;
    # The :2011 server below proxies to the :80 server over the loopback, so the
    # hop the PHP requests arrive on is 127.0.0.1. Without it listed here realip
    # leaves $remote_addr at 127.0.0.1 and every request looks local -- which is
    # what killed the PmaSso gate and put every client in one rate-limit bucket.
    # Forging X-Forwarded-For still does not work: :2011 appends the true peer
    # with $proxy_add_x_forwarded_for, and real_ip_recursive walks from the right
    # and stops at the first address that is not a trusted proxy.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Scheme and port, from the same hops realip trusts. PHP cannot judge this
    # itself: realip already rewrote REMOTE_ADDR to the client, so TrustProxies
    # never sees the proxy and every URL core built came out http:// and
    # without :2011 (engine#273). $realip_remote_addr is the peer before that.
    geo $realip_remote_addr $pa_trusted_hop {
        default 0;
        127.0.0.1 1;
        172.16.0.0/12 1;
    }
    map "$pa_trusted_hop:$http_x_forwarded_proto" $pa_https {
        default $https;
        "1:https" on;
        "1:http" "";
    }
    map "$pa_trusted_hop:$http_x_forwarded_proto:$http_x_forwarded_port" $pa_port {
        default $server_port;
        "~^1:[a-z]*:(?<fwd_port>[0-9]+)$" $fwd_port;
        "1:https:" 443;
        "1:http:" 80;
    }
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    access_log /var/log/nginx/access.log;
    gzip on;
    include /etc/nginx/conf.d/*.conf;
    server {
        listen 80 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php index.html index.htm;
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            # After the include, so these replace its HTTPS and SERVER_PORT.
            fastcgi_param HTTPS $pa_https if_not_empty;
            fastcgi_param SERVER_PORT $pa_port;
            # Single-server: long send/read for backups/imports (SS values).
            # Do not duplicate these — nginx treats a second fastcgi_* as [emerg].
            fastcgi_connect_timeout 300;
            fastcgi_send_timeout 86400;
            fastcgi_read_timeout 86400;
        }
    }

    # The control-plane API on :2011 -- was the separate core-http container's
    # nginx; merged in because it did nothing but TLS-terminate and proxy to
    # this one. Proxies to the :80 server above over loopback rather than
    # duplicating the php-fpm location.
    server {
        listen 2011 ssl;
        http2 on;
        ssl_certificate /root/crt/server.cert;
        ssl_certificate_key /root/crt/server.key;

        error_page 497 https://$host:2011$request_uri;

        location / {
            proxy_connect_timeout 600;
            proxy_send_timeout 86400;
            proxy_read_timeout 86400;
            send_timeout 86400;
            # With the port: Symfony takes the port from Host, and falls back
            # to 443 rather than SERVER_PORT, so a bare $host loses :2011.
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_pass http://127.0.0.1/;
        }

        location /csf-web-ui {
            auth_request /api/test-connection;

            rewrite ^/csf-web-ui/(.*)$ /$1 break;

            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
            send_timeout 600;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass https://host.docker.internal:2012/;

            sub_filter 'action="/' 'action="/csf-web-ui/';
            sub_filter 'href="/' 'href="/csf-web-ui/';
            sub_filter 'src="/' 'src="/csf-web-ui/';
            sub_filter "action='/" "action='/csf-web-ui/";
            sub_filter "href='/" "href='/csf-web-ui/";
            sub_filter "src='/" "src='/csf-web-ui/";
            sub_filter "CSFscript = '/" "CSFscript = '/csf-web-ui/";
            sub_filter_once off;

            proxy_redirect https://host.docker.internal:2012/ /csf-web-ui/;
            proxy_redirect / /csf-web-ui/;
        }
    }
}
