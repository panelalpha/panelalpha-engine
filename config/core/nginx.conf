user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    client_max_body_size 0;
    # Forwarded headers are believed only from the two proxies that set them:
    # core's own :2011 server (the loopback) and the host webserver's
    # /panelalpha-sso hop, which reaches :80 from the compose bridge gateway.
    # Not 172.16.0.0/12: whenever Docker's DNAT for :2011 is missing (CSF used
    # to flush it), docker-proxy hands every client to core from that gateway,
    # so trusting the range let anyone name their own address (engine#241). The gateway
    # differs per host; entrypoint-core.sh writes it to
    # /etc/nginx/pa-trusted-proxy.conf, which the :80 server includes. :2011
    # has no set_real_ip_from at all, so there $remote_addr is the real peer.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Scheme and port, from the same hops realip trusts. PHP cannot judge this
    # itself: realip already rewrote REMOTE_ADDR to the client, so TrustProxies
    # never sees the proxy and every URL core built came out http:// and
    # without :2011 (engine#273). $realip_remote_addr is the peer before that;
    # $pa_gateway is set in the :80 server from the file entrypoint-core.sh
    # writes. A regex backreference, so a missing file trusts only the loopback
    # instead of stopping nginx.
    map "$realip_remote_addr $pa_gateway" $pa_trusted_hop {
        default 0;
        "~^127\.0\.0\.1 " 1;
        "~^(\S+) \1$" 1;
    }
    map "$pa_trusted_hop:$http_x_forwarded_proto" $pa_https {
        default $https;
        "1:https" on;
        "1:http" "";
    }
    map "$pa_trusted_hop:$http_x_forwarded_proto:$http_x_forwarded_port" $pa_port {
        default $server_port;
        "~^1:[a-z]*:(?<fwd_port>[0-9]+)$" $fwd_port;
        "1:https:" 443;
        "1:http:" 80;
    }
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    access_log /var/log/nginx/access.log;
    gzip on;
    include /etc/nginx/conf.d/*.conf;
    server {
        listen 80 default_server;
        server_name _;

        set_real_ip_from 127.0.0.1;
        set $pa_gateway "";
        include /etc/nginx/pa-trusted-proxy*.conf;

        root /var/www/html/public;
        index index.php index.html index.htm;
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            # After the include, so these replace its HTTPS and SERVER_PORT.
            fastcgi_param HTTPS $pa_https if_not_empty;
            fastcgi_param SERVER_PORT $pa_port;
            # The TCP peer before realip rewrote REMOTE_ADDR. A trusted hop
            # (loopback, gateway) names REMOTE_ADDR for its client; no caller
            # can name this. PmaSso checks it.
            fastcgi_param PA_PEER_ADDR $realip_remote_addr;
            # Single-server: long send/read for backups/imports (SS values).
            # Do not duplicate these — nginx treats a second fastcgi_* as [emerg].
            fastcgi_connect_timeout 300;
            fastcgi_send_timeout 86400;
            fastcgi_read_timeout 86400;
        }
    }

    # The control-plane API on :2011 -- was the separate core-http container's
    # nginx; merged in because it did nothing but TLS-terminate and proxy to
    # this one. Proxies to the :80 server above over loopback rather than
    # duplicating the php-fpm location.
    server {
        listen 2011 ssl;
        http2 on;
        # Also on its own: fail2ban counts failed tokens from this file alone,
        # where every address is the client's (:80 also serves internal hops).
        access_log /var/log/nginx/access.log;
        access_log /var/log/nginx/api-access.log;
        ssl_certificate /root/crt/server.cert;
        ssl_certificate_key /root/crt/server.key;

        error_page 497 https://$host:2011$request_uri;

        # Only the phpMyAdmin container calls this, on :80. Refused here so the
        # PmaSso address check is not the only thing keeping it off the internet.
        location ~* ^/api/mysql/phpmyadmin-sso-token {
            default_type application/json;
            return 404 '{"message":"Not found"}';
        }

        location / {
            proxy_connect_timeout 600;
            proxy_send_timeout 86400;
            proxy_read_timeout 86400;
            send_timeout 86400;
            # With the port: Symfony takes the port from Host, and falls back
            # to 443 rather than SERVER_PORT, so a bare $host loses :2011.
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            # The edge: nothing in front of :2011 sets this header, so whatever
            # a client sent is dropped rather than appended to.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_pass http://127.0.0.1/;
        }

    }
}
