[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
; Default is the cwd, which is the bind-mounted core/ tree.
pidfile=/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm8.3 -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Database queue workers. QUEUE_WORKERS comes from docker-compose.yml; --timeout
; stays below retry_after (7400) in core/config/queue.php.
[program:queue]
command=php /var/www/html/artisan queue:work database --queue=default --sleep=1 --tries=1 --timeout=7300 --memory=256
process_name=%(program_name)s_%(process_num)02d
numprocs=%(ENV_QUEUE_WORKERS)s
; A worker exits when the DB is down (e.g. before core-db is up); never go FATAL for that.
startsecs=0
directory=/var/www/html
user=www-data
; supervisord would pass on root's HOME otherwise.
environment=HOME="/var/www",USER="www-data"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Laravel scheduler (was the core-cron container). Output went to /dev/null
; under cron too; failures still reach storage/logs.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
environment=HOME="/var/www",USER="www-data"
autostart=true
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

; Rotation state decides what is due, so an hourly pass is idempotent.
[program:logrotate]
command=/bin/bash -c 'while true; do /usr/sbin/logrotate /etc/logrotate.conf; sleep 3600; done'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The Debian package's socket, so a plain `supervisorctl status` finds it.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
