[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
; Default is the cwd, which is the bind-mounted core/ tree.
pidfile=/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm8.4 -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Database queue workers. The block itself -- including numprocs -- is
; generated by App\Support\QueueWorkers (--timeout stays below retry_after
; (86600) in core/config/queue.php), so the count can change with
; `pae configure queue` and take effect via `supervisorctl update` alone.
; entrypoint-core.sh writes it fresh before this file is ever read.
[include]
files = queue.generated.conf

; Laravel scheduler (was the core-cron container). Output went to /dev/null
; under cron too; failures still reach storage/logs.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
environment=HOME="/var/www",USER="www-data"
autostart=true
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

; Rotation state decides what is due, so an hourly pass is idempotent.
[program:logrotate]
command=/bin/bash -c 'while true; do /usr/sbin/logrotate /etc/logrotate.conf; sleep 3600; done'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The Debian package's socket, so a plain `supervisorctl status` finds it.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
