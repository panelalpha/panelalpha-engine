
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    set_real_ip_from 172.16.0.0/12;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format bytes '[$time_local] $body_bytes_sent';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    server {
        listen 2011 ssl;
        http2 on;
        ssl_certificate /root/crt/server.cert;
        ssl_certificate_key /root/crt/server.key;

        error_page 497 https://$host:2011$request_uri;

        client_max_body_size 0;

        location / {
            proxy_connect_timeout   600;
            proxy_send_timeout      86400;
            proxy_read_timeout      86400;
            send_timeout            86400;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://core.shared-hosting.palocal/;
        }


    }

    include /etc/nginx/conf.d/*.conf;
}
