# Brotli for clients that ask for it; the rest get gzip from the main config.
# Keep the types in step with gzip_types there.
brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types text/plain text/css text/javascript text/xml application/javascript
             application/json application/ld+json application/manifest+json
             application/xml application/rss+xml application/atom+xml
             application/xhtml+xml image/svg+xml application/wasm
             font/ttf font/otf application/vnd.ms-fontobject;
