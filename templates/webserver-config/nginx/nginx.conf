
user  nginx;
worker_processes  auto;

error_log  /opt/panelalpha/shared-hosting/webserver-logs/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # `combined` is predefined by nginx. Defining it again makes nginx refuse to start.
    log_format bytes '[$time_local] $body_bytes_sent';

    access_log  /opt/panelalpha/shared-hosting/webserver-logs/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    server_names_hash_max_size 1024;
    server_names_hash_bucket_size 512;

    client_max_body_size 0;

    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80 default_server;
        server_name _;
        error_page 404 /404.html;
        location / {
            return 404;
        }
        location = /404.html {
            root  /opt/panelalpha/shared-hosting/webserver-config/document-root;
        }
    }
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        ssl_certificate /opt/panelalpha/shared-hosting/crt/server.cert;
        ssl_certificate_key /opt/panelalpha/shared-hosting/crt/server.key;
        error_page 404 /404.html;
        location / {
          return 404;
        }
        location = /404.html {
          root /opt/panelalpha/shared-hosting/webserver-config/document-root;
        }
    }
}
