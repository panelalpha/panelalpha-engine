# Elementor saves its editor state as JSON in ARGS:actions: keys like "$$type" hit 942290 and "url" hits 932370.
# Own file so an update ships it past a kept REQUEST-898; only those two rules, only signed-in admin-ajax.php.
SecRule REQUEST_FILENAME "@endsWith /wp-admin/admin-ajax.php" \
    "id:1000071,phase:1,pass,nolog,t:none,chain"
    SecRule &REQUEST_COOKIES:/^wordpress_logged_in_/ "@gt 0" \
        "t:none,\
        ctl:ruleRemoveTargetById=942290;ARGS:actions,\
        ctl:ruleRemoveTargetById=932370;ARGS:actions"
