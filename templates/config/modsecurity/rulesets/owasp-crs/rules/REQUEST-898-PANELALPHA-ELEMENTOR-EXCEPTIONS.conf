# Elementor saves its editor state as JSON in ARGS:actions: keys like "$$type" hit 942290 and "url" hits 932370.
# Own file so an update ships it past a kept REQUEST-898; only those two rules, only signed-in admin-ajax.php calls
# whose one `action` is elementor_ajax, the only handler that reads `actions`. PHP drops leading spaces from names,
# so " action" counts too. Phase 2: Elementor posts `action` in the body, which phase 1 has not parsed yet.
SecRule REQUEST_FILENAME "@endsWith /wp-admin/admin-ajax.php" \
    "id:1000071,phase:2,pass,nolog,t:none,chain"
    SecRule &ARGS:/^\s*action$/ "@eq 1" \
        "t:none,chain"
        SecRule ARGS:action "@streq elementor_ajax" \
            "t:none,chain"
            SecRule &REQUEST_COOKIES:/^wordpress_logged_in_/ "@gt 0" \
                "t:none,\
                ctl:ruleRemoveTargetById=942290;ARGS:actions,\
                ctl:ruleRemoveTargetById=932370;ARGS:actions"
