# REST APIs (WordPress, Elementor) send PUT/PATCH/DELETE, which 911100 scores to a 403 by default.
# Own file so an update ships it past a kept setup.conf; a setup.conf 900200 still wins.
SecRule &TX:allowed_methods "@eq 0" \
    "id:1000070,phase:1,pass,nolog,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"
