# WordPress hardening that the OWASP Core Rule Set does not cover: two ways an
# anonymous visitor reads login names.

# ?author=N on the front end redirects to /author/<login>/. WordPress reads the
# value as a number, so only a value that starts like one is enumeration. Query
# string only: wp-comments-post.php posts the commenter's name as `author`.
# wp-admin filters posts by the same argument for a signed-in user.
SecRule ARGS_GET:author "@rx ^\s*-?[0-9]" \
    "id:1000101,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'WordPress user enumeration via ?author=N',\
    tag:'panelalpha-wordpress',\
    chain"
    SecRule REQUEST_FILENAME "!@contains /wp-admin/" "t:none,t:lowercase"

# The REST users list gives every author's slug, which is the login. Reachable
# as /wp-json/wp/v2/users and, without pretty permalinks, ?rest_route=. The
# block editor's author picker calls it signed in, with the logged_in cookie.
SecRule REQUEST_FILENAME "@contains /wp-json/wp/v2/users" \
    "id:1000102,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,t:lowercase,t:normalizePath,\
    msg:'WordPress user listing via the REST API',\
    tag:'panelalpha-wordpress',\
    chain"
    SecRule &REQUEST_COOKIES:/^wordpress_logged_in_/ "@eq 0" "t:none"

SecRule ARGS_GET:rest_route "@rx ^/*wp/v2/users" \
    "id:1000103,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,t:lowercase,\
    msg:'WordPress user listing via the REST API',\
    tag:'panelalpha-wordpress',\
    chain"
    SecRule &REQUEST_COOKIES:/^wordpress_logged_in_/ "@eq 0" "t:none"
