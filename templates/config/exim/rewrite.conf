# A project's mail keeps a sender domain this engine serves for it, and every other sender leaves as the name in
# panelalpha/senders (`server <name>`): no receiver is asked to verify a domain that does not exist. Rewrites the
# envelope sender and the From, Reply-To and Sender headers together, so the message says the same thing throughout.
# Without the map, or without a name in it, a sender leaves as the name the engine wrote here; panelalpha-sender.invalid
# until it has written one, which is reserved and owned by no one.
* "${if and{{exists{/etc/exim4/panelalpha/senders}}{eq{${lookup{$sender_host_address/${lc:$domain}}lsearch{/etc/exim4/panelalpha/senders}{allowed}{}}}{allowed}}}{$local_part@$domain}{$local_part@${if exists{/etc/exim4/panelalpha/senders}{${lookup{server}lsearch{/etc/exim4/panelalpha/senders}{$value}{panelalpha-sender.invalid}}}{panelalpha-sender.invalid}}}}" Ffrs
