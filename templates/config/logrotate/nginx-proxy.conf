/opt/panelalpha/shared-hosting/webserver-logs/nginx-proxy/*/*.log
{
    monthly
    rotate 100
    dateext
    dateformat -%Y-%m
    extension .log
    missingok
    notifempty
    compress
    sharedscripts
    postrotate
        # The service is sites-http; -T because logrotate has no TTY. A failure
        # here skips compression, so the rotated file stays readable for stats.
        docker compose -f /opt/panelalpha/shared-hosting/docker-compose.yml exec -T sites-http nginx -s reopen
    endscript
}
