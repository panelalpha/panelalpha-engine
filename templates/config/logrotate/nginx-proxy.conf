/opt/panelalpha/shared-hosting/webserver-logs/nginx-proxy/*/*.log
/opt/panelalpha/shared-hosting/webserver-logs/nginx-proxy/access.log
/opt/panelalpha/shared-hosting/webserver-logs/nginx-proxy/error.log
/opt/panelalpha/shared-hosting/webserver-logs/nginx-proxy/site-password.log
/opt/panelalpha/shared-hosting/webserver-logs/nginx-proxy/proxy-rule-*.log
{
    monthly
    maxsize 100M
    rotate 24
    dateext
    dateformat -%Y-%m-%d-%H-%M-%S
    extension .log
    missingok
    notifempty
    compress
    sharedscripts
    postrotate
        # nginx in sites-http reopens its logs, asked through the host's Engine API. A
        # failure here skips compression, so the rotated file stays readable for stats.
        PYTHONPATH=/usr/local/lib/panelalpha python3 -m rootbroker.logrotation reopen nginx
    endscript
}
