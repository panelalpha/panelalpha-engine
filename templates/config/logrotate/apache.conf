/opt/panelalpha/shared-hosting/webserver-logs/apache/*/*.log
{
    monthly
    rotate 100
    dateext
    dateformat -%Y-%m
    extension .log
    missingok
    notifempty
    compress
    sharedscripts
    postrotate
        docker compose -f /opt/panelalpha/shared-hosting/docker-compose.yml exec -T sites-http apachectl -k graceful >/dev/null 2>&1 || true
    endscript
}
