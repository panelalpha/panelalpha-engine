/opt/panelalpha/shared-hosting/webserver-logs/apache/*/*.log
/opt/panelalpha/shared-hosting/webserver-logs/apache/access.log
/opt/panelalpha/shared-hosting/webserver-logs/apache/error.log
{
    monthly
    maxsize 100M
    rotate 24
    dateext
    dateformat -%Y-%m-%d-%H-%M-%S
    extension .log
    missingok
    notifempty
    compress
    sharedscripts
    postrotate
        PYTHONPATH=/usr/local/lib/panelalpha python3 -m rootbroker.logrotation reopen apache >/dev/null 2>&1 || true
    endscript
}
